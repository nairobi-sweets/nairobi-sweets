<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Login | Nairobi Sweets</title>

<link rel="icon" type="image/png" href="/assets/logo/logo-badge.png">
<link rel="manifest" href="/manifest.webmanifest">

<meta name="theme-color" content="#ffd84b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nairobi Sweets">
<link rel="apple-touch-icon" href="/assets/logo/logo-badge.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  min-height:100vh;
  color:#f8fafc;
  background:
    radial-gradient(circle at 10% 0%, rgba(236,72,153,.14), transparent 25%),
    radial-gradient(circle at 90% 10%, rgba(250,204,21,.11), transparent 25%),
    linear-gradient(180deg, #060812, #0b1020 55%, #070a12);
  font-family:Inter,ui-sans-serif,system-ui,sans-serif;
}

.glass{
  background:rgba(9,14,28,.78);
  border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 24px 70px rgba(0,0,0,.36);
}

.input{
  width:100%;
  padding:14px 16px;
  border-radius:18px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.09);
  color:white;
  outline:none;
}

.input:focus{
  border-color:rgba(250,204,21,.65);
  box-shadow:0 0 0 3px rgba(250,204,21,.10);
}

.btn{
  border-radius:18px;
  transition:.18s ease;
  font-weight:900;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.05);
}

.btn-gold{
  background:linear-gradient(135deg,#facc15,#f59e0b);
  color:#111827;
}

.btn-dark{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.09);
  color:white;
}

.btn-pink{
  background:linear-gradient(135deg,#ff5fb1,#e6257f);
  color:white;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  color:#94a3b8;
  font-size:13px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:rgba(255,255,255,.1);
}
</style>
</head>

<body class="flex items-center justify-center px-4 py-10">

<div class="glass rounded-[30px] w-full max-w-md p-6 md:p-8">

  <div class="text-center mb-6">
    <img src="/assets/logo/logo-badge.png"
         alt="Nairobi Sweets"
         class="w-16 h-16 rounded-full object-cover mx-auto mb-4"
         onerror="this.style.display='none'">

    <p class="text-xs uppercase tracking-[0.22em] text-pink-200 mb-2">
      Welcome back
    </p>

    <h1 class="text-3xl font-black text-yellow-300">
      Login
    </h1>

    <p class="text-slate-400 text-sm mt-2">
      Access your Nairobi Sweets dashboard.
    </p>
  </div>

  <div class="space-y-3">

    <button id="googleBtn" class="btn btn-dark w-full py-3">
      Continue with Google
    </button>

    <div class="divider">or login with email</div>

    <input id="email" type="email" placeholder="Email" class="input">
    <input id="password" type="password" placeholder="Password" class="input">

    <button id="loginBtn" class="btn btn-gold w-full py-3">
      Login
    </button>

    <a href="/public-signup-payment-page.html" class="btn btn-pink w-full py-3 block text-center">
      Create an account
    </a>

    <a href="/index.html" class="btn btn-dark w-full py-3 block text-center">
      Back to Homepage
    </a>

    <p id="msg" class="text-sm text-slate-300 text-center"></p>

  </div>
</div>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const OWNER_EMAILS = [
  "nairobisweets05@gmail.com",
  "beezysprout@gmail.com"
];

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const googleBtn = document.getElementById("googleBtn");
const msg = document.getElementById("msg");

function showMsg(text, type = "normal"){
  msg.textContent = text;
  msg.className = "text-sm text-center " + (
    type === "error" ? "text-pink-300" :
    type === "success" ? "text-green-300" :
    "text-slate-300"
  );
}

function isOwner(email){
  return OWNER_EMAILS.includes(String(email || "").toLowerCase());
}

async function routeUser(user){
  if(!user){
    window.location.href = "/login.html";
    return;
  }

  const email = String(user.email || "").toLowerCase();

  if(isOwner(email)){
    window.location.href = "/vault-8472.html";
    return;
  }

  showMsg("Checking your profile...");

  const { data, error } = await sb
    .from("profiles")
    .select("id,user_id")
    .eq("user_id", user.id)
    .limit(1)
    .maybeSingle();

  if(error){
    showMsg(error.message, "error");
    return;
  }

  if(data){
    window.location.href = "/user-dashboard.html";
  }else{
    window.location.href = "/public-signup-payment-page.html";
  }
}

async function login(){
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  showMsg("");

  if(!email || !password){
    showMsg("Enter your email and password.", "error");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";
  showMsg("Logging in...");

  const { data, error } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showMsg(error.message, "error");
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
    return;
  }

  showMsg("Login successful. Redirecting...", "success");
  await routeUser(data.user);
}

async function loginWithGoogle(){
  showMsg("Opening Google login...");

  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: `${window.location.origin}/login.html`
    }
  });

  if(error){
    showMsg(error.message, "error");
  }
}

async function checkExistingSession(){
  const { data, error } = await sb.auth.getSession();

  if(error){
    showMsg(error.message, "error");
    return;
  }

  if(data.session?.user){
    showMsg("Session found. Redirecting...", "success");
    await routeUser(data.session.user);
  }
}

loginBtn.addEventListener("click", login);
googleBtn.addEventListener("click", loginWithGoogle);

passwordInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") login();
});

emailInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") login();
});

checkExistingSession();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker
      .register("/sw.js")
      .catch(err=>console.error("PWA error:",err));
  });
}
</script>

</body>
</html>
