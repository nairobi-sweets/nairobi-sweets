<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>

<title>Login | Nairobi Sweets</title>

<link rel="icon" type="image/png" href="/assets/logo/logo-badge.png">
<link rel="manifest" href="/manifest.webmanifest">

<meta name="theme-color" content="#ffd84b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nairobi Sweets">
<link rel="apple-touch-icon" href="/assets/logo/logo-badge.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  margin:0;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100vh;
  min-height:100svh;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f8fafc;
  background:#060812;
  font-family:Inter,Arial,Helvetica,sans-serif;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    radial-gradient(circle at 10% 0%, rgba(236,72,153,.16), transparent 28%),
    radial-gradient(circle at 90% 10%, rgba(250,204,21,.13), transparent 28%),
    linear-gradient(180deg,#060812,#0b1020 55%,#070a12);
}

.login-card{
  width:100%;
  max-width:430px;
  margin:auto;
  padding:26px 22px;
  border-radius:28px;
  background:rgba(9,14,28,.94);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 20px 60px rgba(0,0,0,.36);
}

@supports ((backdrop-filter:blur(18px)) or (-webkit-backdrop-filter:blur(18px))){
  .login-card{
    background:rgba(9,14,28,.78);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
}

.logo{
  width:64px;
  height:64px;
  display:block;
  margin:0 auto 16px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 25px rgba(250,204,21,.18);
}

.header{
  text-align:center;
  margin-bottom:24px;
}

.kicker{
  margin:0 0 8px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.22em;
  color:#fbcfe8;
}

h1{
  margin:0;
  font-size:34px;
  line-height:1.1;
  font-weight:900;
  color:#fde047;
}

.subtitle{
  margin:10px 0 0;
  color:#94a3b8;
  font-size:14px;
}

.form{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.input{
  width:100%;
  min-height:50px;
  padding:14px 16px;
  border-radius:18px;
  background:rgba(0,0,0,.30);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  outline:none;
  font-size:16px;
}

.input::placeholder{
  color:#94a3b8;
}

.input:focus{
  border-color:rgba(250,204,21,.70);
  box-shadow:0 0 0 3px rgba(250,204,21,.12);
}

.btn{
  width:100%;
  min-height:50px;
  border:0;
  border-radius:18px;
  padding:13px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  text-decoration:none;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  transition:transform .18s ease, filter .18s ease, opacity .18s ease;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.05);
}

.btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

.btn-gold{
  background:linear-gradient(135deg,#facc15,#f59e0b);
  color:#111827;
}

.btn-dark{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
}

.btn-pink{
  background:linear-gradient(135deg,#ff5fb1,#e6257f);
  color:#fff;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  color:#94a3b8;
  font-size:13px;
  text-align:center;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:rgba(255,255,255,.12);
}

.forgot{
  color:#fde047;
  font-size:14px;
  text-align:center;
  text-decoration:none;
}

.forgot:hover{
  color:#fef08a;
}

.remember-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#cbd5e1;
  font-size:14px;
  text-align:center;
  flex-wrap:wrap;
}

.remember-row input{
  width:18px;
  height:18px;
  accent-color:#fde047;
}

.msg{
  min-height:20px;
  margin:2px 0 0;
  font-size:14px;
  color:#cbd5e1;
  text-align:center;
  line-height:1.4;
}

.msg.error{
  color:#f9a8d4;
}

.msg.success{
  color:#86efac;
}

@media(max-width:480px){
  body{
    padding:14px;
    align-items:center;
  }

  .login-card{
    padding:22px 16px;
    border-radius:24px;
  }

  h1{
    font-size:32px;
  }

  .subtitle{
    font-size:13px;
  }

  .btn,
  .input{
    border-radius:16px;
  }
}

@media(max-width:340px){
  body{
    padding:10px;
  }

  .login-card{
    padding:18px 12px;
  }

  h1{
    font-size:28px;
  }

  .kicker{
    letter-spacing:.15em;
  }
}

@media(prefers-reduced-motion:reduce){
  .btn{
    transition:none;
  }

  .btn:hover{
    transform:none;
  }
}
</style>
<link rel="stylesheet" href="/assets/css/v5-phase3.css">
</head>

<body>

<main class="login-card">

  <div class="header">
    <img src="/assets/logo/logo-badge.png"
         alt="Nairobi Sweets"
         class="logo"
         onerror="this.style.display='none'">

    <p class="kicker">Welcome back</p>

    <h1>Login</h1>

    <p class="subtitle">
      Access your Nairobi Sweets dashboard.
    </p>
  </div>

  <div class="form">

    <button id="googleBtn" class="btn btn-dark" type="button">
      Continue with Google
    </button>

    <div class="divider">or login with username / email</div>

    <input id="username" type="text" placeholder="Username or Email" class="input" autocomplete="username">
    <input id="password" type="password" placeholder="Password" class="input" autocomplete="current-password">

    <a id="forgotPassword" href="/forgot-password.html" class="forgot">
      Forgot Password?
    </a>

    <label class="remember-row" for="rememberMe">
      <input id="rememberMe" type="checkbox" checked>
      <span>Remember me on this device</span>
    </label>

    <button id="loginBtn" class="btn btn-gold" type="button">
      Login
    </button>

    <a href="/public-signup-payment-page.html" class="btn btn-pink">
      Create an account
    </a>

    <a href="/index.html" class="btn btn-dark">
      Back to Homepage
    </a>

    <p id="msg" class="msg"></p>

  </div>
</main>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const OWNER_EMAILS = [
  "nairobisweets05@gmail.com",
  "beezysprout@gmail.com"
];

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const googleBtn = document.getElementById("googleBtn");
const rememberMe = document.getElementById("rememberMe");
const msg = document.getElementById("msg");

function showMsg(text, type = "normal"){
  msg.textContent = text || "";
  msg.className = "msg " + (
    type === "error" ? "error" :
    type === "success" ? "success" :
    ""
  );
}

function isOwner(email){
  return OWNER_EMAILS.includes(String(email || "").toLowerCase());
}

async function logLoginEvent(eventType, email, details = ""){
  try{
    await sb.from("auth_events").insert({
      event_type: eventType,
      email: String(email || "").toLowerCase(),
      details,
      source_page: "login.html",
      created_at: new Date().toISOString()
    });
  }catch(error){
    console.log("Login analytics skipped:", error.message || error);
  }
}

async function updateLastLogin(user){
  if(!user || !user.id) return;

  try{
    await sb
      .from("profiles")
      .update({
        last_login_at: new Date().toISOString()
      })
      .eq("user_id", user.id);
  }catch(error){
    console.log("Last login update skipped:", error.message || error);
  }
}

async function routeUser(user){
  if(!user){
    window.location.href = "/login.html";
    return;
  }

  const email = String(user.email || "").toLowerCase();

  if(isOwner(email)){
    showMsg("Admin account detected. Opening Vault...", "success");
    await updateLastLogin(user);

    setTimeout(function(){
      window.location.href = "/vault-8472.html";
    }, 650);

    return;
  }

  showMsg("Checking your profile...");

  const { data, error } = await sb
    .from("profiles")
    .select("id,user_id")
    .eq("user_id", user.id)
    .limit(1)
    .maybeSingle();

  if(error){
    await logLoginEvent("login_failed", email, error.message);
    showMsg(error.message, "error");
    return;
  }

  await updateLastLogin(user);

  if(data){
    window.location.href = "/user-dashboard.html";
  }else{
    window.location.href = "/public-signup-payment-page.html";
  }
}

async function login(){
  const username = usernameInput.value.trim().toLowerCase();
  const password = passwordInput.value.trim();

  showMsg("");

  if(!username || !password){
    showMsg("Enter your username and password.", "error");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  localStorage.setItem(
    "nairobi_sweets_remember_login",
    rememberMe && rememberMe.checked ? "true" : "false"
  );

  showMsg(username.includes("@") ? "Checking email..." : "Checking username...");

  try{
    let loginEmail = username;

    if(!username.includes("@")){
      const { data: profile, error: profileError } = await sb
        .from("profiles")
        .select("email")
        .eq("username", username)
        .maybeSingle();

      if(profileError){
        throw new Error(profileError.message);
      }

      if(!profile || !profile.email){
        throw new Error("Username not found.");
      }

      loginEmail = profile.email;
    }

    showMsg("Logging in...");

    const { data, error } = await sb.auth.signInWithPassword({
      email: loginEmail,
      password: password
    });

    if(error){
      await logLoginEvent("login_failed", loginEmail, error.message);
      throw new Error("Wrong username or password.");
    }

    await logLoginEvent("login_success", loginEmail, "Username/email login successful");
    showMsg("Login successful. Redirecting...", "success");

    await routeUser(data.user);

  }catch(error){
    showMsg(error.message || "Login failed.", "error");
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
}

async function loginWithGoogle(){
  showMsg("Opening Google login...");

  await logLoginEvent("google_login_started", "unknown", "Google OAuth started");

  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin + "/login.html"
    }
  });

  if(error){
    await logLoginEvent("login_failed", "google", error.message);
    showMsg(error.message, "error");
  }
}

async function checkExistingSession(){
  const { data, error } = await sb.auth.getSession();

  if(error){
    showMsg(error.message, "error");
    return;
  }

  if(data && data.session && data.session.user){
    showMsg("Session found. Redirecting...", "success");
    await routeUser(data.session.user);
  }
}

loginBtn.addEventListener("click", login);
googleBtn.addEventListener("click", loginWithGoogle);

passwordInput.addEventListener("keydown", function(e){
  if(e.key === "Enter") login();
});

usernameInput.addEventListener("keydown", function(e){
  if(e.key === "Enter") login();
});

if(localStorage.getItem("nairobi_sweets_remember_login") === "false" && rememberMe){
  rememberMe.checked = false;
}

checkExistingSession();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker
      .register("/sw.js")
      .catch(function(err){
        console.error("PWA error:", err);
      });
  });
}
</script>

<script src="/assets/js/v5-phase3.js" defer></script>
</body>
</html>
