<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at top,#0c1148 0%,#000 48%);color:#fff;font-family:Arial,Helvetica,sans-serif;padding-bottom:90px}
a{text-decoration:none;color:inherit}
.topbar{position:sticky;top:0;z-index:99;background:#000;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,213,74,.12)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:70px;height:70px;border-radius:20px;object-fit:cover}
.brand h1{color:#ffd54a;font-size:34px;line-height:.9}
.home{background:#06105a;color:#ffd54a;border:1px solid rgba(255,213,74,.15);border-radius:18px;padding:14px 18px;font-weight:900}
.hero{padding:28px 18px}
.hero-box{max-width:1200px;margin:auto;background:linear-gradient(180deg,#020a56,#010633);border:1px solid rgba(255,213,74,.1);border-radius:30px;padding:28px}
.hero-box h2{font-size:52px;color:#ffd54a;margin-bottom:10px}
.hero-box p{color:#ddd;line-height:1.6}
.tabs{max-width:1200px;margin:0 auto 20px;padding:0 18px;display:flex;gap:10px;overflow:auto}
.tabs button{min-width:max-content;border:0;border-radius:999px;padding:13px 18px;font-weight:900;background:#101a52;color:white;cursor:pointer}
.tabs button.active{background:linear-gradient(145deg,#ffd54a,#ff9f1c);color:#000}
.grid{max-width:1200px;margin:auto;padding:0 18px 40px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{position:relative;background:linear-gradient(180deg,#020a56,#010633);border:1px solid rgba(255,213,74,.1);border-radius:26px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);cursor:pointer}
.card img{width:100%;height:260px;object-fit:cover;background:#020617}
.body{padding:16px}
.rank{position:absolute;top:12px;left:12px;background:linear-gradient(145deg,#ffd54a,#ff9f1c);color:#000;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;z-index:3}
.badge{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.75);color:#ffd54a;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;z-index:3}
.badge.vip{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff}
.badge.signature{background:linear-gradient(135deg,#ffd84b,#ff9f1c);color:#000}
.name{font-size:22px;font-weight:900;color:#ffd54a;margin-bottom:8px}
.meta{color:#ddd;font-size:14px;line-height:1.6;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:#06103e;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px}
.stat small{display:block;color:#aaa;font-size:11px;margin-bottom:5px}
.stat strong{color:#ffd54a;font-size:20px}
.empty{grid-column:1/-1;text-align:center;color:#ffd54a;font-weight:900;padding:60px}
.seo-links{max-width:1200px;margin:10px auto 40px;padding:20px 18px}
.seo-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,216,75,.15);border-radius:22px;padding:20px}
.seo-box h2{color:#ffd54a;margin-bottom:14px}
.seo-grid{display:flex;flex-wrap:wrap;gap:10px}
.seo-grid a{background:#07145f;border:1px solid rgba(255,216,75,.2);color:#ffd54a;padding:10px 13px;border-radius:999px;font-size:13px;font-weight:900}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:space-around;border-top:1px solid rgba(255,213,74,.08)}
.bottom-nav a{color:#ffd54a;font-size:24px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.grid{grid-template-columns:1fr}.hero-box h2{font-size:40px}.brand h1{font-size:28px}.logo{width:58px;height:58px}.card img{height:340px}}
</style>

<script type="application/ld+json">
{
 "@context":"https://schema.org",
 "@type":"CollectionPage",
 "name":"Nairobi Sweets Trending Profiles",
 "url":"https://nairobi-sweets.com/trending.html",
 "description":"Trending Nairobi Sweets profiles ranked by live engagement.",
 "isPartOf":{
   "@type":"WebSite",
   "name":"Nairobi Sweets",

 }

<body>

<header class="topbar">
  <a href="/" class="brand">
    <img src="/assets/logo/logo-badge.png" class="logo" alt="Nairobi Sweets">
    <h1>Nairobi<br>Sweets</h1>
  </a>
  <a href="/" class="home">Home</a>
</header>

<section class="hero">
  <div class="hero-box">
    <h2>🔥 Trending</h2>
    <p>Live leaderboard ranked by profile views, WhatsApp clicks, calls, shares, likes and video plays.</p>
  </div>
</section>

<div class="tabs">
  <button class="active" data-sort="trending_score">🔥 Overall</button>
  <button data-sort="views">👁 Views</button>
  <button data-sort="whatsapp_clicks">💬 WhatsApp</button>
  <button data-sort="call_clicks">☎ Calls</button>
  <button data-sort="share_clicks">🔗 Shares</button>
  <button data-sort="video_plays">🎬 Videos</button>
  <button data-sort="likes_count">❤️ Likes</button>
</div>

<section class="grid" id="grid">
  <div class="empty">Loading trending profiles...</div>
</section>

<section class="seo-links">

      <a href="/seo/locations/lavington.html">Lavington</a>
      <a href="/seo/locations/ngong-road.html">Ngong Road</a>

    </div>
  </div>
</section>

</nav>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const grid = document.getElementById("grid");

let rows = [];
let sortKey = "trending_score";

function clean(v){
  return String(v || "").replace(/[<>]/g,"");
}

function makeSlug(value){
  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function img(p){
  return (
    p.profile_image_url ||
    p.cover_image_url ||
    p.image_url ||
    p.photo_url ||
    p.image2_url ||
    p.image3_url ||
    p.image_url_2 ||
    p.image_url_3 ||
    p.avatar_url ||
    p.profile_photo ||
    p.main_photo ||
    p.photo ||
    p.image ||
    "/assets/logo/logo-badge.png"
  );
}

function nameOf(p){
  return p.stage_name || p.name || p.full_name || "Verified";
}

function locOf(p){
  return p.location || p.town || p.area || "Nairobi";
}

function planOf(p){
  return String(p.plan || p.plan_name || p.package || p.tier || "featured").toUpperCase();
}

function n(v){
  return Number(v || 0);
}

function isSignature(p){
  const plan = planOf(p).toLowerCase();
  return plan.includes("signature") || plan.includes("vvip") || p.is_signature || p.is_vvip || p.signature || p.vvip;
}

function isVip(p){
  const plan = planOf(p).toLowerCase();
  return (plan.includes("vip") && !isSignature(p)) || p.is_vip || p.vip;
}

function badgeClass(p){
  if(isSignature(p)) return "badge signature";
  if(isVip(p)) return "badge vip";
  return "badge";
}

function rankLabel(i){
  if(i === 0) return "👑 #1";
  if(i === 1) return "🥈 #2";
  if(i === 2) return "🥉 #3";
  return `#${i + 1}`;
}

function profileLink(p){
  const slug = makeSlug(p.slug || `${nameOf(p)}-${locOf(p)}`);
  if(slug){
    return `/profile.html?slug=${encodeURIComponent(slug)}`;
  }
  return `/profile.html?id=${encodeURIComponent(p.id)}`;
}

function computedScore(p){
  return Math.round(
    n(p.trending_score) ||
    (
      n(p.boost) * 1000 +
      n(p.views) +
      n(p.whatsapp_clicks) * 10 +
      n(p.call_clicks) * 15 +
      n(p.share_clicks) * 7 +
      n(p.video_plays) * 8 +
      n(p.likes_count || p.likes) * 12
    )
  );
}

function render(){
  const sorted = [...rows].sort((a,b)=>n(b[sortKey]) - n(a[sortKey]));

  if(!sorted.length){
    grid.innerHTML = `<div class="empty">No trending data yet.</div>`;
    return;
  }

  grid.innerHTML = sorted.map((p,i)=>`
    <article class="card" onclick="location.href='${profileLink(p)}'">
      <div class="rank">${rankLabel(i)} TRENDING</div>
      <div class="${badgeClass(p)}">${clean(planOf(p))}</div>

      <img
        src="${clean(img(p))}"
        onerror="this.src='/assets/logo/logo-badge.png'"
        alt="${clean(nameOf(p))} trending Nairobi Sweets profile"
        loading="lazy"
      >

      <div class="body">
        <div class="name">${clean(nameOf(p))}</div>

        <div class="meta">
          📍 ${clean(locOf(p))}<br>
          🔥 Score: ${computedScore(p)}
        </div>

        <div class="stats">
          <div class="stat"><small>Views</small><strong>${n(p.views)}</strong></div>
          <div class="stat"><small>WhatsApp</small><strong>${n(p.whatsapp_clicks)}</strong></div>
          <div class="stat"><small>Calls</small><strong>${n(p.call_clicks)}</strong></div>
          <div class="stat"><small>Shares</small><strong>${n(p.share_clicks)}</strong></div>
          <div class="stat"><small>Video Plays</small><strong>${n(p.video_plays)}</strong></div>
          <div class="stat"><small>Likes</small><strong>${n(p.likes_count || p.likes)}</strong></div>
        </div>
      </div>
    </article>
  `).join("");
}

async function loadTrending(){
  grid.innerHTML = `<div class="empty">Loading leaderboard...</div>`;

  const {data,error} = await sb
    .from("profiles")
    .select(`
      *,
      profile_analytics_summary(
        views,
        whatsapp_clicks,
        call_clicks,
        share_clicks,
        video_plays,
        last_event_at
      )
    `)
    .order("id",{ascending:false})
    .limit(100);

  if(error){
    grid.innerHTML = `<div class="empty">Error: ${clean(error.message)}</div>`;
    return;
  }

  rows = (data || [])
    .filter(p =>
      p.approved === true ||
      p.is_approved === true ||
      String(p.status || "").toLowerCase() === "approved" ||
      String(p.status || "").toLowerCase() === "active"
    )
    .filter(p => !(p.is_expired === true || String(p.status || "").toLowerCase() === "expired"))
    .map(p=>{
      const a = Array.isArray(p.profile_analytics_summary)
        ? p.profile_analytics_summary[0]
        : p.profile_analytics_summary;

      return {
        ...p,
        views: a?.views || p.views || 0,
        whatsapp_clicks: a?.whatsapp_clicks || p.whatsapp_clicks || 0,
        call_clicks: a?.call_clicks || p.call_clicks || 0,
        share_clicks: a?.share_clicks || p.share_clicks || p.profile_shares || 0,
        video_plays: a?.video_plays || p.video_plays || 0,
        likes_count: p.likes_count || p.likes || p.favorites || 0,
        trending_score: computedScore({
          ...p,
          views: a?.views || p.views || 0,
          whatsapp_clicks: a?.whatsapp_clicks || p.whatsapp_clicks || 0,
          call_clicks: a?.call_clicks || p.call_clicks || 0,
          share_clicks: a?.share_clicks || p.share_clicks || p.profile_shares || 0,
          video_plays: a?.video_plays || p.video_plays || 0,
          likes_count: p.likes_count || p.likes || p.favorites || 0
        }),
        last_event_at: a?.last_event_at || null
      };
    });

  rows.sort((a,b)=>n(b.trending_score) - n(a.trending_score));
  render();
}

document.querySelectorAll(".tabs button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    sortKey = btn.dataset.sort;
    render();
  });
});

loadTrending();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("/sw.js").catch(()=>{});
  });
}
</script>

</body>
