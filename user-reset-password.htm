<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Reset Password | Nairobi Sweets</title>

<link rel="icon" type="image/png" href="/assets/logo/logo-badge.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="min-h-screen bg-[#060812] text-white flex items-center justify-center p-4">

<div class="w-full max-w-md bg-[#090e1c] border border-white/10 rounded-[28px] p-7 text-center">
  <img src="/assets/logo/logo-badge.png" class="w-16 h-16 rounded-full mx-auto mb-4" onerror="this.style.display='none'">

  <p class="text-pink-200 text-xs uppercase tracking-[.25em]">User Password Reset</p>
  <h1 class="text-3xl font-black text-yellow-300 mt-2">Create New Password</h1>
  <p class="text-slate-400 text-sm mt-2">Enter your new password below.</p>

  <input id="password" type="password"
         class="w-full mt-6 p-4 rounded-2xl bg-black/30 border border-white/10 outline-none text-white"
         placeholder="New password">

  <input id="confirmPassword" type="password"
         class="w-full mt-3 p-4 rounded-2xl bg-black/30 border border-white/10 outline-none text-white"
         placeholder="Confirm password">

  <button id="resetBtn" class="w-full mt-4 p-4 rounded-2xl font-black bg-yellow-400 text-black">
    Update Password
  </button>

  <a href="/login.html" class="block mt-4 text-yellow-300 text-sm">Back to Login</a>

  <p id="msg" class="text-sm mt-4 text-slate-300"></p>
</div>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const resetBtn = document.getElementById("resetBtn");
const msg = document.getElementById("msg");

function showMsg(text, type="normal"){
  msg.textContent = text;
  msg.className =
    "text-sm mt-4 " +
    (type === "error" ? "text-pink-300" :
     type === "success" ? "text-green-300" :
     "text-slate-300");
}

async function prepareSessionFromResetLink(){
  const hashParams = new URLSearchParams(window.location.hash.substring(1));
  const accessToken = hashParams.get("access_token");
  const refreshToken = hashParams.get("refresh_token");

  if(accessToken && refreshToken){
    const { error } = await sb.auth.setSession({
      access_token: accessToken,
      refresh_token: refreshToken
    });

    if(error){
      showMsg(error.message, "error");
      return;
    }

    showMsg("Reset link verified. Enter your new password.", "success");
  }else{
    showMsg("Open this page from the password reset email link.", "error");
  }
}

resetBtn.addEventListener("click", async () => {
  const password = passwordInput.value.trim();
  const confirmPassword = confirmPasswordInput.value.trim();

  if(!password || !confirmPassword){
    showMsg("Enter and confirm your new password.", "error");
    return;
  }

  if(password.length < 6){
    showMsg("Password must be at least 6 characters.", "error");
    return;
  }

  if(password !== confirmPassword){
    showMsg("Passwords do not match.", "error");
    return;
  }

  resetBtn.disabled = true;
  resetBtn.textContent = "Updating...";
  showMsg("Updating password...");

  const { error } = await sb.auth.updateUser({
    password
  });

  if(error){
    showMsg(error.message, "error");
    resetBtn.disabled = false;
    resetBtn.textContent = "Update Password";
    return;
  }

  showMsg("Password updated. You can now login.", "success");

  setTimeout(() => {
    window.location.href = "/login.html";
  }, 1200);
});

prepareSessionFromResetLink();
</script>

</body>
</html>
