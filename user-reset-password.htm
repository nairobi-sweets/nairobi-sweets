<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Nairobi Sweets</title>

<link rel="icon" type="image/png" href="/assets/logo/logo-badge.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  min-height:100vh;
  color:#f8fafc;
  background:
    radial-gradient(circle at 10% 0%, rgba(236,72,153,.14), transparent 25%),
    radial-gradient(circle at 90% 10%, rgba(250,204,21,.11), transparent 25%),
    linear-gradient(180deg,#060812,#0b1020 55%,#070a12);
  font-family:Inter,ui-sans-serif,system-ui,sans-serif;
}
.card{
  background:rgba(9,14,28,.82);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 24px 70px rgba(0,0,0,.38);
}
.input{
  width:100%;
  padding:16px 18px;
  border-radius:18px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.10);
  color:white;
  outline:none;
}
.input:focus{
  border-color:rgba(250,204,21,.65);
  box-shadow:0 0 0 3px rgba(250,204,21,.10);
}
</style>
</head>

<body class="flex items-center justify-center px-4 py-10">

<div class="card w-full max-w-md rounded-[30px] p-7 text-center">

  <img src="/assets/logo/logo-badge.png"
       alt="Nairobi Sweets"
       class="w-16 h-16 rounded-full mx-auto mb-5"
       onerror="this.style.display='none'">

  <p class="text-pink-200 text-xs uppercase tracking-[.28em]">
    User Account Recovery
  </p>

  <h1 class="text-3xl font-black text-yellow-300 mt-3">
    Forgot Password
  </h1>

  <p class="text-slate-400 text-sm mt-3">
    Enter your username. We will send a reset link to your email.
  </p>

  <input
    id="username"
    type="text"
    class="input mt-7"
    placeholder="Username"
    autocomplete="username"
  >

  <button
    id="sendBtn"
    class="w-full mt-4 p-4 rounded-2xl font-black bg-yellow-400 text-black hover:brightness-105 transition">
    Send Reset Link
  </button>

  <a href="/login.html" class="block mt-5 text-yellow-300 text-sm hover:text-yellow-200">
    Back to Login
  </a>

  <p id="msg" class="text-sm mt-5 text-slate-300"></p>

</div>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const usernameInput = document.getElementById("username");
const sendBtn = document.getElementById("sendBtn");
const msg = document.getElementById("msg");

function showMsg(text,type="normal"){
  msg.textContent = text;
  msg.className =
    "text-sm mt-5 " +
    (type === "error" ? "text-pink-300" :
     type === "success" ? "text-green-300" :
     "text-slate-300");
}

function cleanUsername(value){
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"_");
}

async function sendResetLink(){
  const username = cleanUsername(usernameInput.value);

  if(!username){
    showMsg("Enter your username first.","error");
    usernameInput.focus();
    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = "Sending...";
  showMsg("Finding your account...");

  try{
    const { data: profile, error: profileError } = await sb
      .from("profiles")
      .select("email,username")
      .eq("username", username)
      .maybeSingle();

    if(profileError){
      throw new Error(profileError.message);
    }

    if(!profile?.email){
      throw new Error("Username not found. Try using underscores, for example new_sauce.");
    }

    const { error } = await sb.auth.resetPasswordForEmail(profile.email,{
      redirectTo: `${window.location.origin}/user-reset-password.html`
    });

    if(error){
      throw new Error(error.message);
    }

    showMsg("Reset link sent. Check your email inbox.","success");

  }catch(error){
    showMsg(error.message || "Failed to send reset link.","error");
  }finally{
    sendBtn.disabled = false;
    sendBtn.textContent = "Send Reset Link";
  }
}

sendBtn.addEventListener("click", sendResetLink);

usernameInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    sendResetLink();
  }
});
</script>

</body>
</html>
