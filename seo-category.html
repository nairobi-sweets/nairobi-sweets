*{margin:0;padding:0;box-sizing:border-box}body{background:radial-gradient(circle at top,#0c1148,#000 50%);color:white;font-family:Arial,Helvetica,sans-serif;min-height:100vh}a{text-decoration:none;color:inherit}.topbar{position:sticky;top:0;z-index:99;background:#000;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,213,74,.12)}.brand{display:flex;align-items:center;gap:14px}.brand img{width:64px;height:64px;border-radius:18px}.brand strong{font-size:28px;color:#ffd54a}.nav{display:flex;gap:12px;flex-wrap:wrap}.nav a{background:#07145f;border:1px solid rgba(255,213,74,.18);padding:12px 18px;border-radius:999px;font-weight:900}.nav .join{background:linear-gradient(145deg,#ffd54a,#ff9f1c);color:#000}.hero{text-align:center;padding:70px 18px 34px}.badge{display:inline-flex;background:rgba(255,213,74,.12);border:1px solid rgba(255,213,74,.18);padding:10px 18px;border-radius:999px;color:#ffd54a;font-weight:900;margin-bottom:18px}.hero h1{color:#ffd54a;font-size:clamp(48px,9vw,92px);line-height:.9;margin-bottom:18px}.hero p{max-width:920px;margin:auto;color:#ddd;font-size:18px;line-height:1.7}.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}.chips a{background:#07145f;border:1px solid rgba(255,213,74,.18);padding:12px 16px;border-radius:999px;font-weight:900}.chips a.active{background:linear-gradient(145deg,#ffd54a,#ff9f1c);color:#000}.wrap{padding:32px 28px 70px}.section-title{color:#ffd54a;font-size:34px;font-weight:950;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:22px}.card{overflow:hidden;border-radius:28px;background:linear-gradient(180deg,#020a56,#010633);border:1px solid rgba(255,213,74,.12);box-shadow:0 18px 50px rgba(0,0,0,.45)}.card img{width:100%;aspect-ratio:4/4.4;object-fit:cover;display:block;background:#020617}.body{padding:18px}.pill{display:inline-flex;background:linear-gradient(145deg,#ffd54a,#ff9f1c);color:#000;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:950;margin-bottom:12px}.name{font-size:22px;font-weight:950;margin-bottom:8px}.loc{color:#ddd;font-size:14px;margin-bottom:10px}.bio{color:#cfcfcf;font-size:13px;line-height:1.55;margin-bottom:14px;min-height:42px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions a{border-radius:16px;min-height:38px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:950}.wa{background:#0b5f2d}.view{background:#ffd54a;color:#000}.empty{grid-column:1/-1;text-align:center;color:#ffd54a;font-weight:900;padding:60px}.footer{background:#050505;text-align:center;color:#aaa;padding:36px 18px}.footer a{color:#ffd54a}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.topbar{padding:14px}.brand img{width:54px;height:54px}.brand strong{font-size:22px}.nav{display:none}.grid{grid-template-columns:1fr}.wrap{padding:24px 14px 60px}.hero{padding:48px 14px 24px}}

<body>
<header class="topbar"><a href="/" class="brand"><img src="/assets/logo/logo-badge.png" alt="Nairobi Sweets"><strong>Nairobi Sweets</strong></a><nav class="nav"><a href="/seo/">SEO Hub</a><a href="/reel.html">Reels</a><a href="/join.html" class="join">Join</a></nav></header>
<section class="hero"><div class="badge">✨ Category SEO Hub</div><h1 id="pageTitle">Category Profiles</h1><p id="pageDesc">Browse active Nairobi Sweets profiles by category. Listings load from Supabase when available.</p><div class="chips" id="chips"></div></section>
<main class="wrap"><h2 class="section-title" id="sectionTitle">Featured Profiles</h2><section class="grid" id="grid"><div class="empty">Loading profiles...</div></section></main>
<footer class="footer">© 2026 Nairobi Sweets · <a href="/">Home</a> · <a href="/seo/">SEO Hub</a> · <a href="/sitemap.xml">Sitemap</a></footer>
<script>
const SUPABASE_URL="https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRramQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc3NTU0MDgzMiwiZXhwIjoyMDkxMTE2ODMyfQ.invalid";
// The key above is intentionally ignored if the real key is unavailable. Paste your public anon key from index.html here if category cards do not load.
const REAL_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRramx2eXludmd0aWpjY2l0dnZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDA4MzIsImV4cCI6MjA5MTExNjgzMn0.6wlZCQPJ2En4egpQUo5LAyQhee2hkCQ_tHGxfxbv1EQ";
const sb=window.supabase.createClient(SUPABASE_URL,REAL_KEY);
const params=new URLSearchParams(location.search);let category=(params.get('category')||location.pathname.split('/').pop().replace('.html','')||'featured').toLowerCase();
const config={featured:{title:'Featured Profiles',desc:'Browse Featured Nairobi Sweets profiles with active visibility and location discovery.',match:p=>(p.plan||'').toLowerCase().includes('featured')||p.featured},vip:{title:'VIP Profiles',desc:'Browse VIP and VIP+ Nairobi profiles with boosted placement and premium discovery.',match:p=>['vip','vip+','vip-plus'].some(x=>(p.plan||'').toLowerCase().includes(x))||p.vip_plus},signature:{title:'Signature Profiles',desc:'Browse Signature Nairobi profiles with premium luxury placement.',match:p=>(p.plan||'').toLowerCase().includes('signature')},verified:{title:'Verified Profiles',desc:'Browse verified Nairobi profiles with stronger trust signals.',match:p=>!!p.verified},'top-rated':{title:'Top Rated Profiles',desc:'Browse top rated Nairobi profiles ranked by likes, views, verification and quality signals.',match:p=>true,sort:(a,b)=>score(b)-score(a)},'trending-this-week':{title:'Trending This Week',desc:'Browse Nairobi profiles gaining visibility this week.',match:p=>true,sort:(a,b)=>score(b)-score(a)},trending:{title:'Trending Profiles',desc:'Browse trending Nairobi profiles with strong views and engagement.',match:p=>true,sort:(a,b)=>score(b)-score(a)},reels:{title:'Profiles With Reels',desc:'Browse Nairobi profiles with reels or short videos.',match:p=>!!(p.reel||p.short_video||p.video_url)}};
function nice(s){return (s||'').replace(/-/g,' ').replace(/\w/g,m=>m.toUpperCase())}function score(p){return Number(p.likes||0)*20+Number(p.views||0)*15+Number(p.boost||0)*15+(p.verified?10:0)}
function img(p){return p.image_url||p.photo_url||p.main_image||p.avatar_url||(Array.isArray(p.gallery)&&p.gallery[0])||'/assets/logo/logo-badge.png'}function slug(p){return p.slug||p.id||''}function cleanPhone(v){return String(v||'').replace(/\D/g,'').replace(/^0/,'254')}
function setup(){const c=config[category]||config.featured;document.title=c.title+' | Nairobi Sweets';document.getElementById('pageTitle').textContent=c.title;document.getElementById('pageDesc').textContent=c.desc;document.getElementById('sectionTitle').textContent='Featured '+c.title;document.querySelector('meta[name="description"]').setAttribute('content',c.desc);document.getElementById('chips').innerHTML=Object.keys(config).map(k=>`<a class="${k===category?'active':''}" href="/seo/categories/${k}.html">${nice(k)}</a>`).join('')}
async function load(){setup();const grid=document.getElementById('grid');try{let {data,error}=await sb.from('profiles').select('*').eq('approved',true).limit(80);if(error)throw error;const c=config[category]||config.featured;let list=(data||[]).filter(c.match);if(c.sort)list=list.sort(c.sort);else list=list.sort((a,b)=>score(b)-score(a));list=list.slice(0,24);if(!list.length){grid.innerHTML='<div class="empty">No matching profiles yet. New approved profiles will appear here automatically.</div>';return}grid.innerHTML=list.map(p=>`<article class="card"><img src="${img(p)}" alt="${p.stage_name||p.name||'Nairobi Sweets profile'}" onerror="this.src='/assets/logo/logo-badge.png'"><div class="body"><span class="pill">🔥 ${nice(category)}</span><div class="name">${p.stage_name||p.name||'Nairobi Sweet'}</div><div class="loc">📍 ${p.location||'Nairobi'}</div><div class="bio">${p.bio||'Active Nairobi Sweets profile.'}</div><div class="actions"><a class="view" href="/profile/${slug(p)}">View</a><a class="wa" href="https://wa.me/${cleanPhone(p.whatsapp||p.phone)}" target="_blank" rel="noopener">WhatsApp</a></div></div></article>`).join('')}catch(e){grid.innerHTML='<div class="empty">Profiles could not load right now. Check Supabase connection.</div>'}}load();
</script>
