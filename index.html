<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nairobi Sweets | Nairobi Escorts, VIP Profiles & Luxury Discovery</title>

<meta name="description" content="Discover verified Nairobi escort profiles with real photos, WhatsApp access, likes, views, premium VIP listings and luxury discovery.">

<meta name="keywords" content="Nairobi escorts, Nairobi call girls, Nairobi sweets, Kenya escorts, VIP escorts Nairobi, escorts Kenya">

<meta property="og:title" content="Nairobi Sweets">
<meta property="og:description" content="Verified Nairobi profiles with real photos and WhatsApp access.">
<meta property="og:image" content="./assets/logo/logo-hero.png">
<meta property="og:type" content="website">

<link rel="icon" href="./assets/logo/logo-badge.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#020617;
color:white;
overflow-x:hidden;
}

/* NAVBAR */

nav{
width:100%;
padding:22px 70px;
display:flex;
justify-content:space-between;
align-items:center;
background:black;
border-bottom:1px solid rgba(255,215,0,0.2);
position:sticky;
top:0;
z-index:999;
}

.brand{
display:flex;
align-items:center;
gap:16px;
text-decoration:none;
}

.brand img{
width:72px;
height:72px;
object-fit:contain;
display:block;
}

.brand span{
font-size:52px;
font-weight:900;
color:#ffd84b;
letter-spacing:-2px;
}

.nav-right{
display:flex;
align-items:center;
gap:18px;
}

.nav-btn{
padding:18px 34px;
border-radius:22px;
border:none;
font-size:22px;
font-weight:800;
cursor:pointer;
transition:0.3s;
text-decoration:none;
}

.join-btn{
background:#ffd84b;
color:black;
}

.join-btn:hover{
transform:translateY(-3px);
}

.shorts-btn{
background:#09143f;
color:#ffd84b;
border:1px solid rgba(255,215,0,0.25);
}

/* HERO */

.hero{
padding:80px 20px 50px;
text-align:center;
}

.hero h1{
font-size:110px;
font-weight:900;
color:#ffd84b;
line-height:1;
}

.hero p{
margin-top:25px;
font-size:22px;
color:#b8bfd3;
max-width:1100px;
margin-inline:auto;
line-height:1.7;
}

/* SEARCH */

.search-wrap{
width:95%;
margin:20px auto 40px;
display:grid;
grid-template-columns:1fr 280px;
gap:20px;
}

.search-wrap input,
.search-wrap select{
height:78px;
border-radius:24px;
border:1px solid rgba(255,255,255,0.08);
background:#09143f;
padding:0 28px;
font-size:24px;
color:white;
outline:none;
}

/* STATS */

.stats{
width:95%;
margin:auto;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
margin-bottom:35px;
}

.stat-box{
background:#07113a;
border-radius:30px;
padding:34px;
border:1px solid rgba(255,215,0,0.15);
}

.stat-box h3{
font-size:24px;
color:#98a3c7;
margin-bottom:20px;
}

.stat-box h2{
font-size:72px;
font-weight:900;
color:#ffd84b;
}

/* GRID */

#profiles{
width:95%;
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:28px;
padding-bottom:80px;
}

/* CARD */

.card{
background:#081136;
border-radius:34px;
overflow:hidden;
border:2px solid rgba(255,215,0,0.6);
transition:0.35s;
position:relative;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 15px 40px rgba(0,0,0,0.45);
}

.card-image{
width:100%;
aspect-ratio:4/5;
overflow:hidden;
background:black;
}

.card-image img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.badge{
position:absolute;
top:18px;
right:18px;
background:#3d3a37;
color:#ffd84b;
padding:12px 18px;
border-radius:999px;
font-weight:900;
font-size:20px;
border:1px solid rgba(255,215,0,0.3);
backdrop-filter:blur(6px);
}

.card-body{
padding:26px;
}

.card-body h2{
font-size:54px;
font-weight:900;
margin-bottom:14px;
}

.location{
font-size:24px;
color:#d7d7d7;
line-height:1.5;
margin-bottom:16px;
}

.phone{
font-size:24px;
color:#ffffff;
margin-bottom:16px;
}

.stats-line{
font-size:24px;
color:#ff8cb7;
margin-bottom:22px;
}

.profile-link{
display:inline-block;
width:100%;
padding:20px;
border-radius:18px;
background:#ff2f72;
color:white;
font-size:24px;
font-weight:900;
text-align:center;
text-decoration:none;
transition:0.3s;
}

.profile-link:hover{
background:#ff4f88;
}

/* MOBILE */

@media(max-width:1500px){

#profiles{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:1100px){

.hero h1{
font-size:70px;
}

.stats{
grid-template-columns:1fr;
}

#profiles{
grid-template-columns:repeat(2,1fr);
}

nav{
padding:20px;
}

.brand span{
font-size:34px;
}

.search-wrap{
grid-template-columns:1fr;
}

}

@media(max-width:700px){

#profiles{
grid-template-columns:1fr;
}

.hero h1{
font-size:52px;
}

.brand img{
width:52px;
height:52px;
}

.brand span{
font-size:28px;
}

.nav-btn{
padding:14px 20px;
font-size:18px;
}

}

</style>
</head>

<body>

<nav>

<a href="index.html" class="brand">
<img src="./assets/logo/logo-navbar.png" alt="Nairobi Sweets">
<span>Nairobi Sweets</span>
</a>

<div class="nav-right">

<a href="shorts.html" class="nav-btn shorts-btn">
Shorts
</a>

<a href="join.html" class="nav-btn join-btn">
Join Now
</a>

</div>

</nav>

<section class="hero">

<h1>Profiles</h1>

<p>
Verified profiles, WhatsApp access, VIP listings, likes, views,
luxury discovery and real photos.
</p>

</section>

<div class="search-wrap">

<input
type="text"
id="searchInput"
placeholder="Search by name, bio, location..."
>

<select id="sortSelect">
<option value="featured">Featured First</option>
<option value="likes">Most Likes</option>
<option value="views">Most Views</option>
</select>

</div>

<section class="stats">

<div class="stat-box">
<h3>Total Profiles</h3>
<h2 id="totalProfiles">0</h2>
</div>

<div class="stat-box">
<h3>Total Views</h3>
<h2 id="totalViews">0</h2>
</div>

<div class="stat-box">
<h3>Total Likes</h3>
<h2 id="totalLikes">0</h2>
</div>

</section>

<section id="profiles"></section>

<script>

const SUPABASE_URL =
"https://dkjlvyynvgtijccitvvd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const profilesEl =
document.getElementById("profiles");

const totalProfilesEl =
document.getElementById("totalProfiles");

const totalViewsEl =
document.getElementById("totalViews");

const totalLikesEl =
document.getElementById("totalLikes");

const searchInput =
document.getElementById("searchInput");

const sortSelect =
document.getElementById("sortSelect");

let profiles = [];

async function loadProfiles(){

let { data, error } = await sb
.from("profiles")
.select("*")
.eq("approved", true);

if(error){
console.log(error);
return;
}

profiles = data || [];

renderProfiles();

}

function renderProfiles(){

let filtered = [...profiles];

const q =
searchInput.value.toLowerCase();

if(q){

filtered = filtered.filter(p =>

(p.stage_name || "")
.toLowerCase()
.includes(q)

||

(p.location || "")
.toLowerCase()
.includes(q)

||

(p.bio || "")
.toLowerCase()
.includes(q)

);

}

const sort =
sortSelect.value;

if(sort === "likes"){

filtered.sort(
(a,b)=>(b.likes||0)-(a.likes||0)
);

}

if(sort === "views"){

filtered.sort(
(a,b)=>(b.views||0)-(a.views||0)
);

}

if(sort === "featured"){

filtered.sort((a,b)=>{

const order = {
"VVIP":3,
"VIP":2,
"Featured":1
};

return (
(order[b.tier]||0) -
(order[a.tier]||0)
);

});

}

profilesEl.innerHTML = "";

let totalViews = 0;
let totalLikes = 0;

filtered.forEach(profile => {

totalViews += profile.views || 0;
totalLikes += profile.likes || 0;

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `

<div class="card-image">

<img
src="${profile.photo_url}"
loading="lazy"
>

</div>

<div class="badge">
⭐ ${profile.tier || "Featured"}
</div>

<div class="card-body">

<h2>${profile.stage_name || ""}</h2>

<div class="location">
📍 ${profile.location || ""}
</div>

<div class="phone">
📞 ${profile.phone || ""}
</div>

<div class="stats-line">
❤️ ${profile.likes || 0} likes
•
👁️ ${profile.views || 0} views
</div>

<a
class="profile-link"
href="profile.html?id=${profile.id}"
>
View Profile
</a>

</div>

`;

profilesEl.appendChild(card);

});

totalProfilesEl.innerText =
filtered.length;

totalViewsEl.innerText =
totalViews.toLocaleString();

totalLikesEl.innerText =
totalLikes.toLocaleString();

}

searchInput.addEventListener(
"input",
renderProfiles
);

sortSelect.addEventListener(
"change",
renderProfiles
);

loadProfiles();

</script>

</body>
</html>
