<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nairobi Sweets</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080814;
      color: #fff;
    }

    header {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.55);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(14px);
    }

    .brand {
      font-size: 24px;
      font-weight: 900;
      color: #ffd84b;
    }

    .join-btn {
      background: #ffd84b;
      color: #111;
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 36px;
      background:
        radial-gradient(circle at top, rgba(255,216,75,0.22), transparent 35%),
        linear-gradient(180deg, #12122b, #080814);
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 68px);
      margin: 0 0 12px;
      color: #fff;
    }

    .hero p {
      color: #cfcfe8;
      max-width: 680px;
      margin: auto;
      font-size: 17px;
    }

    .filters {
      max-width: 1200px;
      margin: 20px auto 0;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: #fff;
      outline: none;
    }

    .filters select option {
      color: #111;
    }

    .grid {
      max-width: 1200px;
      margin: 26px auto 60px;
      padding: 0 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }

    .card {
      border-radius: 26px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    }

    .photo-wrap {
      width: 100%;
      height: 330px;
      background: #17172b;
      overflow: hidden;
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .35s ease;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .content {
      padding: 18px;
    }

    .name-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .name {
      font-size: 22px;
      font-weight: 900;
      margin: 0;
    }

    .badge {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,216,75,0.15);
      color: #ffd84b;
      border: 1px solid rgba(255,216,75,0.35);
      white-space: nowrap;
    }

    .meta {
      color: #cfcfe8;
      margin: 8px 0 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .bio {
      color: #fff;
      opacity: .9;
      font-size: 14px;
      min-height: 38px;
    }

    .profile-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 14px;
    }

    .like-btn {
      border: none;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff4d8d, #ffd84b);
      color: #111;
      font-weight: 900;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .actions a {
      text-align: center;
      text-decoration: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 900;
    }

    .whatsapp {
      background: #25D366;
      color: #06130a;
    }

    .call {
      background: #ffd84b;
      color: #111;
    }

    .empty {
      text-align: center;
      color: #cfcfe8;
      padding: 40px;
      grid-column: 1 / -1;
    }

    @media (max-width: 650px) {
      .filters {
        grid-template-columns: 1fr;
      }

      header {
        padding: 14px 16px;
      }

      .photo-wrap {
        height: 380px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">Nairobi Sweets</div>
  <a class="join-btn" href="public-signup-payment-page.html">Join Now</a>
</header>

<section class="hero">
  <h1>Premium Profiles</h1>
  <p>Discover approved Nairobi Sweets profiles with real photos, contact buttons, likes, and views.</p>
</section>

<div class="filters">
  <input id="searchInput" type="text" placeholder="Search by name, location, bio..." oninput="renderProfiles()" />
  <select id="sortSelect" onchange="renderProfiles()">
    <option value="featured">Featured first</option>
    <option value="likes">Most liked</option>
    <option value="views">Most viewed</option>
    <option value="newest">Newest</option>
  </select>
</div>

<main id="profilesGrid" class="grid">
  <div class="empty">Loading profiles...</div>
</main>

<script>
  const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allProfiles = [];

  function safeText(value) {
    return value ? String(value) : "";
  }

  function getProfileImage(p) {
    return (
      p.photo_url ||
      p.image_url ||
      p.profile_photo ||
      p.profile_image ||
      p.avatar_url ||
      "assets/logo/logo-badge.png"
    );
  }

  function getName(p) {
    return p.stage_name || p.name || p.full_name || "Nairobi Sweet";
  }

  function getLocation(p) {
    return p.location || p.city || "Nairobi";
  }

  function getPhone(p) {
    return p.phone || p.phone_number || p.whatsapp || "";
  }

  function getWhatsAppLink(phone) {
    const clean = String(phone || "").replace(/\D/g, "");

    if (!clean) return "#";

    let finalPhone = clean;

    if (clean.startsWith("0")) {
      finalPhone = "254" + clean.slice(1);
    } else if (clean.startsWith("7") || clean.startsWith("1")) {
      finalPhone = "254" + clean;
    }

    return `https://wa.me/${finalPhone}`;
  }

  async function loadProfiles() {
    const { data, error } = await sb
      .from("profiles")
      .select("*")
      .or("approved.eq.true,status.eq.approved,is_approved.eq.true")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      document.getElementById("profilesGrid").innerHTML =
        `<div class="empty">Could not load profiles. Check Supabase RLS or table columns.</div>`;
      return;
    }

    allProfiles = data || [];
    renderProfiles();
    countVisibleViews();
  }

  async function addView(profileId, currentViews = 0) {
    const viewedKey = `viewed_${profileId}`;

    if (localStorage.getItem(viewedKey)) return;

    localStorage.setItem(viewedKey, "yes");

    await sb
      .from("profiles")
      .update({ views: Number(currentViews || 0) + 1 })
      .eq("id", profileId);
  }

  async function likeProfile(profileId, currentLikes = 0) {
    const likedKey = `liked_${profileId}`;

    if (localStorage.getItem(likedKey)) {
      alert("You already liked this profile ❤️");
      return;
    }

    localStorage.setItem(likedKey, "yes");

    const { error } = await sb
      .from("profiles")
      .update({ likes: Number(currentLikes || 0) + 1 })
      .eq("id", profileId);

    if (error) {
      console.error(error);
      alert("Like failed. Check Supabase permissions.");
      return;
    }

    allProfiles = allProfiles.map(p => {
      if (p.id === profileId) {
        return { ...p, likes: Number(p.likes || 0) + 1 };
      }
      return p;
    });

    renderProfiles();
  }

  function countVisibleViews() {
    allProfiles.forEach(p => {
      if (p.id) addView(p.id, p.views || 0);
    });
  }

  function renderProfiles() {
    const grid = document.getElementById("profilesGrid");
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const sort = document.getElementById("sortSelect").value;

    let profiles = [...allProfiles];

    if (q) {
      profiles = profiles.filter(p => {
        const haystack = `
          ${safeText(getName(p))}
          ${safeText(getLocation(p))}
          ${safeText(p.bio)}
          ${safeText(p.description)}
          ${safeText(p.category)}
        `.toLowerCase();

        return haystack.includes(q);
      });
    }

    if (sort === "likes") {
      profiles.sort((a, b) => Number(b.likes || 0) - Number(a.likes || 0));
    }

    if (sort === "views") {
      profiles.sort((a, b) => Number(b.views || 0) - Number(a.views || 0));
    }

    if (sort === "newest") {
      profiles.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
    }

    if (sort === "featured") {
      profiles.sort((a, b) => {
        const av = a.plan === "VVIP" || a.plan === "Signature" ? 3 : a.plan === "VIP" ? 2 : 1;
        const bv = b.plan === "VVIP" || b.plan === "Signature" ? 3 : b.plan === "VIP" ? 2 : 1;
        return bv - av;
      });
    }

    if (!profiles.length) {
      grid.innerHTML = `<div class="empty">No approved profiles found.</div>`;
      return;
    }

    grid.innerHTML = profiles.map(p => {
      const name = getName(p);
      const location = getLocation(p);
      const phone = getPhone(p);
      const image = getProfileImage(p);
      const bio = p.bio || p.description || "Premium Nairobi profile.";
      const likes = Number(p.likes || 0);
      const views = Number(p.views || 0);
      const plan = p.plan || p.package || "Featured";

      return `
        <article class="card">
          <div class="photo-wrap">
            <img 
              src="${image}" 
              alt="${name}" 
              loading="lazy"
              onerror="this.onerror=null;this.src='assets/logo/logo-badge.png';"
            />
          </div>

          <div class="content">
            <div class="name-row">
              <h2 class="name">${name}</h2>
              <span class="badge">${plan}</span>
            </div>

            <div class="meta">
              📍 ${location}<br>
              📞 ${phone || "Contact available"}
            </div>

            <div class="bio">${bio}</div>

            <div class="profile-stats">
              <span>👁️ ${views} views</span>
              <button class="like-btn" onclick="likeProfile('${p.id}', ${likes})">
                ❤️ ${likes} likes
              </button>
            </div>

            <div class="actions">
              <a class="whatsapp" href="${getWhatsAppLink(phone)}" target="_blank">WhatsApp</a>
              <a class="call" href="tel:${phone}">Call</a>
            </div>
          </div>
        </article>
      `;
    }).join("");
  }

  loadProfiles();
</script>

</body>
</html>
