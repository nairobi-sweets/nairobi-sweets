<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Nairobi Sweets | Verified Nairobi Profiles</title>

<meta name="description" content="Discover verified Nairobi profiles with real photos, WhatsApp access, likes, views, luxury discovery and VIP listings.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://nairobi-sweets.com/">
<link rel="icon" href="./assets/logo/logo-badge.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#020617;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

a{text-decoration:none;color:inherit}

header{
  background:#000;
  padding:24px 40px;
  border-bottom:1px solid rgba(255,216,75,.18);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
  text-decoration:none;
}

.brand img{
  width:72px;
  height:72px;
  object-fit:contain;
  display:block;
}

.brand span{
  font-size:42px;
  font-weight:900;
  color:#ffd84b;
  letter-spacing:-1px;
}

.header-actions{
  display:flex;
  gap:14px;
  align-items:center;
}

.top-btn{
  background:#0b1742;
  color:#ffd84b;
  border:1px solid rgba(255,216,75,.25);
  padding:18px 34px;
  border-radius:22px;
  font-weight:900;
  font-size:20px;
}

.join-btn{
  background:#ffd84b;
  color:#000;
}

.hero{
  padding:50px 20px 20px;
  text-align:center;
}

.hero h1{
  font-size:88px;
  color:#ffd84b;
  font-weight:900;
}

.hero p{
  margin-top:20px;
  color:#b7bdd1;
  font-size:22px;
}

.controls{
  display:flex;
  gap:20px;
  padding:20px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:260px;
}

.search input,
.sort select{
  width:100%;
  height:72px;
  border-radius:24px;
  border:1px solid #27314d;
  background:#081233;
  color:white;
  padding:0 26px;
  font-size:20px;
}

.sort{
  width:280px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:20px;
}

.stat{
  background:#071038;
  border:1px solid #2a3559;
  border-radius:30px;
  padding:30px;
}

.stat h3{
  color:#95a0c3;
  margin-bottom:18px;
  font-size:18px;
}

.stat span{
  font-size:56px;
  font-weight:900;
  color:#ffd84b;
}

.grid{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:24px;
  align-items:start;
}

.card{
  background:#071038;
  border-radius:26px;
  overflow:hidden;
  border:1px solid #ffbf00;
  position:relative;
  min-width:0;
  transition:.25s ease;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 20px 40px rgba(0,0,0,.45);
}

.card-image{
  width:100%;
  aspect-ratio:3/4;
  overflow:hidden;
  background:#000;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.badge{
  position:absolute;
  top:16px;
  right:16px;
  background:rgba(0,0,0,.65);
  color:#ffd84b;
  border:1px solid rgba(255,216,75,.28);
  padding:10px 18px;
  border-radius:999px;
  font-weight:900;
  font-size:14px;
}

.card-body{
  padding:20px;
}

.card-name{
  font-size:26px;
  font-weight:900;
  margin-bottom:14px;
  line-height:1.1;
}

.card-name a:hover{
  color:#ffd84b;
}

.meta{
  color:#d8dced;
  font-size:16px;
  line-height:1.6;
}

.stats-line{
  margin-top:14px;
  font-size:16px;
  color:#ffdb70;
  font-weight:900;
}

.bio{
  margin-top:14px;
  color:#cbd5e1;
  font-size:15px;
  line-height:1.5;
  min-height:65px;
}

.actions{
  margin-top:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action-btn{
  border:none;
  height:52px;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.like-btn{
  background:#ff3f86;
  color:white;
  grid-column:1/3;
}

.whatsapp-btn{
  background:#25D366;
  color:#001b09;
}

.call-btn{
  background:#ffd84b;
  color:#000;
}

footer{
  padding:70px 20px;
  text-align:center;
  color:#7f8bb0;
}

@media(max-width:1400px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}

@media(max-width:1100px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:1fr}
}

@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  header{padding:18px}
  .brand span{font-size:30px}
  .brand img{width:56px;height:56px}
  .hero h1{font-size:48px}
  .header-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .top-btn{text-align:center;padding:14px;font-size:15px}
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="brand">
    <img src="./assets/logo/logo-navbar.png" alt="Nairobi Sweets">
    <span>Nairobi Sweets</span>
  </a>

  <div class="header-actions">
    <a href="shorts.html" class="top-btn">Shorts</a>
    <a href="join.html" class="top-btn join-btn">Join Now</a>
  </div>
</header>

<section class="hero">
  <h1>Profiles</h1>
  <p>Verified profiles, WhatsApp access, VIP listings, likes, views, luxury discovery and real photos.</p>
</section>

<section class="controls">
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search by name, bio, location...">
  </div>

  <div class="sort">
    <select id="sortSelect">
      <option value="featured">Featured First</option>
      <option value="views">Most Views</option>
      <option value="likes">Most Likes</option>
      <option value="newest">Newest First</option>
    </select>
  </div>
</section>

<section class="stats">
  <div class="stat">
    <h3>Total Profiles</h3>
    <span id="totalProfiles">0</span>
  </div>

  <div class="stat">
    <h3>Total Views</h3>
    <span id="totalViews">0</span>
  </div>

  <div class="stat">
    <h3>Total Likes</h3>
    <span id="totalLikes">0</span>
  </div>
</section>

<section class="grid" id="profilesGrid"></section>

<footer>
  © Nairobi Sweets • Luxury Discovery Platform
</footer>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let profiles = [];

function getImage(p){
  return p.photo_url || p.image_url || p.profile_photo || p.avatar_url || p.photo || "./assets/logo/logo-badge.png";
}

function getName(p){
  return p.stage_name || p.name || p.full_name || "Profile";
}

function getTier(p){
  const tier = String(p.tier || "").toLowerCase();

  if(p.is_vvip || tier === "vvip" || tier === "signature") return "👑 VVIP";
  if(p.is_vip || tier === "vip") return "⭐ VIP";
  return "✨ Featured";
}

function cleanPhone(phone){
  let n = String(phone || "").replace(/\D/g,"");

  if(n.startsWith("0")) n = "254" + n.slice(1);
  if(n.startsWith("7") || n.startsWith("1")) n = "254" + n;

  return n;
}

async function loadProfiles(){
  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("approved", true)
    .order("created_at", { ascending:false });

  if(error){
    console.error(error);
    document.getElementById("profilesGrid").innerHTML = error.message;
    return;
  }

  profiles = data || [];
  renderStats(profiles);
  renderProfiles(profiles);
}

function renderStats(list){
  const totalProfiles = list.length;

  const totalViews = list.reduce((sum,p)=>
    sum + Number(p.views_count || 0),0);

  const totalLikes = list.reduce((sum,p)=>
    sum + Number(p.likes_count || 0),0);

  document.getElementById("totalProfiles").innerText = totalProfiles;
  document.getElementById("totalViews").innerText = totalViews.toLocaleString();
  document.getElementById("totalLikes").innerText = totalLikes.toLocaleString();
}

function renderProfiles(list){
  const grid = document.getElementById("profilesGrid");

  grid.innerHTML = "";

  list.forEach(profile=>{
    const rawPhone = profile.phone || profile.whatsapp || "";
    const phone = cleanPhone(rawPhone);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="badge">${getTier(profile)}</div>

      <div class="card-image">
        <a href="profile.html?id=${profile.id}">
          <img src="${getImage(profile)}" loading="lazy" onerror="this.src='./assets/logo/logo-badge.png'">
        </a>
      </div>

      <div class="card-body">
        <div class="card-name">
          <a href="profile.html?id=${profile.id}">
            ${getName(profile)}
          </a>
        </div>

        <div class="meta">
          <div>📍 ${profile.location || profile.area || profile.city || "Nairobi"}</div>
          <div>📞 ${rawPhone}</div>
        </div>

        <div class="stats-line">
          ❤️ ${profile.likes_count || 0} likes • 👁️ ${profile.views_count || 0} views
        </div>

        <div class="bio">
          ${profile.bio || "Premium Nairobi profile."}
        </div>

        <div class="actions">
          <a class="action-btn whatsapp-btn" href="https://wa.me/${phone}" target="_blank">
            WhatsApp
          </a>

          <a class="action-btn call-btn" href="tel:${rawPhone}">
            Call
          </a>

          <button class="action-btn like-btn" onclick="likeProfile(${profile.id})">
            ❤️ Like
          </button>
        </div>
      </div>
    `;

    grid.appendChild(card);
  });
}

async function likeProfile(id){
  try{
    await sb.rpc("increment_profile_likes", { p_profile_id:id });

    const profile = profiles.find(p => Number(p.id) === Number(id));

    if(profile){
      profile.likes_count = Number(profile.likes_count || 0) + 1;
      renderStats(profiles);
      renderProfiles(profiles);
    }
  }catch(error){
    alert("Like failed. Check Supabase function.");
  }
}

document.getElementById("searchInput").addEventListener("input",(e)=>{
  const value = e.target.value.toLowerCase();

  const filtered = profiles.filter(p =>
    getName(p).toLowerCase().includes(value) ||
    String(p.location || "").toLowerCase().includes(value) ||
    String(p.area || "").toLowerCase().includes(value) ||
    String(p.bio || "").toLowerCase().includes(value)
  );

  renderProfiles(filtered);
});

document.getElementById("sortSelect").addEventListener("change",(e)=>{
  const value = e.target.value;
  let sorted = [...profiles];

  if(value === "views"){
    sorted.sort((a,b)=>Number(b.views_count || 0) - Number(a.views_count || 0));
  }

  if(value === "likes"){
    sorted.sort((a,b)=>Number(b.likes_count || 0) - Number(a.likes_count || 0));
  }

  if(value === "newest"){
    sorted.sort((a,b)=>new Date(b.created_at || 0) - new Date(a.created_at || 0));
  }

  if(value === "featured"){
    sorted.sort((a,b)=>{
      const rank = p => {
        const tier = String(p.tier || "").toLowerCase();
        if(p.is_vvip || tier === "vvip" || tier === "signature") return 3;
        if(p.is_vip || tier === "vip") return 2;
        return 1;
      };

      return rank(b) - rank(a);
    });
  }

  renderProfiles(sorted);
});

loadProfiles();
</script>

</body>
</html>
