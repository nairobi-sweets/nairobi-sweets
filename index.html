<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nairobi Sweets</title>
<meta name="description" content="Verified Nairobi profiles, reels, shorts and WhatsApp connections.">

<link rel="icon" href="/assets/logo/logo-badge.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
  radial-gradient(circle at top,#121c7a 0%,#020617 45%,#000 100%);
  color:white;
  overflow-x:hidden;
  padding-bottom:90px;
}

a{
  text-decoration:none;
  color:inherit;
}

.topbar{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(0,0,0,.95);
  border-bottom:1px solid rgba(255,213,74,.12);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand img{
  width:64px;
  height:64px;
  border-radius:18px;
  object-fit:cover;
}

.brand h1{
  color:#ffd54a;
  line-height:.92;
  font-size:32px;
  font-weight:900;
}

.menu-btn{
  width:82px;
  height:82px;
  border:none;
  border-radius:26px;
  background:linear-gradient(180deg,#071a80,#050a44);
  color:#ffd54a;
  font-size:42px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.hero{
  margin:18px;
  background:
  linear-gradient(180deg,#08117a,#030840);
  border-radius:36px;
  padding:28px;
  border:1px solid rgba(255,213,74,.08);
  box-shadow:
  0 0 40px rgba(89,0,255,.2),
  0 25px 60px rgba(0,0,0,.55);
}

.hero h2{
  font-size:72px;
  line-height:.92;
  color:#ffd54a;
  margin-bottom:18px;
  font-weight:900;
}

.hero p{
  color:#ddd;
  font-size:18px;
  line-height:1.8;
  margin-bottom:22px;
}

.search{
  width:100%;
  height:68px;
  border:none;
  outline:none;
  border-radius:24px;
  background:#020a45;
  color:white;
  padding:0 22px;
  font-size:18px;
  border:1px solid rgba(255,213,74,.08);
}

.tabs{
  display:flex;
  gap:12px;
  padding:0 18px;
  margin-top:22px;
  overflow:auto;
}

.tab{
  min-width:max-content;
  padding:16px 24px;
  border-radius:22px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,213,74,.08);
  font-weight:900;
  color:white;
}

.tab.active{
  background:linear-gradient(145deg,#28d45d,#0f8f39);
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:28px 18px 18px;
}

.section-head h3{
  font-size:54px;
  color:#ffd54a;
  font-weight:900;
}

.section-head a{
  color:#ff5ecf;
  font-weight:900;
  font-size:28px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:18px;
  padding:0 18px 40px;
}

.profile-link{
  display:block;
  text-decoration:none;
  color:inherit;
}

.card{
  background:
  linear-gradient(180deg,#06107b,#02073e);
  border-radius:28px;
  overflow:hidden;
  border:1px solid rgba(255,213,74,.08);
  transition:.25s;
  position:relative;
}

.card:hover{
  transform:translateY(-4px);
}

.card-image-wrap{
  position:relative;
}

.card img{
  width:100%;
  height:390px;
  object-fit:cover;
  display:block;
}

.plan{
  position:absolute;
  top:14px;
  right:14px;
  background:rgba(0,0,0,.75);
  color:#ffd54a;
  padding:10px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
}

.card-body{
  padding:18px;
}

.card-name{
  font-size:42px;
  font-weight:900;
  margin-bottom:8px;
}

.online{
  color:#29ff69;
  font-weight:900;
  margin-bottom:12px;
}

.location{
  color:#ddd;
  margin-bottom:8px;
}

.phone{
  color:#ffd54a;
  font-weight:900;
  margin-bottom:14px;
}

.bio{
  color:#ddd;
  line-height:1.7;
  font-size:15px;
  margin-bottom:18px;
  min-height:78px;
}

.stats{
  display:flex;
  gap:14px;
  color:#ddd;
  margin-bottom:16px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.call-btn,
.whatsapp-btn{
  height:54px;
  border:none;
  border-radius:18px;
  font-weight:900;
  cursor:pointer;
  font-size:15px;
}

.call-btn{
  background:#050918;
  color:white;
}

.whatsapp-btn{
  background:#1db954;
  color:white;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:82px;
  background:rgba(0,0,0,.96);
  border-top:1px solid rgba(255,213,74,.08);
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:999;
}

.bottom-nav a{
  font-size:34px;
  color:#ffd54a;
}

.floating-logo{
  position:fixed;
  right:18px;
  bottom:100px;
  width:72px;
  height:72px;
  border-radius:50%;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  z-index:999;
}

.floating-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.loading{
  text-align:center;
  padding:70px 20px;
  color:#ffd54a;
  font-size:28px;
  font-weight:900;
}

.menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.96);
  z-index:3000;
  padding:32px;
  display:none;
  flex-direction:column;
  gap:22px;
}

.menu.open{
  display:flex;
}

.menu-close{
  align-self:flex-end;
  font-size:72px;
  color:#ffd54a;
  cursor:pointer;
}

.menu a{
  background:
  linear-gradient(180deg,#06107b,#02073e);
  padding:28px;
  border-radius:28px;
  font-size:26px;
  font-weight:900;
  border:1px solid rgba(255,213,74,.08);
}

@media(max-width:700px){

.hero h2{
  font-size:52px;
}

.section-head h3{
  font-size:34px;
}

.card-name{
  font-size:34px;
}

}
</style>
</head>

<body>

<div class="menu" id="menu">
  <div class="menu-close" onclick="toggleMenu()">✕</div>

  <a href="/">🏠 Home</a>
  <a href="/shorts.html">🔥 Shorts</a>
  <a href="/reel.html">🎬 Reels</a>
  <a href="/join.html">💎 Join</a>
  <a href="/login.html">👤 Login</a>
  <a href="/vault-8472.html">🔐 Admin</a>
</div>

<header class="topbar">

  <div class="brand">
    <img src="/assets/logo/logo-navbar.png"
    onerror="this.src='/assets/logo/logo-badge.png'">

    <h1>Nairobi<br>Sweets</h1>
  </div>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

</header>

<section class="hero">

  <h2>Profiles</h2>

  <p>
    Verified profiles, WhatsApp access,
    VIP listings, reels and luxury discovery.
  </p>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search by name, bio, location..."
  >

</section>

<div class="tabs">
  <div class="tab active">HOME</div>
  <div class="tab">VIP</div>
  <div class="tab">ONLINE</div>
  <div class="tab">WHATSAPP</div>
</div>

<div class="section-head">
  <h3>🔥 Nairobi Shorts</h3>
  <a href="/reel.html">Open Reels →</a>
</div>

<section class="cards" id="cards">
  <div class="loading">Loading profiles...</div>
</section>

<a class="floating-logo" href="/">
  <img src="/assets/logo/logo-badge.png">
</a>

<nav class="bottom-nav">
  <a href="/">🏠</a>
  <a href="/shorts.html">🔥</a>
  <a href="/reel.html">🎬</a>
  <a href="/join.html">➕</a>
  <a href="/login.html">👤</a>
</nav>

<script>

const SUPABASE_URL =
"https://dkjlvyynvgtijccitvvd.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRramx2eXludmd0aWpjY2l0dnZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDA4MzIsImV4cCI6MjA5MTExNjgzMn0.6wlZCQPJ2En4egpQUo5LAyQhee2hkCQ_tHGxfxbv1EQ";

const SITE_URL =
"https://nairobi-sweets.com";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const cards =
document.getElementById("cards");

const search =
document.getElementById("search");

let profiles = [];

function toggleMenu(){
  document.getElementById("menu")
  .classList.toggle("open");
}

function safe(v){
  return v || "";
}

function safePhone(phone){

  let p = String(phone || "")
  .replace(/\D/g,"");

  if(!p) return "";

  if(p.startsWith("0")){
    p = "254" + p.slice(1);
  }

  if(p.startsWith("7") || p.startsWith("1")){
    p = "254" + p;
  }

  return p;
}

function slugify(text){
  return String(text || "")
  .toLowerCase()
  .replace(/[^a-z0-9]+/g,"-")
  .replace(/^-+|-+$/g,"");
}

function getSlug(profile){

  if(profile.slug){
    return profile.slug;
  }

  return slugify(
    profile.stage_name ||
    profile.name ||
    "profile"
  );
}

function getName(profile){

  return (
    profile.stage_name ||
    profile.name ||
    "Verified"
  );
}

function getImage(profile){

  return (
    profile.photo_url ||
    profile.image_url ||
    profile.profile_photo ||
    profile.main_photo ||
    profile.photo ||
    profile.image ||
    "/assets/logo/logo-badge.png"
  );
}

function getPlan(profile){

  const p = String(
    profile.plan ||
    profile.plan_name ||
    ""
  ).toLowerCase();

  if(p.includes("signature")){
    return "👑 Signature";
  }

  if(p.includes("vvip")){
    return "👑 VVIP";
  }

  if(p.includes("vip")){
    return "✨ VIP";
  }

  return "✨ Featured";
}

function whatsappShare(profile){

  const phone =
  safePhone(
    profile.phone ||
    profile.whatsapp
  );

  const url =
  `${SITE_URL}/profile.html?slug=${getSlug(profile)}`;

  const text =
  encodeURIComponent(
`🔥 Nairobi Sweets

Hi ${getName(profile)},

I found your profile on Nairobi Sweets:

${url}

💎 Verified profiles
🔥 Nairobi Shorts
🎬 Premium discovery`
  );

  return `https://wa.me/${phone}?text=${text}`;
}

function render(list){

  if(!list.length){

    cards.innerHTML = `
      <div class="loading">
        No profiles found.
      </div>
    `;

    return;
  }

  cards.innerHTML = list.map(profile=>{

    const phone =
    safePhone(
      profile.phone ||
      profile.whatsapp
    );

    return `

    <a
      href="/profile.html?slug=${getSlug(profile)}"
      class="profile-link"
    >

      <div class="card">

        <div class="card-image-wrap">

          <img
            src="${getImage(profile)}"
            onerror="this.src='/assets/logo/logo-badge.png'"
          >

          <div class="plan">
            ${getPlan(profile)}
          </div>

        </div>

        <div class="card-body">

          <div class="card-name">
            ${getName(profile)}
          </div>

          <div class="online">
            🟢 Online Now
          </div>

          <div class="location">
            📍 ${safe(profile.location)}
          </div>

          <div class="phone">
            📞 ${phone}
          </div>

          <div class="bio">
            ${safe(profile.bio || profile.about)}
          </div>

          <div class="stats">
            <span>❤️ ${profile.likes || 0}</span>
            <span>👁️ ${profile.views || 0}</span>
          </div>

          <div class="actions">

            <button
              class="call-btn"
              onclick="event.preventDefault();window.location.href='tel:${phone}'"
            >
              ☎ CALL
            </button>

            <button
              class="whatsapp-btn"
              onclick="event.preventDefault();window.open('${whatsappShare(profile)}','_blank')"
            >
              💬 WHATSAPP
            </button>

          </div>

        </div>

      </div>

    </a>

    `;

  }).join("");
}

async function loadProfiles(){

  const {data,error} =
  await sb
  .from("profiles")
  .select("*")
  .eq("approved",true)
  .order("created_at",{ascending:false});

  if(error){

    cards.innerHTML = `
      <div class="loading">
        ${error.message}
      </div>
    `;

    return;
  }

  profiles = data || [];

  render(profiles);
}

search.addEventListener("input",()=>{

  const q =
  search.value.toLowerCase();

  const filtered =
  profiles.filter(p=>{

    return JSON.stringify(p)
    .toLowerCase()
    .includes(q);

  });

  render(filtered);

});

loadProfiles();

</script>

</body>
</html>
