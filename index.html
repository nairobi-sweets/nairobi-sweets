<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Nairobi Sweets | Verified Nairobi Profiles</title>

<meta name="description" content="Verified Nairobi profiles, WhatsApp access, VIP listings, luxury discovery and real photos." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020617;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

header{
  background:#000;
  padding:20px 34px;
  border-bottom:1px solid rgba(255,216,75,.18);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:999;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand img{
  width:72px;
  height:72px;
  object-fit:contain;
}

.brand h1{
  color:#ffd84b;
  font-size:54px;
  font-weight:900;
  line-height:1;
}

.menu{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.menu a{
  background:#101936;
  color:#fff;
  border:1px solid rgba(255,216,75,.2);
  padding:12px 18px;
  border-radius:999px;
  font-weight:800;
  transition:.25s;
}

.menu a:hover{
  background:#ffd84b;
  color:#000;
}

.join-btn{
  background:#ffd84b !important;
  color:#000 !important;
}

.hero{
  text-align:center;
  padding:70px 20px 40px;
}

.hero h2{
  font-size:clamp(50px,8vw,120px);
  color:#ffd84b;
  font-weight:900;
}

.hero p{
  color:#b8c1d8;
  font-size:22px;
  max-width:900px;
  margin:22px auto 0;
  line-height:1.6;
}

.top-controls{
  width:min(1500px,95%);
  margin:auto;
  display:grid;
  grid-template-columns:1fr 280px;
  gap:20px;
  margin-bottom:30px;
}

.search{
  height:72px;
  border-radius:22px;
  border:1px solid rgba(255,216,75,.15);
  background:#101936;
  color:white;
  padding:0 24px;
  font-size:18px;
  outline:none;
}

.sort{
  height:72px;
  border-radius:22px;
  border:1px solid rgba(255,216,75,.15);
  background:#101936;
  color:white;
  padding:0 20px;
  font-size:18px;
  outline:none;
}

.stats{
  width:min(1500px,95%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-bottom:30px;
}

.stat-card{
  background:#071038;
  border:1px solid rgba(255,216,75,.18);
  border-radius:28px;
  padding:28px;
}

.stat-title{
  color:#93a0c7;
  font-size:18px;
  font-weight:700;
  margin-bottom:18px;
}

.stat-value{
  color:#ffd84b;
  font-size:58px;
  font-weight:900;
}

.grid{
  width:min(1500px,95%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:24px;
  padding-bottom:80px;
}

.card{
  background:#071038;
  border-radius:28px;
  overflow:hidden;
  border:1px solid rgba(255,216,75,.25);
  position:relative;
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
}

.image-wrap{
  width:100%;
  aspect-ratio:3/4;
  background:#000;
  overflow:hidden;
}

.image-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:18px;
  right:18px;
  background:rgba(0,0,0,.7);
  border:1px solid rgba(255,216,75,.3);
  color:#ffd84b;
  padding:10px 18px;
  border-radius:999px;
  font-weight:900;
}

.card-body{
  padding:22px;
}

.name{
  font-size:28px;
  font-weight:900;
  margin-bottom:12px;
}

.name a:hover{
  color:#ffd84b;
}

.location{
  color:#d7deef;
  margin-bottom:10px;
  line-height:1.5;
}

.phone{
  color:#ffd84b;
  font-weight:900;
  margin-bottom:12px;
}

.bio{
  color:#bcc7e4;
  line-height:1.6;
  font-size:15px;
  min-height:70px;
}

.stats-line{
  margin-top:14px;
  color:#ffdb70;
  font-weight:900;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.btn{
  height:52px;
  border:none;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.25s;
}

.btn:hover{
  transform:scale(1.03);
}

.whatsapp{
  background:#25D366;
  color:#001b09;
}

.call{
  background:#ffd84b;
  color:#000;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:100px 20px;
  font-size:30px;
  color:#ffd84b;
  font-weight:900;
}

footer{
  border-top:1px solid rgba(255,216,75,.12);
  padding:40px 20px;
  text-align:center;
  color:#7e8cb2;
}

@media(max-width:1200px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:850px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .top-controls{
    grid-template-columns:1fr;
  }

  .brand h1{
    font-size:38px;
  }
}

@media(max-width:560px){
  .grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .brand img{
    width:54px;
    height:54px;
  }

  .brand h1{
    font-size:28px;
  }
}
</style>
</head>
<body>

<header>

  <a href="index.html" class="brand">
    <img src="assets/logo/logo-navbar.png" alt="Nairobi Sweets Logo">
    <h1>Nairobi Sweets</h1>
  </a>

  <nav class="menu">
    <a href="index.html">Home</a>

    <a href="seo/locations/nairobi.html">Nairobi</a>

    <a href="seo/locations/kilimani.html">Kilimani</a>

    <a href="seo/locations/westlands.html">Westlands</a>

    <a href="seo/locations/kasarani-equity-kasarani.html">Kasarani</a>

    <a href="seo/locations/kikuyu.html">Kikuyu</a>

    <a href="seo/locations/kiambu-ruiru-membley.html">Ruiru</a>

    <a href="shorts.html">Shorts</a>

    <a href="join.html" class="join-btn">Join Now</a>
  </nav>

</header>

<section class="hero">
  <h2>Profiles</h2>

  <p>
    Verified profiles, WhatsApp access, VIP listings,
    likes, views, luxury discovery and real photos.
  </p>
</section>

<section class="top-controls">

  <input
    type="text"
    id="searchInput"
    class="search"
    placeholder="Search by name, bio, location..."
  />

  <select id="sortSelect" class="sort">
    <option value="featured">Featured First</option>
    <option value="likes">Most Likes</option>
    <option value="views">Most Views</option>
    <option value="newest">Newest</option>
  </select>

</section>

<section class="stats">

  <div class="stat-card">
    <div class="stat-title">Total Profiles</div>
    <div class="stat-value" id="totalProfiles">0</div>
  </div>

  <div class="stat-card">
    <div class="stat-title">Total Views</div>
    <div class="stat-value" id="totalViews">0</div>
  </div>

  <div class="stat-card">
    <div class="stat-title">Total Likes</div>
    <div class="stat-value" id="totalLikes">0</div>
  </div>

  <div class="stat-card">
    <div class="stat-title">VIP Profiles</div>
    <div class="stat-value" id="vipProfiles">0</div>
  </div>

</section>

<section class="grid" id="profilesGrid"></section>

<footer>
  © Nairobi Sweets
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://dkjlvyynvgtijccitvvd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allProfiles = [];

function cleanPhone(phone){
  let p = String(phone || "").replace(/\\D/g,"");

  if(p.startsWith("0")){
    p = "254" + p.slice(1);
  }

  if(p.startsWith("7") || p.startsWith("1")){
    p = "254" + p;
  }

  return p;
}

function getPhoto(p){
  return (
    p.photo_url ||
    p.image_url ||
    p.profile_photo ||
    p.avatar_url ||
    p.photo ||
    "assets/logo/logo-badge.png"
  );
}

function getName(p){
  return (
    p.stage_name ||
    p.name ||
    p.full_name ||
    "Profile"
  );
}

function getTier(p){
  const plan = String(p.plan || "").toLowerCase();

  if(plan === "vvip" || plan === "signature"){
    return "👑 VVIP";
  }

  if(plan === "vip"){
    return "⭐ VIP";
  }

  return "✨ Featured";
}

function updateStats(profiles){

  document.getElementById("totalProfiles").innerText =
    profiles.length;

  const views = profiles.reduce(
    (a,b)=>a + Number(b.views_count || 0),0
  );

  const likes = profiles.reduce(
    (a,b)=>a + Number(b.likes_count || 0),0
  );

  const vip = profiles.filter(p =>
    String(p.plan || "").toLowerCase() === "vip"
  ).length;

  document.getElementById("totalViews").innerText =
    views.toLocaleString();

  document.getElementById("totalLikes").innerText =
    likes.toLocaleString();

  document.getElementById("vipProfiles").innerText =
    vip;
}

function renderProfiles(profiles){

  updateStats(profiles);

  const grid = document.getElementById("profilesGrid");

  if(!profiles.length){
    grid.innerHTML = `
      <div class="empty">
        No profiles found
      </div>
    `;
    return;
  }

  grid.innerHTML = profiles.map(profile => {

    const rawPhone =
      profile.phone ||
      profile.whatsapp ||
      "";

    const whatsapp =
      cleanPhone(rawPhone);

    return `
      <article class="card">

        <div class="badge">
          ${getTier(profile)}
        </div>

        <div class="image-wrap">

          <a href="profile.html?id=${profile.id}">
            <img
              src="${getPhoto(profile)}"
              loading="lazy"
              onerror="this.src='assets/logo/logo-badge.png'"
            >
          </a>

        </div>

        <div class="card-body">

          <div class="name">
            <a href="profile.html?id=${profile.id}">
              ${getName(profile)}
            </a>
          </div>

          <div class="location">
            📍 ${profile.location || "Nairobi"}
          </div>

          <div class="phone">
            📞 ${rawPhone}
          </div>

          <div class="bio">
            ${profile.bio || "Premium Nairobi profile"}
          </div>

          <div class="stats-line">
            ❤️ ${profile.likes_count || 0}
            •
            👁️ ${profile.views_count || 0}
          </div>

          <div class="actions">

            <a
              class="btn whatsapp"
              target="_blank"
              href="https://wa.me/${whatsapp}"
            >
              WhatsApp
            </a>

            <a
              class="btn call"
              href="tel:${rawPhone}"
            >
              Call
            </a>

          </div>

        </div>

      </article>
    `;

  }).join("");
}

async function loadProfiles(){

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("approved", true)
    .order("created_at", {
      ascending:false
    });

  if(error){

    document.getElementById(
      "profilesGrid"
    ).innerHTML = `
      <div class="empty">
        ${error.message}
      </div>
    `;

    return;
  }

  allProfiles = data || [];

  renderProfiles(allProfiles);
}

document.getElementById(
  "searchInput"
).addEventListener("input", e => {

  const q = e.target.value.toLowerCase();

  const filtered = allProfiles.filter(p => {

    return `
      ${p.stage_name || ""}
      ${p.bio || ""}
      ${p.location || ""}
    `
    .toLowerCase()
    .includes(q);

  });

  renderProfiles(filtered);

});

document.getElementById(
  "sortSelect"
).addEventListener("change", e => {

  let profiles = [...allProfiles];

  if(e.target.value === "likes"){
    profiles.sort(
      (a,b)=>
      (b.likes_count||0)-(a.likes_count||0)
    );
  }

  if(e.target.value === "views"){
    profiles.sort(
      (a,b)=>
      (b.views_count||0)-(a.views_count||0)
    );
  }

  if(e.target.value === "newest"){
    profiles.sort(
      (a,b)=>
      new Date(b.created_at) -
      new Date(a.created_at)
    );
  }

  renderProfiles(profiles);

});

loadProfiles();
</script>

</body>
</html>
