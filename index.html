<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Nairobi Sweets | Verified Nairobi Profiles</title>

<meta name="description" content="Discover verified Nairobi profiles with real photos, WhatsApp access, likes, views, luxury discovery and VIP listings.">

<link rel="icon" href="./assets/logo/logo-badge.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020617;
  color:white;
  font-family:Inter,Arial,sans-serif;
}

/* HEADER */

header{
  background:black;
  padding:24px 40px;
  border-bottom:1px solid #2f2f2f;

  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
  text-decoration:none;
}

.brand img{
  width:72px;
  height:72px;
  object-fit:contain;
  display:block;
}

.brand span{
  font-size:42px;
  font-weight:900;
  color:#ffd84b;
  letter-spacing:-1px;
}

.header-actions{
  display:flex;
  gap:14px;
  align-items:center;
}

.top-btn{
  background:#0b1742;
  color:#ffd84b;
  border:1px solid #3b3b3b;
  padding:18px 34px;
  border-radius:22px;
  font-weight:800;
  text-decoration:none;
  font-size:20px;
}

.join-btn{
  background:#ffd84b;
  color:black;
}

/* HERO */

.hero{
  padding:50px 20px 20px;
  text-align:center;
}

.hero h1{
  font-size:88px;
  color:#ffd84b;
  font-weight:900;
}

.hero p{
  margin-top:20px;
  color:#b7bdd1;
  font-size:22px;
}

/* SEARCH */

.controls{
  display:flex;
  gap:20px;
  padding:20px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:260px;
}

.search input{
  width:100%;
  height:78px;
  border-radius:24px;
  border:1px solid #27314d;
  background:#081233;
  color:white;
  padding:0 26px;
  font-size:22px;
}

.sort{
  width:280px;
}

.sort select{
  width:100%;
  height:78px;
  border-radius:24px;
  border:1px solid #27314d;
  background:#081233;
  color:white;
  padding:0 24px;
  font-size:22px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:20px;
}

.stat{
  background:#071038;
  border:1px solid #2a3559;
  border-radius:30px;
  padding:30px;
}

.stat h3{
  color:#95a0c3;
  margin-bottom:18px;
  font-size:18px;
}

.stat span{
  font-size:66px;
  font-weight:900;
  color:#ffd84b;
}

/* GRID */

.grid{
  padding:20px;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:26px;
}

.card{
  background:#071038;
  border-radius:34px;
  overflow:hidden;
  border:2px solid #ffbf00;
  position:relative;
}

.card-image{
  width:100%;
  aspect-ratio:4/5;
  overflow:hidden;
  background:black;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.badge{
  position:absolute;
  top:18px;
  right:18px;

  background:#4d463d;
  color:#ffd84b;

  padding:12px 22px;
  border-radius:999px;
  font-weight:800;
  font-size:18px;
}

.card-body{
  padding:24px;
}

.card-name{
  font-size:30px;
  font-weight:900;
  margin-bottom:16px;
}

.card-name a{
  color:white;
  text-decoration:none;
}

.card-name a:hover{
  color:#ffd84b;
}

.meta{
  color:#d8dced;
  font-size:18px;
  line-height:1.7;
}

.meta div{
  margin-bottom:10px;
}

.stats-line{
  margin-top:18px;
  font-size:18px;
  color:#ffdb70;
}

.actions{
  margin-top:24px;
  display:flex;
  gap:14px;
}

.action-btn{
  flex:1;
  border:none;
  height:56px;
  border-radius:16px;
  font-weight:800;
  cursor:pointer;
  font-size:17px;
}

.like-btn{
  background:#ff3f86;
  color:white;
}

.whatsapp-btn{
  background:#25D366;
  color:white;
}

footer{
  padding:70px 20px;
  text-align:center;
  color:#7f8bb0;
}

@media(max-width:1400px){

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:1050px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:62px;
  }

}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .brand span{
    font-size:30px;
  }

  .brand img{
    width:56px;
    height:56px;
  }

  .hero h1{
    font-size:48px;
  }

}

</style>
</head>
<body>

<header>

<a href="index.html" class="brand">
  <img src="./assets/logo/logo-navbar.png" alt="Nairobi Sweets">
  <span>Nairobi Sweets</span>
</a>

<div class="header-actions">
  <a href="shorts.html" class="top-btn">Shorts</a>
  <a href="join.html" class="top-btn join-btn">Join Now</a>
</div>

</header>

<section class="hero">
  <h1>Profiles</h1>
  <p>
    Verified profiles, WhatsApp access, VIP listings,
    likes, views, luxury discovery and real photos.
  </p>
</section>

<section class="controls">

<div class="search">
  <input type="text" id="searchInput" placeholder="Search by name, bio, location...">
</div>

<div class="sort">
  <select id="sortSelect">
    <option value="featured">Featured First</option>
    <option value="views">Most Views</option>
    <option value="likes">Most Likes</option>
  </select>
</div>

</section>

<section class="stats">

<div class="stat">
  <h3>Total Profiles</h3>
  <span id="totalProfiles">0</span>
</div>

<div class="stat">
  <h3>Total Views</h3>
  <span id="totalViews">0</span>
</div>

<div class="stat">
  <h3>Total Likes</h3>
  <span id="totalLikes">0</span>
</div>

</section>

<section class="grid" id="profilesGrid"></section>

<footer>
  © Nairobi Sweets • Luxury Discovery Platform
</footer>

<script>

const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let profiles = [];

async function loadProfiles(){

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("approved", true);

  if(error){
    console.error(error);
    return;
  }

  profiles = data || [];

  renderStats(profiles);
  renderProfiles(profiles);

}

function renderStats(list){

  const totalProfiles = list.length;

  const totalViews = list.reduce((sum,p)=>
    sum + (p.views || 0),0);

  const totalLikes = list.reduce((sum,p)=>
    sum + (p.likes || 0),0);

  document.getElementById("totalProfiles").innerText =
    totalProfiles;

  document.getElementById("totalViews").innerText =
    totalViews.toLocaleString();

  document.getElementById("totalLikes").innerText =
    totalLikes.toLocaleString();

}

function renderProfiles(list){

  const grid = document.getElementById("profilesGrid");

  grid.innerHTML = "";

  list.forEach(profile=>{

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="badge">
        ${profile.plan || "Featured"}
      </div>

      <div class="card-image">
        <img src="${profile.photo_url}" loading="lazy">
      </div>

      <div class="card-body">

        <div class="card-name">
          <a href="profile.html?id=${profile.id}">
            ${profile.stage_name || "Profile"}
          </a>
        </div>

        <div class="meta">

          <div>
            📍 ${profile.location || "Nairobi"}
          </div>

          <div>
            📞 ${profile.phone || ""}
          </div>

        </div>

        <div class="stats-line">
          ❤️ ${profile.likes || 0} likes
          •
          👁️ ${profile.views || 0} views
        </div>

        <div class="actions">

          <button class="action-btn like-btn"
            onclick="likeProfile(${profile.id})">
            ❤️ Like
          </button>

          <a
            class="action-btn whatsapp-btn"
            style="
              display:flex;
              align-items:center;
              justify-content:center;
              text-decoration:none;
            "
            href="https://wa.me/${(profile.phone || '').replace(/\+/g,'')}"
            target="_blank"
          >
            WhatsApp
          </a>

        </div>

      </div>

    `;

    grid.appendChild(card);

  });

}

/* LIKE */

async function likeProfile(id){

  const profile = profiles.find(p=>p.id === id);

  if(!profile) return;

  const newLikes = (profile.likes || 0) + 1;

  await sb
    .from("profiles")
    .update({
      likes:newLikes
    })
    .eq("id",id);

  loadProfiles();

}

/* SEARCH */

document.getElementById("searchInput")
.addEventListener("input",(e)=>{

  const value = e.target.value.toLowerCase();

  const filtered = profiles.filter(p=>

    (p.stage_name || "")
    .toLowerCase()
    .includes(value)

    ||

    (p.location || "")
    .toLowerCase()
    .includes(value)

    ||

    (p.bio || "")
    .toLowerCase()
    .includes(value)

  );

  renderProfiles(filtered);

});

/* SORT */

document.getElementById("sortSelect")
.addEventListener("change",(e)=>{

  const value = e.target.value;

  let sorted = [...profiles];

  if(value === "views"){

    sorted.sort((a,b)=>
      (b.views || 0) - (a.views || 0)
    );

  }

  if(value === "likes"){

    sorted.sort((a,b)=>
      (b.likes || 0) - (a.likes || 0)
    );

  }

  if(value === "featured"){

    sorted.sort((a,b)=>{

      const order = {
        "VVIP":3,
        "VIP":2,
        "Featured":1
      };

      return (order[b.plan] || 0)
      -
      (order[a.plan] || 0);

    });

  }

  renderProfiles(sorted);

});

loadProfiles();

</script>

</body>
</html>
