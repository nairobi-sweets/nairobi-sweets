<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nairobi Sweets</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050505;
  color: white;
}

header {
  padding: 18px 20px;
  background: #000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,216,75,.25);
}

.logo {
  font-size: 22px;
  font-weight: 900;
  color: #ffd84b;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 14px;
  font-weight: bold;
}

.hero {
  text-align: center;
  padding: 55px 20px 35px;
  background: radial-gradient(circle at top, #2b2100, #050505 60%);
}

.hero h1 {
  font-size: 42px;
  margin: 0;
  color: #ffd84b;
}

.hero p {
  color: #ddd;
  font-size: 17px;
}

.join-btn {
  display: inline-block;
  margin-top: 16px;
  background: #ffd84b;
  color: black;
  padding: 13px 22px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 900;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 25px 16px 60px;
}

.section-title {
  font-size: 26px;
  margin-bottom: 20px;
  color: #ffd84b;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 22px;
}

.card {
  background: #111;
  border: 1px solid rgba(255,216,75,.18);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 20px 45px rgba(0,0,0,.45);
}

.card img {
  width: 100%;
  height: 330px;
  object-fit: cover;
  background: #222;
  display: block;
}

.card-body {
  padding: 17px;
}

.name {
  font-size: 22px;
  font-weight: 900;
  color: #ffd84b;
  margin: 0 0 6px;
}

.meta {
  color: #ccc;
  margin: 5px 0;
  font-size: 14px;
}

.badge {
  display: inline-block;
  margin: 10px 0;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(255,216,75,.15);
  color: #ffd84b;
  font-size: 13px;
  font-weight: bold;
}

.bio {
  color: #e5e5e5;
  font-size: 14px;
  line-height: 1.45;
  min-height: 40px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.actions a {
  flex: 1;
  text-align: center;
  padding: 12px 8px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: 900;
}

.whatsapp {
  background: #25D366;
  color: white;
}

.call {
  background: #ffd84b;
  color: black;
}

.loading,
.empty {
  text-align: center;
  color: #ccc;
  padding: 30px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #888;
  border-top: 1px solid rgba(255,255,255,.08);
}

@media(max-width: 600px) {
  .hero h1 {
    font-size: 32px;
  }

  .card img {
    height: 300px;
  }

  nav a {
    font-size: 14px;
    margin-left: 8px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Nairobi Sweets</div>
  <nav>
    <a href="join.html">Join</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<section class="hero">
  <h1>Premium Nairobi Profiles</h1>
  <p>Browse approved profiles and contact directly.</p>
  <a class="join-btn" href="public-signup-payment-page.html">Create Profile</a>
</section>

<main class="container">
  <h2 class="section-title">Featured Profiles</h2>
  <div id="profiles" class="grid">
    <div class="loading">Loading profiles...</div>
  </div>
</main>

<footer>
  © Nairobi Sweets
</footer>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const profilesBox = document.getElementById("profiles");

function cleanPhone(value) {
  if (!value) return "";
  let phone = String(value).replace(/\D/g, "");

  if (phone.startsWith("0")) {
    phone = "254" + phone.slice(1);
  }

  if (phone.startsWith("7") || phone.startsWith("1")) {
    phone = "254" + phone;
  }

  return phone;
}

function profileImage(p) {
  return (
    p.photo_url ||
    p.image_url ||
    p.profile_photo ||
    p.avatar_url ||
    "assets/logo/logo-badge.png"
  );
}

function profileName(p) {
  return p.stage_name || p.name || p.full_name || "Nairobi Sweet";
}

function profilePlan(p) {
  return p.plan || p.package || p.tier || "Featured";
}

async function loadProfiles() {
  profilesBox.innerHTML = `<div class="loading">Loading profiles...</div>`;

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("status", "approved")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    profilesBox.innerHTML = `<div class="empty">Could not load profiles.</div>`;
    return;
  }

  if (!data || data.length === 0) {
    profilesBox.innerHTML = `<div class="empty">No approved profiles yet.</div>`;
    return;
  }

  profilesBox.innerHTML = data.map(p => {
    const name = profileName(p);
    const img = profileImage(p);
    const phone = cleanPhone(p.phone);
    const whatsapp = cleanPhone(p.whatsapp || p.phone);

    return `
      <article class="card">
        <img 
          src="${img}" 
          alt="${name}" 
          loading="lazy"
          onerror="this.src='assets/logo/logo-badge.png'"
        />

        <div class="card-body">
          <h3 class="name">${name}</h3>

          <p class="meta">${p.location || "Nairobi"}</p>

          <span class="badge">${profilePlan(p)}</span>

          <p class="bio">${p.bio || p.description || ""}</p>

          <div class="actions">
            ${whatsapp ? `
              <a 
                class="whatsapp" 
                href="https://wa.me/${whatsapp}" 
                target="_blank">
                WhatsApp
              </a>
            ` : ""}

            ${phone ? `
              <a 
                class="call" 
                href="tel:+${phone}">
                Call
              </a>
            ` : ""}
          </div>
        </div>
      </article>
    `;
  }).join("");
}

loadProfiles();
</script>

</body>
</html>
