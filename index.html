<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nairobi Sweets</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#0b1020;
}

.header{
  max-width:1450px;
  margin:0 auto;
  background:linear-gradient(90deg,#303039,#171821);
  padding:22px 40px;
  border-radius:0 0 28px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
  box-shadow:0 20px 45px rgba(0,0,0,.18);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:10px;
  object-fit:cover;
  background:#111;
}

.kicker{
  font-size:12px;
  letter-spacing:4px;
  color:#d1d5db;
  font-weight:800;
}

.title{
  color:#ffd21f;
  font-size:26px;
  font-weight:900;
}

.nav{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.nav a{
  text-decoration:none;
  color:white;
  padding:13px 24px;
  border-radius:999px;
  background:rgba(255,255,255,.09);
  font-weight:900;
}

.nav .gold{
  background:#ffc400;
  color:#111;
}

.nav .pink{
  background:#e83e95;
  color:white;
}

.hero-gap{
  max-width:1450px;
  height:45px;
  background:#070b1c;
  margin:0 auto;
  border-radius:0 0 28px 28px;
}

.wrap{
  max-width:1220px;
  margin:34px auto 70px;
  padding:0 16px;
}

.panel{
  background:white;
  border-radius:28px;
  padding:28px;
  box-shadow:0 18px 45px rgba(0,0,0,.08);
}

.panel-top{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-start;
  margin-bottom:22px;
}

h1{
  margin:0 0 12px;
  font-size:30px;
  color:#0b1020;
}

.sub{
  margin:0;
  color:#64748b;
  line-height:1.6;
  max-width:700px;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.filter{
  border:none;
  padding:12px 20px;
  border-radius:999px;
  font-weight:900;
  background:#f1f5f9;
  color:#0f172a;
}

.filter.active{
  background:#ffc400;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:18px;
}

.card{
  background:#071126;
  border-radius:18px;
  overflow:hidden;
  color:white;
  box-shadow:0 16px 34px rgba(0,0,0,.18);
}

.image-wrap{
  height:360px;
  position:relative;
  overflow:hidden;
  background:#111;
}

.image-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.badges{
  position:absolute;
  top:14px;
  left:14px;
  display:flex;
  gap:8px;
  z-index:2;
}

.badge{
  padding:8px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
}

.vip{
  background:#e83e95;
  color:white;
}

.live{
  background:#4ade80;
  color:#052e16;
}

.body{
  padding:18px;
}

.name{
  margin:0 0 8px;
  font-size:24px;
  font-weight:900;
  color:white;
}

.location{
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:14px;
}

.bio{
  color:#e5e7eb;
  line-height:1.55;
  font-size:14px;
  min-height:68px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:16px 0;
}

.chip{
  background:rgba(255,255,255,.09);
  padding:9px 13px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  color:white;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.actions a{
  flex:1;
  text-align:center;
  text-decoration:none;
  padding:14px 10px;
  border-radius:12px;
  font-weight:900;
}

.whatsapp{
  background:#22c55e;
  color:white;
}

.call{
  background:#e83e95;
  color:white;
}

.side-tab{
  position:fixed;
  right:0;
  top:48%;
  writing-mode:vertical-rl;
  background:#ffc400;
  color:#111;
  padding:20px 13px;
  border-radius:14px 0 0 14px;
  font-weight:900;
  letter-spacing:.12em;
}

.loading,.empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px;
  color:#64748b;
}

@media(max-width:750px){
  .header{
    flex-direction:column;
    align-items:flex-start;
    padding:20px;
  }

  .panel-top{
    flex-direction:column;
  }

  .side-tab{
    display:none;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <img 
      class="logo" 
      src="https://dkjlvyynvgtijccitvvd.supabase.co/storage/v1/object/public/profile-images/profiles/1775706112598-sly.jpg"
      alt="Nairobi Sweets logo"
    />
    <div>
      <div class="kicker">PRIVATE VIP DIRECTORY</div>
      <div class="title">Nairobi Sweets</div>
    </div>
  </div>

  <nav class="nav">
    <a class="gold" href="#profiles">Signature</a>
    <a href="#profiles">Directory</a>
    <a href="login.html">Login</a>
    <a class="pink" href="public-signup-payment-page.html">Join VIP</a>
  </nav>
</header>

<div class="hero-gap"></div>

<main class="wrap" id="profiles">
  <section class="panel">
    <div class="panel-top">
      <div>
        <h1>Directory profiles</h1>
        <p class="sub">
          Approved listings only. Signature, VIP, and Featured profiles are surfaced from your Supabase directory in real time.
        </p>
      </div>

      <div class="filters">
        <button class="filter active">All</button>
        <button class="filter">Signature</button>
        <button class="filter">VIP</button>
        <button class="filter">Featured</button>
      </div>
    </div>

    <div id="profilesGrid" class="grid">
      <div class="loading">Loading profiles...</div>
    </div>
  </section>
</main>

<div class="side-tab">👑 SIGNATURE</div>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const grid = document.getElementById("profilesGrid");

const STORAGE_BASE = "https://dkjlvyynvgtijccitvvd.supabase.co/storage/v1/object/public/profile-images/profiles/";
const FALLBACK_IMAGE = STORAGE_BASE + "1775706112598-sly.jpg";

function cleanPhone(value){
  if(!value) return "";
  let phone = String(value).replace(/\D/g,"");
  if(phone.startsWith("0")) phone = "254" + phone.slice(1);
  if(phone.startsWith("7") || phone.startsWith("1")) phone = "254" + phone;
  return phone;
}

function safe(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function profileImage(p){
  const img =
    p.photo_url ||
    p.image_url ||
    p.profile_photo ||
    p.avatar_url ||
    p.profile_image ||
    p.picture ||
    p.photo ||
    p.image ||
    "";

  const value = String(img || "").trim();

  if(value.startsWith("https://")) return value;

  if(value.startsWith("profiles/")){
    return "https://dkjlvyynvgtijccitvvd.supabase.co/storage/v1/object/public/profile-images/" + value;
  }

  if(value.includes(".jpg") || value.includes(".jpeg") || value.includes(".png") || value.includes(".webp")){
    return STORAGE_BASE + value;
  }

  return FALLBACK_IMAGE;
}

function profileName(p){
  return p.stage_name || p.name || p.full_name || "Nairobi Sweet";
}

function profilePlan(p){
  return p.plan || p.package || p.tier || "vip";
}

async function loadProfiles(){
  grid.innerHTML = `<div class="loading">Loading profiles...</div>`;

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("status","approved")
    .order("created_at",{ ascending:false });

  if(error){
    console.error(error);
    grid.innerHTML = `<div class="empty">Could not load profiles.</div>`;
    return;
  }

  if(!data || data.length === 0){
    grid.innerHTML = `<div class="empty">No approved profiles yet.</div>`;
    return;
  }

  grid.innerHTML = data.map(p => {
    const name = safe(profileName(p));
    const img = safe(profileImage(p));
    const phone = cleanPhone(p.phone);
    const whatsapp = cleanPhone(p.whatsapp || p.phone);
    const location = safe(p.location || p.area || "Nairobi");
    const bio = safe(p.bio || p.description || `Get amazing services with ${name}`);
    const plan = safe(profilePlan(p));

    return `
      <article class="card">
        <div class="image-wrap">
          <img 
            src="${img}" 
            alt="${name}" 
            loading="lazy"
            onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'"
          />
          <div class="badges">
            <span class="badge vip">${plan}</span>
            <span class="badge live">LIVE</span>
          </div>
        </div>

        <div class="body">
          <h2 class="name">${name}</h2>
          <div class="location">${location}</div>
          <p class="bio">${bio}</p>

          <div class="chips">
            <span class="chip">${location}</span>
            <span class="chip">Direct contact</span>
          </div>

          <div class="actions">
            ${whatsapp ? `<a class="whatsapp" href="https://wa.me/${whatsapp}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
            ${phone ? `<a class="call" href="tel:+${phone}">Call</a>` : ""}
          </div>
        </div>
      </article>
    `;
  }).join("");
}

loadProfiles();
</script>

</body>
</html>
