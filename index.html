<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Nairobi Sweets | Premium Nairobi Profiles</title>
<meta name="description" content="Discover approved Nairobi Sweets profiles with real photos, WhatsApp access, VIP listings, views, likes, and location-based discovery." />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#050814;
  color:white;
}

a{text-decoration:none;color:inherit}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(0,0,0,.94);
  backdrop-filter:blur(18px);
  padding:28px 55px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,216,75,.12);
}

.brand{
  font-size:42px;
  font-weight:900;
  color:#ffd84b;
}

.join-btn{
  background:#ffd84b;
  color:#000;
  padding:18px 42px;
  border-radius:999px;
  font-weight:900;
  font-size:20px;
}

.hero{
  text-align:center;
  padding:32px 20px 18px;
  background:
    radial-gradient(circle at top,rgba(255,216,75,.12),transparent 35%),
    #050814;
}

.hero h1{
  font-size:clamp(30px,5vw,60px);
  margin:0 0 10px;
}

.hero span{color:#ffd84b}

.hero p{
  color:#b7bfd6;
  max-width:760px;
  margin:auto;
  font-size:17px;
}

.controls{
  max-width:1500px;
  margin:auto;
  padding:28px 28px 8px;
  display:grid;
  grid-template-columns:1fr 190px;
  gap:18px;
}

input,select{
  background:linear-gradient(180deg,rgba(20,25,45,.96),rgba(10,14,28,.96));
  border:1px solid rgba(255,216,75,.18);
  color:white;
  border-radius:18px;
  padding:16px 20px;
  font-size:16px;
  outline:none;
}

.grid{
  max-width:1500px;
  margin:auto;
  padding:24px 28px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:34px;
}

.card{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  border-radius:30px;
  background:#0b1020;
  border:2px solid #ff9800;
  min-height:auto;
  transition:.35s ease;
  box-shadow:0 22px 80px rgba(0,0,0,.45);
}

.card::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:30px;
  background:linear-gradient(135deg,rgba(255,216,75,.45),transparent,rgba(255,61,127,.25));
  z-index:-1;
  opacity:0;
  transition:.35s;
}

.card:hover{
  transform:translateY(-8px) scale(1.015);
}

.card:hover::before{opacity:1}

.photo-wrap{
  height:320px;
  background:#111827;
  overflow:hidden;
}

.photo-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  filter:saturate(1.05) contrast(1.04);
  transition:.45s ease;
}

.card:hover img{transform:scale(1.08)}

.tier-badge{
  position:absolute;
  top:18px;
  right:18px;
  z-index:3;
  background:#ffd84b;
  color:#000;
  padding:10px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.content{
  padding:20px;
  background:linear-gradient(180deg,rgba(12,18,38,.98),rgba(5,8,20,1));
}

.name{
  font-size:28px;
  line-height:1.05;
  font-weight:900;
  margin-bottom:10px;
}

.card:hover .name{color:#ffd84b}

.meta{
  color:#ffd84b;
  font-weight:900;
  margin-bottom:8px;
  font-size:16px;
  line-height:1.25;
}

.stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:8px 0 10px;
}

.stat{
  background:rgba(255,216,75,.12);
  color:#ffd84b;
  border:1px solid rgba(255,216,75,.25);
  padding:7px 10px;
  border-radius:999px;
  font-weight:900;
  font-size:13px;
}

.bio{
  color:#cbd5e1;
  line-height:1.35;
  font-size:15px;
  min-height:38px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.action-btn{
  border:none;
  border-radius:15px;
  padding:13px 10px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  transition:.2s ease;
  text-align:center;
}

.whatsapp{background:#25d366;color:#061b0d}
.call{background:#ffd84b;color:#000}
.like{background:#ff3d7f;color:white;grid-column:1/3}

.action-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.loading,.empty{
  text-align:center;
  padding:50px;
  color:#94a3b8;
  font-size:20px;
}

footer{
  text-align:center;
  color:#64748b;
  padding:45px 20px;
}

@media(max-width:760px){
  header{padding:20px}
  .brand{font-size:30px}
  .join-btn{padding:13px 22px;font-size:15px}
  .controls{grid-template-columns:1fr;padding:24px 18px 8px}
  .grid{padding:18px;gap:24px}
  .photo-wrap{height:300px}
  .name{font-size:26px}
}
</style>
</head>

<body>

<header>
  <div class="brand">Nairobi Sweets</div>
  <a class="join-btn" href="join.html">Join Now</a>
</header>

<section class="hero">
  <h1>Discover Nairobi’s <span>Premium Profiles</span></h1>
  <p>Approved listings, real photos, VIP discovery, WhatsApp access, views, likes, and location-based browsing.</p>
</section>

<section class="controls">
  <input id="searchInput" placeholder="Search by name, location, bio..." />
  <select id="sortSelect">
    <option value="featured">Featured first</option>
    <option value="likes">Most liked</option>
    <option value="views">Most viewed</option>
    <option value="newest">Newest first</option>
    <option value="vip">VIP first</option>
  </select>
</section>

<div id="status" class="loading">Loading premium profiles...</div>
<main id="profilesGrid" class="grid"></main>

<footer>
  © <span id="year"></span> Nairobi Sweets. Premium profile discovery platform.
</footer>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const grid = document.getElementById("profilesGrid");
const statusBox = document.getElementById("status");
const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");

document.getElementById("year").textContent = new Date().getFullYear();

let allProfiles = [];

function getImage(p){
  return p.photo_url || p.image_url || p.profile_photo || p.avatar_url || p.photo || "assets/logo/logo-badge.png";
}

function getName(p){
  return p.stage_name || p.name || p.full_name || "Nairobi Sweet";
}

function getLocation(p){
  return p.area || p.location || p.city || "Nairobi";
}

function getTier(p){
  const tier = String(p.tier || "").toLowerCase();
  if(p.is_vvip || tier === "vvip" || tier === "signature") return "VVIP";
  if(p.is_vip || tier === "vip") return "VIP";
  return "Featured";
}

function phoneToWhatsapp(phone){
  if(!phone) return "";
  let cleaned = String(phone).replace(/\D/g,"");

  if(cleaned.startsWith("0")){
    cleaned = "254" + cleaned.slice(1);
  }

  if(cleaned.startsWith("7") || cleaned.startsWith("1")){
    cleaned = "254" + cleaned;
  }

  return cleaned;
}

async function trackEvent(profileId,eventType){
  try{
    await sb.from("analytics_events").insert({
      profile_id:profileId,
      event_type:eventType,
      page:"homepage",
      user_agent:navigator.userAgent
    });
  }catch(e){
    console.warn("Analytics skipped:", e.message);
  }
}

async function addView(profileId){
  try{
    await sb.rpc("increment_profile_views",{p_profile_id:profileId});

    const p = allProfiles.find(x => Number(x.id) === Number(profileId));
    if(p){
      p.views_count = Number(p.views_count || 0) + 1;
      renderProfiles();
    }
  }catch(e){
    console.warn("View count skipped:", e.message);
  }
}

async function likeProfile(profileId){
  try{
    await sb.rpc("increment_profile_likes",{p_profile_id:profileId});
    await trackEvent(profileId,"like_click");

    const p = allProfiles.find(x => Number(x.id) === Number(profileId));
    if(p){
      p.likes_count = Number(p.likes_count || 0) + 1;
      renderProfiles();
    }
  }catch(e){
    alert("Could not like profile. Run the likes SQL patch first.");
    console.error(e);
  }
}

function renderProfiles(){
  const q = searchInput.value.toLowerCase().trim();
  const sort = sortSelect.value;

  let profiles = [...allProfiles];

  if(q){
    profiles = profiles.filter(p => {
      const blob = [
        getName(p),
        getLocation(p),
        p.bio,
        p.description,
        p.area,
        p.city
      ].join(" ").toLowerCase();

      return blob.includes(q);
    });
  }

  profiles.sort((a,b)=>{
    if(sort === "likes") return Number(b.likes_count || 0) - Number(a.likes_count || 0);
    if(sort === "views") return Number(b.views_count || 0) - Number(a.views_count || 0);
    if(sort === "newest") return new Date(b.created_at || 0) - new Date(a.created_at || 0);
    if(sort === "vip") return String(getTier(b)).localeCompare(String(getTier(a)));
    return Number(b.is_featured || 0) - Number(a.is_featured || 0);
  });

  if(!profiles.length){
    grid.innerHTML = "";
    statusBox.style.display = "block";
    statusBox.className = "empty";
    statusBox.textContent = "No approved profiles found.";
    return;
  }

  statusBox.style.display = "none";

  grid.innerHTML = profiles.map(p=>{
    const id = p.id;
    const name = getName(p);
    const location = getLocation(p);
    const image = getImage(p);
    const tier = getTier(p);
    const phone = p.phone || p.whatsapp || p.phone_number || "";
    const whatsappNumber = phoneToWhatsapp(phone);
    const bio = p.bio || p.description || `Get amazing services with ${name}`;

    return `
      <article class="card" onclick="trackEvent(${id}, 'profile_view'); addView(${id});">
        <div class="tier-badge">◆ ${tier}</div>

        <div class="photo-wrap">
          <img src="${image}" alt="${name}" loading="lazy" onerror="this.src='assets/logo/logo-badge.png'" />
        </div>

        <div class="content">
          <div class="name">${name}</div>
          <div class="meta">${location}</div>

          <div class="stats">
            <span class="stat">👁️ ${p.views_count || 0} views</span>
            <span class="stat">❤️ ${p.likes_count || 0} likes</span>
          </div>

          <div class="bio">${bio}</div>

          <div class="actions">
            ${
              whatsappNumber
              ? `<a class="action-btn whatsapp" href="https://wa.me/${whatsappNumber}" target="_blank" onclick="event.stopPropagation(); trackEvent(${id}, 'whatsapp_click')">WhatsApp</a>`
              : `<button class="action-btn whatsapp" disabled>WhatsApp</button>`
            }

            ${
              phone
              ? `<a class="action-btn call" href="tel:${phone}" onclick="event.stopPropagation(); trackEvent(${id}, 'phone_click')">Call</a>`
              : `<button class="action-btn call" disabled>Call</button>`
            }

            <button class="action-btn like" onclick="event.stopPropagation(); likeProfile(${id});">
              ❤️ Like
            </button>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

async function loadProfiles(){
  const {data,error} = await sb
    .from("profiles")
    .select("*")
    .eq("approved",true)
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    statusBox.className = "empty";
    statusBox.textContent = "Could not load profiles. Check Supabase RLS/policies.";
    return;
  }

  allProfiles = data || [];
  renderProfiles();
}

searchInput.addEventListener("input",renderProfiles);
sortSelect.addEventListener("change",renderProfiles);

loadProfiles();
</script>

</body>
</html>
