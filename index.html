<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nairobi Sweets | Verified Nairobi Profiles</title>

<meta
  name="description"
  content="Luxury Nairobi profiles, VIP listings, WhatsApp access, reels and verified discovery."
>

<link rel="icon" href="/assets/logo/logo-badge.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
  radial-gradient(circle at top,#0c1148 0%,#000 45%);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
  padding-bottom:100px;
}

a{
  text-decoration:none;
  color:inherit;
}

/* TOPBAR */

.topbar{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(0,0,0,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,213,74,.08);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:14px 18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.brand-logo{
  width:88px;
  height:88px;
  min-width:88px;

  object-fit:cover;
  border-radius:24px;

  background:#050505;

  border:2px solid rgba(255,190,70,.18);

  box-shadow:
    0 0 25px rgba(255,140,0,.45),
    0 0 60px rgba(255,80,0,.22);
}

.brand-text{
  display:flex;
  flex-direction:column;
  line-height:.88;
}

.brand-text span{
  color:#ffd54a;
  font-size:clamp(2rem,5vw,3.6rem);
  font-weight:900;
  letter-spacing:-2px;
}

.menu-btn{
  width:72px;
  height:72px;

  border-radius:24px;

  background:
  linear-gradient(180deg,#07145f,#02083d);

  border:1px solid rgba(255,213,74,.12);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.menu-btn span{
  color:#ffd54a;
  font-size:40px;
  font-weight:900;
}

/* HERO */

.hero{
  padding:20px 18px 10px;
}

.hero-box{
  background:
  linear-gradient(180deg,#020a56,#010633);

  border-radius:34px;

  padding:34px 24px;

  border:1px solid rgba(255,213,74,.08);

  box-shadow:
  0 0 30px rgba(255,0,128,.12),
  0 25px 80px rgba(0,0,0,.5);
}

.hero-box h2{
  color:#ffd54a;

  font-size:clamp(58px,13vw,100px);

  line-height:.9;
  font-weight:900;

  margin-bottom:18px;
}

.hero-box p{
  color:#d9d9d9;

  font-size:18px;
  line-height:1.7;
}

.search-box{
  width:100%;

  margin-top:24px;

  background:#020926;

  border:1px solid rgba(255,255,255,.08);

  color:white;

  border-radius:18px;

  padding:18px;

  font-size:16px;

  outline:none;
}

/* FILTERS */

.filters{
  display:flex;
  gap:12px;

  overflow-x:auto;

  padding:14px 18px;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filters button{
  border:none;

  background:
  linear-gradient(145deg,#1d243f,#08114f);

  color:white;

  border-radius:16px;

  padding:14px 22px;

  font-size:12px;
  font-weight:900;

  min-width:max-content;

  cursor:pointer;
}

.filters button.active{
  background:
  linear-gradient(145deg,#1db954,#117336);
}

/* STATS */

.stats-wrap{
  padding:0 18px 20px;
}

.stats-box{
  background:
  linear-gradient(180deg,#020a56,#010633);

  border:1px solid rgba(255,213,74,.08);

  border-radius:28px;

  padding:22px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.stats-label{
  color:#d8d8d8;
  font-size:14px;
  font-weight:800;
}

.stats-number{
  color:#ffd54a;
  font-size:56px;
  font-weight:900;
}

/* PROFILES */

.profiles{
  display:grid;
  grid-template-columns:repeat(4,minmax(220px,1fr));

  gap:22px;

  padding:10px 18px 80px;
}

.card{
  position:relative;

  overflow:hidden;

  border-radius:28px;

  background:
  linear-gradient(180deg,#020a56,#010633);

  border:1px solid rgba(255,213,74,.08);

  box-shadow:
  0 0 28px rgba(255,0,128,.08),
  0 18px 50px rgba(0,0,0,.45);

  cursor:pointer;

  transition:.25s ease;
}

.card:hover{
  transform:translateY(-4px);
}

.card-image{
  width:100%;
  aspect-ratio:4/4.4;

  object-fit:cover;

  display:block;

  background:#020617;
}

.card-body{
  padding:16px;
}

.card-name{
  font-size:16px;
  font-weight:900;

  margin-bottom:8px;
}

.online{
  color:#31ff71;

  font-size:12px;
  font-weight:900;

  margin-bottom:10px;
}

.location{
  color:#d5d5d5;

  font-size:12px;

  margin-bottom:10px;
}

.phone{
  color:#ffd54a;

  font-size:13px;
  font-weight:900;

  margin-bottom:12px;
}

.bio{
  color:#d2d2d2;

  font-size:12px;
  line-height:1.6;

  margin-bottom:14px;
}

.engagement{
  display:flex;
  gap:10px;

  color:#d0d0d0;

  font-size:11px;

  margin-bottom:14px;
}

.featured-badge{
  position:absolute;
  top:14px;
  right:14px;

  background:rgba(0,0,0,.72);

  color:#ffd54a;

  padding:8px 16px;

  border-radius:999px;

  font-size:11px;
  font-weight:900;

  z-index:5;
}

.online-dot{
  position:absolute;
  top:14px;
  left:14px;

  width:18px;
  height:18px;

  border-radius:50%;

  background:#31ff71;

  border:3px solid white;

  z-index:5;
}

/* BUTTONS */

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.call-btn,
.wa-btn{
  min-height:38px;

  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  font-size:10px;
  font-weight:900;
}

.call-btn{
  background:
  linear-gradient(145deg,#08114f,#050717);

  color:white;
}

.wa-btn{
  background:
  linear-gradient(145deg,#0b5f2d,#06361b);

  color:white;
}

.wa-btn img{
  width:14px;
  height:14px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  background:rgba(0,0,0,.96);

  display:flex;
  align-items:center;
  justify-content:space-around;

  z-index:999;

  border-top:1px solid rgba(255,213,74,.08);
}

.bottom-nav button{
  border:none;
  background:none;

  color:#ffd54a;

  font-size:24px;

  cursor:pointer;
}

/* MOBILE */

@media(max-width:1100px){
  .profiles{
    grid-template-columns:repeat(2,minmax(220px,1fr));
  }
}

@media(max-width:900px){
  .profiles{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<header class="topbar">

  <a href="/" class="brand">

    <img
      src="/assets/logo/logo-badge.png"
      alt="Nairobi Sweets"
      class="brand-logo"
    >

    <div class="brand-text">
      <span>Nairobi</span>
      <span>Sweets</span>
    </div>

  </a>

  <div class="menu-btn">
    <span>☰</span>
  </div>

</header>

<section class="hero">

  <div class="hero-box">

    <h2>Profiles</h2>

    <p>
      Verified profiles, WhatsApp access,
      VIP listings, reels and luxury discovery.
    </p>

    <input
      type="text"
      class="search-box"
      id="searchInput"
      placeholder="Search by name, bio, location..."
    >

  </div>

</section>

<div class="filters">

  <button class="active">HOME</button>
  <button>VIP</button>
  <button>ONLINE</button>
  <button>WHATSAPP</button>

</div>

<section class="stats-wrap">

  <div class="stats-box">

    <div>
      <div class="stats-label">
        Total Profiles
      </div>

      <div class="stats-number" id="profileCount">
        0
      </div>
    </div>

    <img
      src="/assets/logo/logo-badge.png"
      width="90"
      style="
      border-radius:50%;
      box-shadow:
      0 0 30px rgba(255,180,0,.35);"
    >

  </div>

</section>

<section class="profiles" id="profiles">

  <div style="
  grid-column:1/-1;
  text-align:center;
  padding:80px;
  color:#ffd54a;
  font-weight:900;">
    Loading profiles...
  </div>

</section>

<nav class="bottom-nav">

  <button onclick="window.location.href='/'">
    🏠
  </button>

  <button onclick="window.location.href='/reel.html'">
    🔥
  </button>

  <button onclick="window.location.href='/shorts.html'">
    🎬
  </button>

  <button>
    ✨
  </button>

  <button>
    ☰
  </button>

</nav>

<script>

const SUPABASE_URL =
"https://dkjlvyynvgtijccitvvd.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRramx2eXludmd0aWpjY2l0dnZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDA4MzIsImV4cCI6MjA5MTExNjgzMn0.6wlZCQPJ2En4egpQUo5LAyQhee2hkCQ_tHGxfxbv1EQ";

const SITE_URL =
"https://nairobi-sweets.com";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const profilesEl =
document.getElementById("profiles");

const searchInput =
document.getElementById("searchInput");

const profileCount =
document.getElementById("profileCount");

let ALL_PROFILES = [];

function safePhone(phone){

  let p = String(phone || "")
  .replace(/\D/g,"");

  if(!p) return "";

  if(p.startsWith("0")){
    p = "254" + p.slice(1);
  }

  if(p.startsWith("7")){
    p = "254" + p;
  }

  return p;
}

function getImage(profile){

  return (
    profile.photo_url ||
    profile.image_url ||
    profile.profile_photo ||
    "/assets/logo/logo-badge.png"
  );
}

function getName(profile){

  return (
    profile.stage_name ||
    profile.name ||
    "Verified"
  );
}

function getLocation(profile){

  return (
    profile.location ||
    profile.town ||
    "Nairobi"
  );
}

function getBio(profile){

  return (
    profile.bio ||
    "Luxury Nairobi profile."
  );
}

function getLikes(profile){

  return Number(
    profile.likes || 0
  );
}

function getViews(profile){

  return Number(
    profile.views || 0
  );
}

function getBadge(profile){

  const plan = String(
    profile.plan || ""
  ).toLowerCase();

  if(plan.includes("vip")){
    return "✨ VIP";
  }

  return "✨ Featured";
}

function compact(text,max=120){

  text = String(text || "");

  return text.length > max
  ? text.slice(0,max) + "..."
  : text;
}

function whatsappMessage(profile){

  return encodeURIComponent(

`🔥 Nairobi Sweets

Hi ${getName(profile)}

I found your profile on Nairobi Sweets.

🌍 ${SITE_URL}`

  );
}

function renderProfiles(data){

  profileCount.textContent =
  data.length;

  if(!data.length){

    profilesEl.innerHTML = `
    <div style="
    grid-column:1/-1;
    text-align:center;
    padding:60px;
    color:#ffd54a;
    font-weight:900;">
      No profiles found.
    </div>
    `;

    return;
  }

  profilesEl.innerHTML =
  data.map(profile=>{

    const phone =
    safePhone(
      profile.phone ||
      profile.whatsapp
    );

    return `

    <article
      class="card"
      onclick="window.location.href='/profile.html?id=${profile.id}'"
    >

      <span class="online-dot"></span>

      <div class="featured-badge">
        ${getBadge(profile)}
      </div>

      <img
        src="${getImage(profile)}"
        class="card-image"
        loading="lazy"

        onerror="
        this.src='/assets/logo/logo-badge.png'
        "
      >

      <div class="card-body">

        <div class="card-name">
          ${getName(profile)}
        </div>

        <div class="online">
          Online Now
        </div>

        <div class="location">
          📍 ${getLocation(profile)}
        </div>

        <div class="phone">
          📞 ${phone || "Hidden"}
        </div>

        <div class="bio">
          ${compact(getBio(profile))}
        </div>

        <div class="engagement">
          ❤️ ${getLikes(profile)}
          •
          👁️ ${getViews(profile)}
        </div>

        <div class="action-row">

          <a
            class="call-btn"
            href="tel:${phone}"

            onclick="
            event.stopPropagation()
            "
          >
            ☎ CALL
          </a>

          <a
            class="wa-btn"

            href="
            https://wa.me/${phone}?text=${whatsappMessage(profile)}
            "

            target="_blank"

            onclick="
            event.stopPropagation()
            "
          >

            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">

            WHATSAPP

          </a>

        </div>

      </div>

    </article>

    `;

  }).join("");
}

searchInput.addEventListener(
"input",
()=>{

  const q =
  searchInput.value
  .toLowerCase()
  .trim();

  const filtered =
  ALL_PROFILES.filter(profile=>{

    return `
      ${getName(profile)}
      ${getLocation(profile)}
      ${getBio(profile)}
    `
    .toLowerCase()
    .includes(q);

  });

  renderProfiles(filtered);

});

async function loadProfiles(){

  const {data,error} =
  await sb
  .from("profiles")
  .select("*")
  .eq("approved",true)
  .order(
    "created_at",
    {ascending:false}
  );

  if(error){

    profilesEl.innerHTML = `
    <div style="
    grid-column:1/-1;
    text-align:center;
    padding:60px;
    color:#ff5b5b;
    font-weight:900;">
      ${error.message}
    </div>
    `;

    return;
  }

  ALL_PROFILES = data || [];

  renderProfiles(
    ALL_PROFILES
  );
}

loadProfiles();

</script>

</body>
</html>
