<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Premium Nairobi Profiles | Nairobi Sweets</title>
<meta name="description" content="Browse premium Nairobi Sweets profiles with verified photos, WhatsApp access, direct calls, and VIP listings." />
<meta name="keywords" content="Nairobi escorts, premium profiles, Nairobi sweets, VIP listings, verified profiles" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://nairobi-sweets.com/" />

<meta property="og:title" content="Premium Nairobi Profiles | Nairobi Sweets" />
<meta property="og:description" content="Verified premium Nairobi listings with direct WhatsApp and booking." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://nairobi-sweets.com/assets/logo/logo-badge.png" />

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"CollectionPage",
  "name":"Premium Nairobi Profiles",
  "url":"https://nairobi-sweets.com/",
  "description":"Verified premium Nairobi profiles directory"
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:white;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:40px 20px;
}

.hero{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  padding:40px;
  border-radius:24px;
  margin-bottom:40px;
  box-shadow:0 0 25px rgba(255,215,0,.08);
}

h1{
  font-size:52px;
  color:#facc15;
  margin-bottom:15px;
}

.hero p{
  color:#e2e8f0;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:24px;
}

.card{
  background:#0f172a;
  border:1px solid rgba(255,215,0,.12);
  border-radius:22px;
  overflow:hidden;
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 35px rgba(255,215,0,.12);
}

.card img{
  width:100%;
  height:320px;
  object-fit:cover;
  background:#111827;
}

.card-body{
  padding:18px;
}

.card h2{
  font-size:28px;
  margin:0 0 10px;
  color:white;
}

.meta{
  color:#cbd5e1;
  margin-bottom:8px;
  font-size:15px;
}

.bio{
  color:#e2e8f0;
  line-height:1.5;
  min-height:72px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.btn{
  flex:1;
  text-align:center;
  padding:12px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
}

.wa{
  background:#22c55e;
  color:black;
}

.call{
  background:#facc15;
  color:black;
}

footer{
  margin-top:60px;
  text-align:center;
  color:#94a3b8;
}

footer a{
  color:#facc15;
  text-decoration:none;
  margin:0 8px;
}

.empty{
  text-align:center;
  font-size:18px;
  color:#cbd5e1;
  padding:50px 0;
}
</style>
</head>

<body>

<div class="container">

<section class="hero">
  <h1 id="pageTitle">Premium Profiles</h1>
  <p id="pageIntro">Browse verified premium Nairobi Sweets listings with real photos, VIP upgrades, direct WhatsApp, and private booking.</p>
</section>

<section class="grid" id="profilesGrid"></section>

<footer>
  <a href="/">Home</a> |
  <a href="/public-signup-payment-page.html">Join</a> |
  <a href="/seo/locations/westlands.html">Westlands</a> |
  <a href="/seo/locations/ruaka.html">Ruaka</a> |
  <a href="/seo/locations/kilimani.html">Kilimani</a> |
  <a href="/seo/locations/thika-road.html">Thika Road</a>
</footer>

</div>

<script>
const PAGE_LOCATION = "Westlands";

const LOCATION_QUERY =
"location.ilike.%westlands%,location.ilike.%parklands%,location.ilike.%waiyaki%,location.ilike.%kangemi%,location.ilike.%westy%";

const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.title = `${PAGE_LOCATION} Premium Nairobi Profiles | Nairobi Sweets`;

document.getElementById("pageTitle").textContent =
`Premium Profiles in ${PAGE_LOCATION}`;

document.getElementById("pageIntro").textContent =
`Browse verified premium Nairobi Sweets listings in ${PAGE_LOCATION} with real photos, VIP upgrades, direct WhatsApp, and private booking.`;

function cleanPhone(phone){
  return String(phone || "").replace(/\D/g,"");
}

function makeWhatsApp(phone){
  let p = cleanPhone(phone);
  if(!p) return "#";

  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;

  return `https://wa.me/${p}`;
}

async function loadProfiles(){
  const {data,error} = await sb
    .from("profiles")
    .select("*")
    .eq("approved", true)
    .or(LOCATION_QUERY)
    .order("created_at",{ascending:false});

  const grid = document.getElementById("profilesGrid");

  if(error || !data || !data.length){
    grid.innerHTML = `<div class="empty">No ${PAGE_LOCATION} profiles available yet.</div>`;
    return;
  }

  grid.innerHTML = data.map(profile => {
    const name =
      profile.stage_name ||
      profile.name ||
      "Premium Profile";

    const phone =
      profile.phone ||
      profile.phone_number ||
      profile.whatsapp ||
      "";

    const whatsapp =
      profile.whatsapp ||
      profile.phone ||
      profile.phone_number ||
      "";

    const photo =
      profile.photo_url ||
      "/assets/logo/logo-badge.png";

    const bio =
      profile.bio
      ? profile.bio.substring(0,140)
      : "Premium Nairobi profile.";

    const packageType =
      profile.package ||
      profile.plan ||
      "Featured";

    const location =
      profile.location ||
      PAGE_LOCATION;

    return `
      <article class="card">
        <img
          src="${photo}"
          alt="${name} premium profile in ${location}"
          loading="lazy"
          onerror="this.onerror=null;this.src='/assets/logo/logo-badge.png';"
        />

        <div class="card-body">
          <h2>${name}</h2>

          <div class="meta">📍 ${location}</div>
          <div class="meta">${packageType}</div>

          <p class="bio">${bio}</p>

          <div class="buttons">
            <a class="btn wa"
               href="${makeWhatsApp(whatsapp)}"
               target="_blank">
               WhatsApp
            </a>

            <a class="btn call"
               href="tel:${phone}">
               Call
            </a>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

loadProfiles();
</script>

</body>
</html>
