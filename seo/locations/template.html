<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Nairobi Sweets Locations</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#020b24;
font-family:Arial,Helvetica,sans-serif;
color:white;
}

.container{
width:min(1500px,95%);
margin:auto;
padding:40px 0;
}

.hero{
background:#101936;
border-radius:30px;
padding:50px;
border:1px solid rgba(255,215,0,.15);
margin-bottom:30px;
}

.hero h1{
font-size:58px;
color:#ffd84b;
margin-bottom:18px;
font-weight:900;
}

.hero p{
font-size:22px;
color:#b7c2df;
line-height:1.6;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:24px;
margin-top:30px;
}

.card{
background:#081433;
border-radius:24px;
overflow:hidden;
border:1px solid rgba(255,215,0,.15);
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
}

.card img{
width:100%;
height:420px;
object-fit:cover;
background:#000;
}

.content{
padding:20px;
}

.name{
font-size:32px;
font-weight:900;
margin-bottom:10px;
}

.location{
color:#c2cee8;
margin-bottom:12px;
}

.bio{
color:#9eb0d4;
line-height:1.6;
margin-bottom:18px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.btn{
height:52px;
border:none;
border-radius:14px;
font-weight:900;
cursor:pointer;
font-size:16px;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
}

.whatsapp{
background:#25D366;
color:#001b07;
}

.call{
background:#ffd84b;
color:black;
}

.footer{
margin-top:60px;
padding:30px 0;
border-top:1px solid rgba(255,215,0,.1);
color:#9ca9cb;
}

.loading{
text-align:center;
font-size:26px;
padding:80px;
color:#ffd84b;
font-weight:900;
}

@media(max-width:1200px){

.grid{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:900px){

.grid{
grid-template-columns:repeat(2,1fr);
}

.hero h1{
font-size:42px;
}

}

@media(max-width:600px){

.grid{
grid-template-columns:1fr;
}

.hero{
padding:30px;
}

.hero h1{
font-size:34px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="hero">

<h1 id="title">
Premium Profiles
</h1>

<p id="desc">
Verified luxury profiles on Nairobi Sweets.
</p>

</div>

<div id="grid" class="grid">

<div class="loading">
Loading profiles...
</div>

</div>

<div class="footer">

<a href="/" style="color:#ffd84b;text-decoration:none;">
Home
</a>

</div>

</div>

<script>

const SUPABASE_URL =
"https://dkjlvyynvgtijccitvvd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const path =
window.location.pathname;

const slug =
path
.split("/")
.pop()
.replace(".html","")
.replaceAll("-"," ");

document.getElementById("title").innerText =
`Premium Profiles in ${slug}`;

document.getElementById("desc").innerText =
`Browse verified profiles in ${slug} on Nairobi Sweets.`;

async function loadProfiles(){

const grid =
document.getElementById("grid");

const { data, error } =
await sb
.from("profiles")
.select("*")
.eq("approved", true)
.ilike("location", `%${slug}%`)
.limit(24);

if(error){

grid.innerHTML = `
<div class="loading">
${error.message}
</div>
`;

return;
}

if(!data || !data.length){

grid.innerHTML = `
<div class="loading">
No profiles found in ${slug}
</div>
`;

return;
}

grid.innerHTML =
data.map(profile => {

const phone =
(profile.phone || "")
.replace(/\D/g,"");

return `

<div class="card">

<img
src="${
profile.photo_url ||
profile.image_url ||
'../../assets/logo/logo-badge.png'
}"
onerror="
this.src='../../assets/logo/logo-badge.png'
"
/>

<div class="content">

<div class="name">
${profile.stage_name || 'Profile'}
</div>

<div class="location">
📍 ${profile.location || 'Nairobi'}
</div>

<div class="bio">
${profile.bio || 'Premium Nairobi profile'}
</div>

<div class="actions">

<a
class="btn whatsapp"
target="_blank"
href="https://wa.me/${phone}"
>
WhatsApp
</a>

<a
class="btn call"
href="tel:${phone}"
>
Call
</a>

</div>

</div>

</div>

`;

}).join("");

}

loadProfiles();

</script>

</body>
</html>
