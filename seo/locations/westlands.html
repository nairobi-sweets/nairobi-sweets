<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Westlands Premium Nairobi Profiles | Nairobi Sweets</title>
  <meta name="description" content="Browse premium Nairobi Sweets profiles in Westlands with verified photos, WhatsApp access, direct calls, and VIP listings.">
  <meta name="keywords" content="Westlands escorts, Nairobi profiles, Nairobi sweets Westlands, VIP Nairobi listings">
  <link rel="canonical" href="https://nairobi-sweets.com/seo/locations/westlands.html">

  <meta property="og:title" content="Westlands Premium Nairobi Profiles">
  <meta property="og:description" content="Verified Westlands premium listings on Nairobi Sweets.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nairobi-sweets.com/seo/locations/westlands.html">
  <meta property="og:image" content="https://nairobi-sweets.com/assets/logo/logo-badge.png">

  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"CollectionPage",
    "name":"Westlands Premium Nairobi Profiles",
    "url":"https://nairobi-sweets.com/seo/locations/westlands.html",
    "description":"Premium Westlands listings on Nairobi Sweets"
  }
  </script>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#020617;
      color:white;
    }

    .container{
      max-width:1400px;
      margin:auto;
      padding:40px 20px;
    }

    .hero{
      background:linear-gradient(135deg,#0f172a,#1e293b);
      padding:40px;
      border-radius:24px;
      margin-bottom:40px;
      box-shadow:0 0 25px rgba(255,215,0,0.08);
    }

    h1{
      font-size:48px;
      color:#facc15;
      margin-bottom:15px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:24px;
    }

    .card{
      background:#0f172a;
      border:1px solid rgba(255,215,0,0.12);
      border-radius:22px;
      overflow:hidden;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-6px);
      box-shadow:0 12px 35px rgba(255,215,0,0.12);
    }

    .card img{
      width:100%;
      height:320px;
      object-fit:cover;
      background:#111827;
    }

    .card-body{
      padding:18px;
    }

    .card h2{
      font-size:28px;
      margin:0 0 10px;
      color:#fff;
    }

    .meta{
      color:#cbd5e1;
      margin-bottom:8px;
      font-size:15px;
    }

    .buttons{
      display:flex;
      gap:10px;
      margin-top:15px;
    }

    .btn{
      flex:1;
      text-align:center;
      padding:12px;
      border-radius:12px;
      text-decoration:none;
      font-weight:bold;
    }

    .wa{background:#22c55e;color:black;}
    .call{background:#facc15;color:black;}

    footer{
      margin-top:50px;
      text-align:center;
      color:#94a3b8;
    }
  </style>
</head>
<body>

<div class="container">

  <section class="hero">
    <h1>Premium Profiles in Westlands</h1>
    <p>Browse verified premium Nairobi Sweets listings in Westlands with real photos, VIP upgrades, direct WhatsApp, and private booking.</p>
  </section>

  <section class="grid" id="profilesGrid"></section>

  <footer>
    <p>
      <a href="/" style="color:#facc15;">Home</a> |
      <a href="/join.html" style="color:#facc15;">Join</a> |
      <a href="/seo/locations/kilimani.html" style="color:#facc15;">Kilimani</a>
    </p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadProfiles() {
  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("approved", true)
    .ilike("location", "%westlands%")
    .order("created_at", { ascending:false });

  const grid = document.getElementById("profilesGrid");

  if(error || !data || !data.length){
    grid.innerHTML = "<p>No profiles available yet.</p>";
    return;
  }

  grid.innerHTML = data.map(profile => `
    <article class="card">
      <img src="${profile.photo_url || '/assets/logo/logo-badge.png'}" alt="${profile.stage_name}">
      <div class="card-body">
        <h2>${profile.stage_name}</h2>
        <div class="meta">${profile.location}</div>
        <div class="meta">${profile.package || 'Featured'}</div>
        <p>${profile.bio ? profile.bio.substring(0,120) : ''}</p>

        <div class="buttons">
          <a class="btn wa" href="https://wa.me/${profile.whatsapp_number.replace('+','')}" target="_blank">WhatsApp</a>
          <a class="btn call" href="tel:${profile.phone}">Call</a>
        </div>
      </div>
    </article>
  `).join('');
}

loadProfiles();
</script>

</body>
</html>
