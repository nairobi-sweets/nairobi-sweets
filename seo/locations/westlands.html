<!DOCTYPE html>
<html lang="en">
<head>

  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"CollectionPage",
    "name":"Westlands Premium Nairobi Profiles",
    "url":"https://nairobi-sweets.com/seo/locations/westlands.html",
    "description":"Premium Westlands listings on Nairobi Sweets"
  }
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: white;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 40px 20px;
    }

    .hero {
      background: linear-gradient(135deg,#0f172a,#1e293b);
      padding: 40px;
      border-radius: 24px;
      margin-bottom: 40px;
      box-shadow: 0 0 25px rgba(255,215,0,0.08);
    }

    h1 {
      font-size: 48px;
      color: #facc15;
      margin-bottom: 15px;
    }

    .hero p {
      color: #e2e8f0;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
      gap: 24px;
    }

    .card {
      background: #0f172a;
      border: 1px solid rgba(255,215,0,0.12);
      border-radius: 22px;
      overflow: hidden;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 35px rgba(255,215,0,0.12);
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      background: #111827;
    }

    .card-body {
      padding: 18px;
    }

    .card h2 {
      font-size: 28px;
      margin: 0 0 10px;
      color: white;
    }

    .meta {
      color: #cbd5e1;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .bio {
      color: #e2e8f0;
      line-height: 1.5;
      min-height: 72px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .wa {
      background: #22c55e;
      color: black;
    }

    .call {
      background: #facc15;
      color: black;
    }

    footer {
      margin-top: 50px;
      text-align: center;
      color: #94a3b8;
    }

    footer a {
      color: #facc15;
      text-decoration: none;
      margin: 0 8px;
    }

    .empty {
      font-size: 18px;
      color: #cbd5e1;
      text-align: center;
      padding: 40px 0;
    }
  </style>
</head>
<body>

<div class="container">

  <section class="hero">
    <h1>Premium Profiles in Westlands</h1>
    <p>Browse verified premium Nairobi Sweets listings in Westlands with real photos, VIP upgrades, direct WhatsApp, and private booking.</p>
  </section>

  <section class="grid" id="profilesGrid"></section>

  <footer>
    <p>
      <a href="/">Home</a> |
      <a href="/join.html">Join</a> |
      <a href="/seo/locations/kilimani.html">Kilimani</a>
    </p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadProfiles() {
  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("approved", true)
    .or("location.ilike.%westlands%,location.ilike.%parklands%,location.ilike.%waiyaki%,location.ilike.%kangemi%,location.ilike.%westy%")
    .order("created_at", { ascending: false });

  const grid = document.getElementById("profilesGrid");

  if (error || !data || !data.length) {
    grid.innerHTML = '<div class="empty">No profiles available yet.</div>';
    return;
  }

  grid.innerHTML = data.map(profile => {
    const whatsapp = (profile.whatsapp_number || profile.phone || "").replace(/\+/g, "").replace(/\s/g, "");
    const phone = profile.phone || profile.whatsapp_number || "";
    const photo = profile.photo_url || "/assets/logo/logo-badge.png";
    const bio = profile.bio ? profile.bio.substring(0, 140) : "";
    const packageType = profile.package || "Featured";

    return `
      <article class="card">
        <img src="${photo}" alt="${profile.stage_name}">
        <div class="card-body">
          <h2>${profile.stage_name || "Premium Profile"}</h2>
          <div class="meta">${profile.location || "Westlands"}</div>
          <div class="meta">${packageType}</div>
          <p class="bio">${bio}</p>

          <div class="buttons">
            <a class="btn wa" href="https://wa.me/${whatsapp}" target="_blank">WhatsApp</a>
            <a class="btn call" href="tel:${phone}">Call</a>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

loadProfiles();
</script>

</body>
</html>
