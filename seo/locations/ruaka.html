  <style>
    *{box-sizing:border-box}
    body{

    .hero{

<body>

<div class="container">

  <section class="hero">
    <h1>Premium Profiles in Ruaka</h1>
    <p>Browse verified premium Nairobi Sweets listings in Ruaka with real photos, VIP upgrades, direct WhatsApp, and private booking.</p>
  </section>

  <section class="grid" id="profilesGrid"></section>

  <footer>
    <p>
      <a href="/">Home</a> |
      <a href="/public-signup-payment-page.html">Join</a> |
      <a href="/seo/locations/westlands.html">Westlands</a> |
      <a href="/seo/locations/kilimani.html">Kilimani</a>
    </p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function cleanPhone(phone){
  return String(phone || "").replace(/\D/g, "");
}

function makeWhatsApp(phone){
  let p = cleanPhone(phone);
  if(!p) return "#";
  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
  return `https://wa.me/${p}`;
}

async function loadProfiles() {
  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("approved", true)
    .or("location.ilike.%ruaka%,location.ilike.%joyland%,location.ilike.%ruaka-square%,location.ilike.%limuru-road%,location.ilike.%two-rivers%")
    .order("created_at", { ascending: false });

  const grid = document.getElementById("profilesGrid");

  if (error || !data || !data.length) {
    grid.innerHTML = '<div class="empty">No Ruaka profiles available yet.</div>';
    return;
  }

  grid.innerHTML = data.map(profile => {
    const name = profile.stage_name || profile.name || "Premium Profile";
    const phone = profile.phone || profile.phone_number || profile.whatsapp || "";
    const whatsapp = profile.whatsapp || profile.phone || profile.phone_number || "";
    const photo = profile.photo_url || "/assets/logo/logo-badge.png";
    const bio = profile.bio ? profile.bio.substring(0,140) : "Premium Nairobi profile.";
    const packageType = profile.package || profile.plan || "Featured";
    const location = profile.location || "Ruaka";

    return `
      <article class="card">
        <img
          src="${photo}"
          alt="${name} premium profile in ${location}"
          loading="lazy"
          onerror="this.onerror=null;this.src='/assets/logo/logo-badge.png';"
        />

        <div class="card-body">
          <h2>${name}</h2>
          <div class="meta">📍 ${location}</div>
          <div class="meta">${packageType}</div>
          <p class="bio">${bio}</p>

          <div class="buttons">
            <a class="btn wa" href="${makeWhatsApp(whatsapp)}" target="_blank">WhatsApp</a>
            <a class="btn call" href="tel:${phone}">Call</a>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

loadProfiles();
</script>

</body>
</html>
