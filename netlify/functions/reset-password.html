<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | Nairobi Sweets</title>

<link rel="icon" href="/assets/logo/logo-badge.png">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#03051b;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:#07145a;
border:1px solid rgba(255,216,75,.2);
border-radius:24px;
padding:40px;
box-shadow:0 0 40px rgba(255,216,75,.15);
}

.logo{
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.logo img{
width:70px;
height:70px;
border-radius:50%;
}

.logo h1{
color:#ffd84b;
font-size:32px;
font-weight:800;
line-height:1;
}

h2{
color:#fff;
margin-bottom:10px;
font-size:32px;
}

.subtitle{
color:#cfd4ff;
margin-bottom:30px;
}

.input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:14px;
background:#020a3a;
color:#fff;
font-size:16px;
margin-bottom:15px;
}

.btn{
width:100%;
padding:16px;
border:none;
cursor:pointer;
border-radius:14px;
background:#ffd84b;
color:#000;
font-size:18px;
font-weight:800;
margin-top:10px;
}

.btn:hover{
opacity:.95;
}

.message{
margin-top:20px;
padding:15px;
border-radius:12px;
display:none;
font-weight:700;
}

.success{
background:#0d6b3a;
color:#fff;
}

.error{
background:#8d1b1b;
color:#fff;
}
</style>
</head>
<body>

<div class="card">

<div class="logo">
<img src="/assets/logo/logo-badge.png">
<h1>Nairobi<br>Sweets</h1>
</div>

<h2>Reset Password</h2>

<p class="subtitle">
Create a new password for your account.
</p>

<input
type="password"
id="password"
class="input"
placeholder="New Password">

<input
type="password"
id="confirmPassword"
class="input"
placeholder="Confirm Password">

<button
class="btn"
onclick="updatePassword()">
Update Password
</button>

<div id="success" class="message success"></div>
<div id="error" class="message error"></div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://dkjlvyynvgtijccitvvd.supabase.co",
"YOUR_SUPABASE_ANON_KEY"
);

window.updatePassword = async () => {

const password =
document.getElementById("password").value.trim();

const confirmPassword =
document.getElementById("confirmPassword").value.trim();

const success =
document.getElementById("success");

const error =
document.getElementById("error");

success.style.display="none";
error.style.display="none";

if(password.length < 8){

error.innerHTML =
"Password must be at least 8 characters.";

error.style.display="block";
return;
}

if(password !== confirmPassword){

error.innerHTML =
"Passwords do not match.";

error.style.display="block";
return;
}

try{

const { error: updateError } =
await supabase.auth.updateUser({
password
});

if(updateError) throw updateError;

success.innerHTML =
"Password updated successfully. Redirecting to Vault Login...";

success.style.display="block";

setTimeout(()=>{

window.location.href =
"/vault-login.html";

},2000);

}catch(err){

error.innerHTML =
err.message;

error.style.display="block";

}

};

</script>

</body>
</html>
