<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nairobi Sweets Offline</title>
<meta name="theme-color" content="#ffd54a">
<link rel="icon" href="/assets/pwa/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top,#101b69,#000814 55%,#000);font-family:Arial,Helvetica,sans-serif;color:#fff;text-align:center}
.card{width:min(520px,94vw);border-radius:32px;padding:32px;background:linear-gradient(180deg,#020a56,#010633);border:1px solid rgba(255,213,74,.18);box-shadow:0 28px 90px rgba(0,0,0,.65)}
img{width:96px;height:96px;border-radius:24px;margin-bottom:18px;box-shadow:0 0 30px rgba(255,213,74,.22)}
h1{color:#ffd54a;font-size:34px;margin-bottom:12px;line-height:1}
p{color:#ddd;line-height:1.7;font-weight:800;margin-bottom:18px}
a,button{display:inline-flex;align-items:center;justify-content:center;min-height:50px;border:0;border-radius:18px;padding:14px 22px;background:linear-gradient(145deg,#ffd54a,#ff9f1c);color:#000;font-weight:950;text-decoration:none;cursor:pointer}
</style>
</head>
<body>
  <main class="card">
    <img src="/assets/pwa/icon-192.png" alt="Nairobi Sweets">
    <h1>You are offline</h1>
    <p>Nairobi Sweets is installed, but this page needs internet to refresh live profiles, WhatsApp links and contact tracking.</p>
    <button onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>
