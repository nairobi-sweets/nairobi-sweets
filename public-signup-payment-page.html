<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nairobi Sweets - Create Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050507;
  color:white;
}
header{
  padding:18px 24px;
  background:#03030a;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,216,75,.18);
}
.logo{
  color:#ffd84b;
  font-size:24px;
  font-weight:900;
}
.home{
  color:#111;
  background:#ffd84b;
  text-decoration:none;
  padding:10px 16px;
  border-radius:999px;
  font-weight:900;
}
.wrap{
  max-width:520px;
  margin:40px auto;
  padding:0 18px;
}
.card{
  background:#111;
  border:1px solid rgba(255,216,75,.25);
  border-radius:26px;
  padding:24px;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
}
h1{
  color:#ffd84b;
  margin:0 0 8px;
}
p{
  color:#ddd;
}
label{
  display:block;
  color:#ffd84b;
  font-weight:900;
  margin-top:14px;
}
input,textarea,select{
  width:100%;
  padding:14px;
  margin-top:7px;
  border-radius:14px;
  border:1px solid #333;
  background:#050505;
  color:white;
  outline:none;
}
textarea{
  min-height:95px;
  resize:vertical;
}
.preview{
  width:100%;
  height:230px;
  object-fit:cover;
  border-radius:18px;
  background:#191919;
  margin-top:12px;
  display:none;
}
.amount{
  margin-top:16px;
  padding:16px;
  border-radius:16px;
  background:rgba(255,216,75,.13);
  color:#ffd84b;
  font-size:18px;
  font-weight:900;
}
button{
  width:100%;
  margin-top:18px;
  padding:16px;
  border:0;
  border-radius:999px;
  background:#ffd84b;
  color:#111;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}
.status{
  margin-top:14px;
  color:#ff5c7a;
  font-weight:800;
}
.good{color:#25D366}
footer{
  text-align:center;
  color:#888;
  padding:30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Nairobi Sweets</div>
  <a class="home" href="index.html">Home</a>
</header>

<div class="wrap">
  <div class="card">
    <h1>Create Profile</h1>
    <p>Create your profile, upload a photo, choose package, then pay.</p>

    <label>Profile Photo</label>
    <input id="photoFile" type="file" accept="image/*" onchange="previewPhoto()" />
    <img id="photoPreview" class="preview" />

    <label>Stage Name</label>
    <input id="stage_name" placeholder="Example: Hot Salam" />

    <label>Phone Number</label>
    <input id="phone" placeholder="Example: 0757291539" />

    <label>WhatsApp Number</label>
    <input id="whatsapp" placeholder="Example: 0757291539" />

    <label>Location</label>
    <input id="location" placeholder="Example: Nairobi" />

    <label>Bio</label>
    <textarea id="bio" placeholder="Write short profile bio..."></textarea>

    <label>Package</label>
    <select id="packageSelect" onchange="updateAmount()">
      <option value="Featured" data-amount="1000">Featured - KES 1000 / week</option>
      <option value="VIP" data-amount="1500">VIP - KES 1500 / week</option>
      <option value="VVIP / Signature" data-amount="3000">VVIP / Signature - KES 3000 / week</option>
    </select>

    <div class="amount" id="amountBox">Amount: KES 1000</div>

    <button onclick="createProfileAndPay()">Create Profile & Pay</button>

    <div id="status" class="status"></div>
  </div>
</div>

<footer>© Nairobi Sweets</footer>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";
const STORAGE_BUCKET = "profile-images";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function $(id){
  return document.getElementById(id);
}

function setStatus(message, good = false){
  $("status").textContent = message;
  $("status").className = good ? "status good" : "status";
}

function cleanPhone(phone){
  return String(phone || "").replace(/\D/g, "");
}

function normalizeKenyanPhone(phone){
  let p = cleanPhone(phone);

  if(!p) return "";

  if(p.startsWith("0")) return "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) return "254" + p;

  return p;
}

function updateAmount(){
  const select = $("packageSelect");
  const amount = select.options[select.selectedIndex].dataset.amount;
  $("amountBox").textContent = `Amount: KES ${amount}`;
}

function previewPhoto(){
  const file = $("photoFile").files[0];
  const preview = $("photoPreview");

  if(!file){
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}

async function uploadPhoto(stageName){
  const file = $("photoFile").files[0];

  if(!file){
    return "";
  }

  const ext = file.name.split(".").pop().toLowerCase();
  const safeName = stageName.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  const fileName = `${Date.now()}-${safeName}.${ext}`;

  const { error } = await sb.storage
    .from(STORAGE_BUCKET)
    .upload(fileName, file, {
      cacheControl: "3600",
      upsert: false
    });

  if(error){
    console.error("UPLOAD ERROR:", error);
    throw new Error("Photo upload failed");
  }

  return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${fileName}`;
}

async function createProfileAndPay(){
  try{
    setStatus("Preparing profile...");

    const stageName = $("stage_name").value.trim();
    const phoneRaw = $("phone").value.trim();
    const whatsappRaw = $("whatsapp").value.trim();
    const location = $("location").value.trim();
    const bio = $("bio").value.trim();

    const packageSelect = $("packageSelect");
    const selectedPackage = packageSelect.value;
    const amount = Number(packageSelect.options[packageSelect.selectedIndex].dataset.amount || 0);

    if(!stageName){
      setStatus("Missing stage name");
      return;
    }

    if(!phoneRaw){
      setStatus("Missing phone number");
      return;
    }

    if(!whatsappRaw){
      setStatus("Missing WhatsApp number");
      return;
    }

    if(!location){
      setStatus("Missing location");
      return;
    }

    const phone = normalizeKenyanPhone(phoneRaw);
    const whatsapp = normalizeKenyanPhone(whatsappRaw);

    if(phone.length < 12){
      setStatus("Phone number is not valid");
      return;
    }

    setStatus("Uploading photo...");
    const photoUrl = await uploadPhoto(stageName);

    setStatus("Creating profile...");

    const profilePayload = {
      stage_name: stageName,
      name: stageName,
      full_name: stageName,

      phone: phone,
      phone_number: phone,
      whatsapp: whatsapp,

      location: location,
      bio: bio,

      photo_url: photoUrl,

      package: selectedPackage,
      plan: selectedPackage,
      amount_paid: amount,

      payment_status: "pending",
      approved: false,
      status: "pending",

      likes: 0,
      views: 0
    };

    const { data: profile, error: profileError } = await sb
      .from("profiles")
      .insert(profilePayload)
      .select()
      .single();

    if(profileError){
      console.error("PROFILE ERROR:", profileError);
      setStatus(profileError.message || "Could not create profile");
      return;
    }

    setStatus("Profile created. Sending M-Pesa request...", true);

    const paymentPayload = {
      profile_id: profile.id,
      name: stageName,
      stage_name: stageName,
      phone: phone,
      amount: amount,
      package: selectedPackage
    };

    const res = await fetch("/.netlify/functions/mpesa-stk-push", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(paymentPayload)
    });

    const paymentData = await res.json().catch(() => ({}));

    if(!res.ok){
      console.error("PAYMENT ERROR:", paymentData);
      setStatus(paymentData.error || "Profile saved, but payment request failed");
      return;
    }

    setStatus("M-Pesa request sent. Check your phone to complete payment.", true);

    setTimeout(() => {
      window.location.href = "payment-status.html";
    }, 2500);

  }catch(err){
    console.error(err);
    setStatus(err.message || "Something went wrong");
  }
}

updateAmount();
</script>

</body>
</html>
