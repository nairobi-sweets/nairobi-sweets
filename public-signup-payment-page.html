<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Signup Form | Nairobi Sweets</title>

<link rel="icon" href="/assets/logo/logo-badge.png">
<link rel="manifest" href="/manifest.webmanifest">

<meta name="theme-color" content="#ff0088">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nairobi Sweets">
<link rel="apple-touch-icon" href="/assets/logo/logo-badge.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

:root{
  --pink:#ff0088;
  --pink2:#ff4bad;
  --gold:#ffd84b;
  --black:#000;
  --white:#fff;
  --text:#171827;
  --muted:#74788a;
  --line:#e4e5ec;
  --soft:#f7f7fb;
  --green:#16a34a;
  --red:#e11d48;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#000;
  color:var(--text);
}

a{
  color:inherit;
  text-decoration:none;
}

.header{
  background:#fff;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:50;
}

.nav{
  width:min(1320px,calc(100% - 28px));
  margin:auto;
  min-height:92px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:86px;
  max-height:70px;
  object-fit:contain;
}

.brand strong{
  font-size:25px;
  color:var(--pink);
  font-weight:950;
}

.menu{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}

.menu a{
  color:var(--pink);
  font-weight:800;
  padding:10px 12px;
  border-radius:12px;
}

.menu .join{
  border:2px solid var(--pink);
  border-radius:18px;
  padding:12px 20px;
}

.hero{
  text-align:center;
  padding:34px 14px 24px;
  color:#fff;
}

.hero h1{
  margin:0;
  color:var(--pink);
  font-size:clamp(38px,5vw,56px);
  font-weight:500;
}

.hero p{
  color:#fff;
  font-size:20px;
}

.form-shell{
  width:min(980px,calc(100% - 28px));
  margin:0 auto 52px;
  background:#f5f5f7;
  border-radius:26px;
  padding:30px;
  box-shadow:0 0 35px rgba(255,0,136,.45);
}

.notice{
  color:var(--pink);
  font-size:20px;
  margin:0 0 24px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px 30px;
}

.field{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  font-size:14px;
  color:#6a6d7d;
  padding:12px 16px 0;
}

input,
select,
textarea{
  width:100%;
  border:0;
  background:#fff;
  color:#111;
  padding:8px 16px 16px;
  font-size:20px;
  outline:none;
  font-family:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.phone-wrap{
  display:grid;
  grid-template-columns:78px 1fr;
}

.code{
  display:flex;
  align-items:center;
  justify-content:center;
  border-right:1px solid var(--line);
  font-size:20px;
  background:#fafafa;
}

.files{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px 30px;
  margin-top:28px;
}

.file-box{
  display:grid;
  grid-template-columns:auto 1fr;
  align-items:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}

.file-box span{
  padding:16px;
  border-right:1px solid var(--line);
  font-size:18px;
  white-space:nowrap;
}

.file-box input{
  padding:14px;
  font-size:16px;
}

.preview{
  margin-top:10px;
  width:100%;
  max-height:220px;
  object-fit:cover;
  display:none;
  border-radius:14px;
}

.plan-card{
  margin-top:30px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
}

.plan-title{
  margin:0 0 16px;
  color:var(--pink);
  font-size:25px;
}

.amount{
  margin-top:18px;
  padding:20px;
  border-radius:16px;
  background:#111;
  color:var(--gold);
  font-size:30px;
  font-weight:950;
  text-align:center;
}

.price-mini{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:16px;
}

.price-pill{
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  text-align:center;
  background:#fafafa;
  font-size:14px;
}

.price-pill strong{
  display:block;
  color:var(--pink);
  margin-top:6px;
  font-size:16px;
}

.checks{
  margin-top:26px;
  display:grid;
  gap:18px;
}

.check{
  display:flex;
  gap:12px;
  align-items:flex-start;
  color:#20212b;
  font-size:18px;
  line-height:1.5;
}

.check input{
  width:22px;
  height:22px;
  margin-top:2px;
  accent-color:var(--pink);
}

button{
  width:100%;
  margin-top:30px;
  padding:22px;
  border:none;
  border-radius:10px;
  background:var(--pink);
  color:#fff;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.msg{
  margin-top:20px;
  font-size:18px;
  font-weight:900;
  line-height:1.5;
  text-align:center;
}

.success{color:var(--green)}
.error{color:var(--red)}

.login-note{
  margin-top:24px;
  text-align:center;
  font-size:18px;
}

.login-note a{
  color:var(--pink);
  font-weight:900;
}

footer{
  text-align:center;
  color:#aaa;
  padding:30px;
}

@media(max-width:850px){
  .grid,
  .files,
  .price-mini{
    grid-template-columns:1fr;
  }

  .nav{
    flex-direction:column;
    align-items:flex-start;
    padding:14px 0;
  }

  .menu{
    gap:6px;
  }

  .form-shell{
    padding:22px;
  }

  .file-box{
    grid-template-columns:1fr;
  }

  .file-box span{
    border-right:0;
    border-bottom:1px solid var(--line);
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="nav">
    <a href="/index.html" class="brand">
      <img src="/assets/logo/logo-navbar.png" alt="Nairobi Sweets Logo" onerror="this.src='/assets/logo/logo-badge.png'">
      <strong>Nairobi Sweets</strong>
    </a>

    <nav class="menu">
      <a href="/index.html">Home</a>
      <a href="/index.html#profiles">Profiles</a>
      <a href="/shorts.html">Videos</a>
      <a href="/join.html" class="join">Join Us</a>
    </nav>
  </div>
</header>

<section class="hero">
  <h1>Signup Form</h1>
  <p>It’s quick and easy.</p>
</section>

<main class="form-shell">
  <p class="notice">NB: Fill in all areas with a (*)</p>

  <form id="joinForm">

    <div class="grid">

      <div class="field">
        <label>User Name*</label>
        <input id="stageName" required placeholder="Stage name">
      </div>

      <div class="field">
        <label>Phone Number*</label>
        <div class="phone-wrap">
          <div class="code">+254</div>
          <input id="phone" required placeholder="700123123">
        </div>
      </div>

      <div class="field">
        <label>Email*</label>
        <input id="email" type="email" required placeholder="you@email.com">
      </div>

      <div class="field">
        <label>WhatsApp Number</label>
        <div class="phone-wrap">
          <div class="code">+254</div>
          <input id="whatsapp" placeholder="Leave blank if same">
        </div>
      </div>

      <div class="field">
        <label>Gender*</label>
        <select id="gender" required>
          <option value="">Select Your Gender*</option>
          <option>Female</option>
          <option>Male</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label>Your Age*</label>
        <input id="age" type="number" min="20" required placeholder="20+">
      </div>

      <div class="field">
        <label>Your Town*</label>
        <input id="town" required placeholder="i.e. Nairobi">
      </div>

      <div class="field">
        <label>Your Location*</label>
        <input id="location" required placeholder="i.e. Kasarani">
      </div>

      <div class="field">
        <label>Your Estate*</label>
        <input id="estate" placeholder="i.e. Mwiki">
      </div>

      <div class="field">
        <label>Meeting Place*</label>
        <select id="meetingPlace" required>
          <option value="">Select Your Meeting Place*</option>
          <option>In Call</option>
          <option>Out Call</option>
          <option>Both</option>
        </select>
      </div>

      <div class="field">
        <label>Preference*</label>
        <select id="preference" required>
          <option value="">Select Your Preference*</option>
          <option>Men</option>
          <option>Women</option>
          <option>Couples</option>
          <option>Everyone</option>
        </select>
      </div>

      <div class="field">
        <label>Body Type*</label>
        <select id="bodyType" required>
          <option value="">Select Your Body Type*</option>
          <option>Petite</option>
          <option>Slim</option>
          <option>Thick</option>
          <option>Curvy</option>
          <option>Athletic</option>
          <option>BBW</option>
        </select>
      </div>

      <div class="field full">
        <label>Your Rate Optional</label>
        <input id="rate" placeholder="KSh 5,000">
      </div>

      <div class="field full">
        <label>Your Short Description Optional</label>
        <textarea id="bio" placeholder="Short profile description"></textarea>
      </div>

      <div class="field full">
        <label>Services You Offer*</label>
        <textarea id="services" required placeholder="Write the services you offer"></textarea>
      </div>

      <div class="field full">
        <label>Services You Don’t Offer Optional</label>
        <textarea id="servicesDontOffer" placeholder="Write services you do not offer"></textarea>
      </div>

    </div>

    <div class="files">
      <div>
        <div class="file-box">
          <span>Main Picture*</span>
          <input id="photo1" type="file" accept="image/*" required>
        </div>
        <img id="preview1" class="preview" alt="">
      </div>

      <div>
        <div class="file-box">
          <span>2nd Picture*</span>
          <input id="photo2" type="file" accept="image/*" required>
        </div>
        <img id="preview2" class="preview" alt="">
      </div>

      <div>
        <div class="file-box">
          <span>3rd Picture*</span>
          <input id="photo3" type="file" accept="image/*" required>
        </div>
        <img id="preview3" class="preview" alt="">
      </div>

      <div>
        <div class="file-box">
          <span>4th Picture</span>
          <input id="photo4" type="file" accept="image/*">
        </div>
        <img id="preview4" class="preview" alt="">
      </div>

      <div>
        <div class="file-box">
          <span>Video 1*</span>
          <input id="video1" type="file" accept="video/*" required>
        </div>
      </div>

      <div>
        <div class="file-box">
          <span>Video 2</span>
          <input id="video2" type="file" accept="video/*">
        </div>
      </div>
    </div>

    <section class="plan-card">
      <h2 class="plan-title">Choose Membership</h2>

      <div class="grid">
        <div class="field">
          <label>Membership Plan*</label>
          <select id="package" required>
            <option value="featured">⭐ Featured</option>
            <option value="vip">🔥 VIP</option>
            <option value="vip-plus">💎 VIP+</option>
            <option value="signature">👑 Signature</option>
          </select>
        </div>

        <div class="field">
          <label>Duration*</label>
          <select id="duration" required>
            <option value="3">3 Days</option>
            <option value="7">7 Days</option>
            <option value="15">15 Days</option>
            <option value="30">30 Days</option>
          </select>
        </div>
      </div>

      <div class="amount" id="amountBox">Amount: KSh 300</div>
      <div class="price-mini" id="priceMini"></div>
    </section>

    <div class="checks">
      <label class="check">
        <input id="terms" type="checkbox" required>
        <span>I agree to the Terms, Advertiser Agreement and Privacy Policy*</span>
      </label>

      <label class="check">
        <input id="adult" type="checkbox" required>
        <span>I am at least 20 years old*</span>
      </label>

      <label class="check">
        <input id="independent" type="checkbox" required>
        <span>I am joining on my own behalf as a consenting adult and I am independent*</span>
      </label>
    </div>

    <button id="payBtn" type="submit">Create Profile & Pay</button>

    <div id="msg" class="msg"></div>

    <div class="login-note">
      Already a member? <a href="/login.html">Login here</a>
    </div>

  </form>
</main>

<footer>
  © Nairobi Sweets
</footer>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PLAN_PRICES = {
  featured: { 3: 300, 7: 600, 15: 900, 30: 1500 },
  vip: { 3: 800, 7: 1500, 15: 2500, 30: 4000 },
  "vip-plus": { 3: 1000, 7: 2000, 15: 3500, 30: 5000 },
  signature: { 3: 1500, 7: 3000, 15: 6000, 30: 10000 }
};

const PLAN_LABELS = {
  featured: "Featured",
  vip: "VIP",
  "vip-plus": "VIP+",
  signature: "Signature"
};

const PLAN_RANKS = {
  featured: 1,
  vip: 2,
  "vip-plus": 3,
  signature: 4
};

const form = document.getElementById("joinForm");
const msg = document.getElementById("msg");
const payBtn = document.getElementById("payBtn");
const packageSelect = document.getElementById("package");
const durationSelect = document.getElementById("duration");
const amountBox = document.getElementById("amountBox");
const priceMini = document.getElementById("priceMini");

function money(amount){
  return "KSh " + Number(amount).toLocaleString("en-KE");
}

function getAmount(){
  return PLAN_PRICES[packageSelect.value][durationSelect.value];
}

function updateAmount(){
  const plan = packageSelect.value;
  const amount = getAmount();

  amountBox.innerText = "Amount: " + money(amount);

  priceMini.innerHTML = Object.entries(PLAN_PRICES[plan]).map(([days, price]) => `
    <div class="price-pill">
      ${days} Days
      <strong>${money(price)}</strong>
    </div>
  `).join("");
}

packageSelect.addEventListener("change", updateAmount);
durationSelect.addEventListener("change", updateAmount);

function applyURLPlan(){
  const params = new URLSearchParams(window.location.search);
  const plan = params.get("plan");
  const duration = params.get("duration");

  if(plan && PLAN_PRICES[plan]){
    packageSelect.value = plan;
  }

  if(duration && ["3","7","15","30"].includes(duration)){
    durationSelect.value = duration;
  }

  updateAmount();
}

function preview(inputId,imgId){
  const input = document.getElementById(inputId);
  const img = document.getElementById(imgId);

  input.addEventListener("change",()=>{
    const file = input.files[0];
    if(!file) return;

    img.src = URL.createObjectURL(file);
    img.style.display = "block";
  });
}

preview("photo1","preview1");
preview("photo2","preview2");
preview("photo3","preview3");
preview("photo4","preview4");

function cleanPhone(phone){
  let p = String(phone || "").replace(/\D/g,"");

  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
  if(p.length === 9) p = "254" + p;

  return p;
}

function slugify(text){
  return String(text || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function addDays(date,days){
  const d = new Date(date);
  d.setDate(d.getDate() + Number(days));
  return d.toISOString();
}

async function uploadFile(bucket,file,folder){
  if(!file) return null;

  const ext = file.name.split(".").pop() || "file";
  const fileName = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext.toLowerCase()}`;

  const { error } = await sb.storage
    .from(bucket)
    .upload(fileName,file,{
      cacheControl:"3600",
      upsert:false
    });

  if(error) throw error;

  const { data } = sb.storage.from(bucket).getPublicUrl(fileName);
  return data.publicUrl;
}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();

  msg.className = "msg";
  msg.innerText = "Creating profile...";
  payBtn.disabled = true;
  payBtn.innerText = "Processing...";

  try{
    const stageName = document.getElementById("stageName").value.trim();
    const phone = cleanPhone(document.getElementById("phone").value);
    const whatsappInput = document.getElementById("whatsapp").value.trim();
    const whatsapp = whatsappInput ? cleanPhone(whatsappInput) : phone;
    const email = document.getElementById("email").value.trim();
    const gender = document.getElementById("gender").value;
    const age = Number(document.getElementById("age").value);
    const town = document.getElementById("town").value.trim();
    const location = document.getElementById("location").value.trim();
    const estate = document.getElementById("estate").value.trim();
    const meetingPlace = document.getElementById("meetingPlace").value;
    const preference = document.getElementById("preference").value;
    const bodyType = document.getElementById("bodyType").value;
    const rate = document.getElementById("rate").value.trim();
    const bio = document.getElementById("bio").value.trim();
    const services = document.getElementById("services").value.trim();
    const servicesDontOffer = document.getElementById("servicesDontOffer").value.trim();

    const plan = packageSelect.value;
    const planLabel = PLAN_LABELS[plan];
    const durationDays = Number(durationSelect.value);
    const amount = getAmount();

    if(!stageName || !phone || !email || !gender || !age || !town || !location || !meetingPlace || !preference || !bodyType || !services){
      throw new Error("Please fill all required fields marked with (*).");
    }

    if(!phone.startsWith("254") || phone.length < 12){
      throw new Error("Enter a valid phone number, for example 700123123 or 254700123123.");
    }

    if(age < 20){
      throw new Error("You must be at least 20 years old.");
    }

    const photo1 = document.getElementById("photo1").files[0];
    const photo2 = document.getElementById("photo2").files[0];
    const photo3 = document.getElementById("photo3").files[0];
    const photo4 = document.getElementById("photo4").files[0];
    const video1 = document.getElementById("video1").files[0];
    const video2 = document.getElementById("video2").files[0];

    if(!photo1 || !photo2 || !photo3 || !video1){
      throw new Error("Please upload at least 3 pictures and 1 video.");
    }

    const folder = `${slugify(stageName)}-${Date.now()}`;

    msg.innerText = "Uploading pictures...";

    const imageUrl = await uploadFile("profile-images", photo1, folder);
    const imageUrl2 = await uploadFile("profile-images", photo2, folder);
    const imageUrl3 = await uploadFile("profile-images", photo3, folder);
    const imageUrl4 = photo4 ? await uploadFile("profile-images", photo4, folder) : null;

    const gallery = [imageUrl,imageUrl2,imageUrl3,imageUrl4].filter(Boolean);

    msg.innerText = "Uploading videos...";

    let videoUrl1 = null;
    let videoUrl2 = null;

    try{
      videoUrl1 = await uploadFile("shorts", video1, folder);
    }catch{
      videoUrl1 = await uploadFile("profile-images", video1, folder);
    }

    if(video2){
      try{
        videoUrl2 = await uploadFile("shorts", video2, folder);
      }catch{
        videoUrl2 = await uploadFile("profile-images", video2, folder);
      }
    }

    msg.innerText = "Saving profile...";

    const now = new Date().toISOString();
    const expiryDate = addDays(now,durationDays);
    const profileSlug = `${slugify(stageName)}-${Date.now()}`;

    const profilePayload = {
      stage_name: stageName,
      name: stageName,
      slug: profileSlug,
      email,
      phone,
      whatsapp,
      gender,
      age,
      town,
      location,
      estate,
      body_type: bodyType,
      meeting_place: meetingPlace,
      preference,
      rate,
      services,
      services_dont_offer: servicesDontOffer,
      bio,

      image_url: imageUrl,
      photo_url: imageUrl,
      image_url_2: imageUrl2,
      image_url_3: imageUrl3,
      image_url_4: imageUrl4,
      gallery_images: gallery,
      gallery: gallery,

      short_url: videoUrl1,
      video_url: videoUrl1,
      short_video: videoUrl1,
      video_url_2: videoUrl2,

      package: planLabel,
      tier: planLabel,
      plan: plan,
      plan_label: planLabel,
      duration_days: durationDays,
      amount_paid: amount,
      expected_amount: amount,
      expires_at: expiryDate,

      payment_status: "pending",
      approved: false,
      is_expired: false,
      online: true,

      likes_count: 0,
      views_count: 0,
      views: 0,
      favorites: 0,
      whatsapp_clicks: 0,
      call_clicks: 0,
      profile_shares: 0,
      video_plays: 0,
      trending_score: 0,
      boost_score: 0,
      plan_rank: PLAN_RANKS[plan] || 1
    };

    const { data: profile, error: profileError } = await sb
      .from("profiles")
      .insert([profilePayload])
      .select()
      .single();

    if(profileError) throw profileError;

    msg.innerText = "Sending M-Pesa prompt...";

    const payRes = await fetch("/.netlify/functions/mpesa-stk-push",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        profile_id: profile.id,
        profile_name: stageName,
        phone,
        amount,
        plan,
        plan_label: planLabel,
        duration_days: durationDays,
        expires_at: expiryDate
      })
    });

    const payText = await payRes.text();

    let payData = {};
    try{
      payData = payText ? JSON.parse(payText) : {};
    }catch{
      throw new Error(payText || "Invalid payment server response");
    }

    if(!payRes.ok){
      throw new Error(payData.error || payData.message || "Payment failed");
    }

    msg.className = "msg success";
    msg.innerText = "M-Pesa prompt sent. Check your phone to complete payment.";
    payBtn.innerText = "Payment Prompt Sent";

  }catch(error){
    msg.className = "msg error";
    msg.innerText = error.message || "Something went wrong.";

    payBtn.disabled = false;
    payBtn.innerText = "Create Profile & Pay";
  }
});

applyURLPlan();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker
      .register("/sw.js")
      .catch(err=>console.error("PWA error:",err));
  });
}
</script>
