<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nairobi Sweets | Signup</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{background:#050816;color:#fff;font-family:Arial;padding:20px}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none}
button{background:#ffd54a;font-weight:bold}
</style>
</head>

<body>

<h2>Create Profile + Pay</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<input id="name" placeholder="Name">
<input id="phone" placeholder="2547XXXXXXXX">
<input id="location" placeholder="Location">

<input id="amount" value="1500">
<input type="file" id="image">

<button onclick="uploadImage()">Upload Image</button>
<button onclick="saveProfile()">Save Profile</button>
<button onclick="pay()">Create profile + Pay</button>

<div id="msg"></div>

<script>
const sb = supabase.createClient("YOUR_SUPABASE_URL","YOUR_SUPABASE_ANON_KEY");
let imageUrl=null;
let profileId=null;

async function auth(){
  const email=emailInput.value;
  const password=passwordInput.value;

  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(data?.user) return data.user;

  const res=await sb.auth.signUp({email,password});
  return res.data.user;
}

async function uploadImage(){
  const file=image.files[0];
  const name=Date.now()+"-"+file.name;
  await sb.storage.from("profile-images").upload(name,file,{upsert:true});
  const {data}=sb.storage.from("profile-images").getPublicUrl(name);
  imageUrl=data.publicUrl;
  msg.innerText="Image uploaded";
}

async function saveProfile(){
  const user=await auth();

  const {data}=await sb.from("profiles").insert([{
    owner_user_id:user.id,
    stage_name:name.value,
    phone:phone.value,
    location:location.value,
    profile_image_url:imageUrl,
    payment_status:"pending"
  }]).select().single();

  profileId=data.id;
  msg.innerText="Profile saved";
}

async function pay(){
  if(!profileId) await saveProfile();

  const res=await fetch("/.netlify/functions/mpesa-stk-push",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      profile_id:profileId,
      phone:phone.value,
      amount:amount.value
    })
  });

  const data=await res.json();
  msg.innerText=data.customerMessage || "STK sent";
}
</script>

</body>
</html>
