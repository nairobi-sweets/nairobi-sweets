<script>
  // ---------- helpers ----------
  function byId(id) {
    return document.getElementById(id);
  }

  function textValue(id) {
    const el = byId(id);
    if (!el) return "";
    return String(el.value ?? "").trim();
  }

  function nullableText(value) {
    const v = String(value ?? "").trim();
    return v === "" ? null : v;
  }

  function nullableInt(value) {
    const v = String(value ?? "").trim();
    if (v === "") return null;
    const n = Number(v);
    return Number.isInteger(n) ? n : null;
  }

  function nullableNumber(value) {
    const v = String(value ?? "").trim();
    if (v === "") return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function normalizePhone(phone) {
    let p = String(phone ?? "").replace(/\D/g, "");
    if (!p) return null;
    if (p.startsWith("0")) p = "254" + p.slice(1);
    if (p.startsWith("7") && p.length === 9) p = "254" + p;
    if (/^2547\d{8}$/.test(p)) return p;
    return p;
  }

  function slugify(value) {
    return String(value ?? "")
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  function sanitizeProfilePayload(raw) {
    const cleaned = {};

    for (const [key, value] of Object.entries(raw)) {
      // never send empty string into integer / numeric fields
      if (["id", "profile_id", "age"].includes(key)) {
        const n = nullableInt(value);
        if (n !== null) cleaned[key] = n;
        continue;
      }

      if (["amount"].includes(key)) {
        const n = nullableNumber(value);
        if (n !== null) cleaned[key] = n;
        continue;
      }

      if (typeof value === "string") {
        const trimmed = value.trim();
        cleaned[key] = trimmed === "" ? null : trimmed;
      } else if (value !== undefined) {
        cleaned[key] = value;
      }
    }

    return cleaned;
  }

  // ---------- build payload ----------
  function collectProfilePayload() {
    const rawId =
      textValue("profile_id") ||
      textValue("profileId") ||
      textValue("id");

    const rawDisplayName = textValue("display_name") || textValue("name");
    const rawSlug = textValue("slug");

    const raw = {
      // IMPORTANT: id is only included if valid integer
      id: rawId,

      display_name: rawDisplayName,
      whatsapp_name: textValue("whatsapp_name"),
      phone: normalizePhone(textValue("phone") || textValue("whatsapp_phone")),
      reminder_schedule: textValue("reminder_schedule"),
      location: textValue("location"),
      age: textValue("age"),
      plan: textValue("plan"),
      amount: textValue("amount"),
      slug: rawSlug || slugify(rawDisplayName),
      bio: textValue("bio"),

      // keep these only if your table already has them
      payment_status: "pending",
      status: "pending_review",
      updated_at: new Date().toISOString()
    };

    return sanitizeProfilePayload(raw);
  }

  // ---------- save profile ----------
  async function saveProfileDraft() {
    try {
      const payload = collectProfilePayload();

      if (!payload.display_name) {
        throw new Error("Display name is required.");
      }

      if (!payload.phone) {
        throw new Error("Phone is required.");
      }

      if (!payload.amount || payload.amount <= 0) {
        throw new Error("Amount is required.");
      }

      // IMPORTANT:
      // - for NEW profile: do NOT send id
      // - for EXISTING profile: update by id
      let result, error;

      if (payload.id) {
        const existingId = payload.id;
        const updatePayload = { ...payload };
        delete updatePayload.id;

        ({ data: result, error } = await supabase
          .from("profiles")
          .update(updatePayload)
          .eq("id", existingId)
          .select()
          .single());
      } else {
        const insertPayload = { ...payload };
        delete insertPayload.id;

        ({ data: result, error } = await supabase
          .from("profiles")
          .insert([insertPayload])
          .select()
          .single());
      }

      if (error) throw error;

      // save returned id back into hidden field if present
      if (result?.id) {
        if (byId("profile_id")) byId("profile_id").value = result.id;
        if (byId("profileId")) byId("profileId").value = result.id;
        if (byId("id")) byId("id").value = result.id;
      }

      return result;
    } catch (err) {
      console.error("PROFILE SAVE ERROR:", err);
      throw err;
    }
  }

  // ---------- create profile + pay ----------
  async function createProfileAndPay() {
    try {
      // 1. save profile first
      const profile = await saveProfileDraft();

      // 2. build payment payload
      const paymentPayload = {
        profile_id: profile?.id ?? null,
        phone: normalizePhone(textValue("phone") || textValue("whatsapp_phone")),
        amount: nullableNumber(textValue("amount")),
        name: textValue("display_name") || textValue("name"),
        plan: textValue("plan"),
        location: textValue("location"),
        slug: textValue("slug") || slugify(textValue("display_name") || textValue("name"))
      };

      const res = await fetch("/.netlify/functions/mpesa-stk-push", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(paymentPayload)
      });

      const data = await res.json();

      if (!res.ok) {
        console.error("STK PUSH ERROR:", data);
        throw new Error(data?.error || "STK push failed");
      }

      console.log("STK PUSH OK:", data);
      alert(data.customerMessage || "STK push sent. Check your phone.");
    } catch (err) {
      console.error(err);
      alert(err.message || "Something went wrong.");
    }
  }
</script>
