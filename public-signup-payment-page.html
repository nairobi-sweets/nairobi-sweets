<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Nairobi Sweets</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 30px;
      border-bottom: 1px solid #3b2f00;
      background: #000;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .brand img {
      width: 90px;
      height: auto;
    }
    h1 {
      color: #ffdb45;
      font-size: 54px;
      margin: 0;
    }
    .wrap {
      max-width: 980px;
      margin: 40px auto;
      padding: 30px;
      border: 1px solid #5b4700;
      border-radius: 28px;
      background: #111;
    }
    h2 {
      color: #ffdb45;
      font-size: 36px;
    }
    label {
      display: block;
      color: #ffdb45;
      font-weight: 900;
      margin: 18px 0 8px;
      font-size: 20px;
    }
    input, select, textarea {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid #444;
      background: #000;
      color: white;
      font-size: 18px;
    }
    textarea { min-height: 130px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }
    .files {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-top: 20px;
    }
    .preview {
      margin-top: 14px;
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px dashed #555;
      display: none;
    }
    .amount {
      margin-top: 26px;
      padding: 25px;
      border-radius: 18px;
      background: #302a12;
      color: #ffdb45;
      font-size: 34px;
      font-weight: 900;
    }
    button {
      width: 100%;
      margin-top: 28px;
      padding: 24px;
      border: none;
      border-radius: 40px;
      background: #ffdb45;
      color: black;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 22px;
      font-size: 22px;
      font-weight: 900;
    }
    .success { color: #22c55e; }
    .error { color: #ff4f86; }
    .note {
      color: #bbb;
      line-height: 1.6;
      margin-top: 20px;
    }
    footer {
      text-align: center;
      color: #888;
      padding: 40px;
    }
    @media(max-width: 800px) {
      h1 { font-size: 38px; }
      .grid, .files { grid-template-columns: 1fr; }
      .wrap { margin: 20px; padding: 22px; }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <img src="/assets/logo/logo-navbar.png" alt="Nairobi Sweets Logo">
    <h1>Nairobi Sweets</h1>
  </div>
</header>

<main class="wrap">
  <h2>Create Profile & Pay</h2>

  <p class="note">
    Fill your profile details, upload at least 3 photos and 1 short video, then pay by M-Pesa.
  </p>

  <form id="joinForm">

    <div class="grid">
      <div>
        <label>Stage Name *</label>
        <input id="stageName" required placeholder="Sweet" />
      </div>

      <div>
        <label>Email *</label>
        <input id="email" type="email" required placeholder="you@email.com" />
      </div>

      <div>
        <label>Phone *</label>
        <input id="phone" required placeholder="2547XXXXXXXX" />
      </div>

      <div>
        <label>Age *</label>
        <input id="age" type="number" min="20" required placeholder="22" />
      </div>

      <div>
        <label>Location *</label>
        <input id="location" required placeholder="Westlands" />
      </div>

      <div>
        <label>Body Type *</label>
        <select id="bodyType" required>
          <option value="">Select body type</option>
          <option>Petite</option>
          <option>Slim</option>
          <option>Thick</option>
          <option>Curvy</option>
          <option>Athletic</option>
          <option>BBW</option>
        </select>
      </div>

      <div>
        <label>Meeting Place *</label>
        <select id="meetingPlace" required>
          <option value="">Select</option>
          <option>In Call</option>
          <option>Out Call</option>
          <option>Both</option>
        </select>
      </div>

      <div>
        <label>Rate Optional</label>
        <input id="rate" placeholder="5,000" />
      </div>
    </div>

    <label>Services You Offer *</label>
    <textarea id="services" required placeholder="Massage, dinner date, companionship..."></textarea>

    <label>Bio *</label>
    <textarea id="bio" required placeholder="Short profile description"></textarea>

    <div class="files">
      <div>
        <label>Main Picture *</label>
        <input id="photo1" type="file" accept="image/*" required />
        <img id="preview1" class="preview">
      </div>

      <div>
        <label>Second Picture *</label>
        <input id="photo2" type="file" accept="image/*" required />
        <img id="preview2" class="preview">
      </div>

      <div>
        <label>Third Picture *</label>
        <input id="photo3" type="file" accept="image/*" required />
        <img id="preview3" class="preview">
      </div>

      <div>
        <label>Short Video *</label>
        <input id="shortVideo" type="file" accept="video/*" required />
      </div>
    </div>

    <label>Choose Package</label>
    <select id="package">
      <option value="Featured" data-amount="1000">Featured - KES 1000 / week</option>
      <option value="VIP" data-amount="1500" selected>VIP - KES 1500 / week</option>
      <option value="VVIP" data-amount="3000">VVIP - KES 3000 / week</option>
    </select>

    <div class="amount" id="amountBox">Amount: KES 1500</div>

    <button id="payBtn" type="submit">Create Profile & Pay</button>

    <div id="msg" class="msg"></div>
  </form>
</main>

<footer>
  © Nairobi Sweets
</footer>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRramx2eXludmd0aWpjY2l0dnZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDA4MzIsImV4cCI6MjA5MTExNjgzMn0.6wlZCQPJ2En4egpQUo5LAyQhee2hkCQ_tHGxfxbv1EQ";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("joinForm");
const msg = document.getElementById("msg");
const payBtn = document.getElementById("payBtn");
const packageSelect = document.getElementById("package");
const amountBox = document.getElementById("amountBox");

packageSelect.addEventListener("change", () => {
  const amount = packageSelect.selectedOptions[0].dataset.amount;
  amountBox.innerText = `Amount: KES ${amount}`;
});

function preview(inputId, imgId) {
  const input = document.getElementById(inputId);
  const img = document.getElementById(imgId);

  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;

    img.src = URL.createObjectURL(file);
    img.style.display = "block";
  });
}

preview("photo1", "preview1");
preview("photo2", "preview2");
preview("photo3", "preview3");

function cleanPhone(phone) {
  let p = String(phone || "").replace(/\D/g, "");

  if (p.startsWith("0")) p = "254" + p.slice(1);
  if (p.startsWith("7") || p.startsWith("1")) p = "254" + p;

  return p;
}

async function uploadFile(bucket, file, folder) {
  if (!file) return null;

  const ext = file.name.split(".").pop();
  const fileName = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

  const { error } = await sb.storage
    .from(bucket)
    .upload(fileName, file, {
      cacheControl: "3600",
      upsert: false
    });

  if (error) throw error;

  const { data } = sb.storage
    .from(bucket)
    .getPublicUrl(fileName);

  return data.publicUrl;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  msg.className = "msg";
  msg.innerText = "Creating profile...";

  payBtn.disabled = true;
  payBtn.innerText = "Processing...";

  try {
    const stageName = document.getElementById("stageName").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = cleanPhone(document.getElementById("phone").value);
    const age = Number(document.getElementById("age").value);
    const location = document.getElementById("location").value.trim();
    const bodyType = document.getElementById("bodyType").value;
    const meetingPlace = document.getElementById("meetingPlace").value;
    const rate = document.getElementById("rate").value.trim();
    const services = document.getElementById("services").value.trim();
    const bio = document.getElementById("bio").value.trim();

    const plan = packageSelect.value;
    const amount = Number(packageSelect.selectedOptions[0].dataset.amount);

    if (age < 20) {
      throw new Error("You must be at least 20 years old.");
    }

    const photo1 = document.getElementById("photo1").files[0];
    const photo2 = document.getElementById("photo2").files[0];
    const photo3 = document.getElementById("photo3").files[0];
    const shortVideo = document.getElementById("shortVideo").files[0];

    if (!photo1 || !photo2 || !photo3 || !shortVideo) {
      throw new Error("Please upload at least 3 pictures and 1 short video.");
    }

    msg.innerText = "Uploading photos...";

    const folder = `${stageName.replace(/\s+/g, "-").toLowerCase()}-${Date.now()}`;

    const imageUrl = await uploadFile("profile-images", photo1, folder);
    const imageUrl2 = await uploadFile("profile-images", photo2, folder);
    const imageUrl3 = await uploadFile("profile-images", photo3, folder);

    msg.innerText = "Uploading short video...";

    let shortUrl = null;

    try {
      shortUrl = await uploadFile("shorts", shortVideo, folder);
    } catch {
      shortUrl = await uploadFile("profile-images", shortVideo, folder);
    }

    msg.innerText = "Saving profile...";

    const profilePayload = {
      stage_name: stageName,
      name: stageName,
      email,
      phone,
      whatsapp: phone,
      age,
      location,
      body_type: bodyType,
      meeting_place: meetingPlace,
      rate,
      services,
      bio,
      image_url: imageUrl,
      photo_url: imageUrl,
      image_url_2: imageUrl2,
      image_url_3: imageUrl3,
      short_url: shortUrl,
      package: plan,
      tier: plan,
      plan,
      payment_status: "pending",
      approved: false,
      likes_count: 0,
      views_count: 0
    };

    const { data: profile, error: profileError } = await sb
      .from("profiles")
      .insert([profilePayload])
      .select()
      .single();

    if (profileError) throw profileError;

    msg.innerText = "Sending M-Pesa prompt...";

    const payRes = await fetch("/.netlify/functions/mpesa-stk-push", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        profile_id: profile.id,
        profile_name: stageName,
        phone,
        amount,
        plan
      })
    });

    const payText = await payRes.text();

    let payData = {};
    try {
      payData = payText ? JSON.parse(payText) : {};
    } catch {
      throw new Error(payText || "Invalid payment server response");
    }

    if (!payRes.ok) {
      throw new Error(payData.error || "Payment failed");
    }

    msg.className = "msg success";
    msg.innerText = "M-Pesa prompt sent. Check your phone.";
    payBtn.innerText = "Payment Prompt Sent";

  } catch (error) {
    msg.className = "msg error";
    msg.innerText = error.message || "Something went wrong.";

    payBtn.disabled = false;
    payBtn.innerText = "Create Profile & Pay";
  }
});
</script>

</body>
</html>
