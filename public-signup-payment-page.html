<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Profile & Pay | Nairobi Sweets</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:760px;
  margin:40px auto;
  padding:30px;
  background:#111;
  border:1px solid rgba(255,216,75,.35);
  border-radius:28px;
}

h1{
  color:#ffd84b;
  font-size:42px;
  margin-bottom:20px;
}

label{
  display:block;
  color:#ffd84b;
  font-weight:900;
  margin:18px 0 8px;
  font-size:20px;
}

input,textarea,select{
  width:100%;
  padding:18px;
  border-radius:16px;
  border:1px solid #444;
  background:#000;
  color:#fff;
  font-size:18px;
}

textarea{
  min-height:120px;
}

.amount{
  margin-top:22px;
  padding:22px;
  border-radius:18px;
  background:rgba(255,216,75,.14);
  color:#ffd84b;
  font-size:26px;
  font-weight:900;
}

button{
  width:100%;
  margin-top:24px;
  padding:22px;
  border:none;
  border-radius:999px;
  background:#ffd84b;
  color:#000;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.msg{
  margin-top:20px;
  color:#ff5c8a;
  font-size:20px;
  font-weight:900;
}

.success{
  color:#22c55e;
}
</style>
</head>

<body>

<div class="wrap">
  <h1>Create Profile & Pay</h1>

  <label>Stage Name</label>
  <input id="stageName" placeholder="Your name">

  <label>Phone</label>
  <input id="phone" placeholder="07XXXXXXXX">

  <label>Location</label>
  <input id="location" placeholder="Nairobi">

  <label>Photo URL</label>
  <input id="photoUrl" placeholder="Paste photo URL">

  <label>Bio</label>
  <textarea id="bio" placeholder="Short profile description"></textarea>

  <label>Package</label>
  <select id="package" onchange="updateAmount()">
    <option value="featured" data-amount="1000">Featured - KES 1000 / week</option>
    <option value="vip" data-amount="1500" selected>VIP - KES 1500 / week</option>
    <option value="vvip" data-amount="3000">VVIP / Signature - KES 3000 / week</option>
  </select>

  <div class="amount" id="amountBox">Amount: KES 1500</div>

  <button id="payBtn" onclick="createProfileAndPay()">
    Create Profile & Pay
  </button>

  <div class="msg" id="message"></div>
</div>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function getSelectedPackage(){
  const select = document.getElementById("package");
  const option = select.options[select.selectedIndex];

  return {
    plan: select.value,
    amount: Number(option.dataset.amount)
  };
}

function updateAmount(){
  const pkg = getSelectedPackage();
  document.getElementById("amountBox").innerText =
    "Amount: KES " + pkg.amount;
}

function normalizePhone(phone){
  let p = String(phone || "").replace(/\D/g,"");

  if(p.startsWith("0")){
    p = "254" + p.slice(1);
  }

  if(p.startsWith("7") || p.startsWith("1")){
    p = "254" + p;
  }

  return p;
}

async function safeJsonResponse(response){
  const rawText = await response.text();

  let result = {};

  try{
    result = rawText ? JSON.parse(rawText) : {};
  }catch(err){
    throw new Error("Payment server returned invalid response: " + rawText);
  }

  if(!response.ok){
    throw new Error(
      result.error ||
      result.message ||
      "Payment request failed"
    );
  }

  return result;
}

async function createProfileAndPay(){
  const btn = document.getElementById("payBtn");
  const msg = document.getElementById("message");

  msg.className = "msg";
  msg.innerText = "";

  const stageName = document.getElementById("stageName").value.trim();
  const rawPhone = document.getElementById("phone").value.trim();
  const phone = normalizePhone(rawPhone);
  const location = document.getElementById("location").value.trim();
  const photoUrl = document.getElementById("photoUrl").value.trim();
  const bio = document.getElementById("bio").value.trim();
  const pkg = getSelectedPackage();

  if(!stageName || !phone || !location){
    msg.innerText = "Please fill name, phone and location.";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Creating profile...";

  try{
    const profilePayload = {
      stage_name: stageName,
      phone: phone,
      whatsapp: phone,
      location: location,
      bio: bio,
      photo_url: photoUrl,
      image_url: photoUrl,
      plan: pkg.plan,
      approved: false,
      views_count: 0,
      likes_count: 0,
      payment_status: "pending"
    };

    const { data:profile, error:profileError } = await sb
      .from("profiles")
      .insert([profilePayload])
      .select()
      .single();

    if(profileError){
      throw new Error(profileError.message);
    }

    btn.innerText = "Sending M-Pesa prompt...";

    const response = await fetch("/.netlify/functions/mpesa-stk-push", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone: phone,
        amount: pkg.amount,
        profile_id: profile.id,
        plan: pkg.plan
      })
    });

    const result = await safeJsonResponse(response);

    msg.className = "msg success";
    msg.innerText =
      result.message ||
      "Profile created. Check your phone for the M-Pesa prompt.";

    btn.innerText = "Payment Prompt Sent";

  }catch(error){
    msg.className = "msg";
    msg.innerText = error.message || "Something went wrong.";
    btn.disabled = false;
    btn.innerText = "Create Profile & Pay";
  }
}

updateAmount();
</script>

</body>
</html>
