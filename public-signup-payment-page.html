<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function saveProfile() {
    try {

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const plan = document.getElementById("plan").value;

      if (!name || !phone) {
        alert("Fill all fields");
        return;
      }

      const { data, error } = await sb.from("profiles").insert([{
        stage_name: name,
        phone: phone,
        plan: plan,
        approval_status: "pending",
        payment_status: "unpaid"
      }]).select().single();

      if (error) {
        console.error(error);
        alert("Error saving profile");
        return;
      }

      // 🔥 CALL STK PUSH
      const res = await fetch("/.netlify/functions/mpesa-stk-push", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          phone,
          amount: getAmount(plan),
          profile_id: data.id
        })
      });

      const result = await res.json();

      if (!result.checkoutRequestID) {
        alert("Payment failed to start");
        return;
      }

      // 🚀 REDIRECT TO TRACKING
      window.location.href =
        `/payment-status.html?checkoutRequestID=${result.checkoutRequestID}`;

    } catch (err) {
      console.error("CRASH:", err);
      alert("Something broke. Check console.");
    }
  }

  function getAmount(plan) {
    if (plan === "featured") return 1000;
    if (plan === "vip") return 1500;
    if (plan === "signature") return 3000;
    return 0;
  }

  window.saveProfile = saveProfile;

});
</script>
