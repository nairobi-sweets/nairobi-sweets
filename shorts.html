<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nairobi Sweets Shorts</title>
<link rel="icon" href="/assets/logo/logo-badge.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 18px;
  background:linear-gradient(to bottom,rgba(0,0,0,.82),transparent);
}

.logo{
  color:#ffd54a;
  font-size:25px;
  font-weight:900;
}

.home{
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,213,74,.24);
  color:#fff;
  text-decoration:none;
  padding:10px 16px;
  border-radius:999px;
  font-weight:900;
  backdrop-filter:blur(12px);
}

.feed{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.feed::-webkit-scrollbar{display:none}

.short{
  height:100vh;
  position:relative;
  scroll-snap-align:start;
  background:#020617;
  overflow:hidden;
}

.short::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.72),transparent 38%);
  pointer-events:none;
}

.media{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.82),transparent 55%,rgba(0,0,0,.35));
}

.ai-badge{
  position:absolute;
  top:95px;
  left:18px;
  z-index:8;
  background:#ff1493;
  color:#fff;
  padding:10px 16px;
  border-radius:999px;
  font-weight:900;
  font-size:14px;
  box-shadow:0 0 25px rgba(255,0,128,.45);
}

.info{
  position:absolute;
  left:18px;
  right:90px;
  bottom:100px;
  z-index:8;
}

.badge{
  display:inline-block;
  background:#ffd54a;
  color:#000;
  padding:8px 14px;
  border-radius:999px;
  font-weight:900;
  margin-bottom:12px;
  font-size:14px;
}

.name{
  font-size:28px;
  font-weight:900;
  margin-bottom:10px;
  line-height:1.05;
  text-shadow:0 2px 20px rgba(0,0,0,.6);
}

.location{
  font-size:15px;
  color:#e5e7eb;
  margin-bottom:8px;
  line-height:1.35;
  font-weight:700;
}

.bio{
  font-size:14px;
  line-height:1.45;
  color:#d1d5db;
  max-width:96%;
}

.actions{
  position:absolute;
  right:14px;
  bottom:138px;
  z-index:9;
  display:grid;
  gap:14px;
}

.action{
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  text-decoration:none;
  font-size:22px;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 24px rgba(0,0,0,.35);
}

.whatsapp{
  background:#25D366;
}

.call{
  background:#ffd54a;
  color:#000;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:78px;
  background:rgba(0,0,0,.94);
  z-index:60;
  display:flex;
  align-items:center;
  justify-content:space-around;
  border-top:1px solid rgba(255,213,74,.12);
  backdrop-filter:blur(18px);
}

.bottom-nav a{
  color:#ffd54a;
  text-decoration:none;
  font-size:24px;
  opacity:.95;
  transition:.25s ease;
}

.bottom-nav a:hover{
  transform:translateY(-2px);
  opacity:1;
}

.loader,
.empty{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#ffd54a;
  font-size:22px;
  font-weight:900;
  padding:24px;
}

@media(max-width:700px){
  .logo{font-size:24px}
  .home{padding:10px 16px}
  .name{font-size:28px}
  .bottom-nav{height:82px}
  .bottom-nav a{font-size:24px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">🔥 Nairobi Shorts</div>
  <a href="/" class="home">Home</a>
</header>

<main class="feed" id="feed">
  <div class="loader">Loading shorts...</div>
</main>

<nav class="bottom-nav">
  <a href="/">🏠</a>
  <a href="/shorts.html">🔥</a>
  <a href="/join.html">➕</a>
  <a href="/login.html">👤</a>
</nav>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRramx2eXludmd0aWpjY2l0dnZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDA4MzIsImV4cCI6MjA5MTExNjgzMn0.6wlZCQPJ2En4egpQUo5LAyQhee2hkCQ_tHGxfxbv1EQ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const feed = document.getElementById("feed");

function safePhone(phone){
  let p = String(phone || "").replace(/\D/g,"");
  if(!p) return "";
  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
  return p;
}

function mediaUrl(p){
  return (
    p.video_url ||
    p.short_url ||
    p.reel_url ||
    p.photo_url ||
    p.image_url ||
    p.profile_photo ||
    p.main_photo ||
    p.photo ||
    p.image ||
    "/assets/logo/logo-badge.png"
  );
}

function isVideo(url){
  return /\.(mp4|webm|mov)$/i.test(String(url || ""));
}

function nameOf(p){
  return p.stage_name || p.name || p.full_name || "Verified Profile";
}

function locationOf(p){
  return p.location || p.town || p.area || "Nairobi";
}

function planOf(p){
  return String(p.plan || p.plan_name || p.package || p.tier || "").toLowerCase();
}

function badgeOf(p){
  const plan = planOf(p);
  if(plan.includes("vvip") || plan.includes("signature")) return "👑 VVIP Pick";
  if(plan.includes("vip")) return "👑 VIP Pick";
  return "🔥 Sweet Pick";
}

function aiBadge(p){
  const plan = planOf(p);
  const views = Number(p.views_count || p.views || 0);
  const likes = Number(p.likes_count || p.likes || 0);

  if(plan.includes("vip")) return "👑 VIP Energy";
  if(views > 1000) return "🔥 Trending";
  if(likes > 50) return "💋 Most Liked";
  return "✨ Sweet Pick";
}

function renderShort(p){
  const media = mediaUrl(p);
  const phone = safePhone(p.phone || p.whatsapp);
  const name = nameOf(p);

  const mediaTag = isVideo(media)
    ? `
      <video
        class="media"
        src="${media}"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
      ></video>
    `
    : `
      <img
        class="media"
        src="${media}"
        alt="${name}"
        onerror="this.src='/assets/logo/logo-badge.png'"
      >
    `;

  return `
    <section class="short">
      ${mediaTag}

      <div class="overlay"></div>

      <div class="ai-badge">
        ${aiBadge(p)}
      </div>

      <div class="info">
        <div class="badge">${badgeOf(p)}</div>
        <div class="name">${name}</div>
        <div class="location">📍 ${locationOf(p)} · 🟢 Online Now</div>
        <div class="bio">${p.bio || p.description || "Tap WhatsApp or call to connect."}</div>
      </div>

      <div class="actions">
        <a class="action" onclick="likeShort('${p.id}')">❤️</a>
        <a class="action">👁️</a>
        ${phone ? `<a class="action whatsapp" href="https://wa.me/${phone}" target="_blank" rel="noopener">💬</a>` : ""}
        ${phone ? `<a class="action call" href="tel:${phone}">☎</a>` : ""}
      </div>
    </section>
  `;
}

async function loadShorts(){
  const {data,error} = await sb
    .from("profiles")
    .select("*")
    .eq("approved",true)
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){
    feed.innerHTML = `<div class="empty">Supabase error: ${error.message}</div>`;
    return;
  }

  if(!data || !data.length){
    feed.innerHTML = `<div class="empty">No shorts yet. Add video_url, short_url, or profile photos in Supabase.</div>`;
    return;
  }

  const ranked = data.sort((a,b)=>{
    const scoreA = Number(a.likes_count || 0) * 3 + Number(a.views_count || 0);
    const scoreB = Number(b.likes_count || 0) * 3 + Number(b.views_count || 0);
    return scoreB - scoreA;
  });

  feed.innerHTML = ranked.map(renderShort).join("");
  observeVideos();
}

function observeVideos(){
  const videos = document.querySelectorAll("video");

  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.play().catch(()=>{});
      }else{
        entry.target.pause();
      }
    });
  },{threshold:.65});

  videos.forEach(video=>observer.observe(video));
}

async function likeShort(id){
  const {data} = await sb
    .from("profiles")
    .select("likes_count")
    .eq("id",id)
    .single();

  const likes = Number(data?.likes_count || 0) + 1;

  await sb
    .from("profiles")
    .update({likes_count:likes})
    .eq("id",id);
}

window.likeShort = likeShort;
loadShorts();
</script>

</body>
</html>
