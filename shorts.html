<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nairobi Sweets Shorts</title>

<link rel="icon" href="/assets/logo/logo-badge.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
.top{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);
}
.logo{
  color:#ffd54f;
  font-size:28px;
  font-weight:900;
}
.top a{
  color:white;
  text-decoration:none;
  background:rgba(255,255,255,.12);
  padding:10px 14px;
  border-radius:999px;
  font-weight:900;
}
.feed{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}
.feed::-webkit-scrollbar{display:none}
.short{
  height:100vh;
  width:100%;
  scroll-snap-align:start;
  position:relative;
  background:#050505;
}
.short-media{
  width:100%;
  height:100%;
  object-fit:cover;
}
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.85),transparent 55%,rgba(0,0,0,.35));
}
.info{
  position:absolute;
  left:18px;
  right:95px;
  bottom:95px;
  z-index:5;
}
.badge{
  display:inline-block;
  background:rgba(255,213,79,.95);
  color:#000;
  padding:8px 13px;
  border-radius:999px;
  font-weight:900;
  margin-bottom:12px;
}
.name{
  font-size:42px;
  font-weight:900;
  margin-bottom:10px;
}
.location{
  color:#e5e7eb;
  font-size:18px;
  margin-bottom:10px;
}
.bio{
  color:#d1d5db;
  line-height:1.5;
  font-size:16px;
}
.side-actions{
  position:absolute;
  right:14px;
  bottom:130px;
  z-index:6;
  display:grid;
  gap:16px;
}
.action{
  width:62px;
  height:62px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.18);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  text-decoration:none;
  backdrop-filter:blur(10px);
}
.action span{
  font-size:11px;
  display:block;
}
.whatsapp{background:#16a34a}
.call{background:#ffd54f;color:#000}
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  z-index:30;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(18px);
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  border-top:1px solid rgba(255,255,255,.12);
}
.bottom-nav a{
  color:#ffd54f;
  text-decoration:none;
  font-size:25px;
}
.empty{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  color:#ffd54f;
  font-size:24px;
  font-weight:900;
}
.loader{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffd54f;
  font-size:28px;
  font-weight:900;
}
</style>
</head>

<body>

<div class="top">
  <div class="logo">Nairobi Shorts</div>
  <a href="/">Home</a>
</div>

<main class="feed" id="feed">
  <div class="loader">Loading shorts...</div>
</main>

<nav class="bottom-nav">
  <a href="/">🏠</a>
  <a href="/shorts.html">🔥</a>
  <a href="/join.html">➕</a>
  <a href="/login.html">👤</a>
</nav>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_ANON_PUBLIC_KEY_HERE";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const feed = document.getElementById("feed");

function safePhone(phone){
  let p = String(phone || "").replace(/\\D/g,"");
  if(!p) return "";
  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
  return p;
}

function getMedia(profile){
  return (
    profile.short_url ||
    profile.video_url ||
    profile.photo_url ||
    profile.image_url ||
    profile.profile_photo ||
    profile.avatar_url ||
    profile.photo ||
    "/assets/logo/logo-badge.png"
  );
}

function isVideo(url){
  return String(url || "").match(/\\.(mp4|webm|mov)$/i);
}

function getName(profile){
  return profile.stage_name || profile.name || "Verified Profile";
}

function getBadge(profile){
  const plan = String(profile.plan || profile.package || profile.tier || "").toLowerCase();
  if(plan.includes("vvip") || plan.includes("signature")) return "👑 VVIP Pick";
  if(plan.includes("vip")) return "👑 VIP Pick";
  return "🔥 Sweet Pick";
}

function renderShort(profile){
  const media = getMedia(profile);
  const phone = safePhone(profile.phone || profile.whatsapp);

  const mediaTag = isVideo(media)
    ? `<video class="short-media" src="${media}" autoplay muted loop playsinline></video>`
    : `<img class="short-media" src="${media}" onerror="this.src='/assets/logo/logo-badge.png'">`;

  return `
    <section class="short">
      ${mediaTag}
      <div class="overlay"></div>

      <div class="info">
        <div class="badge">${getBadge(profile)}</div>
        <div class="name">${getName(profile)}</div>
        <div class="location">📍 ${profile.location || "Nairobi"} · 🟢 Online Now</div>
        <div class="bio">${profile.bio || "Tap WhatsApp or call to connect."}</div>
      </div>

      <div class="side-actions">
        <a class="action">❤️</a>
        <a class="action">👁️</a>
        ${phone ? `<a class="action whatsapp" href="https://wa.me/${phone}" target="_blank">💬</a>` : ""}
        ${phone ? `<a class="action call" href="tel:${phone}">☎</a>` : ""}
      </div>
    </section>
  `;
}

async function loadShorts(){
  const {data,error} = await sb
    .from("profiles")
    .select("*")
    .eq("approved",true)
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){
    feed.innerHTML = `<div class="empty">${error.message}</div>`;
    return;
  }

  if(!data || !data.length){
    feed.innerHTML = `<div class="empty">No shorts yet.</div>`;
    return;
  }

  feed.innerHTML = data.map(renderShort).join("");
}

loadShorts();
</script>

</body>
</html>
