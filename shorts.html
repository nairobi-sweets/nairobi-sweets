<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRramx2eXludmd0aWpjY2l0dnZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDA4MzIsImV4cCI6MjA5MTExNjgzMn0.6wlZCQPJ2En4egpQUo5LAyQhee2hkCQ_tHGxfxbv1EQ";
const SITE_URL = "https://nairobi-sweets.com";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const feed = document.getElementById("feed");
const viewedVideos = new Set();

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function safePhone(phone){
  let p = String(phone || "").replace(/\D/g,"");
  if(!p) return "";
  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
  return p;
}

function videoUrl(p){
  return String(
    p.short_video ||
    p.video_url ||
    p.short_url ||
    p.reel_url ||
    ""
  ).trim();
}

function posterUrl(p){
  return String(
    p.photo_url ||
    p.image_url ||
    p.profile_photo ||
    p.main_photo ||
    p.photo ||
    p.image ||
    "/assets/logo/logo-badge.png"
  ).trim();
}

function isPlayableVideo(url){
  const clean = String(url || "").split("?")[0].toLowerCase();
  return /\.(mp4|webm|mov|m4v)$/i.test(clean) || String(url || "").includes("supabase.co/storage/v1/object/public/");
}

function nameOf(p){
  return p.stage_name || p.name || p.full_name || "Verified Profile";
}

function locationOf(p){
  return p.location || p.town || p.area || "Nairobi";
}

function planOf(p){
  return String(p.plan || p.plan_name || p.package || p.tier || "featured").toLowerCase();
}

function isSignature(p){
  const plan = planOf(p);
  return Boolean(p.is_signature) || plan.includes("signature") || plan.includes("vvip");
}

function isVip(p){
  const plan = planOf(p);
  return plan.includes("vip") && !isSignature(p);
}

function profileUrl(p){
  const slug = String(p.slug || p.username || "").trim();
  if(slug && !["null","undefined","nan"].includes(slug.toLowerCase())){
    return `/profile.html?slug=${encodeURIComponent(slug)}`;
  }
  return `/profile.html?id=${encodeURIComponent(p.id)}`;
}

function badgeOf(p){
  if(isSignature(p)) return "👑 Signature Video";
  if(isVip(p)) return "⭐ VIP Video";
  if(p.verified) return "✔ Verified Video";
  return "🔥 Sweet Video";
}

function aiBadge(p){
  const views = Number(p.views_count || p.views || 0);
  const likes = Number(p.likes_count || p.likes || p.favorites || 0);
  const quality = Number(p.image_quality_score || 0);
  if(isSignature(p)) return "👑 Signature First";
  if(quality >= 75) return "📸 HD Pick";
  if(views > 1000) return "🔥 Trending";
  if(likes > 50) return "💋 Most Liked";
  if(p.verified) return "✔ Verified";
  return "✨ Sweet Pick";
}

function finalShortScore(p){
  const imageQuality = Number(p.image_quality_score || 0);
  const likes = Number(p.likes_count || p.likes || p.favorites || 0);
  const views = Number(p.views_count || p.views || 0);
  const boost = Number(p.boost_score || p.boost || 0);
  const verified = p.verified ? 100 : 0;
  const signatureBonus = isSignature(p) ? 500 : 0;
  const vipBonus = isVip(p) ? 220 : 0;
  const pinnedBonus = p.pinned_top ? 800 : 0;

  return (
    pinnedBonus +
    signatureBonus +
    vipBonus +
    imageQuality * 0.40 +
    likes * 0.20 +
    views * 0.15 +
    boost * 0.15 +
    verified * 0.10
  );
}

function whatsappMessage(p){
  return encodeURIComponent(`Hi ${nameOf(p)}, I found your Nairobi Sweets video short: ${SITE_URL}${profileUrl(p)}`);
}

function compact(text,max=118){
  const s = String(text || "Tap WhatsApp or call to connect.").trim();
  return s.length > max ? s.slice(0,max).trim() + "..." : s;
}

function renderShort(p){
  const video = videoUrl(p);
  if(!video || !isPlayableVideo(video)) return "";

  const phone = safePhone(p.phone || p.whatsapp);
  const name = escapeHTML(nameOf(p));
  const loc = escapeHTML(locationOf(p));
  const profileHref = profileUrl(p);
  const poster = escapeHTML(posterUrl(p));
  const quality = Number(p.image_quality_score || 0);
  const score = Math.round(finalShortScore(p));

  return `
    <section class="short" data-id="${escapeHTML(p.id)}" data-name="${name}" data-views="${Number(p.views_count || p.views || 0)}">
      <video
        class="media"
        src="${escapeHTML(video)}"
        poster="${poster}"
        muted
        loop
        playsinline
        preload="metadata"
        controlsList="nodownload"
        disablePictureInPicture
        oncontextmenu="return false"
      ></video>

      <div class="top-badges">
        <span class="pill pink">${aiBadge(p)}</span>
        <span class="pill gold">${badgeOf(p)}</span>
        ${p.verified ? `<span class="pill blue">✔ Verified</span>` : ``}
        ${quality >= 60 ? `<span class="pill dark">📸 HD ${quality}</span>` : ``}
      </div>

      <div class="info">
        <div class="name">${name}</div>
        <div class="location">📍 ${loc} · 🟢 Online Now · 🔥 ${score.toLocaleString()}</div>
        <div class="bio">${escapeHTML(compact(p.bio || p.description || p.about))}</div>
      </div>

      <div class="actions">
        <button class="action" onclick="likeShort('${escapeHTML(p.id)}')" title="Like">❤️</button>
        <a class="action profile" href="${profileHref}" title="Open profile">👤</a>
        ${phone ? `<a class="action whatsapp" href="https://wa.me/${phone}?text=${whatsappMessage(p)}" target="_blank" rel="noopener" onclick="trackContact('${escapeHTML(p.id)}','whatsapp_clicks')" title="WhatsApp">💬</a>` : ""}
        ${phone ? `<a class="action call" href="tel:+${phone}" onclick="trackContact('${escapeHTML(p.id)}','call_clicks')" title="Call">☎</a>` : ""}
      </div>

      <div class="sound-hint">Tap video for sound</div>
    </section>
  `;
}

async function trackEvent(profileId,eventType){
  try{
    await sb.from("profile_events").insert({
      profile_id:profileId,
      event_type:eventType,
      source_page:"/shorts.html",
      created_at:new Date().toISOString()
    });
  }catch(error){
    console.log("Event log skipped:",error.message);
  }
}

async function incrementProfileCounter(profileId,column){
  try{
    const { data } = await sb
      .from("profiles")
      .select(`${column}`)
      .eq("id",profileId)
      .maybeSingle();

    const next = Number(data?.[column] || 0) + 1;

    await sb
      .from("profiles")
      .update({[column]:next})
      .eq("id",profileId);

    return next;
  }catch(error){
    console.log("Counter update skipped:",error.message);
    return null;
  }
}

async function trackVideoView(profileId){
  if(!profileId || viewedVideos.has(String(profileId))) return;
  viewedVideos.add(String(profileId));

  await incrementProfileCounter(profileId,"views_count");
  await incrementProfileCounter(profileId,"views");
  await incrementProfileCounter(profileId,"video_plays");
  await trackEvent(profileId,"video_play");
}

async function trackContact(profileId,column){
  await incrementProfileCounter(profileId,column);
  await trackEvent(profileId,column === "whatsapp_clicks" ? "whatsapp" : "call");
}

async function likeShort(id){
  await incrementProfileCounter(id,"likes_count");
  await incrementProfileCounter(id,"likes");
  await trackEvent(id,"like");
}

function markVideoReady(video){
  const section = video.closest(".short");
  if(section) section.classList.add("ready");
}

function warmVideo(video,index){
  video.preload = index < 2 ? "auto" : "metadata";
  video.addEventListener("loadeddata",()=>markVideoReady(video),{once:true});
  video.addEventListener("canplay",()=>markVideoReady(video),{once:true});
  video.addEventListener("error",()=>{
    const section = video.closest(".short");
    if(section) section.classList.add("ready");
  },{once:true});
  if(video.readyState >= 2) markVideoReady(video);
}

function observeVideos(){
  const sections = document.querySelectorAll(".short");
  const videos = Array.from(document.querySelectorAll("video"));

  videos.forEach(warmVideo);

  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const section = entry.target;
      const video = section.querySelector("video");
      if(!video) return;

      if(entry.isIntersecting){
        videos.forEach(v=>{ if(v !== video){ v.pause(); v.muted = true; } });
        video.play().catch(()=>{});
        trackVideoView(section.dataset.id);
      }else{
        video.pause();
      }
    });
  },{threshold:.65,rootMargin:"80px 0px 80px 0px"});

  sections.forEach(section=>observer.observe(section));

  videos.forEach(video=>{
    video.addEventListener("click",()=>{
      videos.forEach(v=>{ if(v !== video) v.muted = true; });
      video.muted = !video.muted;
      video.play().catch(()=>{});
      const hint = video.closest(".short")?.querySelector(".sound-hint");
      if(hint) hint.textContent = video.muted ? "Tap video for sound" : "Sound on";
    });
  });
}

async function loadShorts(){
  feed.innerHTML = `<div class="loader">Loading video shorts...</div>`;

  const {data,error} = await sb
    .from("profiles")
    .select("*")
    .eq("approved",true)
    .or("is_expired.eq.false,is_expired.is.null")
    .limit(120);

  if(error){
    feed.innerHTML = `<div class="empty"><div class="empty-box">Supabase error<p>${escapeHTML(error.message)}</p></div></div>`;
    return;
  }

  const videoProfiles = (data || [])
    .filter(p => videoUrl(p) && isPlayableVideo(videoUrl(p)))
    .sort((a,b)=> finalShortScore(b) - finalShortScore(a));

  if(!videoProfiles.length){
    feed.innerHTML = `
      <div class="empty">
        <div class="empty-box">
          No video shorts yet.
          <p>Upload MP4/WebM/MOV videos into <strong>short_video</strong>, <strong>video_url</strong>, <strong>short_url</strong>, or <strong>reel_url</strong>. Photos are not shown in Shorts.</p>
          <a href="/join.html">Add a Video Profile</a>
        </div>
      </div>
    `;
    return;
  }

  feed.innerHTML = videoProfiles.map(renderShort).join("");
  observeVideos();
}

window.likeShort = likeShort;
window.trackContact = trackContact;

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    document.querySelectorAll("video").forEach(video=>video.pause());
  }else{
    document.querySelector(".short")?.querySelector("video")?.play().catch(()=>{});
  }
});

loadShorts();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("/sw.js").catch(()=>{});
  });
}
</script>
