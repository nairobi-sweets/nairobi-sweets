<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nairobi Sweets Shorts</title>
<link rel="icon" href="/assets/logo/logo-badge.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent)}
.logo{color:#ffd54a;font-size:26px;font-weight:900}
.home{background:rgba(0,0,0,.55);border:1px solid rgba(255,213,74,.25);color:#ffd54a;text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:900}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.feed::-webkit-scrollbar{display:none}
.short{height:100vh;position:relative;scroll-snap-align:start;background:#020617}
.media{width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),transparent 55%,rgba(0,0,0,.35))}
.info{position:absolute;left:18px;right:92px;bottom:105px;z-index:5}
.badge{display:inline-block;background:#ffd54a;color:#000;padding:8px 14px;border-radius:999px;font-weight:900;margin-bottom:12px}
.name{font-size:42px;font-weight:900;margin-bottom:10px}
.location{font-size:17px;color:#e5e7eb;margin-bottom:10px}
.bio{font-size:15px;line-height:1.5;color:#d1d5db}
.actions{position:absolute;right:14px;bottom:145px;z-index:6;display:grid;gap:14px}
.action{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;font-size:26px;backdrop-filter:blur(12px)}
.whatsapp{background:#25D366}
.call{background:#ffd54a;color:#000}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:86px;background:rgba(0,0,0,.94);z-index:60;display:flex;align-items:center;justify-content:space-around;border-top:1px solid rgba(255,213,74,.12)}
.bottom-nav a{color:#ffd54a;text-decoration:none;font-size:32px}
.loader,.empty{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffd54a;font-size:24px;font-weight:900;padding:24px}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">🔥 Nairobi Shorts</div>
  <a href="/" class="home">Home</a>
</header>

<main class="feed" id="feed">
  <div class="loader">Loading shorts...</div>
</main>

<nav class="bottom-nav">
  <a href="/">🏠</a>
  <a href="/shorts.html">🔥</a>
  <a href="/join.html">➕</a>
  <a href="/login.html">👤</a>
</nav>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_ANON_PUBLIC_KEY_HERE";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const feed = document.getElementById("feed");

function safePhone(phone){
  let p = String(phone || "").replace(/\D/g,"");
  if(!p) return "";
  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
  return p;
}

function mediaUrl(p){
  return p.short_url || p.video_url || p.reel_url || p.photo_url || p.image_url || p.profile_photo || p.photo || "/assets/logo/logo-badge.png";
}

function isVideo(url){
  return /\.(mp4|webm|mov)$/i.test(String(url || ""));
}

function nameOf(p){
  return p.stage_name || p.name || p.full_name || "Verified Profile";
}

function badgeOf(p){
  const plan = String(p.plan || p.plan_name || p.package || "").toLowerCase();
  if(plan.includes("vvip") || plan.includes("signature")) return "👑 VVIP";
  if(plan.includes("vip")) return "⭐ VIP";
  return "🔥 Sweet Pick";
}

function renderShort(p){
  const media = mediaUrl(p);
  const phone = safePhone(p.phone || p.whatsapp);

  const mediaTag = isVideo(media)
    ? `<video class="media" src="${media}" autoplay muted loop playsinline></video>`
    : `<img class="media" src="${media}" onerror="this.src='/assets/logo/logo-badge.png'">`;

  return `
    <section class="short">
      ${mediaTag}
      <div class="overlay"></div>

      <div class="info">
        <div class="badge">${badgeOf(p)}</div>
        <div class="name">${nameOf(p)}</div>
        <div class="location">📍 ${p.location || "Nairobi"} · 🟢 Online Now</div>
        <div class="bio">${p.bio || "Tap WhatsApp or call to connect."}</div>
      </div>

      <div class="actions">
        <a class="action" onclick="likeShort('${p.id}')">❤️</a>
        <a class="action">👁️</a>
        ${phone ? `<a class="action whatsapp" href="https://wa.me/${phone}" target="_blank">💬</a>` : ""}
        ${phone ? `<a class="action call" href="tel:${phone}">☎</a>` : ""}
      </div>
    </section>
  `;
}

async function loadShorts(){
  const {data,error} = await sb
    .from("profiles")
    .select("*")
    .eq("approved",true)
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){
    feed.innerHTML = `<div class="empty">Supabase error: ${error.message}</div>`;
    return;
  }

  if(!data || !data.length){
    feed.innerHTML = `<div class="empty">No shorts yet. Add video_url, short_url, or profile photos in Supabase.</div>`;
    return;
  }

  feed.innerHTML = data.map(renderShort).join("");
  observeVideos();
}

function observeVideos(){
  const videos = document.querySelectorAll("video");
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting) entry.target.play();
      else entry.target.pause();
    });
  },{threshold:.65});

  videos.forEach(video=>observer.observe(video));
}

async function likeShort(id){
  const {data} = await sb.from("profiles").select("likes_count").eq("id",id).single();
  const likes = Number(data?.likes_count || 0) + 1;
  await sb.from("profiles").update({likes_count:likes}).eq("id",id);
}

window.likeShort = likeShort;
loadShorts();
</script>

</body>
</html>
