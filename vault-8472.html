<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const els = {
  email: document.getElementById("email"),
  password: document.getElementById("password"),
  loginBtn: document.getElementById("loginBtn"),
  restoreBtn: document.getElementById("restoreBtn"),
  logoutBtn: document.getElementById("logoutBtn"),
  refreshBtn: document.getElementById("refreshBtn"),
  refreshLogsBtn: document.getElementById("refreshLogsBtn"),
  search: document.getElementById("search"),
  status: document.getElementById("status"),
  adminMeta: document.getElementById("adminMeta"),
  logsStatus: document.getElementById("logsStatus"),
  analyticsStatus: document.getElementById("analyticsStatus"),
  logActionFilter: document.getElementById("logActionFilter"),
  results: document.getElementById("results"),
  auditLogs: document.getElementById("auditLogs"),
  planBreakdown: document.getElementById("planBreakdown"),

  total: document.getElementById("totalCount"),
  pending: document.getElementById("pendingCount"),
  approved: document.getElementById("approvedCount"),
  paid: document.getElementById("paidCount"),
  unpaid: document.getElementById("unpaidCount"),

  paidRevenue: document.getElementById("paidRevenue"),
  unpaidRevenue: document.getElementById("unpaidRevenue"),
  paidProfilesCount: document.getElementById("paidProfilesCount"),
  unpaidProfilesCount: document.getElementById("unpaidProfilesCount"),
  topPlanName: document.getElementById("topPlanName"),

  tabs: Array.from(document.querySelectorAll(".tabs button"))
};

let currentFilter = "all";
let lastProfiles = [];

function setStatus(message, isError = false) {
  if (!els.status) return;
  els.status.textContent = message || "";
  els.status.style.color = isError ? "#ff9b9b" : "#d9e7ff";
}

function setAdminMeta(message, isError = false) {
  if (!els.adminMeta) return;
  els.adminMeta.textContent = message || "";
  els.adminMeta.style.color = isError ? "#ffb3b3" : "rgba(255,255,255,0.72)";
}

function setLogsStatus(message, isError = false) {
  if (!els.logsStatus) return;
  els.logsStatus.textContent = message || "";
  els.logsStatus.style.color = isError ? "#ffb3b3" : "rgba(255,255,255,0.72)";
}

function setAnalyticsStatus(message, isError = false) {
  if (!els.analyticsStatus) return;
  els.analyticsStatus.textContent = message || "";
  els.analyticsStatus.style.color = isError ? "#ffb3b3" : "rgba(255,255,255,0.72)";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function lc(value) {
  return String(value ?? "").trim().toLowerCase();
}

function formatDate(value) {
  if (!value) return "-";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleString();
}

function currency(value) {
  const num = Number(value) || 0;
  return "KES " + num.toLocaleString();
}

function shortMoney(value) {
  const num = Number(value);
  if (!Number.isFinite(num)) return "-";
  return "KES " + num.toLocaleString();
}

function prettyJson(value) {
  try {
    return JSON.stringify(value ?? null, null, 2);
  } catch {
    return String(value ?? "");
  }
}

function getNumericAmount(profile) {
  const candidates = [
    profile.amount,
    profile.plan_price,
    profile.price,
    profile.total_amount,
    profile.package_price
  ];

  for (const raw of candidates) {
    const cleaned = Number(String(raw ?? "").replace(/[^\d.-]/g, ""));
    if (Number.isFinite(cleaned) && cleaned > 0) return cleaned;
  }

  const planName = lc(profile.plan);
  if (planName.includes("featured")) return 1000;
  if (planName.includes("vip")) return 1500;
  if (planName.includes("vvip") || planName.includes("signature")) return 3000;

  return 0;
}

async function getAccessToken() {
  const { data, error } = await sb.auth.getSession();
  if (error) throw error;
  return data?.session?.access_token || null;
}

async function requireAccessToken() {
  const token = await getAccessToken();
  if (!token) {
    throw new Error("No active admin session. Please log in first.");
  }
  return token;
}

async function apiFetch(path, options = {}) {
  const token = await requireAccessToken();

  const res = await fetch(path, {
    ...options,
    headers: {
      Authorization: `Bearer ${token}`,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  const payload = await res.json().catch(() => ({}));

  if (!res.ok) {
    throw new Error(payload?.message || payload?.error || `HTTP ${res.status}`);
  }

  return payload;
}

function buildListUrl() {
  const qs = new URLSearchParams();
  const search = (els.search?.value || "").trim();

  qs.set("limit", "200");
  if (search) qs.set("search", search);
  if (currentFilter !== "all") qs.set("status", currentFilter);

  return `/.netlify/functions/admin-list-profiles?${qs.toString()}`;
}

function buildLogsUrl() {
  const qs = new URLSearchParams();
  qs.set("limit", "50");

  const action = (els.logActionFilter?.value || "").trim();
  if (action) qs.set("action", action);

  return `/.netlify/functions/admin-list-audit-logs?${qs.toString()}`;
}

function renderSummary(summary = {}) {
  if (els.total) els.total.textContent = String(summary.total ?? 0);
  if (els.pending) els.pending.textContent = String(summary.pending ?? 0);
  if (els.approved) els.approved.textContent = String(summary.approved ?? 0);
  if (els.paid) els.paid.textContent = String(summary.paid ?? 0);
  if (els.unpaid) els.unpaid.textContent = String(summary.unpaid ?? 0);
}

function renderAnalytics(rows = []) {
  const planMap = {};
  let paidRevenue = 0;
  let unpaidRevenue = 0;
  let paidProfiles = 0;
  let unpaidProfiles = 0;

  for (const row of rows) {
    const plan = String(row.plan || "Unassigned").trim() || "Unassigned";
    const amount = getNumericAmount(row);
    const payment = lc(row.payment_status);

    if (!planMap[plan]) {
      planMap[plan] = {
        plan,
        totalProfiles: 0,
        paidProfiles: 0,
        unpaidProfiles: 0,
        paidRevenue: 0,
        unpaidRevenue: 0,
        totalRevenuePotential: 0
      };
    }

    planMap[plan].totalProfiles += 1;
    planMap[plan].totalRevenuePotential += amount;

    if (payment === "paid") {
      paidRevenue += amount;
      paidProfiles += 1;
      planMap[plan].paidProfiles += 1;
      planMap[plan].paidRevenue += amount;
    } else {
      unpaidRevenue += amount;
      unpaidProfiles += 1;
      planMap[plan].unpaidProfiles += 1;
      planMap[plan].unpaidRevenue += amount;
    }
  }

  const plans = Object.values(planMap).sort((a, b) => {
    if (b.paidRevenue !== a.paidRevenue) return b.paidRevenue - a.paidRevenue;
    return b.totalProfiles - a.totalProfiles;
  });

  if (els.paidRevenue) els.paidRevenue.textContent = currency(paidRevenue);
  if (els.unpaidRevenue) els.unpaidRevenue.textContent = currency(unpaidRevenue);
  if (els.paidProfilesCount) els.paidProfilesCount.textContent = String(paidProfiles);
  if (els.unpaidProfilesCount) els.unpaidProfilesCount.textContent = String(unpaidProfiles);
  if (els.topPlanName) els.topPlanName.textContent = plans[0]?.plan || "-";

  if (!els.planBreakdown) return;

  if (!plans.length) {
    els.planBreakdown.innerHTML = `
      <div class="plan-card">
        <div class="plan-name">No plan data yet</div>
        <div class="plan-meta">Plan breakdown appears when profiles are loaded.</div>
      </div>
    `;
    setAnalyticsStatus("No profile data available for analytics.");
    return;
  }

  els.planBreakdown.innerHTML = plans.map((plan) => `
    <div class="plan-card">
      <div class="plan-name">${escapeHtml(plan.plan)}</div>
      <div class="chipbar">
        <span class="chip">Profiles: ${plan.totalProfiles}</span>
        <span class="chip">Paid: ${plan.paidProfiles}</span>
        <span class="chip">Unpaid: ${plan.unpaidProfiles}</span>
      </div>
      <div class="plan-meta">Paid revenue: ${escapeHtml(currency(plan.paidRevenue))}</div>
      <div class="plan-meta">Unpaid revenue: ${escapeHtml(currency(plan.unpaidRevenue))}</div>
      <div class="plan-meta">Potential total: ${escapeHtml(currency(plan.totalRevenuePotential))}</div>
    </div>
  `).join("");

  setAnalyticsStatus(`Analytics computed from ${rows.length} loaded profiles.`);
}

function renderEmpty(message = "No profiles found.") {
  if (!els.results) return;
  els.results.innerHTML = `
    <div class="empty">
      <strong>No profiles here yet</strong>
      <div class="muted">${escapeHtml(message)}</div>
    </div>
  `;
}

function renderError(message) {
  if (!els.results) return;
  els.results.innerHTML = `
    <div class="error-box">
      <strong>Load failed</strong>
      <div class="muted">${escapeHtml(message || "Unknown error")}</div>
    </div>
  `;
}

function renderProfiles(rows = []) {
  if (!Array.isArray(rows) || !rows.length) {
    renderEmpty("Try another filter or search term.");
    return;
  }

  els.results.innerHTML = `
    <div class="grid">
      ${rows.map((p) => {
        const id = p.id || "";
        const name = p.stage_name || p.full_name || p.name || "Unnamed profile";
        const approval = p.approval_status || "pending";
        const payment = p.payment_status || "unpaid";
        const phone = p.phone || "-";
        const email = p.email || "-";
        const plan = p.plan || "-";
        const createdAt = formatDate(p.created_at);
        const updatedAt = formatDate(p.updated_at);
        const amount = p.amount || p.price || p.plan_price || getNumericAmount(p);
        const city = p.city || "-";
        const category = p.category || p.service_type || "-";
        const image = p.photo_url || p.image_url || p.avatar_url || "";

        return `
          <div class="card">
            <div class="title-row">
              <div>
                <div class="name">${escapeHtml(name)}</div>
                <div class="chipbar">
                  <span class="chip">Approval: ${escapeHtml(approval)}</span>
                  <span class="chip">Payment: ${escapeHtml(payment)}</span>
                  ${plan ? `<span class="chip">Plan: ${escapeHtml(plan)}</span>` : ""}
                </div>
              </div>
              <div class="status">${escapeHtml(approval)} / ${escapeHtml(payment)}</div>
            </div>

            ${image ? `
              <div style="margin: 12px 0;">
                <img src="${escapeHtml(image)}" alt="${escapeHtml(name)}" style="width:100%; max-height:240px; object-fit:cover; border-radius:14px; border:1px solid rgba(255,255,255,0.08);" />
              </div>
            ` : ""}

            <div class="meta">
              <div><strong>Phone:</strong> ${escapeHtml(phone)}</div>
              <div><strong>Email:</strong> ${escapeHtml(email)}</div>
              <div><strong>Plan:</strong> ${escapeHtml(plan)}</div>
              <div><strong>Amount:</strong> ${escapeHtml(shortMoney(amount))}</div>
              <div><strong>Category:</strong> ${escapeHtml(category)}</div>
              <div><strong>City:</strong> ${escapeHtml(city)}</div>
              <div><strong>Created:</strong> ${escapeHtml(createdAt)}</div>
              <div><strong>Updated:</strong> ${escapeHtml(updatedAt)}</div>
            </div>

            <div class="card-actions">
              <button class="btn-green" onclick="approveProfile('${escapeHtml(id)}')">Approve</button>
              <button class="btn-blue" onclick="togglePayment('${escapeHtml(id)}', '${escapeHtml(payment)}')">
                ${lc(payment) === "paid" ? "Mark Unpaid" : "Mark Paid"}
              </button>
              <button class="btn-red" onclick="deleteProfile('${escapeHtml(id)}', '${escapeHtml(name)}')">Delete</button>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderAuditLogs(logs = []) {
  if (!els.auditLogs) return;

  if (!Array.isArray(logs) || !logs.length) {
    els.auditLogs.innerHTML = `
      <div class="empty" style="margin-top:14px;">
        <strong>No audit logs yet</strong>
        <div class="muted">When admins touch records, the footprints will show up here.</div>
      </div>
    `;
    return;
  }

  els.auditLogs.innerHTML = `
    <div class="logs-grid">
      ${logs.map((log) => {
        const action = log.action || "unknown_action";
        const adminEmail = log.admin_email || "-";
        const targetLabel = log.target_label || "-";
        const targetId = log.target_id || "-";
        const createdAt = formatDate(log.created_at);
        const source = log.meta?.source || "-";

        return `
          <div class="log-card">
            <div class="log-head">
              <div class="log-action">${escapeHtml(action)}</div>
              <div class="log-time">${escapeHtml(createdAt)}</div>
            </div>

            <div class="chipbar">
              <span class="chip">Admin: ${escapeHtml(adminEmail)}</span>
              <span class="chip">Target: ${escapeHtml(targetLabel)}</span>
              <span class="chip">ID: ${escapeHtml(targetId)}</span>
              <span class="chip">Source: ${escapeHtml(source)}</span>
            </div>

            <div class="log-meta">
              <div><strong>Table:</strong> ${escapeHtml(log.target_table || "-")}</div>
              <div><strong>Action:</strong> ${escapeHtml(action)}</div>
            </div>

            <details>
              <summary>Before</summary>
              <pre class="log-json">${escapeHtml(prettyJson(log.before_data))}</pre>
            </details>

            <details>
              <summary>After</summary>
              <pre class="log-json">${escapeHtml(prettyJson(log.after_data))}</pre>
            </details>

            <details>
              <summary>Meta</summary>
              <pre class="log-json">${escapeHtml(prettyJson(log.meta))}</pre>
            </details>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

async function loginAdmin() {
  try {
    const email = (els.email?.value || "").trim();
    const password = els.password?.value || "";

    if (!email || !password) {
      setStatus("Enter admin email and password.", true);
      return;
    }

    setStatus("Signing in...");
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (!data?.session) throw new Error("Login returned no session.");

    setStatus("Login successful.");
    await Promise.all([loadProfiles(), loadAuditLogs()]);
  } catch (err) {
    console.error("login error:", err);
    setStatus(err.message || "Login failed.", true);
  }
}

async function restoreSession() {
  try {
    setStatus("Restoring session...");
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;

    if (!data?.session) {
      setStatus("No saved session found.", true);
      setAdminMeta("Waiting for valid admin session...", true);
      setLogsStatus("Logs unavailable until admin session is active.", true);
      setAnalyticsStatus("Analytics unavailable until profiles load.", true);
      return;
    }

    setStatus("Session restored.");
    await Promise.all([loadProfiles(), loadAuditLogs()]);
  } catch (err) {
    console.error("restore session error:", err);
    setStatus(err.message || "Could not restore session.", true);
  }
}

async function logoutAdmin() {
  try {
    await sb.auth.signOut();
    lastProfiles = [];
    renderSummary({});
    renderAnalytics([]);
    if (els.results) els.results.innerHTML = "";
    if (els.auditLogs) els.auditLogs.innerHTML = "";
    setStatus("Logged out.");
    setAdminMeta("Waiting for valid admin session...");
    setLogsStatus("Audit stream idle.");
  } catch (err) {
    console.error("logout error:", err);
    setStatus(err.message || "Logout failed.", true);
  }
}

async function loadProfiles() {
  try {
    setStatus("Loading profiles...");
    const payload = await apiFetch(buildListUrl(), { method: "GET" });

    lastProfiles = payload.profiles || [];
    renderSummary(payload.summary || {});
    renderAnalytics(lastProfiles);
    renderProfiles(lastProfiles);

    const adminEmail = payload?.admin?.email || "admin";
    const source = payload?.admin?.source || "unknown";
    setAdminMeta(`Logged in as ${adminEmail}. Admin source: ${source}.`);
    setStatus(`Loaded ${payload?.summary?.total ?? 0} profiles.`);
  } catch (err) {
    console.error("loadProfiles error:", err);
    lastProfiles = [];
    renderSummary({});
    renderAnalytics([]);
    renderError(err.message || "Failed to load profiles.");
    setAdminMeta("Admin session missing or not authorized.", true);
    setStatus(err.message || "Load failed.", true);
  }
}

async function loadAuditLogs() {
  try {
    setLogsStatus("Loading audit logs...");
    const payload = await apiFetch(buildLogsUrl(), { method: "GET" });
    renderAuditLogs(payload.logs || []);
    setLogsStatus(`Loaded ${(payload.logs || []).length} audit logs.`);
  } catch (err) {
    console.error("loadAuditLogs error:", err);
    if (els.auditLogs) {
      els.auditLogs.innerHTML = `
        <div class="error-box" style="margin-top:14px;">
          <strong>Audit log load failed</strong>
          <div class="muted">${escapeHtml(err.message || "Unknown error")}</div>
        </div>
      `;
    }
    setLogsStatus(err.message || "Failed to load audit logs.", true);
  }
}

async function approveProfile(profileId) {
  try {
    if (!profileId) throw new Error("Missing profile id.");
    setStatus("Approving profile...");

    await apiFetch("/.netlify/functions/admin-approve-profile", {
      method: "POST",
      body: JSON.stringify({
        profile_id: profileId,
        approval_status: "approved"
      })
    });

    setStatus("Profile approved.");
    await Promise.all([loadProfiles(), loadAuditLogs()]);
  } catch (err) {
    console.error("approveProfile error:", err);
    setStatus(err.message || "Approval failed.", true);
  }
}

async function togglePayment(profileId, currentPaymentStatus) {
  try {
    if (!profileId) throw new Error("Missing profile id.");

    const nextStatus = lc(currentPaymentStatus) === "paid" ? "unpaid" : "paid";
    setStatus(`Updating payment to ${nextStatus}...`);

    await apiFetch("/.netlify/functions/admin-toggle-payment", {
      method: "POST",
      body: JSON.stringify({
        profile_id: profileId,
        payment_status: nextStatus
      })
    });

    setStatus(`Payment marked ${nextStatus}.`);
    await Promise.all([loadProfiles(), loadAuditLogs()]);
  } catch (err) {
    console.error("togglePayment error:", err);
    setStatus(err.message || "Payment update failed.", true);
  }
}

async function deleteProfile(profileId, profileName) {
  try {
    if (!profileId) throw new Error("Missing profile id.");

    const ok = window.confirm(`Delete "${profileName || "this profile"}"? This cannot be undone.`);
    if (!ok) return;

    setStatus("Deleting profile...");

    await apiFetch("/.netlify/functions/admin-delete-profile", {
      method: "POST",
      body: JSON.stringify({
        profile_id: profileId
      })
    });

    setStatus("Profile deleted.");
    await Promise.all([loadProfiles(), loadAuditLogs()]);
  } catch (err) {
    console.error("deleteProfile error:", err);
    setStatus(err.message || "Delete failed.", true);
  }
}

function setFilter(filterValue) {
  currentFilter = filterValue;
  if (els.tabs?.length) {
    els.tabs.forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.filter === filterValue);
    });
  }
  loadProfiles();
}

let searchTimer = null;
if (els.search) {
  els.search.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadProfiles(), 300);
  });
}

if (els.logActionFilter) {
  els.logActionFilter.addEventListener("change", loadAuditLogs);
}

if (els.tabs?.length) {
  els.tabs.forEach((btn) => {
    btn.addEventListener("click", () => setFilter(btn.dataset.filter));
  });
}

if (els.loginBtn) els.loginBtn.addEventListener("click", loginAdmin);
if (els.restoreBtn) els.restoreBtn.addEventListener("click", restoreSession);
if (els.logoutBtn) els.logoutBtn.addEventListener("click", logoutAdmin);
if (els.refreshBtn) {
  els.refreshBtn.addEventListener("click", () => Promise.all([loadProfiles(), loadAuditLogs()]));
}
if (els.refreshLogsBtn) els.refreshLogsBtn.addEventListener("click", loadAuditLogs);

sb.auth.onAuthStateChange((_event, session) => {
  if (session) {
    setStatus("Authenticated.");
  }
});

window.approveProfile = approveProfile;
window.togglePayment = togglePayment;
window.deleteProfile = deleteProfile;

// Auto-restore on page load
window.addEventListener("DOMContentLoaded", async () => {
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;
    if (data?.session) {
      setStatus("Session found. Loading vault...");
      await Promise.all([loadProfiles(), loadAuditLogs()]);
    } else {
      setStatus("Not logged in.");
      setAdminMeta("Waiting for valid admin session...");
      setLogsStatus("Audit stream idle.");
      setAnalyticsStatus("Analytics will appear when profiles load.");
    }
  } catch (err) {
    console.error("initial session restore error:", err);
    setStatus("Could not restore session.", true);
  }
});
</script>
