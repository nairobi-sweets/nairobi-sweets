<section class="admin-add-profile">

  <h2>Add New Profile</h2>

  <div class="admin-form-grid">

    <input
      id="newName"
      type="text"
      placeholder="Stage Name"
    >

    <input
      id="newPhone"
      type="text"
      placeholder="Phone Number"
    >

    <input
      id="newLocation"
      type="text"
      placeholder="Location"
    >

    <input
      id="newPhoto"
      type="text"
      placeholder="Photo URL"
    >

    <input
      id="newViews"
      type="number"
      placeholder="Starting Views"
      value="0"
    >

    <input
      id="newLikes"
      type="number"
      placeholder="Starting Likes"
      value="0"
    >

    <select id="newTier">
      <option value="Featured">Featured</option>
      <option value="VIP">VIP</option>
      <option value="VVIP">VVIP</option>
    </select>

    <textarea
      id="newBio"
      placeholder="Bio / Description"
    ></textarea>

  </div>

  <button onclick="addProfile()" class="add-btn">
    Add Profile
  </button>

</section>

<script>

async function addProfile(){

  const stage_name =
    document.getElementById("newName").value.trim();

  const phone =
    document.getElementById("newPhone").value.trim();

  const location =
    document.getElementById("newLocation").value.trim();

  const photo =
    document.getElementById("newPhoto").value.trim();

  const tier =
    document.getElementById("newTier").value;

  const bio =
    document.getElementById("newBio").value.trim();

  const views =
    Number(document.getElementById("newViews").value || 0);

  const likes =
    Number(document.getElementById("newLikes").value || 0);

  if(!stage_name || !phone || !location || !photo){

    alert("Fill all required fields");
    return;

  }

  const payload = {

    stage_name: stage_name,

    phone: phone,

    whatsapp: phone,

    location: location,

    photo_url: photo,

    image_url: photo,

    bio: bio,

    tier: tier,

    views_count: views,

    likes_count: likes,

    approved: true

  };

  const { error } = await sb
    .from("profiles")
    .insert([payload]);

  if(error){

    console.error(error);

    alert(error.message);

    return;

  }

  alert("✅ Profile Added");

  location.reload();

}

</script>

<style>

.admin-add-profile{

  background:#07113a;

  border:1px solid rgba(255,215,0,.25);

  border-radius:30px;

  padding:30px;

  margin-bottom:40px;

}

.admin-add-profile h2{

  color:white;

  font-size:42px;

  margin-bottom:30px;

  font-weight:800;

}

.admin-form-grid{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:18px;

}

.admin-form-grid input,
.admin-form-grid select,
.admin-form-grid textarea{

  width:100%;

  background:#0d1845;

  border:1px solid rgba(255,255,255,.12);

  color:white;

  border-radius:22px;

  padding:20px;

  font-size:18px;

  outline:none;

}

.admin-form-grid textarea{

  min-height:140px;

  grid-column:1/-1;

  resize:none;

}

.add-btn{

  margin-top:25px;

  background:#16d45c;

  color:black;

  border:none;

  padding:18px 40px;

  border-radius:18px;

  font-size:20px;

  font-weight:800;

  cursor:pointer;

}

.add-btn:hover{

  transform:translateY(-2px);

}

@media(max-width:1200px){

  .admin-form-grid{

    grid-template-columns:repeat(2,1fr);

  }

}

@media(max-width:700px){

  .admin-form-grid{

    grid-template-columns:1fr;

  }

}

</style>
