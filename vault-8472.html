<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nairobi Sweets Admin Vault</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#070a18;
  color:white;
}

header{
  padding:35px;
  background:#000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,216,75,.25);
}

h1{
  color:#ffd84b;
  margin:0;
  font-size:42px;
}

button,input,select,textarea{
  padding:16px;
  border-radius:14px;
  border:none;
  font-weight:900;
  font-size:16px;
}

input,select,textarea{
  width:100%;
  background:#111827;
  color:white;
  border:1px solid rgba(255,255,255,.18);
}

textarea{
  min-height:95px;
  font-family:monospace;
}

.admin-box{
  max-width:1500px;
  margin:32px auto;
  padding:25px;
  background:#0d1226;
  border-radius:26px;
  border:1px solid rgba(255,216,75,.2);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
}

.add-btn{background:#22c55e;color:#001b09}
.refresh{background:#ffd84b;color:#000}
.upload-btn{background:#38bdf8;color:#00111f}

.grid{
  max-width:1500px;
  margin:auto;
  padding:25px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:24px;
}

.card{
  background:#101326;
  border:1px solid rgba(255,216,75,.2);
  border-radius:24px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  background:#111;
}

.content{padding:18px}

.name{
  font-size:28px;
  font-weight:900;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(255,216,75,.14);
  color:#ffd84b;
  border:1px solid rgba(255,216,75,.35);
  margin-bottom:12px;
}

.info{
  line-height:1.6;
  color:#e5e7eb;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.approve{background:#22c55e;color:#001b09}
.hide{background:#ff4770;color:white}
.save{background:#38bdf8;color:#00111f}
.reset{background:#ffd84b;color:#000}
.delete{background:#ef4444;color:white;grid-column:1/3}
.vip{background:#fb923c;color:#000}
.vvip{background:linear-gradient(135deg,#ff3d7f,#8b5cf6);color:white}

.status{
  max-width:1500px;
  margin:10px auto;
  color:#ffd84b;
  padding:0 25px;
  font-weight:900;
}

.preview{
  margin-top:12px;
  width:120px;
  height:120px;
  border-radius:18px;
  object-fit:cover;
  display:none;
  border:2px solid #ffd84b;
}
</style>
</head>

<body>

<header>
  <h1>Nairobi Sweets Vault</h1>
  <button onclick="loadProfiles()" class="refresh">Refresh</button>
</header>

<section class="admin-box">
  <h2>Add New Profile</h2>

  <div class="form-grid">
    <input id="newName" placeholder="Stage name">
    <input id="newPhone" placeholder="Phone">
    <input id="newLocation" placeholder="Location / Area">
    <input id="newCity" placeholder="City" value="Nairobi">

    <div>
      <input id="newPhoto" placeholder="Photo URL will appear here">
      <br><br>
      <input type="file" id="photoUpload" accept="image/*" onchange="uploadAdminPhoto()">
      <img id="photoPreview" class="preview">
    </div>

    <select id="newTier">
      <option value="featured">Featured</option>
      <option value="vip">VIP</option>
      <option value="vvip">VVIP / Signature</option>
    </select>
  </div>

  <br>
  <textarea id="newBio" placeholder="Bio / description"></textarea>
  <br><br>

  <button onclick="addProfile()" class="add-btn">Add Profile</button>
</section>

<section class="admin-box">
  <h2>Search Profiles</h2>
  <input id="searchBox" placeholder="Search by name, phone, location..." oninput="renderProfiles()">
</section>

<div id="status" class="status">Loading profiles...</div>
<main id="profilesGrid" class="grid"></main>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let profiles = [];

const grid = document.getElementById("profilesGrid");
const statusBox = document.getElementById("status");

function img(p){
  return p.photo_url || p.image_url || p.profile_photo || p.avatar_url || p.photo || "assets/logo/logo-badge.png";
}

function nameOf(p){
  return p.stage_name || p.name || p.full_name || "Unnamed Profile";
}

function tierOf(p){
  const t = String(p.tier || "").toLowerCase();
  if(p.is_vvip || t === "vvip" || t === "signature") return "VVIP / Signature";
  if(p.is_vip || t === "vip") return "VIP";
  return "Featured";
}

async function uploadAdminPhoto(){
  const fileInput = document.getElementById("photoUpload");
  const preview = document.getElementById("photoPreview");

  if(!fileInput.files.length) return;

  const file = fileInput.files[0];
  const fileExt = file.name.split(".").pop();
  const fileName = Date.now() + "-" + Math.random().toString(36).substring(2) + "." + fileExt;
  const filePath = fileName;

  statusBox.textContent = "Uploading photo...";

  const { error: uploadError } = await sb.storage
    .from("profile-images")
    .upload(filePath, file, {
      cacheControl: "3600",
      upsert: false
    });

  if(uploadError){
    alert(uploadError.message);
    statusBox.textContent = "Upload failed";
    return;
  }

  const { data } = sb.storage
    .from("profile-images")
    .getPublicUrl(filePath);

  document.getElementById("newPhoto").value = data.publicUrl;

  preview.src = data.publicUrl;
  preview.style.display = "block";

  statusBox.textContent = "Photo uploaded successfully";
}

async function loadProfiles(){
  statusBox.textContent = "Loading profiles...";

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .order("created_at", { ascending:false });

  if(error){
    statusBox.textContent = error.message;
    return;
  }

  profiles = data || [];
  statusBox.textContent = `${profiles.length} profiles loaded`;
  renderProfiles();
}

function renderProfiles(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();

  let list = [...profiles];

  if(q){
    list = list.filter(p => {
      return [
        nameOf(p),
        p.phone,
        p.whatsapp,
        p.location,
        p.area,
        p.city,
        p.bio
      ].join(" ").toLowerCase().includes(q);
    });
  }

  grid.innerHTML = list.map(p => `
    <article class="card">
      <img src="${img(p)}" onerror="this.src='assets/logo/logo-badge.png'">

      <div class="content">
        <div class="name">${nameOf(p)}</div>
        <div class="badge">${tierOf(p)}</div>

        <div class="info">
          📍 ${p.location || p.area || p.city || "Nairobi"}<br>
          📞 ${p.phone || p.whatsapp || "No phone"}<br>
          ❤️ ${p.likes_count || 0} likes · 👁️ ${p.views_count || 0} views<br>
          Status: ${p.approved ? "Approved" : "Pending/Hidden"}
        </div>

        <br>
        <textarea id="photo-${p.id}">${img(p)}</textarea>

        <div class="actions">
          <button class="approve" onclick="approveProfile(${p.id})">Approve</button>
          <button class="hide" onclick="hideProfile(${p.id})">Hide</button>
          <button class="save" onclick="savePhoto(${p.id})">Save Photo</button>
          <button class="reset" onclick="resetStats(${p.id})">Reset Stats</button>
          <button class="vip" onclick="upgradeVIP(${p.id})">VIP</button>
          <button class="vvip" onclick="upgradeVVIP(${p.id})">VVIP</button>
          <button class="delete" onclick="deleteProfile(${p.id})">Delete Profile</button>
        </div>
      </div>
    </article>
  `).join("");
}

async function approveProfile(id){
  const { error } = await sb.from("profiles").update({
    approved:true,
    subscription_status:"active"
  }).eq("id",id);

  if(error) return alert(error.message);
  await loadProfiles();
}

async function hideProfile(id){
  const { error } = await sb.from("profiles").update({
    approved:false
  }).eq("id",id);

  if(error) return alert(error.message);
  await loadProfiles();
}

async function savePhoto(id){
  const photo = document.getElementById(`photo-${id}`).value.trim();

  const { error } = await sb.from("profiles").update({
    photo_url:photo,
    image_url:photo
  }).eq("id",id);

  if(error) return alert(error.message);
  alert("Photo saved");
  await loadProfiles();
}

async function resetStats(id){
  const { error } = await sb.from("profiles").update({
    views_count:0,
    likes_count:0
  }).eq("id",id);

  if(error) return alert(error.message);
  await loadProfiles();
}

async function upgradeVIP(id){
  const { error } = await sb.from("profiles").update({
    tier:"vip",
    is_vip:true,
    is_vvip:false,
    is_featured:false
  }).eq("id",id);

  if(error) return alert(error.message);
  await loadProfiles();
}

async function upgradeVVIP(id){
  const { error } = await sb.from("profiles").update({
    tier:"vvip",
    is_vvip:true,
    is_vip:false,
    is_featured:false
  }).eq("id",id);

  if(error) return alert(error.message);
  await loadProfiles();
}

async function addProfile(){
  const payload = {
    stage_name:document.getElementById("newName").value.trim(),
    phone:document.getElementById("newPhone").value.trim(),
    whatsapp:document.getElementById("newPhone").value.trim(),
    location:document.getElementById("newLocation").value.trim(),
    area:document.getElementById("newLocation").value.trim(),
    city:document.getElementById("newCity").value.trim() || "Nairobi",
    photo_url:document.getElementById("newPhoto").value.trim(),
    bio:document.getElementById("newBio").value.trim(),
    tier:document.getElementById("newTier").value
  };

  const res = await fetch("/.netlify/functions/admin-add-profile",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(payload)
  });

  const data = await res.json();

  if(!data.success){
    alert(data.error || "Add failed");
    return;
  }

  alert("Profile added");

  document.getElementById("newName").value = "";
  document.getElementById("newPhone").value = "";
  document.getElementById("newLocation").value = "";
  document.getElementById("newPhoto").value = "";
  document.getElementById("newBio").value = "";
  document.getElementById("photoUpload").value = "";
  document.getElementById("photoPreview").style.display = "none";

  await loadProfiles();
}

async function deleteProfile(id){
  if(!confirm("Delete this profile permanently?")) return;

  const res = await fetch("/.netlify/functions/admin-delete-profile",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ id })
  });

  const data = await res.json();

  if(!data.success){
    alert(data.error || "Delete failed");
    return;
  }

  alert("Profile deleted");
  await loadProfiles();
}

loadProfiles();
</script>

</body>
</html>
