<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nairobi Sweets Admin Vault</title>

<style>
:root{
  --bg:#0b0f2c;
  --panel:#11163a;
  --panel-2:#18204f;
  --text:#ffffff;
  --muted:rgba(255,255,255,0.7);
  --gold:#ffd84b;
  --green:#28c76f;
  --red:#ff4d4f;
  --line:rgba(255,255,255,0.08);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px;
}

h1{
  margin:0 0 20px;
  font-size:42px;
}

.panel{
  background:var(--panel);
  border-radius:14px;
  padding:16px;
  margin-bottom:18px;
  border:1px solid var(--line);
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}

input{
  padding:12px;
  border-radius:10px;
  border:none;
  min-width:220px;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn-gold{background:var(--gold);}
.btn-red{background:var(--red); color:#fff;}
.btn-dark{background:#222; color:#fff;}

.tabs button{
  background:#222;
  color:#fff;
}

.tabs .active{
  background:var(--gold);
  color:#000;
}

.stats{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:12px;
}

.stat{
  background:var(--panel-2);
  padding:12px;
  border-radius:10px;
  min-width:120px;
}

.card{
  background:var(--panel-2);
  padding:14px;
  border-radius:12px;
  margin-top:14px;
}

.title-row{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

.name{font-size:18px; font-weight:bold;}
.meta{font-size:13px; color:var(--muted); margin-top:4px;}

.status{
  font-size:12px;
  padding:4px 10px;
  border-radius:999px;
  background:rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<h1>Admin Vault</h1>

<div class="panel">
  <div class="row">
    <input id="email" placeholder="Admin email"/>
    <input id="password" type="password" placeholder="Password"/>
    <button id="loginBtn" class="btn-gold">Login</button>
    <button id="restoreBtn" class="btn-dark">Restore Session</button>
    <button id="logoutBtn" class="btn-red">Logout</button>
  </div>
  <div id="status" style="margin-top:10px;"></div>
</div>

<div class="panel">
  <div class="row">
    <button id="refreshBtn" class="btn-gold">Refresh</button>
    <input id="search" placeholder="Search by name, phone, plan..." />
  </div>

  <div class="tabs row" style="margin-top:10px;">
    <button onclick="setFilter('all')" class="active">All</button>
    <button onclick="setFilter('pending')">Pending</button>
    <button onclick="setFilter('approved')">Approved</button>
    <button onclick="setFilter('paid')">Paid</button>
    <button onclick="setFilter('unpaid')">Unpaid</button>
  </div>

  <div class="stats">
    <div class="stat">Total<br><b id="totalCount">0</b></div>
    <div class="stat">Pending<br><b id="pendingCount">0</b></div>
    <div class="stat">Approved<br><b id="approvedCount">0</b></div>
    <div class="stat">Paid<br><b id="paidCount">0</b></div>
    <div class="stat">Unpaid<br><b id="unpaidCount">0</b></div>
  </div>
</div>

<div id="results"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentFilter = "all";

const el = (id)=>document.getElementById(id);

function setStatus(msg, err=false){
  el("status").textContent = msg;
  el("status").style.color = err ? "#ff9b9b" : "#d9e7ff";
}

async function getToken(){
  const {data} = await sb.auth.getSession();
  return data?.session?.access_token;
}

async function login(){
  const email = el("email").value;
  const password = el("password").value;

  const {error} = await sb.auth.signInWithPassword({email,password});
  if(error) return setStatus(error.message,true);

  setStatus("Login successful");
  load();
}

async function load(){
  try{
    setStatus("Loading...");
    const token = await getToken();
    if(!token) throw new Error("Not logged in");

    let url = "/.netlify/functions/admin-list-profiles?limit=200";

    const search = el("search").value.trim();
    if(search) url += `&search=${encodeURIComponent(search)}`;
    if(currentFilter!=="all") url += `&status=${currentFilter}`;

    const res = await fetch(url,{
      headers:{Authorization:`Bearer ${token}`}
    });

    const data = await res.json();

    if(!res.ok) throw new Error(data.message||data.error);

    render(data.profiles);
    stats(data.summary);

    setStatus("Loaded "+data.summary.total+" profiles");
  }catch(e){
    setStatus(e.message,true);
    el("results").innerHTML = `<div class="card">${e.message}</div>`;
  }
}

function stats(s){
  el("totalCount").textContent = s.total;
  el("pendingCount").textContent = s.pending;
  el("approvedCount").textContent = s.approved;
  el("paidCount").textContent = s.paid;
  el("unpaidCount").textContent = s.unpaid;
}

function render(list){
  el("results").innerHTML = list.map(p=>{
    return `
    <div class="card">
      <div class="title-row">
        <div class="name">${p.stage_name||p.name||"Unnamed"}</div>
        <div class="status">${p.approval_status} / ${p.payment_status}</div>
      </div>
      <div class="meta">Phone: ${p.phone||"-"}</div>
      <div class="meta">Plan: ${p.plan||"-"}</div>
    </div>
    `;
  }).join("");
}

function setFilter(f){
  currentFilter=f;
  load();
}

document.getElementById("loginBtn").onclick=login;
document.getElementById("restoreBtn").onclick=load;
document.getElementById("logoutBtn").onclick=()=>sb.auth.signOut();
document.getElementById("refreshBtn").onclick=load;

el("search").addEventListener("input", ()=>{
  clearTimeout(window.t);
  window.t=setTimeout(load,300);
});
</script>

</body>
</html>
