<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vault Admin | Nairobi Sweets</title>
  <link rel="icon" type="image/png" href="/assets/logo/logo-badge.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{
      min-height:100vh;
      color:#f8fafc;
      background:
        radial-gradient(circle at 10% 0%, rgba(236,72,153,.10), transparent 22%),
        radial-gradient(circle at 90% 10%, rgba(250,204,21,.08), transparent 24%),
        linear-gradient(180deg, #060812, #0b1020 55%, #070a12);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .glass{
      background:rgba(9,14,28,.74);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:0 22px 60px rgba(0,0,0,.30);
    }
    .input, .select{
      width:100%;
      padding:14px 16px;
      border-radius:18px;
      background:rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.08);
      color:white;
      outline:none;
    }
    .btn{
      border-radius:16px;
      transition:.18s ease;
    }
    .btn:hover{ transform:translateY(-1px); filter:brightness(1.05); }
    .btn-gold{
      background:linear-gradient(135deg,#facc15,#f59e0b);
      color:#111827;
      font-weight:800;
    }
    .btn-dark{
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.08);
      color:white;
    }
    .btn-pink{
      background:linear-gradient(135deg,#ec4899,#db2777);
      color:white;
      font-weight:700;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border-radius:999px;
      padding:7px 11px;
      font-size:11px;
      font-weight:800;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.05);
    }
    .table-wrap{
      overflow:auto;
      border-radius:24px;
    }
    table{
      width:100%;
      border-collapse:collapse;
      min-width:1100px;
    }
    th, td{
      padding:14px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
      text-align:left;
      vertical-align:top;
    }
    th{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#cbd5e1;
    }
  </style>
</head>
<body>
  <header class="sticky top-0 z-40 border-b border-white/10 bg-[#080a12]/85 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <a href="/index.html" class="flex items-center gap-3">
        <img src="/assets/logo/logo-badge.png" alt="Nairobi Sweets" class="w-11 h-11 rounded-full object-cover">
        <div>
          <div class="text-xs uppercase tracking-[0.22em] text-pink-200">Enterprise admin</div>
          <div class="text-2xl font-extrabold text-yellow-300 leading-none">Vault</div>
        </div>
      </a>
      <div class="flex gap-2">
        <a href="/index.html" class="btn btn-dark px-4 py-2 text-sm">Home</a>
        <button id="logoutBtn" class="btn btn-gold px-4 py-2 text-sm">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10">
    <section class="grid md:grid-cols-4 gap-4 mb-6">
      <div class="glass rounded-[26px] p-5">
        <div class="text-xs text-slate-400">Profiles</div>
        <div id="statProfiles" class="text-3xl font-black text-yellow-300 mt-2">0</div>
      </div>
      <div class="glass rounded-[26px] p-5">
        <div class="text-xs text-slate-400">Pending payments</div>
        <div id="statPending" class="text-3xl font-black text-pink-300 mt-2">0</div>
      </div>
      <div class="glass rounded-[26px] p-5">
        <div class="text-xs text-slate-400">Active online</div>
        <div id="statOnline" class="text-3xl font-black text-green-300 mt-2">0</div>
      </div>
      <div class="glass rounded-[26px] p-5">
        <div class="text-xs text-slate-400">Signature</div>
        <div id="statSignature" class="text-3xl font-black text-yellow-200 mt-2">0</div>
      </div>
    </section>

    <section class="glass rounded-[30px] p-6 mb-6">
      <div class="grid md:grid-cols-[1fr_220px_220px_180px] gap-4">
        <input id="searchInput" class="input" placeholder="Search by name, email, location, payment status">
        <select id="planFilter" class="select">
          <option value="">All plans</option>
          <option value="featured">Featured</option>
          <option value="vip">VIP</option>
          <option value="signature">Signature</option>
        </select>
        <select id="paymentFilter" class="select">
          <option value="">All payments</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="approved">Approved</option>
        </select>
        <button id="refreshBtn" class="btn btn-dark px-4 py-3">Refresh</button>
      </div>
      <p id="msg" class="text-sm text-slate-300 mt-4"></p>
    </section>

    <section class="glass rounded-[30px] p-4 md:p-6">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Profile</th>
              <th>Plan</th>
              <th>Status</th>
              <th>Contact</th>
              <th>Badges</th>
              <th>Admin Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://dkjlvyynvgtijccitvvd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm';
    const OWNER_EMAIL = 'nairobisweets05@gmail.com';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProfiles = [];

    function esc(v){
      return String(v ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    async function requireOwner(){
      const { data } = await supabaseClient.auth.getSession();
      const email = data.session?.user?.email || '';
      if(!data.session || email.toLowerCase() !== OWNER_EMAIL.toLowerCase()){
        window.location.href = '/login.html';
        return false;
      }
      return true;
    }

    function renderStats(list){
      document.getElementById('statProfiles').textContent = list.length;
      document.getElementById('statPending').textContent = list.filter(p => (p.payment_status || '').toLowerCase() === 'pending').length;
      document.getElementById('statOnline').textContent = list.filter(p => p.is_online).length;
      document.getElementById('statSignature').textContent = list.filter(p => p.is_vvip || p.plan === 'signature' || p.category === 'signature').length;
    }

    function getBadges(p){
      const badges = [];
      if(p.is_vvip || p.plan === 'signature' || p.category === 'signature') badges.push('<span class="chip">👑 Signature</span>');
      if(p.is_vip || p.plan === 'vip' || p.category === 'vip') badges.push('<span class="chip">VIP</span>');
      if(p.is_featured || p.plan === 'featured' || p.category === 'featured') badges.push('<span class="chip">Featured</span>');
      if(p.is_verified) badges.push('<span class="chip">Verified</span>');
      if(p.is_online) badges.push('<span class="chip">Online</span>');
      return badges.join(' ');
    }

    function renderRows(list){
      const tbody = document.getElementById('rows');
      if(!list.length){
        tbody.innerHTML = '<tr><td colspan="6" class="text-slate-400">No profiles found.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(p => `
        <tr>
          <td>
            <div class="flex gap-3">
              <img src="${esc(p.profile_image_url || p.image_url || '/assets/logo/logo-badge.png')}" alt="" class="w-14 h-14 rounded-2xl object-cover border border-white/10">
              <div>
                <div class="font-bold text-white">${esc(p.stage_name || p.name || 'Unnamed')}</div>
                <div class="text-sm text-slate-400">${esc(p.email || '')}</div>
                <div class="text-sm text-slate-400">${esc(p.location || '')}</div>
              </div>
            </div>
          </td>
          <td>
            <div class="font-semibold">${esc(p.plan || p.category || '-')}</div>
            <div class="text-sm text-slate-400">KES ${Number(p.price_per_week || 0)}</div>
          </td>
          <td>
            <div class="font-semibold">${esc(p.payment_status || 'pending')}</div>
            <div class="text-sm text-slate-400">${p.is_online ? 'Live' : 'Offline'}</div>
          </td>
          <td>
            <div class="text-sm">${esc(p.phone || '')}</div>
            <div class="text-sm text-slate-400">${esc(p.whatsapp || '')}</div>
          </td>
          <td>${getBadges(p)}</td>
          <td>
            <div class="flex flex-wrap gap-2">
              <button class="btn btn-gold px-3 py-2 text-xs" onclick="approvePayment('${p.id}')">Approve</button>
              <button class="btn btn-dark px-3 py-2 text-xs" onclick="setPlan('${p.id}','featured')">Featured</button>
              <button class="btn btn-dark px-3 py-2 text-xs" onclick="setPlan('${p.id}','vip')">VIP</button>
              <button class="btn btn-dark px-3 py-2 text-xs" onclick="setPlan('${p.id}','signature')">Signature</button>
              <button class="btn btn-pink px-3 py-2 text-xs" onclick="toggleOnline('${p.id}', ${p.is_online ? 'false' : 'true'})">${p.is_online ? 'Take Offline' : 'Go Live'}</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function applyFilters(){
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const planFilter = document.getElementById('planFilter').value;
      const paymentFilter = document.getElementById('paymentFilter').value;

      const filtered = allProfiles.filter(p => {
        const hay = [
          p.stage_name, p.name, p.email, p.location, p.payment_status, p.plan, p.category
        ].join(' ').toLowerCase();

        if(search && !hay.includes(search)) return false;
        if(planFilter && (p.plan || p.category) !== planFilter) return false;
        if(paymentFilter && (p.payment_status || '').toLowerCase() !== paymentFilter) return false;
        return true;
      });

      renderStats(filtered);
      renderRows(filtered);
    }

    async function loadProfiles(){
      const msg = document.getElementById('msg');
      msg.textContent = 'Loading profiles...';

      const { data, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .order('id', { ascending: false });

      if(error){
        msg.textContent = error.message;
        return;
      }

      allProfiles = data || [];
      applyFilters();
      msg.textContent = `${allProfiles.length} profiles loaded.`;
    }

    async function setPlan(id, plan){
      const patch = {
        plan,
        category: plan,
        is_featured: plan === 'featured',
        is_vip: plan === 'vip',
        is_vvip: plan === 'signature',
        price_per_week: plan === 'featured' ? 1000 : plan === 'vip' ? 1500 : 3000
      };

      const { error } = await supabaseClient.from('profiles').update(patch).eq('id', id);
      document.getElementById('msg').textContent = error ? error.message : 'Plan updated.';
      await loadProfiles();
    }

    async function toggleOnline(id, state){
      const { error } = await supabaseClient
        .from('profiles')
        .update({ is_online: state === true || state === 'true' })
        .eq('id', id);

      document.getElementById('msg').textContent = error ? error.message : 'Online status updated.';
      await loadProfiles();
    }

    async function approvePayment(id){
      const msg = document.getElementById('msg');
      msg.textContent = 'Approving payment...';

      try{
        const res = await fetch('/.netlify/functions/admin-approve-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profile_id: id })
        });

        const data = await res.json().catch(() => ({}));

        if(!res.ok) throw new Error(data.error || 'Approval failed.');

        msg.textContent = data.message || 'Payment approved.';
        await loadProfiles();
      }catch(err){
        msg.textContent = err.message || 'Approval failed.';
      }
    }

    async function logout(){
      await supabaseClient.auth.signOut();
      window.location.href = '/login.html';
    }

    window.setPlan = setPlan;
    window.toggleOnline = toggleOnline;
    window.approvePayment = approvePayment;

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('planFilter').addEventListener('change', applyFilters);
    document.getElementById('paymentFilter').addEventListener('change', applyFilters);
    document.getElementById('refreshBtn').addEventListener('click', loadProfiles);
    document.getElementById('logoutBtn').addEventListener('click', logout);

    (async () => {
      const ok = await requireOwner();
      if(ok) loadProfiles();
    })();
  </script>
</body>
</html>
