<!DOCTYPE html>
<html>
<head>
  <title>Nairobi Sweets Admin Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial;
      background:#0b0f2c;
      color:#fff;
      padding:20px;
    }

    h1 { margin-bottom:10px; }

    .topbar {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    input, button, select {
      padding:10px;
      border-radius:8px;
      border:none;
    }

    button {
      cursor:pointer;
      font-weight:bold;
    }

    .btn-gold { background:#ffd84b; color:#000; }
    .btn-green { background:#28c76f; }
    .btn-red { background:#ff4d4f; }

    .card {
      background:#11163a;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
    }

    .row {
      display:flex;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .status {
      font-size:12px;
      opacity:.7;
    }

    .tabs button {
      background:#222;
    }

    .tabs .active {
      background:#ffd84b;
      color:#000;
    }
  </style>
</head>

<body>

<h1>Admin Vault</h1>

<div class="topbar">
  <input id="token" placeholder="Paste ADMIN_APPROVAL_TOKEN" />
  <button onclick="saveToken()">Save Token</button>
  <button onclick="load()">Refresh</button>
</div>

<div class="tabs">
  <button onclick="setFilter('all')" id="tab-all">All</button>
  <button onclick="setFilter('pending')" id="tab-pending">Pending</button>
  <button onclick="setFilter('approved')" id="tab-approved">Approved</button>
</div>

<br>

<input id="search" placeholder="Search..." oninput="render()" />

<div id="list"></div>

<script>
const ADMIN_KEY = "vault_admin_token";
let profiles = [];
let filter = "all";

function saveToken(){
  localStorage.setItem(ADMIN_KEY, token.value.trim());
  alert("Token saved");
}

function getToken(){
  return localStorage.getItem(ADMIN_KEY) || "";
}

function setFilter(f){
  filter = f;

  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+f).classList.add("active");

  render();
}

async function load(){
  const token = getToken();

  if(!token){
    alert("Set admin token first");
    return;
  }

  list.innerHTML = "Loading...";

  const res = await fetch("/.netlify/functions/admin-list-profiles",{
    headers:{ Authorization:`Bearer ${token}` }
  });

  const json = await res.json();

  if(!json.ok){
    list.innerHTML = "Error: "+json.error;
    return;
  }

  profiles = json.profiles || [];
  render();
}

function render(){
  const q = search.value.toLowerCase();

  let filtered = profiles.filter(p=>{
    const approved = p.is_approved;

    if(filter==="pending" && approved) return false;
    if(filter==="approved" && !approved) return false;

    const text = JSON.stringify(p).toLowerCase();
    return text.includes(q);
  });

  if(!filtered.length){
    list.innerHTML = "<p>No profiles</p>";
    return;
  }

  list.innerHTML = filtered.map(p=>`
    <div class="card">

      <div class="row">
        <b>${p.stage_name || "Unnamed"}</b>
        <span class="status">
          ${p.is_approved ? "APPROVED" : "PENDING"}
        </span>
      </div>

      <div>${p.phone || ""}</div>
      <div>${p.membership_plan || ""}</div>
      <div>${p.payment_status || ""}</div>

      <br>

      <button class="btn-green" onclick="approve('${p.id}')">
        Approve
      </button>

      <button class="btn-red" onclick="unapprove('${p.id}')">
        Unapprove
      </button>

    </div>
  `).join("");
}

async function approve(id){
  await update(id,"approve");
}

async function unapprove(id){
  await update(id,"unapprove");
}

async function update(id,action){
  const token = getToken();

  const res = await fetch("/.netlify/functions/admin-approve-profile",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:`Bearer ${token}`
    },
    body:JSON.stringify({ profileId:id, action })
  });

  const json = await res.json();

  if(!json.ok){
    alert(json.error);
    return;
  }

  load();
}
</script>

</body>
</html>
