<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Forgot Password | Nairobi Sweets</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/assets/css/v5-phase3.css">
</head>

<body class="min-h-screen bg-[#060812] text-white flex items-center justify-center p-4">

<div class="w-full max-w-md bg-[#090e1c] border border-white/10 rounded-[28px] p-7 text-center">
  <img src="/assets/logo/logo-badge.png" class="w-16 h-16 rounded-full mx-auto mb-4" onerror="this.style.display='none'">

  <p class="text-pink-200 text-xs uppercase tracking-[.25em]">Account Recovery</p>
  <h1 class="text-3xl font-black text-yellow-300 mt-2">Forgot Password</h1>
  <p class="text-slate-400 text-sm mt-2">Enter your username. We will send a reset link to your email.</p>

  <input id="username" class="w-full mt-6 p-4 rounded-2xl bg-black/30 border border-white/10 outline-none"
         placeholder="Username">

  <button id="sendBtn" class="w-full mt-4 p-4 rounded-2xl font-black bg-yellow-400 text-black">
    Send Reset Link
  </button>

  <a href="/login.html" class="block mt-4 text-yellow-300 text-sm">Back to Login</a>

  <p id="msg" class="text-sm mt-4 text-slate-300"></p>
</div>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const usernameInput = document.getElementById("username");
const sendBtn = document.getElementById("sendBtn");
const msg = document.getElementById("msg");

function showMsg(text, type="normal"){
  msg.textContent = text;
  msg.className =
    "text-sm mt-4 " +
    (type === "error" ? "text-pink-300" :
     type === "success" ? "text-green-300" :
     "text-slate-300");
}

sendBtn.addEventListener("click", async () => {
  const username = usernameInput.value.trim().toLowerCase();

  if(!username){
    showMsg("Enter your username first.", "error");
    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = "Sending...";
  showMsg("Finding your account...");

  try{
    const { data: profile, error: profileError } = await sb
      .from("profiles")
      .select("email")
      .eq("username", username)
      .maybeSingle();

    if(profileError) throw profileError;
    if(!profile?.email) throw new Error("Username not found.");

    const { error } = await sb.auth.resetPasswordForEmail(profile.email, {
      redirectTo: `${window.location.origin}/reset-password.html`
    });

    if(error) throw error;

    showMsg("Reset link sent. Check your email inbox.", "success");

  }catch(error){
    showMsg(error.message || "Failed to send reset link.", "error");
  }finally{
    sendBtn.disabled = false;
    sendBtn.textContent = "Send Reset Link";
  }
});
</script>

<script src="/assets/js/v5-phase3.js" defer></script>
</body>
</html>
