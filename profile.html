<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nairobi Sweets Profile</title>
  <meta name="description" content="Verified Nairobi Sweets profile." />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta property="og:title" content="Nairobi Sweets Profile" />
  <meta property="og:description" content="Verified Nairobi Sweets profile." />
  <meta property="og:image" content="https://nairobi-sweets.com/assets/logo/logo-badge.png" />
  <meta property="og:url" content="https://nairobi-sweets.com/profile.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/assets/logo/logo-badge.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --gold:#ffd84b;
      --gold2:#ffb700;
      --navy:#05075a;
      --deep:#01020e;
      --glass:rgba(255,255,255,.08);
      --line:rgba(255,216,75,.22);
      --green:#25d366;
      --pink:#ff2d75;
      --purple:#7c3aed;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:radial-gradient(circle at top,#07105a 0%,#020315 42%,#000 76%);
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      padding-bottom:96px;
      overflow-x:hidden;
    }
    a{text-decoration:none;color:inherit}
    button{font-family:inherit}
    header{
      position:sticky;
      top:0;
      z-index:80;
      background:rgba(0,0,0,.94);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,216,75,.2);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      padding:18px 36px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:16px;
      color:var(--gold);
      font-size:44px;
      font-weight:1000;
      line-height:.82;
      letter-spacing:-2px;
      text-shadow:0 0 22px rgba(255,216,75,.16);
    }
    .brand img{
      width:86px;
      height:86px;
      object-fit:cover;
      border-radius:24px;
      box-shadow:0 0 28px rgba(255,120,0,.35);
    }
    .home-btn{
      background:#07106a;
      color:var(--gold);
      border:1px solid rgba(255,216,75,.36);
      padding:18px 34px;
      border-radius:24px;
      font-weight:1000;
      font-size:22px;
      box-shadow:inset 0 0 18px rgba(255,255,255,.07);
    }
    .wrap{max-width:1280px;margin:0 auto 36px;padding:0 22px}
    .card{
      background:linear-gradient(145deg,#02031d,#06075e 58%,#08095d);
      border:1px solid var(--line);
      border-radius:34px;
      overflow:hidden;
      box-shadow:0 0 48px rgba(0,0,0,.75);
      margin-top:28px;
    }
    .signature-banner{
      display:none;
      background:linear-gradient(90deg,#fff2a1,#ffd84b,#ff9f1c,#ffd84b);
      color:#000;
      padding:12px 24px;
      font-weight:1000;
      letter-spacing:.6px;
      text-align:center;
      border-bottom:1px solid rgba(0,0,0,.2);
    }
    .signature-banner.show{display:block}
    .hero{
      position:relative;
      min-height:520px;
      background:#020315;
      overflow:hidden;
    }
    .hero-slider{
      display:flex;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      scroll-behavior:smooth;
      gap:0;
      height:520px;
      scrollbar-width:none;
    }
    .hero-slider::-webkit-scrollbar{display:none}
    .slide{
      position:relative;
      flex:0 0 100%;
      scroll-snap-align:start;
      min-height:520px;
    }
    .slide img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }
    .slide::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.05) 52%,rgba(0,0,0,.2));
      pointer-events:none;
    }
    .watermark{
      position:absolute;
      right:22px;
      bottom:22px;
      z-index:3;
      display:flex;
      align-items:center;
      gap:10px;
      background:rgba(0,0,0,.58);
      border:1px solid rgba(255,216,75,.3);
      color:var(--gold);
      padding:10px 16px;
      border-radius:999px;
      font-weight:1000;
      font-size:14px;
      letter-spacing:.6px;
      backdrop-filter:blur(8px);
    }
    .watermark img{width:28px;height:28px;border-radius:50%}
    .hero-score{
      position:absolute;
      left:22px;
      bottom:22px;
      z-index:4;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }
    .score-badge{
      background:rgba(0,0,0,.7);
      border:1px solid rgba(255,216,75,.35);
      color:var(--gold);
      padding:12px 18px;
      border-radius:999px;
      font-weight:1000;
    }
    .dots{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:20px;
      z-index:5;
      display:flex;
      gap:8px;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      border:1px solid rgba(255,216,75,.8);
      background:rgba(255,255,255,.25);
    }
    .dot.active{background:var(--gold)}
    .content{padding:42px 44px 52px}
    .badges,.chips,.actions,.stats-strip,.related-grid,.nav-row{display:flex;flex-wrap:wrap;gap:14px}
    .badge,.chip,.stat{
      border-radius:999px;
      font-weight:1000;
      padding:13px 20px;
      border:1px solid rgba(255,216,75,.28);
    }
    .signature{background:linear-gradient(135deg,#ffd84b,#ff9f1c);color:#000}
    .vip{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff}
    .verified{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff}
    .featured,.chip,.stat{background:rgba(255,216,75,.11);color:var(--gold)}
    h1{
      color:var(--gold);
      font-size:74px;
      line-height:.9;
      margin:24px 0 18px;
      text-transform:uppercase;
      letter-spacing:-2px;
    }
    h2{color:var(--gold);font-size:42px;margin:42px 0 18px;letter-spacing:-1px}
    .meta,.bio{font-size:24px;line-height:1.65;color:#f5f5f5}
    .bio{max-width:980px;margin:26px 0}
    .stats-strip{margin:26px 0}
    .stat{font-size:19px;background:rgba(255,255,255,.08)}
    .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:24px}
    .info-box{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      padding:22px;
      border-radius:22px;
      font-weight:1000;
      font-size:20px;
    }
    .chip{font-size:18px;background:rgba(255,216,75,.12)}
    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
      gap:14px;
      margin-top:14px;
    }
    .gallery .watermarked-img{position:relative;overflow:hidden;border-radius:20px;border:1px solid rgba(255,216,75,.18)}
    .gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
    .gallery .mini-mark{
      position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;padding:6px 9px;border-radius:8px;font-size:11px;font-weight:900;
    }
    .reel-box{margin-top:24px;background:#000;border:1px solid var(--line);border-radius:24px;overflow:hidden;max-width:760px}
    .reel-box video{width:100%;max-height:620px;display:block;background:#000}
    .btn{
      border:none;
      cursor:pointer;
      min-width:190px;
      padding:19px 28px;
      border-radius:22px;
      font-weight:1000;
      font-size:20px;
      text-align:center;
      display:inline-flex;
      justify-content:center;
      align-items:center;
      gap:10px;
    }
    .wa{background:var(--green);color:#fff}
    .call{background:var(--gold);color:#000}
    .fav{background:var(--pink);color:#fff}
    .share{background:var(--purple);color:#fff}
    .back{background:#07106a;color:var(--gold);border:1px solid rgba(255,216,75,.35)}
    .actions{margin-top:36px}
    .nav-row{margin-top:34px}
    .related-section{margin-top:34px}
    .related-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:22px;
    }
    .related-card{
      background:linear-gradient(180deg,#11136e,#070943);
      border:1px solid rgba(255,216,75,.28);
      border-radius:24px;
      overflow:hidden;
      min-height:330px;
      transition:.2s transform;
    }
    .related-card:hover{transform:translateY(-4px)}
    .related-card img{width:100%;height:210px;object-fit:cover;background:#111;display:block}
    .related-body{padding:18px;color:#fff}
    .related-name{font-size:22px;font-weight:1000;color:var(--gold);margin-bottom:8px}
    .related-meta{font-size:17px;line-height:1.45;color:#eee}
    .related-plan{margin-top:12px;background:var(--gold);color:#fff;padding:9px 14px;border-radius:999px;font-weight:1000;font-size:15px;text-transform:capitalize}
    .empty-note{color:#ddd;font-size:18px;background:rgba(255,255,255,.06);padding:18px;border-radius:18px;border:1px solid rgba(255,255,255,.1)}
    .error{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:30px;font-weight:1000;text-align:center;padding:30px}
    .bottom-nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      z-index:90;
      height:78px;
      background:rgba(0,0,0,.94);
      border-top:1px solid rgba(255,216,75,.15);
      display:flex;
      align-items:center;
      justify-content:space-around;
      backdrop-filter:blur(10px);
    }
    .bottom-nav a{color:var(--gold);font-size:28px}
    .sticky-contact{
      position:fixed;
      left:12px;
      right:12px;
      bottom:86px;
      z-index:89;
      display:none;
      gap:10px;
      pointer-events:none;
    }
    .sticky-contact a{pointer-events:auto;flex:1;justify-content:center;min-width:0;padding:16px 10px;border-radius:18px;font-size:17px}

    @media(max-width:980px){
      .related-grid{grid-template-columns:repeat(2,1fr)}
      h1{font-size:58px}
      .brand{font-size:36px}.brand img{width:74px;height:74px}
    }
    @media(max-width:760px){
      body{padding-bottom:164px}
      header{padding:14px 18px}
      .brand{font-size:34px;letter-spacing:-1px}.brand img{width:64px;height:64px;border-radius:18px}
      .home-btn{padding:14px 21px;font-size:18px;border-radius:20px}
      .wrap{padding:0;margin:0 auto 18px}
      .card{border-radius:0;margin-top:0;border-left:none;border-right:none}
      .hero,.hero-slider,.slide{min-height:430px;height:430px}
      .hero-score{left:14px;bottom:16px}.score-badge{font-size:13px;padding:9px 12px}
      .watermark{right:12px;bottom:16px;font-size:10px;padding:7px 10px}.watermark img{width:20px;height:20px}
      .content{padding:28px 22px 36px}
      h1{font-size:48px;letter-spacing:-1px}
      h2{font-size:34px;margin:34px 0 16px}
      .meta,.bio{font-size:20px}
      .stat{font-size:17px;padding:12px 15px}
      .info-grid{grid-template-columns:1fr}
      .info-box{font-size:19px;padding:20px}
      .btn{width:100%;min-width:0}
      .related-grid{grid-template-columns:1fr 1fr;gap:12px;padding-bottom:8px}
      .related-card{min-height:250px;border-radius:18px}
      .related-card img{height:150px}
      .related-body{padding:12px}.related-name{font-size:18px}.related-meta{font-size:14px}.related-plan{font-size:12px}
      .sticky-contact{display:flex}
    }
  </style>

  <script type="application/ld+json" id="schema-json">{}</script>
</head>
<body oncontextmenu="return false">

<header>
  <a href="/" class="brand" aria-label="Nairobi Sweets Home">
    <img src="/assets/logo/logo-badge.png" onerror="this.src='/logo.png'" alt="Nairobi Sweets">
    <div>Nairobi<br>Sweets</div>
  </a>
  <a href="/" class="home-btn">Home</a>
</header>

<main id="app"><div class="error">Loading profile...</div></main>

<div class="sticky-contact" id="stickyContact"></div>

<nav class="bottom-nav">
  <a href="/" aria-label="Home">🏠</a>
  <a href="/trending.html" aria-label="Trending">🔥</a>
  <a href="/shorts.html" aria-label="Shorts">🎬</a>
  <a href="/join.html" aria-label="Join">➕</a>
</nav>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const stickyContact = document.getElementById("stickyContact");
let currentProfile = null;
let relatedProfiles = [];
let slideIndex = 0;

function getSlug(){
  const q = new URLSearchParams(location.search).get("slug");
  if(q) return q.trim();
  const parts = location.pathname.split("/").filter(Boolean);
  return parts[0] === "profile" && parts[1] ? decodeURIComponent(parts[1]).trim() : "";
}

function escapeHTML(v){
  return String(v ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function cleanPhone(phone){
  if(!phone) return "";
  let p = String(phone).replace(/\D/g,"");
  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
  return p;
}

function normalizeText(value){
  return String(value || "").trim().replace(/\s+/g," ");
}

function safeArray(value){
  if(!value) return [];
  if(Array.isArray(value)){
    return value.map(x => normalizeText(x)).filter(x => x && x !== "[]" && x !== "null" && x !== "undefined");
  }
  const s = String(value).trim();
  if(!s || s === "[]" || s === "null" || s === "undefined") return [];
  try{
    const parsed = JSON.parse(s);
    if(Array.isArray(parsed)) return safeArray(parsed);
  }catch(e){}
  return s
    .replace(/^\[|\]$/g,"")
    .replaceAll('"',"")
    .split(/[,;\n]/)
    .map(x => normalizeText(x))
    .filter(x => x && x !== "[]" && x !== "null" && x !== "undefined");
}

function mainImage(p){
  return p.signature_banner_url || p.banner_url || p.image_url || p.photo_url || p.main_image || "/assets/logo/logo-badge.png";
}

function galleryImages(p){
  const arr = safeArray(p.gallery_images || p.gallery || p.images || p.image_urls);
  return [...new Set([mainImage(p), ...arr].filter(Boolean))];
}

function profileUrl(p){
  return `https://nairobi-sweets.com/profile.html?slug=${encodeURIComponent(p.slug || getSlug())}`;
}

function isSignature(p){
  const plan = String(p.plan || "").toLowerCase();
  return plan.includes("signature") || plan.includes("vvip") || p.is_signature === true || p.signature === true;
}

function isVip(p){
  const plan = String(p.plan || "").toLowerCase();
  return plan.includes("vip") || plan.includes("vvip");
}

function badges(p){
  let out = "";
  if(isSignature(p)) out += `<span class="badge signature">👑 Signature</span>`;
  else if(isVip(p)) out += `<span class="badge vip">⭐ VIP</span>`;
  else out += `<span class="badge featured">🔥 Featured</span>`;
  if(p.verified === true || p.verified === "true") out += `<span class="badge verified">✅ Verified</span>`;
  return out;
}

function trendingScore(p){
  return (
    Number(p.boost || 0) * 1000 +
    Number(p.views || 0) +
    Number(p.whatsapp_clicks || 0) * 10 +
    Number(p.call_clicks || 0) * 10 +
    Number(p.favorites || 0) * 15 +
    Number(p.profile_shares || 0) * 6
  );
}

async function incrementColumn(column){
  if(!currentProfile?.id) return;
  const value = Number(currentProfile[column] || 0) + 1;
  currentProfile[column] = value;
  try{
    await sb.from("profiles").update({[column]: value}).eq("id", currentProfile.id);
    const el = document.getElementById(column);
    if(el) el.textContent = value;
    const scoreEl = document.getElementById("trending_score");
    if(scoreEl) scoreEl.textContent = trendingScore(currentProfile);
  }catch(e){console.log("Counter skipped", e.message)}
}

async function logEvent(type){
  if(!currentProfile?.id) return;
  try{ await sb.from("profile_analytics").insert({profile_id:currentProfile.id,event_type:type}); }catch(e){}
  try{ await sb.from("profile_events").insert({profile_id:currentProfile.id,event_type:type}); }catch(e){}
}

function updateSEO(p){
  const name = p.stage_name || p.name || "Nairobi Sweets Profile";
  const loc = p.location || "Nairobi";
  const img = mainImage(p);
  const url = profileUrl(p);
  const desc = `${name} in ${loc}. Verified Nairobi Sweets profile.`;
  document.title = `${name} | Nairobi Sweets`;
  document.querySelector('meta[name="description"]')?.setAttribute("content", desc);
  document.querySelector('meta[property="og:title"]')?.setAttribute("content", `${name} | Nairobi Sweets`);
  document.querySelector('meta[property="og:description"]')?.setAttribute("content", desc);
  document.querySelector('meta[property="og:image"]')?.setAttribute("content", img);
  document.querySelector('meta[property="og:url"]')?.setAttribute("content", url);
  document.getElementById("schema-json").textContent = JSON.stringify({
    "@context":"https://schema.org",
    "@type":"LocalBusiness",
    "name":name,
    "url":url,
    "image":img,
    "description":desc,
    "address":{"@type":"PostalAddress","addressLocality":loc,"addressCountry":"KE"}
  });
}

function relatedCard(p){
  return `
    <a class="related-card" href="/profile.html?slug=${encodeURIComponent(p.slug || '')}">
      <img src="${escapeHTML(mainImage(p))}" alt="${escapeHTML(p.stage_name || 'Profile')}" loading="lazy" onerror="this.src='/assets/logo/logo-badge.png'">
      <div class="related-body">
        <div class="related-name">${escapeHTML(p.stage_name || 'Profile')}</div>
        <div class="related-meta">📍 ${escapeHTML(p.location || 'Nairobi')}</div>
        <div class="related-plan">${escapeHTML(p.plan || 'Featured')}</div>
      </div>
    </a>`;
}

function pickRelated(filterFn, limit=8){
  return relatedProfiles.filter(filterFn).sort((a,b)=>trendingScore(b)-trendingScore(a)).slice(0,limit);
}

function renderRelated(){
  if(!relatedProfiles.length) return "";
  const currentLoc = String(currentProfile.location || "").toLowerCase();
  const currentPlan = String(currentProfile.plan || "").toLowerCase();
  const all = pickRelated(()=>true,8);
  const sameLocation = pickRelated(p => String(p.location || "").toLowerCase().includes(currentLoc.split(",")[0]) && currentLoc, 8);
  const samePlan = pickRelated(p => String(p.plan || "").toLowerCase() === currentPlan && currentPlan, 8);
  const vipProfiles = pickRelated(p => isVip(p), 8);
  const signatureProfiles = pickRelated(p => isSignature(p), 8);

  return `
    ${all.length ? `<section class="related-section"><h2>🔥 More Profiles You May Like</h2><div class="related-grid">${all.map(relatedCard).join("")}</div></section>` : ""}
    ${sameLocation.length ? `<section class="related-section"><h2>📍 More in ${escapeHTML(currentProfile.location || 'Nairobi')}</h2><div class="related-grid">${sameLocation.map(relatedCard).join("")}</div></section>` : ""}
    ${samePlan.length ? `<section class="related-section"><h2>💎 More ${escapeHTML(currentProfile.plan || 'Featured')} Profiles</h2><div class="related-grid">${samePlan.map(relatedCard).join("")}</div></section>` : ""}
    ${signatureProfiles.length ? `<section class="related-section"><h2>👑 More Signature Profiles</h2><div class="related-grid">${signatureProfiles.map(relatedCard).join("")}</div></section>` : ""}
    ${vipProfiles.length ? `<section class="related-section"><h2>💎 More VIP Profiles</h2><div class="related-grid">${vipProfiles.map(relatedCard).join("")}</div></section>` : ""}
  `;
}

function previousNext(){
  const sorted = relatedProfiles.sort((a,b)=>Number(a.id||0)-Number(b.id||0));
  if(!sorted.length) return "";
  const prev = sorted.find(p => Number(p.id) < Number(currentProfile.id)) || sorted[sorted.length-1];
  const next = sorted.find(p => Number(p.id) > Number(currentProfile.id)) || sorted[0];
  return `
    <div class="nav-row">
      ${prev ? `<a class="btn back" href="/profile.html?slug=${encodeURIComponent(prev.slug)}">← Previous Profile</a>` : ""}
      ${next ? `<a class="btn back" href="/profile.html?slug=${encodeURIComponent(next.slug)}">Next Profile →</a>` : ""}
    </div>`;
}

function renderHero(gallery, p){
  return `
    <div class="hero">
      <div class="hero-slider" id="heroSlider" onscroll="syncDots()">
        ${gallery.map((img,i)=>`
          <div class="slide">
            <img src="${escapeHTML(img)}" alt="${escapeHTML(p.stage_name || 'Profile image')}" ${i>0?'loading="lazy"':''} onerror="this.src='/assets/logo/logo-badge.png'">
            <div class="watermark"><img src="/assets/logo/logo-badge.png" onerror="this.style.display='none'">NAIROBI-SWEETS.COM</div>
          </div>
        `).join("")}
      </div>
      <div class="hero-score">
        <span class="score-badge">🔥 Score <span id="trending_score">${trendingScore(p)}</span></span>
        <span class="score-badge">👁 <span id="hero_views">${Number(p.views||0)}</span> Views</span>
      </div>
      <div class="dots">${gallery.map((_,i)=>`<button class="dot ${i===0?'active':''}" onclick="goSlide(${i})" aria-label="Slide ${i+1}"></button>`).join("")}</div>
    </div>`;
}

function renderProfile(p){
  currentProfile = p;
  updateSEO(p);
  const name = escapeHTML(p.stage_name || p.name || "Nairobi Sweet");
  const locationName = escapeHTML(p.location || "Nairobi");
  const plan = escapeHTML(p.plan || "Featured");
  const bio = escapeHTML(p.bio || p.description || p.about || `Verified Nairobi Sweets profile in ${p.location || 'Nairobi'}.`);
  const services = safeArray(p.services);
  const coverage = safeArray(p.coverage_areas || p.coverage || p.areas || p.location);
  const gallery = galleryImages(p);
  const reel = p.reel_url || p.reel || p.short_video || p.video_url || "";
  const whatsapp = cleanPhone(p.whatsapp || p.phone);
  const phone = cleanPhone(p.phone || p.whatsapp);
  const waText = encodeURIComponent(`Hi ${p.stage_name || 'there'}, I found your profile on Nairobi Sweets: ${profileUrl(p)}`);

  stickyContact.innerHTML = `
    ${whatsapp ? `<a class="btn wa" href="https://wa.me/${whatsapp}?text=${waText}" target="_blank" onclick="incrementColumn('whatsapp_clicks');logEvent('whatsapp')">💬 WhatsApp</a>` : ""}
    ${phone ? `<a class="btn call" href="tel:+${phone}" onclick="incrementColumn('call_clicks');logEvent('call')">☎ Call</a>` : ""}
  `;

  app.innerHTML = `
    <section class="wrap">
      <article class="card">
        <div class="signature-banner ${isSignature(p)?'show':''}">👑 NAIROBI SWEETS SIGNATURE PROFILE</div>
        ${renderHero(gallery,p)}
        <div class="content">
          <div class="badges">${badges(p)}</div>
          <h1>${name}</h1>
          <div class="meta">📍 ${locationName} · ${p.online === true || p.online === 'true' ? '🟢 Online Now' : '⚪ Offline'}<br>💎 Plan: ${plan}</div>

          <div class="stats-strip">
            <span class="stat">👁 <span id="views">${Number(p.views || 0)}</span> Views</span>
            <span class="stat">💬 <span id="whatsapp_clicks">${Number(p.whatsapp_clicks || 0)}</span> WhatsApp</span>
            <span class="stat">☎ <span id="call_clicks">${Number(p.call_clicks || 0)}</span> Calls</span>
            <span class="stat">❤️ <span id="favorites">${Number(p.favorites || 0)}</span> Favorites</span>
            <span class="stat">🔗 <span id="profile_shares">${Number(p.profile_shares || 0)}</span> Shares</span>
          </div>

          <div class="info-grid">
            <div class="info-box">🎂 Age: ${escapeHTML(p.age || 'N/A')}</div>
            <div class="info-box">💃 Body: ${escapeHTML(p.body_type || 'N/A')}</div>
            <div class="info-box">🏨 Meeting: ${escapeHTML(p.meeting_place || 'Ask')}</div>
            <div class="info-box">💰 Rate: ${escapeHTML(p.rate || 'Ask')}</div>
          </div>

          <p class="bio">${bio}</p>

          <h2>Services</h2>
          <div class="chips">
            ${(services.length ? services : ['Professional Services']).map(s=>`<span class="chip">✓ ${escapeHTML(s)}</span>`).join("")}
          </div>

          ${coverage.length ? `<h2>Coverage Areas</h2><div class="chips">${coverage.map(a=>`<span class="chip">📍 ${escapeHTML(a)}</span>`).join("")}</div>` : ""}

          ${reel ? `<h2>Reel</h2><div class="reel-box"><video controls playsinline preload="metadata" onplay="logEvent('video_play')"><source src="${escapeHTML(reel)}"></video></div>` : ""}

          ${gallery.length > 1 ? `<h2>Gallery</h2><div class="gallery">${gallery.slice(1).map(img=>`<div class="watermarked-img"><img src="${escapeHTML(img)}" loading="lazy" onerror="this.parentElement.style.display='none'"><span class="mini-mark">© NAIROBI-SWEETS.COM</span></div>`).join("")}</div>` : ""}

          <div class="actions">
            ${whatsapp ? `<a class="btn wa" href="https://wa.me/${whatsapp}?text=${waText}" target="_blank" onclick="incrementColumn('whatsapp_clicks');logEvent('whatsapp')">💬 WhatsApp</a>` : ""}
            ${phone ? `<a class="btn call" href="tel:+${phone}" onclick="incrementColumn('call_clicks');logEvent('call')">☎ Call</a>` : ""}
            <button class="btn fav" onclick="incrementColumn('favorites');logEvent('favorite')">❤️ Favorite</button>
            <button class="btn share" onclick="shareProfile()">🔗 Share</button>
            <a class="btn back" href="/">🏠 Back Home</a>
          </div>

          ${previousNext()}
          ${renderRelated()}
        </div>
      </article>
    </section>`;
}

function goSlide(i){
  const slider = document.getElementById('heroSlider');
  if(!slider) return;
  slider.scrollTo({left:slider.clientWidth*i,behavior:'smooth'});
  slideIndex = i;
  syncDots();
}
function syncDots(){
  const slider = document.getElementById('heroSlider');
  if(!slider) return;
  const idx = Math.round(slider.scrollLeft / slider.clientWidth);
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
}

async function shareProfile(){
  if(!currentProfile) return;
  const url = profileUrl(currentProfile);
  await incrementColumn("profile_shares");
  await logEvent("share");
  if(navigator.share){
    try{ await navigator.share({title:document.title,url}); }catch(e){}
  }else{
    await navigator.clipboard.writeText(url);
    alert("Profile link copied!");
  }
}

async function loadProfile(){
  const slug = getSlug();
  if(!slug){ app.innerHTML = `<div class="error">Profile slug missing.</div>`; return; }

  const {data,error} = await sb.from("profiles").select("*").eq("slug",slug).eq("approved",true).maybeSingle();
  if(error){ app.innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`; return; }
  if(!data){ app.innerHTML = `<div class="error">Profile not found.</div>`; return; }

  const {data:rel} = await sb.from("profiles").select("*").eq("approved",true).neq("id",data.id).limit(60);
  relatedProfiles = rel || [];
  renderProfile(data);
  await incrementColumn("views");
  const hv = document.getElementById("hero_views"); if(hv) hv.textContent = Number(currentProfile.views || 0);
  await logEvent("view");
}

loadProfile();
</script>
</body>
</html>
