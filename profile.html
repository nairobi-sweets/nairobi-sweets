<script>
/*
  SEO V4 bootstrap:
  Give crawlers a URL-specific canonical/title/description immediately,
  before Supabase and the full profile renderer finish loading.
*/
(function(){
  try{
    const SITE = "https://nairobi-sweets.com";
    const params = new URLSearchParams(location.search);
    let slug = (params.get("slug") || "").trim();

    if(!slug){
      const parts = location.pathname.split("/").filter(Boolean);
      if(parts[0] === "profile" && parts[1]) slug = decodeURIComponent(parts[1]).trim();
    }

    if(!slug) return;

    const cleanSlug = String(slug)
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"");

    if(!cleanSlug) return;

    const canonicalUrl = `${SITE}/profile.html?slug=${encodeURIComponent(cleanSlug)}`;
    const readable = cleanSlug
      .replace(/-\d+$/,"")
      .replace(/-/g," ")
      .replace(/\b\w/g,c => c.toUpperCase())
      .trim();

    const bootstrapTitle = readable
      ? `${readable} | Nairobi Sweets Profile`
      : "Nairobi Sweets Profile";

    const bootstrapDesc = readable
      ? `View ${readable} on Nairobi Sweets. Browse profile details, location, gallery and contact options.`
      : "View this Nairobi Sweets profile.";

    document.title = bootstrapTitle;

    // SEO hardening: valid profile URLs must never inherit a stale noindex directive.
    const robotsValue = "index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1";
    document.querySelectorAll('meta[name="robots"],meta[name="googlebot"]').forEach(meta => {
      meta.setAttribute("content", robotsValue);
    });

    const canonical = document.querySelector('link[rel="canonical"]');
    if(canonical) canonical.href = canonicalUrl;

    const set = (selector,value) => {
      const el = document.querySelector(selector);
      if(el) el.setAttribute("content",value);
    };

    set('meta[name="description"]', bootstrapDesc);
    set('meta[property="og:title"]', bootstrapTitle);
    set('meta[property="og:description"]', bootstrapDesc);
    set('meta[property="og:url"]', canonicalUrl);
    set('meta[name="twitter:title"]', bootstrapTitle);
    set('meta[name="twitter:description"]', bootstrapDesc);
  }catch(e){}
})();
</script>

/* =========================================================
   NAIROBI SWEETS PROFILE V3 PREMIUM PATCH
   Safe-area, glass UI, faster media, mobile polish, PWA comfort
========================================================= */
:root{
  --glass:rgba(7,12,46,.66);
  --glass-strong:rgba(5,8,32,.84);
  --gold-soft:rgba(255,216,75,.16);
  --shadow-lux:0 22px 80px rgba(0,0,0,.58),0 0 34px rgba(255,216,75,.08);
}
html{
  min-height:100%;
  text-size-adjust:100%;
  -webkit-text-size-adjust:100%;
}
body{
  min-height:100%;
  background:
    radial-gradient(circle at 18% 0%,rgba(255,216,75,.11),transparent 26%),
    radial-gradient(circle at 88% 12%,rgba(236,72,153,.12),transparent 30%),
    radial-gradient(circle at top,#07105a 0%,#010212 48%,#000 100%);
  padding-bottom:calc(118px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.72),transparent 72%);
}
a,button{touch-action:manipulation}
.site-header{
  top:0;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:rgba(0,0,0,.74);
  backdrop-filter:blur(22px) saturate(1.25);

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";

const SITE_URL = "https://nairobi-sweets.com";

let currentProfile = null;

function getSlug(){
  const q = new URLSearchParams(location.search).get("slug");
  if(q) return q.trim();
  const parts = location.pathname.split("/").filter(Boolean);
  return parts[0] === "profile" && parts[1] ? decodeURIComponent(parts[1]).trim() : "";
}

function getIdParam(){
  return new URLSearchParams(location.search).get("id");
}

function makeSlug(value){
  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function escapeHTML(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function cleanPhone(phone){
  if(!phone) return "";
  let p = String(phone).replace(/\D/g,"");
  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
  return p;
}

function safeArray(value){
  if(value == null) return [];
  let out = [];

  if(Array.isArray(value)){
    out = value;
  }else if(typeof value === "string"){
    const raw = value.trim();
    if(!raw || raw === "[]") return [];
    try{
      const parsed = JSON.parse(raw);
      out = Array.isArray(parsed) ? parsed : [parsed];
    }catch(e){
      out = raw.split(/[,;\n]/);
    }
  }else{
    out = [value];
  }

  return out
    .flatMap(x => Array.isArray(x) ? x : [x])
    .map(x => String(x ?? "").trim().replace(/^\[+|\]+$/g,"").replace(/^['"]+|['"]+$/g,"").trim())
    .filter(x => x && !["0","[]","null","undefined","nan"].includes(x.toLowerCase()))
    .filter((x,i,a) => a.indexOf(x) === i);
}

function absUrl(url){
  const s = String(url || "").trim();
  if(!s) return "";
  if(s.startsWith("http://") || s.startsWith("https://")) return s;
  if(s.startsWith("/")) return SITE_URL + s;
  return s;
}

function mainImage(p){
  return (
    p.profile_image_url ||
    p.cover_image_url ||
    p.signature_banner_url ||
    p.banner_url ||
    p.image_url ||
    p.photo_url ||
    p.image2_url ||
    p.image3_url ||
    p.image_url_2 ||
    p.image_url_3 ||
    p.avatar_url ||
    p.image_path ||
    p.main_image ||
    p.profile_photo ||
    p.main_photo ||
    p.photo ||
    p.image ||
    FALLBACK_IMAGE
  );
}

function galleryImages(p){
  const arr = [
    ...safeArray(p.gallery_images),
    ...safeArray(p.gallery),
    ...safeArray(p.images),
    ...safeArray(p.image_urls),
    p.image_url,
    p.photo_url,
    p.image2_url,
    p.image3_url,
    p.image_url_2,
    p.image_url_3,
    p.avatar_url,
    p.image_path
  ].filter(Boolean);

  return [...new Set([mainImage(p), ...arr].filter(Boolean))];
}

function reelUrl(p){
  return p.reel_url || p.reel || p.short_video || p.video_url || p.short_url || "";
}

/*
  SEO V4 canonical slug.
  The dynamic profile sitemap uses the durable format:
  stage-name + location + profile ID.
  Keeping the same format here prevents canonical drift and duplicate URLs.
*/
function profileSlug(p){
  if(!p) return "";
  const name = p.stage_name || p.name || p.full_name || p.username || "profile";
  const loc = p.location || primaryLocation(p) || "nairobi";
  const id = p.id ?? "";

  if(id !== "" && id !== null && id !== undefined){
    return makeSlug(`${name}-${loc}-${id}`);
  }

  return makeSlug(p.seo_slug || p.profile_slug || p.slug || `${name}-${loc}`);
}

function profileUrl(p){
  const slug = profileSlug(p);
  return slug
    ? `${SITE_URL}/profile.html?slug=${encodeURIComponent(slug)}`
    : `${SITE_URL}/profile.html?id=${encodeURIComponent(p?.id || "")}`;
}

function localProfileUrl(p){
  const slug = profileSlug(p);
  return slug
    ? `/profile.html?slug=${encodeURIComponent(slug)}`
    : `/profile.html?id=${encodeURIComponent(p?.id || "")}`;
}

function slugId(slug){
  const clean = makeSlug(slug);
  if(/^\d+$/.test(clean)) return clean;
  const match = clean.match(/-(\d+)$/);
  return match ? match[1] : "";
}

function slugCandidates(p){
  if(!p) return [];
  const name = p.stage_name || p.name || p.full_name || p.username || "profile";
  const loc = p.location || primaryLocation(p) || "";
  return [
    profileSlug(p),
    p.slug,
    p.profile_slug,
    p.seo_slug,
    p.username,
    p.stage_name,
    p.name,
    p.full_name,
    p.id,
    `${name}-${loc}`,
    `${name}-${loc}-${p.id ?? ""}`
  ].map(makeSlug).filter(Boolean);
}

function planText(p){
  return String(p.plan || p.plan_name || p.package || p.tier || "Featured").trim();
}

function isSignature(p){
  const plan = planText(p).toLowerCase();
  return plan.includes("signature") || plan.includes("vvip") || p.is_signature === true || p.signature === true || p.is_vvip === true || p.vvip === true;
}

function isVip(p){
  const plan = planText(p).toLowerCase();
  return (plan.includes("vip") && !isSignature(p)) || p.is_vip === true || p.vip === true;
}

function niceTitle(v){
  return String(v || "")
    .replace(/[-_]+/g," ")
    .replace(/\s+/g," ")
    .trim()
    .replace(/\b\w/g,c => c.toUpperCase());
}

function displayName(p){
  const raw = String(p.stage_name || p.name || p.full_name || "Nairobi Sweet").trim();
  const lower = raw.toLowerCase().replace(/\s+/g,"");
  if(lower === "pretiezari" || lower === "prettiezari" || lower === "pretie-zari") return "Pretie Zari";
  return niceTitle(raw);
}

function locationParts(p){
  return safeArray(p.coverage_areas || p.coverage || p.areas || p.location).concat(safeArray(p.location));
}

function primaryLocation(p){
  const arr = locationParts(p);
  return arr[0] || "Nairobi";
}

function sameLocation(a,b){
  const aa = locationParts(a).map(x => x.toLowerCase());
  const bb = locationParts(b).map(x => x.toLowerCase());
  return aa.some(x => bb.some(y => x === y || x.includes(y) || y.includes(x)));
}

function score(p){
  return Math.round(
    Number(p.profile_score || 0) ||
    (
      Number(p.image_quality_score || 0) * 0.40 +
      Number(p.favorites || p.likes || p.likes_count || 0) * 0.20 +
      Number(p.views || p.views_count || 0) * 0.15 +
      Number(p.boost_score || p.boost || 0) * 0.15 +
      (p.verified === true || p.verified === "true" ? 100 : 0) * 0.10
    )
  );
}

function qualityScore(p){
  return Number(p.image_quality_score || 0);
}

function rankScore(p){
  return Number(p.profile_score || score(p));
}

function fieldValue(p, keys, fallback="N/A"){
  for(const key of keys){
    const value = p[key];
    if(value !== undefined && value !== null && String(value).trim() !== ""){
      return value;
    }
  }
  return fallback;
}

function badgeHTML(p){
  let html = "";
  if(isSignature(p)) html += `<span class="badge signature">👑 Signature</span>`;
  else if(isVip(p)) html += `<span class="badge vip">⭐ VIP</span>`;
  else html += `<span class="badge featured">🔥 Featured</span>`;

  if(p.verified === true || p.verified === "true" || p.is_verified === true){
    html += `<span class="badge verified">✅ Verified</span>`;
  }
  return html;
}


function isLiveLocationActive(profile){
  if(!profile || !profile.live_location_enabled) return false;
  if(profile.live_location_expires_at && new Date(profile.live_location_expires_at).getTime() < Date.now()) return false;
  return Boolean(profile.live_location_url || (profile.live_lat && profile.live_lng));
}

function getLiveLocationUrl(profile){
  if(!isLiveLocationActive(profile)) return "";
  if(profile.live_location_url) return profile.live_location_url;
  return `https://www.google.com/maps?q=${profile.live_lat},${profile.live_lng}`;
}

function liveLocationHTML(profile){
  if(!isLiveLocationActive(profile)) return "";
  const mapUrl = getLiveLocationUrl(profile);
  const updated = profile.live_location_updated_at ? new Date(profile.live_location_updated_at).toLocaleString("en-KE") : "Recently";
  const accuracy = profile.live_accuracy ? `Accuracy: about ${Math.round(Number(profile.live_accuracy))} meters · ` : "";
  return `
    <div class="live-location-card">
      <h2>📍 Accurate Live Location</h2>
      <p>${accuracy}Updated: ${updated}. Open the verified Google Maps location shared from this profile dashboard.</p>
      <a class="live-location-profile-btn" href="${escapeHTML(mapUrl)}" target="_blank" rel="noopener">📍 View Live Location On Maps</a>
    </div>
  `;
}

function renderServices(raw){
  let services = safeArray(raw);
  if(!services.length) services = ["Professional Massage"];
  return services.map(s => `<span class="chip">✓ ${escapeHTML(s)}</span>`).join("");

}

async function incrementColumn(column){
  if(!currentProfile?.id) return;
  const next = Number(currentProfile[column] || 0) + 1;
  currentProfile[column] = next;

  try{
    await sb.from("profiles").update({[column]:next}).eq("id",currentProfile.id);
    const el = document.getElementById(column);
    if(el) el.textContent = next;
    const hv = document.getElementById("hero_views");
    if(column === "views" && hv) hv.textContent = next;
    const hs = document.getElementById("hero_score");
    if(hs) hs.textContent = score(currentProfile);
  }catch(e){}
}

  try{await sb.from("profile_analytics").insert({profile_id:currentProfile.id,event_type:type});}catch(e){}
  try{await sb.from("profile_events").insert({profile_id:currentProfile.id,event_type:type});}catch(e){}

  const sorted = [...relatedProfiles].sort((a,b) => score(b) - score(a));
  const locTitle = primaryLocation(currentProfile);
  const sameLoc = sorted.filter(p => sameLocation(currentProfile,p));
  const base = sameLoc.length >= 4 ? sameLoc : sorted;

  const vip = base.filter(isVip).slice(0,8);
  const signature = base.filter(isSignature).slice(0,8);
  const featured = base.filter(p => !isVip(p) && !isSignature(p)).slice(0,8);

  return `
    <section class="feed-section">
      ${section(`More Profiles in ${locTitle}`,"📍",sameLoc.slice(0,8))}
      ${section("More VIP Profiles","⭐",vip)}
      ${section("Signature Profiles","👑",signature)}
      ${section("Featured Profiles","🔥",featured)}
    </section>
  `;
}

function previousNext(){
  const sorted = [...relatedProfiles].sort((a,b) => Number(a.id || 0) - Number(b.id || 0));
  if(!sorted.length) return "";

  const prev = sorted.filter(p => Number(p.id) < Number(currentProfile.id)).pop() || sorted[sorted.length - 1];
  const next = sorted.find(p => Number(p.id) > Number(currentProfile.id)) || sorted[0];

  return `
    <div class="profile-nav">
      ${prev ? `<a class="btn back" href="${localProfileUrl(prev)}">← Previous</a>` : ""}
      ${next ? `<a class="btn back" href="${localProfileUrl(next)}">Next →</a>` : ""}
    </div>
  `;
}

let profileLookupHadError = false;

function wait(ms){
  return new Promise(resolve => setTimeout(resolve,ms));
}

async function queryProfileById(id){
  if(!id) return {data:null,error:null};

  let lastError = null;
  for(let attempt=0; attempt<2; attempt++){
    const result = await sb
      .from("profiles")
      .select("*")
      .eq("id",id)
      .maybeSingle();

    if(!result.error) return result;
    lastError = result.error;
    if(attempt === 0) await wait(350);
  }

  return {data:null,error:lastError};
}

async function findProfileById(id){
  if(!id) return null;
  const {data,error} = await queryProfileById(id);
  if(error){
    profileLookupHadError = true;
    console.warn("Profile ID lookup failed:", error.message || error);
    return null;
  }
  return data || null;
}

async function findProfileBySlug(slug){
  if(!slug) return null;

  const wanted = makeSlug(slug);
  if(!wanted) return null;

  /*
    SEO V5 resilient resolver.
    1. Current sitemap URLs end with the stable database ID.
    2. Old Google URLs may end with a deleted/replaced historical ID.
    3. Never let a stale trailing ID prevent a safe slug/name recovery.
    4. Avoid downloading the whole profiles table into the browser.
  */
  const idFromSlug = slugId(wanted);
  if(idFromSlug){
    const byId = await findProfileById(idFromSlug);
    if(byId) return byId;
    // IMPORTANT: a missing historical ID is not a fatal lookup error.
    // Continue into legacy recovery below.
    if(profileLookupHadError) return null;
  }

  const stripTrailingId = value => makeSlug(String(value || '').replace(/-\d+$/,''));
  const legacyBase = stripTrailingId(wanted);
  const words = legacyBase.split('-').filter(Boolean);

  // Prefer meaningful leading terms. This makes old links such as
  // cherry-ruai-kanisani-261 recover Cherry Zendaya without trusting ID 261.
  const probes = [...new Set([
    legacyBase,
    words.slice(0,3).join('-'),
    words.slice(0,2).join('-'),
    words[0] || ''
  ].map(makeSlug).filter(x => x && x.length >= 3))];

  async function runCandidateQuery(column, probe){
    // Convert the slug probe to a loose text phrase for indexed/server-side filtering.
    const phrase = probe.replace(/-/g,' ').trim();
    if(!phrase) return [];
    const result = await sb
      .from('profiles')
      .select('*')
      .ilike(column, `%${phrase}%`)
      .limit(40);
    if(result.error){
      // Missing optional columns should not break profile resolution.
      return [];
    }
    return result.data || [];
  }

  let candidates = [];
  const searchableColumns = ['stage_name','name','username','slug'];

  for(const probe of probes){
    for(const column of searchableColumns){
      const rows = await runCandidateQuery(column, probe);
      if(rows.length){
        candidates.push(...rows);
      }
    }
    if(candidates.length) break;
  }

  // Deduplicate before scoring.
  candidates = [...new Map(candidates.map(p => [String(p.id),p])).values()];
  if(!candidates.length) return null;

  const wantedNoId = stripTrailingId(wanted);
  const wantedTokens = new Set(wantedNoId.split('-').filter(Boolean));

  function legacyMatchScore(p){
    const current = profileSlug(p);
    const currentNoId = stripTrailingId(current);
    const names = [p.stage_name,p.name,p.full_name,p.username,p.slug,p.profile_slug,p.seo_slug]
      .filter(Boolean)
      .map(makeSlug);

    let points = 0;
    if(current === wanted) points += 10000;
    if(currentNoId === wantedNoId) points += 5000;
    if(names.includes(wantedNoId)) points += 3500;

    const haystack = new Set([
      ...currentNoId.split('-'),
      ...names.flatMap(x => x.split('-')),
      ...makeSlug(primaryLocation(p)).split('-')
    ].filter(Boolean));

    for(const token of wantedTokens){
      if(haystack.has(token)) points += token.length >= 5 ? 120 : 60;
    }

    // Strongly reward a matching first/name token, useful for historical location slugs.
    const first = [...wantedTokens][0];
    if(first && names.some(n => n.split('-').includes(first))) points += 800;

    // Deterministic tie breakers favour stronger/current profiles without changing eligibility.
    points += Math.min(rankScore(p),1000) / 1000;
    return points;
  }

  candidates.sort((a,b) => legacyMatchScore(b) - legacyMatchScore(a));
  const best = candidates[0];
  return best && legacyMatchScore(best) >= 800 ? best : null;
}

async function loadProfile(){
  const slug = getSlug();
  const idParam = getIdParam();

  if(!slug && !idParam){
    window.location.replace("/404.html");
    return;
  }

  profileLookupHadError = false;
  let data = null;

  // Fastest route for sitemap URLs and explicit IDs.
  const stableId = idParam || slugId(slug);
  if(stableId){
    data = await findProfileById(stableId);
  }

  // Legacy/non-ID slug support.
  if(!data && slug && !profileLookupHadError){
    data = await findProfileBySlug(slug);
  }

  if(!data){
    if(profileLookupHadError){
      showTemporaryProfileError();
      return;
    }
    window.location.replace("/404.html");
    return;
  }

  /*
    Critical SEO/LCP change:
    Render the real profile immediately. Related-profile discovery is secondary
    and must never delay the main profile content seen by users or crawlers.
  */
  renderProfile(data);

  // SEO V5: once an old/stale URL resolves, expose the current canonical URL in the
  // address bar without reloading. Shared links now converge on the durable slug.
  try{
    const currentLocal = localProfileUrl(data);
    const requested = location.pathname + location.search;
    if(currentLocal && requested !== currentLocal){
      history.replaceState({profileId:data.id}, "", currentLocal);
    }
  }catch(e){}

  await loadAdminContact();

  // Load related profiles after the main entity is already visible.
  try{
    await loadRelated(data);
    const slot = document.getElementById("profileNavAndFeeds");
    if(slot){
      slot.innerHTML = `${previousNext()}${buildFeeds()}`;
    }
  }catch(error){
    console.warn("Related profiles failed:", error?.message || error);
  }

  // Analytics are non-blocking for page rendering.
  incrementColumn("views").catch(()=>{});
  logEvent("view").catch(()=>{});
}

loadProfile().catch(error => {
  profileLookupHadError = true;
  console.error("Profile loader failed:", error);
  showTemporaryProfileError();
});
</script>

<script>
/* =========================================================
   NAIROBI SWEETS PROFILE V4 PREMIUM SEO PATCH JS
   safer lazy media, active nav, iOS comfort, resilient sharing
========================================================= */
(function(){
  const fallback = "/assets/logo/logo-badge.png";

  function markActiveNav(){
    const path = location.pathname.replace(/\/$/,"") || "/";
    document.querySelectorAll(".bottom-nav a").forEach(a=>{
      try{
        const hrefPath = new URL(a.getAttribute("href"), location.origin).pathname.replace(/\/$/,"") || "/";
        a.classList.toggle("active", hrefPath === path || (path.includes("profile") && hrefPath === "/"));
      }catch(e){}
    });
  }

  function improveImages(root=document){
    root.querySelectorAll("img").forEach((img,index)=>{
      if(!img.getAttribute("loading")) img.setAttribute("loading", index < 2 ? "eager" : "lazy");
      img.setAttribute("decoding","async");
      img.addEventListener("error",()=>{
        if(!img.dataset.fallbackApplied){
          img.dataset.fallbackApplied = "1";
          img.src = fallback;
        }
      },{once:true});
    });
  }

  function improveVideos(root=document){
    root.querySelectorAll("video").forEach(video=>{
      video.setAttribute("playsinline","");
      video.setAttribute("webkit-playsinline","");
      if(!video.getAttribute("preload")) video.setAttribute("preload","metadata");
      if(!video.getAttribute("poster")) video.setAttribute("poster", fallback);
      video.addEventListener("loadedmetadata",()=>video.classList.remove("image-skeleton"),{once:true});
      video.addEventListener("error",()=>video.style.display="none",{once:true});
    });
  }

  function watchAppRender(){
    const app = document.getElementById("app");
    if(!app) return;
    const obs = new MutationObserver(()=>{
      improveImages(app);
      improveVideos(app);
      markActiveNav();
    });
    obs.observe(app,{childList:true,subtree:true});
  }

  function registerSW(){
    if("serviceWorker" in navigator){
      window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}),{once:true});
    }
  }

  function installIOSHint(){
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
    if(!isIOS || standalone || localStorage.getItem("ns_ios_hint_seen")) return;
    setTimeout(()=>{
      localStorage.setItem("ns_ios_hint_seen","1");
      console.info("Nairobi Sweets iPhone install: Safari Share button → Add to Home Screen.");
    },1800);
  }

  document.addEventListener("DOMContentLoaded",()=>{
    markActiveNav();
    improveImages();
    improveVideos();
    watchAppRender();
    installIOSHint();
  });

  registerSW();
})();
</script>

<script>
/* SEO V4.1 robots guard
   Keeps successfully resolved public profile pages indexable even if a stale
   late-running script attempts to restore an old noindex directive. */
(function(){
  const robotsValue = "index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1";
  const head = document.head;
  if(!head) return;

  function enforceIndex(){
    if(!window.currentProfile && typeof currentProfile !== "undefined" && !currentProfile) return;
    document.querySelectorAll('meta[name="robots"],meta[name="googlebot"]').forEach(meta=>{
      if(/noindex/i.test(meta.getAttribute("content") || "")){
        meta.setAttribute("content", robotsValue);
      }
    });
  }

  const observer = new MutationObserver(enforceIndex);
  observer.observe(head,{subtree:true,childList:true,attributes:true,attributeFilter:["content"]});
  window.addEventListener("load",enforceIndex,{once:true});
})();
</script>
