<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nairobi Sweets Profile</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 25px;
      background: #000;
      border-bottom: 1px solid #2a2100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      color: #ffd84b;
      font-size: 42px;
      font-weight: 900;
      line-height: 0.85;
    }

    .brand img {
      width: 80px;
      height: 80px;
      border-radius: 20px;
    }

    .home {
      background: #07136b;
      color: #ffd84b;
      padding: 18px 32px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 900;
      border: 1px solid #2b3bff;
    }

    .wrap {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: linear-gradient(135deg, #05081f, #080b55);
      border: 1px solid #1d2b9b;
      border-radius: 35px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,.6);
    }

    .hero {
      width: 100%;
      height: 560px;
      object-fit: cover;
      background: #111;
    }

    .content {
      padding: 35px;
    }

    h1 {
      color: #ffd84b;
      font-size: 56px;
      margin: 0 0 10px;
    }

    .meta {
      color: #ddd;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      background: #ffd84b;
      color: #000;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .bio {
      font-size: 20px;
      line-height: 1.6;
      color: #f1f1f1;
    }

    .actions {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .btn {
      padding: 18px 26px;
      border-radius: 18px;
      font-weight: 900;
      text-decoration: none;
      color: #000;
      background: #ffd84b;
    }

    .whatsapp {
      background: #25d366;
      color: #fff;
    }

    .call {
      background: #ffd84b;
      color: #000;
    }

    .error {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd84b;
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      padding: 40px;
    }

    @media (max-width: 700px) {
      .brand {
        font-size: 32px;
      }

      .brand img {
        width: 65px;
        height: 65px;
      }

      h1 {
        font-size: 38px;
      }

      .hero {
        height: 430px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <img src="/logo.png" alt="Nairobi Sweets Logo">
    <div>Nairobi<br>Sweets</div>
  </div>

  <a class="home" href="/">Home</a>
</header>

<main id="app">
  <div class="error">Loading profile...</div>
</main>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById("app");

function getSlug() {
  const params = new URLSearchParams(window.location.search);
  const querySlug = params.get("slug");

  if (querySlug) return querySlug.trim();

  const parts = window.location.pathname.split("/").filter(Boolean);

  if (parts[0] === "profile" && parts[1]) {
    return decodeURIComponent(parts[1]).trim();
  }

  return "";
}

function cleanPhone(phone) {
  if (!phone) return "";
  let p = String(phone).replace(/\D/g, "");

  if (p.startsWith("0")) p = "254" + p.slice(1);
  if (p.startsWith("7")) p = "254" + p;
  if (p.startsWith("1")) p = "254" + p;

  return p;
}

function getImage(p) {
  if (p.image_url) return p.image_url;
  if (p.photo_url) return p.photo_url;
  if (p.main_image) return p.main_image;
  if (p.gallery && Array.isArray(p.gallery) && p.gallery.length) return p.gallery[0];
  if (p.images && Array.isArray(p.images) && p.images.length) return p.images[0];
  return "/logo.png";
}

async function loadProfile() {
  const slug = getSlug();

  if (!slug) {
    app.innerHTML = `<div class="error">Profile slug missing.</div>`;
    return;
  }

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("slug", slug)
    .eq("approved", true)
    .maybeSingle();

  if (error) {
    app.innerHTML = `<div class="error">${error.message}</div>`;
    return;
  }

  if (!data) {
    app.innerHTML = `<div class="error">Profile not found.</div>`;
    return;
  }

  const p = data;
  const name = p.stage_name || p.name || "Nairobi Sweet";
  const location = p.location || "Nairobi";
  const plan = p.plan || "Featured";
  const bio = p.bio || p.description || p.services || "Verified Nairobi Sweets profile.";
  const img = getImage(p);

  const whatsapp = cleanPhone(p.whatsapp || p.phone);
  const phone = cleanPhone(p.phone || p.whatsapp);

  const whatsappText = encodeURIComponent(
    `Hi ${name}, I found your profile on Nairobi Sweets: https://nairobi-sweets.com/profile.html?slug=${p.slug}`
  );

  app.innerHTML = `
    <section class="wrap">
      <div class="card">
        <img class="hero" src="${img}" alt="${name}" onerror="this.src='/logo.png'">

        <div class="content">
          <div class="badge">👑 ${plan}</div>

          <h1>${name}</h1>

          <div class="meta">
            📍 ${location} · 🟢 Online Now
          </div>

          <div class="bio">${bio}</div>

          <div class="actions">
            ${
              whatsapp
              ? `<a class="btn whatsapp" href="https://wa.me/${whatsapp}?text=${whatsappText}" target="_blank">💬 WhatsApp</a>`
              : ""
            }

            ${
              phone
              ? `<a class="btn call" href="tel:+${phone}">☎ Call</a>`
              : ""
            }

            <a class="btn" href="/">🏠 Back Home</a>
          </div>
        </div>
      </div>
    </section>
  `;
}

loadProfile();
</script>

</body>
</html>
