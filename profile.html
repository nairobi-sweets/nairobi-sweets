<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Nairobi Sweets Profile</title>
<meta name="description" content="Premium Nairobi Sweets profile with photos, reels, services, WhatsApp access, likes and views.">
<link rel="icon" href="/assets/logo/logo-badge.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:radial-gradient(circle at top,#0c1148 0%,#000 48%);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;padding-bottom:92px}
a{text-decoration:none;color:inherit}
.topbar{position:sticky;top:0;z-index:999;background:rgba(0,0,0,.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,213,74,.1);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}.brand-logo{width:78px;height:78px;min-width:78px;object-fit:cover;border-radius:24px;background:#050505;border:2px solid rgba(255,190,70,.18);box-shadow:0 0 25px rgba(255,140,0,.45),0 0 60px rgba(255,80,0,.22)}
.brand-text{display:flex;flex-direction:column;line-height:.88}.brand-text span{color:#ffd54a;font-size:clamp(1.8rem,5vw,3.3rem);font-weight:900;letter-spacing:-2px}
.home-btn{background:linear-gradient(180deg,#07145f,#02083d);color:#ffd54a;padding:14px 18px;border-radius:18px;border:1px solid rgba(255,213,74,.14);font-weight:900}
.wrap{max-width:1250px;margin:auto;padding:18px}.hero{background:linear-gradient(180deg,#020a56,#010633);border:1px solid rgba(255,213,74,.1);border-radius:34px;overflow:hidden;box-shadow:0 0 35px rgba(255,0,128,.12),0 25px 70px rgba(0,0,0,.55)}
.media-wrap{position:relative;background:#020617}.media-wrap img,.media-wrap video{width:100%;max-height:760px;object-fit:cover;display:block;background:#020617}
.badge-row{position:absolute;top:18px;left:18px;right:18px;display:flex;gap:10px;flex-wrap:wrap;z-index:4}.badge{background:rgba(0,0,0,.76);color:#ffd54a;border:1px solid rgba(255,213,74,.18);padding:9px 14px;border-radius:999px;font-size:12px;font-weight:900;backdrop-filter:blur(10px)}
.content{padding:24px}.name{font-size:clamp(42px,10vw,86px);line-height:.9;font-weight:900;color:#fff;margin-bottom:12px}.online{color:#31ff71;font-weight:900;font-size:16px;margin-bottom:14px}.meta{color:#d8d8d8;font-size:15px;line-height:1.8;margin-bottom:20px}.bio{color:#e7e7e7;font-size:16px;line-height:1.75;margin-bottom:22px;white-space:pre-wrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{min-height:56px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;border:none;cursor:pointer;font-size:15px}.call{background:linear-gradient(145deg,#08114f,#050717);color:white}.whatsapp{background:linear-gradient(145deg,#0b6b32,#06361b);color:white}.share{grid-column:1/-1;background:linear-gradient(145deg,#7dffcf,#a054ff);color:#000}
.section{margin-top:18px;background:linear-gradient(180deg,#020a56,#010633);border:1px solid rgba(255,213,74,.08);border-radius:28px;padding:22px}.section h2{color:#ffd54a;font-size:26px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.info-box{background:#07114a;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px}.info-box small{display:block;color:#aeb4c5;font-size:12px;margin-bottom:7px}.info-box strong{color:white;font-size:15px}.tags{display:flex;gap:10px;flex-wrap:wrap}.tags span{background:rgba(255,213,74,.12);border:1px solid rgba(255,213,74,.14);color:#ffd54a;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:900}.map iframe{width:100%;height:300px;border:0;border-radius:22px;display:block}.disclaimer{color:#d8d8d8;line-height:1.7;font-size:14px}.loading,.empty{min-height:70vh;display:flex;align-items:center;justify-content:center;color:#ffd54a;font-size:26px;font-weight:900;text-align:center;padding:30px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:rgba(0,0,0,.96);border-top:1px solid rgba(255,213,74,.08);display:flex;align-items:center;justify-content:space-around;z-index:999}.bottom-nav a,.bottom-nav button{background:none;border:none;color:#ffd54a;font-size:24px;cursor:pointer}
@media(max-width:720px){.brand-logo{width:70px;height:70px;min-width:70px}.grid,.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><a href="/" class="brand"><img src="/assets/logo/logo-badge.png" class="brand-logo" alt="Nairobi Sweets"><div class="brand-text"><span>Nairobi</span><span>Sweets</span></div></a><a href="/" class="home-btn">Home</a></header>
<main class="wrap" id="app"><div class="loading">Loading profile...</div></main>
<nav class="bottom-nav"><a href="/">🏠</a><a href="/shorts.html">🔥</a><a href="/reel.html">🎬</a><a href="/join.html">➕</a><a href="/login.html">👤</a></nav>
<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRramx2eXludmd0aWpjY2l0dnZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDA4MzIsImV4cCI6MjA5MTExNjgzMn0.6wlZCQPJ2En4egpQUo5LAyQhee2hkCQ_tHGxfxbv1EQ";
const SITE_URL = "https://nairobi-sweets.com";
const sb = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app = document.getElementById("app");
const params = new URLSearchParams(window.location.search);
const profileId = params.get("id");
const slug = params.get("slug");
function esc(value=""){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function safePhone(phone){let p=String(phone||"").replace(/\D/g,"");if(!p)return"";if(p.startsWith("0"))p="254"+p.slice(1);if(p.startsWith("7")||p.startsWith("1"))p="254"+p;return p}
function getName(p){return p.stage_name||p.name||p.full_name||"Verified"}
function getLocation(p){return p.location||p.town||p.area||"Nairobi"}
function getImage(p){return p.photo_url||p.image_url||p.profile_photo||p.main_photo||p.photo||p.image||"/assets/logo/logo-badge.png"}
function getVideo(p){return p.reel_url||p.video_url||p.short_url||""}
function getPlan(p){return String(p.plan||p.tier||p.package||"featured").toLowerCase()}
function getBio(p){return p.about||p.bio||p.description||"Premium Nairobi Sweets profile."}
function getLikes(p){return Number(p.likes_count||p.likes||0)}
function getViews(p){return Number(p.views_count||p.views||0)}
function getBadge(p){if(Number(p.trending_score||0)>=1000)return"🔥 Trending";const plan=getPlan(p);if(plan.includes("signature"))return"👑 Signature";if(plan.includes("vvip"))return"👑 VVIP";if(plan.includes("vip"))return"✨ VIP";return"✨ Featured"}
function servicesOf(p){if(Array.isArray(p.services))return p.services;if(typeof p.services==="string")return p.services.split(",").map(s=>s.trim()).filter(Boolean);return[]}
function profileUrl(p){if(p&&p.id)return `${SITE_URL}/profile/${encodeURIComponent(p.id)}`;if(p&&p.slug)return `${SITE_URL}/profile.html?slug=${encodeURIComponent(p.slug)}`;return SITE_URL}
function whatsappText(p){return encodeURIComponent(`🔥 Nairobi Sweets\n\nHi ${getName(p)},\n\nI found your profile here:\n\n${profileUrl(p)}\n\n💎 Verified Profiles\n🔥 Nairobi Shorts\n🎬 Nairobi Reels`)}
async function trackEvent(eventName, profileId, profileName=""){
  const payload={profile_id:profileId,profile_name:profileName||"",event_name:eventName,event_type:eventName,source_page:window.location.pathname,created_at:new Date().toISOString()};
  try{const {error}=await sb.from("analytics_events").insert(payload);if(!error)return true;console.log("analytics_events insert failed:",error.message)}catch(err){console.log("analytics_events error:",err)}
  try{const {error}=await sb.from("profile_events").insert(payload);if(!error)return true;console.log("profile_events insert failed:",error.message)}catch(err){console.log("profile_events error:",err)}
  try{const tableMap={profile_views:"profile_views",profile_view:"profile_views",profile_opens:"profile_views",whatsapp_clicks:"whatsapp_clicks",whatsapp_click:"whatsapp_clicks",call_clicks:"call_clicks",call_click:"call_clicks"};const table=tableMap[eventName];if(table){await sb.from(table).insert({profile_id:profileId})}}catch(err){console.log("fallback analytics error:",err)}
  return false;
}
async function handleTrackedLink(event,eventName,profileId,url,newTab=false){event.preventDefault();await trackEvent(eventName,profileId,document.title.replace(" | Nairobi Sweets",""));if(newTab){window.open(url,"_blank","noopener")}else{window.location.href=url}return false}
async function incrementViews(p){const newViews=getViews(p)+1;try{await sb.rpc("increment_profile_views",{p_profile_id:p.id})}catch(e){await sb.from("profiles").update({views_count:newViews,views:newViews}).eq("id",p.id)}}
async function likeProfile(id){try{await sb.rpc("increment_profile_likes",{p_profile_id:id})}catch(e){const {data}=await sb.from("profiles").select("likes_count,likes").eq("id",id).single();const next=Number(data?.likes_count||data?.likes||0)+1;await sb.from("profiles").update({likes_count:next,likes:next}).eq("id",id)}location.reload()}
function shareProfile(){const url=window.location.href;if(navigator.share){navigator.share({title:document.title,text:"Check this Nairobi Sweets profile",url})}else{navigator.clipboard.writeText(url);alert("Profile link copied.")}}
function render(p){
  const phone=safePhone(p.phone||p.whatsapp);const video=getVideo(p);const services=servicesOf(p);const mapQuery=encodeURIComponent(getLocation(p)+", Kenya");
  document.title=`${getName(p)} | Nairobi Sweets`;
  document.querySelector("meta[name='description']").setAttribute("content",`${getName(p)} on Nairobi Sweets. Premium profile in ${getLocation(p)}.`);
  const media=video?`<video src="${esc(video)}" controls playsinline poster="${esc(getImage(p))}"></video>`:`<img src="${esc(getImage(p))}" onerror="this.src='/assets/logo/logo-badge.png'" alt="${esc(getName(p))}">`;
  const waUrl=phone?`https://wa.me/${phone}?text=${whatsappText(p)}`:"";
  app.innerHTML=`<section class="hero"><div class="media-wrap"><div class="badge-row"><span class="badge">${esc(getBadge(p))}</span>${p.verified?`<span class="badge">🛡️ Verified</span>`:""}${p.featured?`<span class="badge">⭐ Featured</span>`:""}</div>${media}</div><div class="content"><h1 class="name">${esc(getName(p))}</h1><div class="online">🟢 ${esc(p.availability||"Online Now")}</div><div class="meta">📍 ${esc(getLocation(p))}<br>📞 ${phone||"Hidden"}<br>❤️ ${getLikes(p)} likes · 👁️ ${getViews(p)} views</div><div class="bio">${esc(getBio(p))}</div><div class="actions">${phone?`<a class="action call" href="tel:${phone}" onclick="return handleTrackedLink(event,'call_clicks','${p.id}','tel:${phone}',false)">☎ CALL</a><a class="action whatsapp" href="${waUrl}" target="_blank" rel="noopener" onclick="return handleTrackedLink(event,'whatsapp_clicks','${p.id}','${waUrl}',true)">💬 WHATSAPP</a>`:`<button class="action call">Contact hidden</button>`}<button class="action share" onclick="shareProfile()">🔗 SHARE PROFILE</button><button class="action share" onclick="likeProfile('${p.id}')">❤️ LIKE PROFILE</button></div></div></section><section class="section"><h2>Premium Details</h2><div class="grid"><div class="info-box"><small>Age</small><strong>${esc(p.age||"Not listed")}</strong></div><div class="info-box"><small>Languages</small><strong>${esc(p.languages||"Not listed")}</strong></div><div class="info-box"><small>Nationality</small><strong>${esc(p.nationality||"Not listed")}</strong></div><div class="info-box"><small>Orientation</small><strong>${esc(p.orientation||"Not listed")}</strong></div><div class="info-box"><small>Height</small><strong>${esc(p.height||"Not listed")}</strong></div><div class="info-box"><small>Plan</small><strong>${esc(p.plan||"featured")}</strong></div></div></section><section class="section"><h2>Rates</h2><div class="grid"><div class="info-box"><small>Incall</small><strong>${esc(p.incall_price||"Ask on WhatsApp")}</strong></div><div class="info-box"><small>Outcall</small><strong>${esc(p.outcall_price||"Ask on WhatsApp")}</strong></div></div></section><section class="section"><h2>Services</h2><div class="tags">${services.length?services.map(s=>`<span>${esc(s)}</span>`).join(""):`<span>Ask on WhatsApp</span>`}</div></section><section class="section map"><h2>Location</h2><iframe src="https://maps.google.com/maps?q=${mapQuery}&t=&z=12&ie=UTF8&iwloc=&output=embed" loading="lazy" allowfullscreen></iframe></section><section class="section"><h2>Disclaimer</h2><p class="disclaimer">Nairobi Sweets is an advertising and discovery platform only. Profiles are independently managed. Users must act responsibly and comply with all applicable laws and regulations.</p></section>`;
  incrementViews(p);trackEvent("profile_views",p.id,getName(p));
}
function isApproved(profile){return profile.approved===true||profile.approved==="true"||profile.approved==="Yes"||profile.approved==="yes"||profile.approved===1}
async function loadProfile(){
  let query=sb.from("profiles").select("*").limit(1);
  if(profileId){query=query.eq("id",profileId)}else if(slug){query=query.eq("slug",slug)}else{app.innerHTML=`<div class="empty">No profile selected.</div>`;return}
  const {data,error}=await query;
  if(error){app.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}
  if(!data||data.length===0){app.innerHTML=`<div class="empty">Profile not found.</div>`;return}
  const profile=data[0];
  if(!isApproved(profile)){app.innerHTML=`<div class="empty">Profile awaiting approval.</div>`;return}
  render(profile);
}
loadProfile();
</script>
</body>
</html>
