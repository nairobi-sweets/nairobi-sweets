<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nairobi Sweets Profile</title>
  <meta name="description" content="Verified Nairobi Sweets profile with gallery, reels, coverage areas and direct contact options." />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta name="theme-color" content="#020312" />
  <link rel="canonical" id="canonicalLink" href="https://nairobi-sweets.com/profile.html" />
  <link rel="icon" href="/assets/logo/logo-badge.png" />

  <meta property="og:title" content="Nairobi Sweets Profile" />
  <meta property="og:description" content="Verified Nairobi Sweets profile." />
  <meta property="og:image" content="https://nairobi-sweets.com/assets/logo/logo-badge.png" />
  <meta property="og:url" content="https://nairobi-sweets.com/profile.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#000;
      --panel:#060847;
      --panel2:#080b67;
      --gold:#ffd84b;
      --gold2:#ffb92e;
      --blue:#061064;
      --pink:#ff2d75;
      --green:#25d366;
      --purple:#7c3aed;
      --line:rgba(255,216,75,.22);
      --soft:rgba(255,255,255,.08);
      --text:#fff;
      --muted:#d7d7e8;
      --shadow:0 28px 80px rgba(0,0,0,.72);
      --radius:34px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(12,20,109,.65), transparent 44%),
        linear-gradient(180deg,#020312 0%,#000 58%,#020312 100%);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      padding-bottom:96px;
      overflow-x:hidden;
    }
    body::selection{background:var(--gold);color:#000}
    a{text-decoration:none;color:inherit}
    button{font-family:inherit}

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      min-height:104px;
      background:rgba(0,0,0,.93);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:16px clamp(18px,4vw,42px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      color:var(--gold);
      font-weight:1000;
      letter-spacing:-2px;
      font-size:clamp(30px,4.8vw,58px);
      line-height:.82;
      text-shadow:0 0 24px rgba(255,216,75,.18);
    }
    .brand img{
      width:74px;
      height:74px;
      object-fit:cover;
      border-radius:22px;
      box-shadow:0 0 26px rgba(255,119,0,.28);
      flex:0 0 auto;
    }
    .home-btn{
      background:linear-gradient(145deg,#07146e,#040b49);
      color:var(--gold);
      border:1px solid rgba(255,216,75,.35);
      border-radius:24px;
      padding:16px 28px;
      font-weight:1000;
      font-size:20px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 28px rgba(0,0,0,.3);
    }

    .wrap{max-width:1260px;margin:38px auto;padding:0 clamp(12px,3vw,24px)}
    .loading,.error{
      min-height:60vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:var(--gold);
      font-size:clamp(24px,4vw,38px);
      font-weight:1000;
      padding:28px;
    }
    .profile-shell{
      background:linear-gradient(145deg,#03041b,#07085e 45%,#04052d);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .media-hero{
      position:relative;
      background:#02020c;
      border-bottom:1px solid var(--line);
      overflow:hidden;
    }
    .banner-img{
      width:100%;
      height:min(70vh,720px);
      min-height:360px;
      object-fit:cover;
      display:block;
      background:#090909;
      user-select:none;
      -webkit-user-drag:none;
    }
    .media-hero::after{
      content:"";
      position:absolute;
      inset:auto 0 0;
      height:38%;
      background:linear-gradient(180deg,transparent,rgba(0,0,0,.88));
      pointer-events:none;
    }
    .watermark{
      position:absolute;
      right:18px;
      bottom:18px;
      z-index:5;
      opacity:.72;
      display:flex;
      align-items:center;
      gap:8px;
      color:rgba(255,216,75,.9);
      font-weight:900;
      background:rgba(0,0,0,.45);
      border:1px solid rgba(255,216,75,.18);
      border-radius:999px;
      padding:8px 12px;
      pointer-events:none;
      backdrop-filter:blur(8px);
    }
    .watermark img{width:28px;height:28px;border-radius:50%;object-fit:cover}
    .hero-actions{
      position:absolute;
      left:18px;
      bottom:18px;
      z-index:6;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .mini-pill{
      background:rgba(0,0,0,.62);
      color:var(--gold);
      border:1px solid rgba(255,216,75,.28);
      border-radius:999px;
      padding:10px 14px;
      font-weight:1000;
      backdrop-filter:blur(10px);
    }

    .content{padding:clamp(24px,4vw,46px)}
    .badges,.chips,.stats-strip,.actions,.quick-nav{display:flex;flex-wrap:wrap;gap:12px}
    .badges{margin-bottom:18px}
    .badge,.chip,.stat{
      border-radius:999px;
      font-weight:1000;
      padding:12px 18px;
      border:1px solid rgba(255,216,75,.28);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    }
    .signature{background:linear-gradient(135deg,#ffd84b,#ff9f1c);color:#000}
    .vip{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff}
    .verified{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff}
    .featured,.chip,.stat{background:rgba(255,216,75,.12);color:var(--gold)}

    h1{
      margin:0 0 18px;
      color:var(--gold);
      font-size:clamp(44px,7vw,82px);
      line-height:.92;
      letter-spacing:-2px;
      text-transform:uppercase;
    }
    h2{
      color:var(--gold);
      font-size:clamp(28px,4vw,44px);
      margin:42px 0 18px;
      letter-spacing:-1px;
    }
    .meta,.bio{
      font-size:clamp(18px,2.2vw,24px);
      color:#f5f5ff;
      line-height:1.65;
    }
    .bio{margin:24px 0 0;color:#fff}
    .stats-strip{margin:22px 0 28px}.stat{font-size:18px;background:rgba(255,255,255,.07)}

    .info-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:14px;
      margin:26px 0;
    }
    .info-box{
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      border-radius:20px;
      padding:18px;
      font-size:18px;
      font-weight:900;
      color:#fff;
    }
    .chip{font-size:17px;background:rgba(255,216,75,.10)}

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:14px;
    }
    .gallery-grid img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-radius:22px;
      border:1px solid rgba(255,216,75,.18);
      background:#101010;
      cursor:pointer;
      user-select:none;
      -webkit-user-drag:none;
    }
    .reel-box{
      margin-top:18px;
      background:rgba(0,0,0,.28);
      border:1px solid rgba(255,216,75,.2);
      border-radius:28px;
      overflow:hidden;
    }
    .reel-box video{width:100%;max-height:680px;display:block;background:#000}

    .actions{margin-top:34px}.btn{
      border:none;
      cursor:pointer;
      min-width:190px;
      padding:18px 26px;
      border-radius:22px;
      font-weight:1000;
      font-size:20px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      box-shadow:0 16px 34px rgba(0,0,0,.26);
    }
    .wa{background:var(--green);color:#fff}.call{background:var(--gold);color:#000}.fav{background:var(--pink);color:#fff}.share{background:var(--purple);color:#fff}.back{background:#061064;color:var(--gold);border:1px solid rgba(255,216,75,.35)}

    .related-section{margin-top:54px}
    .related-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:18px;
    }
    .related-card{
      background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.035));
      border:1px solid rgba(255,216,75,.18);
      border-radius:24px;
      overflow:hidden;
      transition:transform .2s ease,border-color .2s ease;
    }
    .related-card:hover{transform:translateY(-3px);border-color:rgba(255,216,75,.5)}
    .related-card img{width:100%;height:190px;object-fit:cover;background:#111;display:block}
    .related-info{padding:14px}.related-info strong{display:block;color:var(--gold);font-size:18px;line-height:1.15}.related-info span{display:block;color:#e7e7f7;margin-top:6px}.related-badge{font-size:13px;color:#000;background:var(--gold);padding:6px 9px;border-radius:999px;font-weight:1000;display:inline-block;margin-top:10px}
    .quick-nav{margin-top:28px}.quick-nav .btn{min-width:220px}

    .lightbox{
      position:fixed;
      inset:0;
      z-index:200;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.92);
      padding:20px;
    }
    .lightbox.active{display:flex}.lightbox img{max-width:96vw;max-height:88vh;border-radius:24px;border:1px solid var(--line);user-select:none;-webkit-user-drag:none}.lightbox button{position:absolute;top:22px;right:22px;border:none;border-radius:999px;background:var(--gold);color:#000;font-weight:1000;padding:12px 16px;font-size:20px;cursor:pointer}

    .bottom-nav{
      position:fixed;
      left:0;right:0;bottom:0;
      height:78px;
      z-index:120;
      background:rgba(0,0,0,.92);
      border-top:1px solid rgba(255,216,75,.15);
      display:flex;
      justify-content:space-around;
      align-items:center;
      backdrop-filter:blur(14px);
    }
    .bottom-nav a{font-size:28px;color:var(--gold);opacity:.95}

    @media(max-width:920px){.info-grid,.related-grid,.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.banner-img{height:62vh}}
    @media(max-width:620px){
      body{padding-bottom:86px}.topbar{min-height:92px;padding:12px 18px}.brand{font-size:34px;letter-spacing:-1px}.brand img{width:62px;height:62px}.home-btn{font-size:18px;padding:13px 22px}.wrap{margin:0 auto;padding:0}.profile-shell{border-radius:0;border-left:none;border-right:none}.content{padding:24px}.banner-img{height:auto;min-height:0;aspect-ratio:1/1.22;object-fit:cover}.info-grid,.related-grid,.gallery-grid{grid-template-columns:1fr}.related-card img{height:240px}.btn{width:100%;min-width:0}.stats-strip{display:grid;grid-template-columns:1fr 1fr}.stat{font-size:16px;padding:11px 12px}.hero-actions{display:none}.watermark{font-size:12px;right:10px;bottom:10px}.quick-nav .btn{width:100%}
    }
  </style>
</head>
<body oncontextmenu="return false">
  <header class="topbar">
    <a href="/" class="brand" aria-label="Nairobi Sweets home">
      <img src="/assets/logo/logo-badge.png" onerror="this.src='/logo.png'" alt="Nairobi Sweets logo" />
      <span>Nairobi<br>Sweets</span>
    </a>
    <a class="home-btn" href="/">Home</a>
  </header>

  <main id="app"><div class="loading">Loading profile...</div></main>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button type="button" onclick="closeLightbox()">×</button>
    <img id="lightboxImg" src="" alt="Gallery preview" />
  </div>

  <nav class="bottom-nav" aria-label="Bottom navigation">
    <a href="/" aria-label="Home">🏠</a>
    <a href="/trending.html" aria-label="Trending">🔥</a>
    <a href="/shorts.html" aria-label="Shorts">🎬</a>
    <a href="/join.html" aria-label="Join">➕</a>
  </nav>

  <script>
    const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const app = document.getElementById("app");
    let currentProfile = null;
    let relatedProfiles = [];

    function getSlug(){
      const q = new URLSearchParams(location.search).get("slug");
      if(q) return q.trim();
      const parts = location.pathname.split("/").filter(Boolean);
      if(parts[0] === "profile" && parts[1]) return decodeURIComponent(parts[1]).trim();
      return "";
    }

    function escapeHTML(v){
      return String(v ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function cleanPhone(phone){
      if(!phone) return "";
      let p = String(phone).replace(/\D/g,"");
      if(p.startsWith("0")) p = "254" + p.slice(1);
      if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
      return p;
    }

    function safeArray(value){
      if(!value) return [];
      if(Array.isArray(value)) return value.map(x => String(x).trim()).filter(Boolean);
      try{
        const parsed = JSON.parse(value);
        if(Array.isArray(parsed)) return parsed.map(x => String(x).trim()).filter(Boolean);
      }catch(e){}
      return String(value).split(/[,;\n]/).map(x => x.trim()).filter(Boolean);
    }

    function unique(arr){return [...new Set(arr.filter(Boolean))]}

    function mainImage(p){
      return p.signature_banner_url || p.banner_url || p.cover_image || p.image_url || p.photo_url || p.main_image || "/assets/logo/logo-badge.png";
    }

    function reelUrl(p){
      return p.reel_url || p.reel || p.short_video || p.video_url || "";
    }

    function galleryImages(p){
      return unique([
        mainImage(p),
        ...safeArray(p.gallery_images),
        ...safeArray(p.gallery),
        ...safeArray(p.images),
        ...safeArray(p.image_urls),
        p.image_url_2,
        p.image_url_3,
        p.image2,
        p.image3
      ]);
    }

    function isTrue(v){return v === true || String(v).toLowerCase() === "true" || String(v) === "1"}
    function planLower(p){return String(p.plan || "featured").toLowerCase()}

    function badges(p){
      const plan = planLower(p);
      let html = "";
      if(plan.includes("signature") || plan.includes("vvip") || isTrue(p.is_signature)) html += `<span class="badge signature">👑 Signature</span>`;
      else if(plan.includes("vip")) html += `<span class="badge vip">⭐ VIP</span>`;
      else html += `<span class="badge featured">🔥 Featured</span>`;
      if(isTrue(p.verified)) html += `<span class="badge verified">✅ Verified</span>`;
      return html;
    }

    function profileUrl(p=currentProfile){
      return `https://nairobi-sweets.com/profile.html?slug=${encodeURIComponent(p?.slug || getSlug())}`;
    }

    function trendingScore(p){
      return (Number(p.boost || 0) * 1000) + Number(p.views || 0) + Number(p.whatsapp_clicks || 0) * 10 + Number(p.call_clicks || 0) * 20 + Number(p.favorites || 0) * 15 + Number(p.profile_shares || 0) * 8;
    }

    async function incrementColumn(column){
      if(!currentProfile?.id) return;
      const value = Number(currentProfile[column] || 0) + 1;
      currentProfile[column] = value;
      const el = document.getElementById(column);
      if(el) el.textContent = value;
      try{ await sb.from("profiles").update({[column]:value}).eq("id", currentProfile.id); }catch(e){ console.log("Counter skipped", e.message); }
    }

    async function logEvent(type){
      if(!currentProfile?.id) return;
      try{ await sb.from("profile_analytics").insert({profile_id:currentProfile.id,event_type:type}); }catch(e){ console.log("Analytics skipped", e.message); }
    }

    function updateSEO(p){
      const title = `${p.stage_name || p.name || "Profile"} | Nairobi Sweets`;
      const desc = `${p.stage_name || p.name || "Profile"} in ${p.location || "Nairobi"}. Verified Nairobi Sweets profile with gallery and direct contact.`;
      const url = profileUrl(p);
      const img = mainImage(p);
      document.title = title;
      document.querySelector('meta[name="description"]')?.setAttribute("content", desc);
      document.querySelector('meta[property="og:title"]')?.setAttribute("content", title);
      document.querySelector('meta[property="og:description"]')?.setAttribute("content", desc);
      document.querySelector('meta[property="og:image"]')?.setAttribute("content", img);
      document.querySelector('meta[property="og:url"]')?.setAttribute("content", url);
      document.querySelector('#canonicalLink')?.setAttribute("href", url);
      injectSchema(p, desc, img, url);
    }

    function injectSchema(p, desc, img, url){
      document.getElementById("profileSchema")?.remove();
      const script = document.createElement("script");
      script.id = "profileSchema";
      script.type = "application/ld+json";
      script.textContent = JSON.stringify({
        "@context":"https://schema.org",
        "@type":"WebPage",
        "name":`${p.stage_name || p.name || "Profile"} | Nairobi Sweets`,
        "description":desc,
        "url":url,
        "image":img,
        "publisher":{"@type":"Organization","name":"Nairobi Sweets","url":"https://nairobi-sweets.com"}
      });
      document.head.appendChild(script);
    }

    function relatedCard(p){
      const plan = planLower(p);
      const tag = plan.includes("signature") ? "Signature" : plan.includes("vip") ? "VIP" : "Featured";
      return `
        <a class="related-card" href="/profile.html?slug=${encodeURIComponent(p.slug)}">
          <img src="${mainImage(p)}" loading="lazy" onerror="this.src='/assets/logo/logo-badge.png'" alt="${escapeHTML(p.stage_name || 'Profile')}">
          <div class="related-info">
            <strong>${escapeHTML(p.stage_name || p.name || 'Profile')}</strong>
            <span>📍 ${escapeHTML(p.location || 'Nairobi')}</span>
            <span class="related-badge">${escapeHTML(tag)}</span>
          </div>
        </a>`;
    }

    function renderRelated(){
      if(!relatedProfiles.length) return "";
      const loc = String(currentProfile.location || "").toLowerCase();
      const plan = planLower(currentProfile);
      const sameLocation = relatedProfiles.filter(p => String(p.location || "").toLowerCase() === loc).slice(0,4);
      const samePlan = relatedProfiles.filter(p => planLower(p) === plan).slice(0,4);
      const top = relatedProfiles.slice().sort((a,b)=>trendingScore(b)-trendingScore(a)).slice(0,8);
      return `
        <section class="related-section">
          <h2>🔥 More Profiles You May Like</h2>
          <div class="related-grid">${top.map(relatedCard).join("")}</div>
          ${sameLocation.length ? `<h2>📍 More in ${escapeHTML(currentProfile.location)}</h2><div class="related-grid">${sameLocation.map(relatedCard).join("")}</div>` : ""}
          ${samePlan.length ? `<h2>💎 More ${escapeHTML(currentProfile.plan || 'Featured')} Profiles</h2><div class="related-grid">${samePlan.map(relatedCard).join("")}</div>` : ""}
        </section>`;
    }

    function renderPrevNext(){
      if(!relatedProfiles.length) return "";
      const sorted = relatedProfiles.slice().sort((a,b)=>trendingScore(b)-trendingScore(a));
      const prev = sorted[0];
      const next = sorted[1] || sorted[0];
      return `<div class="quick-nav">
        ${prev ? `<a class="btn back" href="/profile.html?slug=${encodeURIComponent(prev.slug)}">⬅ Previous Profile</a>` : ""}
        ${next ? `<a class="btn back" href="/profile.html?slug=${encodeURIComponent(next.slug)}">Next Profile ➜</a>` : ""}
      </div>`;
    }

    function openLightbox(src){
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").classList.add("active");
    }
    function closeLightbox(){document.getElementById("lightbox").classList.remove("active")}

    function renderProfile(p){
      currentProfile = p;
      updateSEO(p);
      const name = escapeHTML(p.stage_name || p.name || "Nairobi Sweet");
      const locationName = escapeHTML(p.location || "Nairobi");
      const areas = unique([...safeArray(p.coverage_areas), ...safeArray(p.coverage), ...safeArray(p.areas), ...safeArray(p.location)]);
      const services = safeArray(p.services);
      const gallery = galleryImages(p);
      const reel = reelUrl(p);
      const whatsapp = cleanPhone(p.whatsapp || p.whatsapp_number || p.phone);
      const phone = cleanPhone(p.phone || p.call_number || p.whatsapp);
      const waText = encodeURIComponent(`Hi ${p.stage_name || 'there'}, I found your profile on Nairobi Sweets: ${profileUrl(p)}`);
      const bio = escapeHTML(p.bio || p.description || p.about || `Verified Nairobi Sweets profile in ${p.location || 'Nairobi'}.`);

      app.innerHTML = `
        <section class="wrap">
          <article class="profile-shell">
            <section class="media-hero">
              <img class="banner-img" src="${gallery[0]}" alt="${name}" onerror="this.src='/assets/logo/logo-badge.png'">
              <div class="hero-actions">
                <span class="mini-pill">🔥 Score ${trendingScore(p)}</span>
                <span class="mini-pill">👁 ${Number(p.views || 0)} Views</span>
              </div>
              <div class="watermark"><img src="/assets/logo/logo-badge.png" onerror="this.style.display='none'">NAIROBI-SWEETS.COM</div>
            </section>

            <section class="content">
              <div class="badges">${badges(p)}</div>
              <h1>${name}</h1>
              <div class="meta">
                📍 ${locationName} · ${isTrue(p.online) ? "🟢 Online Now" : "⚪ Offline"}<br>
                💎 Plan: ${escapeHTML(p.plan || 'Featured')}
              </div>

              <div class="stats-strip">
                <span class="stat">👁 <span id="views">${Number(p.views || 0)}</span> Views</span>
                <span class="stat">💬 <span id="whatsapp_clicks">${Number(p.whatsapp_clicks || 0)}</span> WhatsApp</span>
                <span class="stat">☎ <span id="call_clicks">${Number(p.call_clicks || 0)}</span> Calls</span>
                <span class="stat">❤️ <span id="favorites">${Number(p.favorites || 0)}</span> Favorites</span>
                <span class="stat">🔗 <span id="profile_shares">${Number(p.profile_shares || 0)}</span> Shares</span>
              </div>

              <div class="info-grid">
                <div class="info-box">🎂 Age: ${escapeHTML(p.age || 'N/A')}</div>
                <div class="info-box">💃 Body: ${escapeHTML(p.body_type || 'N/A')}</div>
                <div class="info-box">🏨 Meeting: ${escapeHTML(p.meeting_place || 'Ask')}</div>
                <div class="info-box">💰 Rate: ${escapeHTML(p.rate || 'Ask')}</div>
              </div>

              <p class="bio">${bio}</p>

              ${services.length ? `<h2>Services</h2><div class="chips">${services.map(s=>`<span class="chip">✓ ${escapeHTML(s)}</span>`).join("")}</div>` : ""}
              ${areas.length ? `<h2>Coverage Areas</h2><div class="chips">${areas.map(a=>`<span class="chip">📍 ${escapeHTML(a)}</span>`).join("")}</div>` : ""}
              ${reel ? `<h2>Reel</h2><div class="reel-box"><video src="${reel}" controls playsinline preload="metadata"></video></div>` : ""}
              ${gallery.length > 1 ? `<h2>Gallery</h2><div class="gallery-grid">${gallery.map(img=>`<img src="${img}" loading="lazy" onclick="openLightbox('${String(img).replaceAll("'","%27")}')" onerror="this.style.display='none'" alt="${name}">`).join("")}</div>` : ""}

              <div class="actions">
                ${whatsapp ? `<a class="btn wa" href="https://wa.me/${whatsapp}?text=${waText}" target="_blank" rel="noopener" onclick="incrementColumn('whatsapp_clicks');logEvent('whatsapp')">💬 WhatsApp</a>` : ""}
                ${phone ? `<a class="btn call" href="tel:+${phone}" onclick="incrementColumn('call_clicks');logEvent('call')">☎ Call</a>` : ""}
                <button class="btn fav" type="button" onclick="incrementColumn('favorites');logEvent('favorite')">❤️ Favorite</button>
                <button class="btn share" type="button" onclick="shareProfile()">🔗 Share</button>
                <a class="btn back" href="/">🏠 Back Home</a>
              </div>

              ${renderPrevNext()}
              ${renderRelated()}
            </section>
          </article>
        </section>`;
    }

    async function shareProfile(){
      if(!currentProfile) return;
      const url = profileUrl(currentProfile);
      await incrementColumn("profile_shares");
      await logEvent("share");
      if(navigator.share){
        try{ await navigator.share({title:document.title,url}); }catch(e){}
      }else{
        await navigator.clipboard.writeText(url);
        alert("Profile link copied!");
      }
    }

    async function loadProfile(){
      const slug = getSlug();
      if(!slug){ app.innerHTML = `<div class="error">Profile slug missing.</div>`; return; }

      const {data,error} = await sb.from("profiles").select("*").eq("slug", slug).eq("approved", true).maybeSingle();
      if(error){ app.innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`; return; }
      if(!data){ app.innerHTML = `<div class="error">Profile not found.</div>`; return; }

      const {data:rel,error:relError} = await sb.from("profiles").select("*").eq("approved", true).neq("id", data.id).limit(40);
      relatedProfiles = relError ? [] : (rel || []);

      renderProfile(data);
      await incrementColumn("views");
      await logEvent("view");
    }

    document.addEventListener("dragstart", e => e.preventDefault());
    loadProfile();
  </script>
</body>
</html>
