<style>
:root{
  --gold:#ffd84b;
  --navy:#050750;
  --line:rgba(255,216,75,.22);
  --green:#25d366;
  --pink:#ff2d75;
  --purple:#7c3aed;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#000}
body{
  margin:0;
  background:radial-gradient(circle at top,#07105a 0%,#010212 48%,#000 100%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:98px;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
img,video{max-width:100%;display:block}
button{font:inherit}

.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  min-height:88px;
  background:rgba(0,0,0,.95);
  border-bottom:1px solid rgba(255,216,75,.18);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 28px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--gold);
  font-size:34px;
  font-weight:950;
  line-height:.82;
  letter-spacing:-1.4px;
}
.brand img{
  width:64px;
  height:64px;
  object-fit:cover;
  border-radius:18px;
}
.home-btn{
  background:#07106a;
  color:var(--gold);
  border:1px solid rgba(255,216,75,.34);
  padding:13px 25px;
  border-radius:20px;
  font-size:18px;
  font-weight:950;
}
.page{max-width:1180px;margin:0 auto;padding:22px 16px 96px}
.profile-card{
  background:linear-gradient(145deg,#02031d,#06075e 62%,#05063d);
  border:1px solid var(--line);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 0 42px rgba(0,0,0,.72);
}
.hero{position:relative;background:#01020e;overflow:hidden}
.hero-img{
  width:100%;
  height:430px;
  object-fit:cover;
  object-position:center top;
  background:#020315;
}
.hero::after{
  content:"";
  position:absolute;
  inset:auto 0 0 0;
  height:46%;
  background:linear-gradient(to top,rgba(0,0,0,.82),transparent);
}
.hero-row{
  position:absolute;
  left:18px;
  right:18px;
  bottom:18px;
  z-index:3;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
}
.score-row{display:flex;gap:8px;flex-wrap:wrap}
.hero-pill,.watermark{
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,216,75,.28);
  color:var(--gold);
  border-radius:999px;
  font-weight:900;
  font-size:13px;
  padding:9px 12px;
  white-space:nowrap;
}
.watermark{display:flex;align-items:center;gap:7px;letter-spacing:.35px}
.watermark img{width:22px;height:22px;border-radius:50%}
.content{padding:24px 30px 34px}
.badges,.stats,.chips,.actions{display:flex;flex-wrap:wrap;gap:10px}
.badge,.stat,.chip{
  border-radius:999px;
  font-weight:900;
  padding:9px 14px;
  font-size:14px;
  border:1px solid rgba(255,216,75,.28);
}
.badge.signature{background:linear-gradient(135deg,#ffd84b,#ff9f1c);color:#000}
.badge.vip{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff}
.badge.verified{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff}
.badge.featured,.stat,.chip{background:rgba(255,216,75,.1);color:var(--gold)}
.signature-banner{
  display:none;
  margin:0 0 16px;
  padding:12px 18px;
  border-radius:18px;
  background:linear-gradient(90deg,#ffd84b,#ff9f1c,#ffd84b);
  color:#000;
  font-weight:950;
  text-align:center;
}
.signature-banner.show{display:block}
h1{
  color:var(--gold);
  font-size:42px;
  line-height:.96;
  margin:16px 0 12px;
  text-transform:uppercase;
  letter-spacing:-1.2px;
}
h2{color:var(--gold);font-size:27px;line-height:1.08;margin:28px 0 14px}
.meta,.bio{color:#f6f6f6;font-size:17px;line-height:1.55}
.bio{margin:18px 0 4px;max-width:900px}
.stats{margin:18px 0}
.info-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:20px 0;
}
.info-box{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  padding:14px 16px;
  border-radius:16px;
  font-size:15px;
  font-weight:850;
}
.gallery-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gallery-item{
  height:250px;
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#111;

}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-item span{
  position:absolute;
  right:8px;

  color:var(--gold);

  font-size:10px;
  font-weight:900;
}
.reel-box{
  max-width:360px;
  border-radius:22px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#000;
}
.reel-box video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000}
.btn{
  border:none;
  cursor:pointer;
  min-width:150px;
  padding:14px 18px;
  border-radius:18px;
  font-size:16px;
  font-weight:950;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-align:center;
}
.fav{background:var(--pink);color:#fff}
.share{background:var(--purple);color:#fff}
.back{background:#07106a;color:var(--gold);border:1px solid rgba(255,216,75,.32)}
.actions.compact-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:24px;
}
.actions.compact-actions .back{grid-column:1/-1}
.profile-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}
.feed-section{
  margin-top:34px;
  border-top:1px solid rgba(255,216,75,.16);
  padding-top:22px;
}
.feed-block{margin:0 0 30px}
.feed-block h2{font-size:24px}
.mini-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mini-card{
  background:linear-gradient(180deg,#11136e,#070943);
  border:1px solid rgba(255,216,75,.24);
  border-radius:16px;
  overflow:hidden;
}
.mini-media{height:180px;position:relative;background:#111}
.mini-media img{width:100%;height:100%;object-fit:cover}
.mini-score{
  position:absolute;
  left:8px;
  bottom:8px;
  background:rgba(0,0,0,.7);
  color:var(--gold);
  border-radius:999px;
  padding:6px 9px;
  font-size:12px;
  font-weight:950;
}
.mini-body{padding:12px}
.mini-name{color:var(--gold);font-size:16px;font-weight:950;margin-bottom:7px}
.mini-meta{font-size:13px;color:#f3f3f3}
.mini-plan{
  margin-top:10px;
  background:var(--gold);
  color:#07105a;
  border-radius:999px;
  padding:6px 8px;
  text-align:center;
  font-size:11px;
  font-weight:950;
  text-transform:uppercase;
}
.seo-links{
  margin-top:32px;
  padding:20px;
  border-radius:20px;
  border:1px solid rgba(255,216,75,.18);
  background:rgba(255,255,255,.04);
}
.seo-links h2{margin-top:0;font-size:22px}
.seo-link-grid{display:flex;flex-wrap:wrap;gap:10px}
.seo-link-grid a{
  color:var(--gold);
  background:rgba(255,216,75,.08);
  border:1px solid rgba(255,216,75,.18);
  border-radius:999px;
  padding:9px 12px;
  font-size:13px;
  font-weight:900;
}
.sticky-contact{
  position:fixed;
  left:50%;
  bottom:72px;
  transform:translateX(-50%);
  width:calc(100% - 28px);
  max-width:460px;
  display:none;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:7px;
  background:rgba(5,7,20,.72);
  border:1px solid rgba(255,216,75,.18);
  border-radius:22px;
  box-shadow:0 14px 35px rgba(0,0,0,.55);
  backdrop-filter:blur(16px);
  z-index:9999;
}
.sticky-contact.show{display:grid}
.sticky-contact .btn{
  height:44px;
  min-height:44px;
  padding:0 10px;
  border-radius:16px;
  font-size:14px;
  min-width:0;
}
.wa{background:linear-gradient(180deg,#2be678,#16bd5a);color:#fff}
.call{background:linear-gradient(180deg,#ffe15b,#ffc928);color:#050505}
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:9998;
  height:60px;
  background:rgba(0,0,0,.96);
  border-top:1px solid rgba(255,216,75,.15);
  display:flex;
  justify-content:space-around;
  align-items:center;
}
.bottom-nav a{font-size:24px;color:var(--gold)}
.error{
  min-height:58vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold);
  font-size:24px;
  font-weight:950;
  text-align:center;
  padding:30px;
}
@media(max-width:920px){
  .gallery-row,.mini-row{grid-template-columns:repeat(2,1fr)}
  .info-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .site-header{min-height:78px;padding:10px 16px}
  .brand{font-size:26px}
  .brand img{width:54px;height:54px}
  .home-btn{font-size:14px;padding:11px 18px}
  .page{padding:0 0 88px}
  .profile-card{border-radius:0;border-left:0;border-right:0}
  .hero-img{height:330px}
  .hero-row{left:10px;right:10px;bottom:10px}
  .watermark{font-size:10px;padding:7px 9px}
  .hero-pill{font-size:12px;padding:7px 9px}
  .content{padding:20px 18px 28px}
  h1{font-size:31px}
  h2{font-size:23px}
  .meta,.bio{font-size:16px}
  .info-grid{grid-template-columns:1fr}
  .gallery-row,.mini-row{grid-template-columns:1fr 1fr}
  .gallery-item{height:210px}
  .mini-media{height:160px}
  .actions.compact-actions{grid-template-columns:1fr}
  .profile-nav{grid-template-columns:1fr}
}
</style>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SITE_URL = "https://nairobi-sweets.com";
const FALLBACK_IMAGE = "/assets/logo/logo-badge.png";
const ABS_FALLBACK_IMAGE = SITE_URL + "/assets/logo/logo-badge.png";

const app = document.getElementById("app");
const stickyContact = document.getElementById("stickyContact");

let currentProfile = null;
let relatedProfiles = [];

function getSlug(){
  const q = new URLSearchParams(location.search).get("slug");
  if(q) return q.trim();
  const parts = location.pathname.split("/").filter(Boolean);
  return parts[0] === "profile" && parts[1] ? decodeURIComponent(parts[1]).trim() : "";
}

function getIdParam(){
  return new URLSearchParams(location.search).get("id");
}

function makeSlug(value){
  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function escapeHTML(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function cleanPhone(phone){
  if(!phone) return "";
  let p = String(phone).replace(/\D/g,"");
  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
  return p;
}

function safeArray(value){
  if(value == null) return [];
  let out = [];

  if(Array.isArray(value)){
    out = value;
  }else if(typeof value === "string"){
    const raw = value.trim();
    if(!raw || raw === "[]") return [];
    try{
      const parsed = JSON.parse(raw);
      out = Array.isArray(parsed) ? parsed : [parsed];
    }catch(e){
      out = raw.split(/[,;\n]/);
    }
  }else{
    out = [value];
  }

  return out
    .flatMap(x => Array.isArray(x) ? x : [x])
    .map(x => String(x ?? "").trim().replace(/^\[+|\]+$/g,"").replace(/^['"]+|['"]+$/g,"").trim())
    .filter(x => x && !["0","[]","null","undefined","nan"].includes(x.toLowerCase()))
    .filter((x,i,a) => a.indexOf(x) === i);
}

function absUrl(url){
  const s = String(url || "").trim();
  if(!s) return "";
  if(s.startsWith("http://") || s.startsWith("https://")) return s;
  if(s.startsWith("/")) return SITE_URL + s;
  return s;
}

function mainImage(p){
  return (
    p.profile_image_url ||
    p.cover_image_url ||
    p.signature_banner_url ||
    p.banner_url ||
    p.image_url ||
    p.photo_url ||
    p.image2_url ||
    p.image3_url ||
    p.image_url_2 ||
    p.image_url_3 ||
    p.avatar_url ||
    p.image_path ||
    p.main_image ||
    p.profile_photo ||
    p.main_photo ||
    p.photo ||
    p.image ||
    FALLBACK_IMAGE
  );
}

function galleryImages(p){
  const arr = [
    ...safeArray(p.gallery_images),
    ...safeArray(p.gallery),
    ...safeArray(p.images),
    ...safeArray(p.image_urls),
    p.image_url,
    p.photo_url,
    p.image2_url,
    p.image3_url,
    p.image_url_2,
    p.image_url_3,
    p.avatar_url,
    p.image_path
  ].filter(Boolean);

  return [...new Set([mainImage(p), ...arr].filter(Boolean))];
}

function reelUrl(p){
  return p.reel_url || p.reel || p.short_video || p.video_url || p.short_url || "";
}

function profileSlug(p){
  return makeSlug(p.slug || `${p.stage_name || p.name || "profile"}-${p.location || p.id}`);
}

function profileUrl(p){
  const slug = profileSlug(p);
  if(slug) return `${SITE_URL}/profile.html?slug=${encodeURIComponent(slug)}`;
  return `${SITE_URL}/profile.html?id=${encodeURIComponent(p.id || "")}`;
}

function localProfileUrl(p){
  const slug = profileSlug(p);
  if(slug) return `/profile.html?slug=${encodeURIComponent(slug)}`;
  return `/profile.html?id=${encodeURIComponent(p.id || "")}`;
}

function planText(p){
  return String(p.plan || p.plan_name || p.package || p.tier || "Featured").trim();
}

function isSignature(p){
  const plan = planText(p).toLowerCase();
  return plan.includes("signature") || plan.includes("vvip") || p.is_signature === true || p.signature === true || p.is_vvip === true || p.vvip === true;
}

function isVip(p){
  const plan = planText(p).toLowerCase();
  return (plan.includes("vip") && !isSignature(p)) || p.is_vip === true || p.vip === true;
}

function niceTitle(v){
  return String(v || "")
    .replace(/[-_]+/g," ")
    .replace(/\s+/g," ")
    .trim()
    .replace(/\b\w/g,c => c.toUpperCase());
}

function displayName(p){
  const raw = String(p.stage_name || p.name || p.full_name || "Nairobi Sweet").trim();
  const lower = raw.toLowerCase().replace(/\s+/g,"");
  if(lower === "pretiezari" || lower === "prettiezari" || lower === "pretie-zari") return "Pretie Zari";
  return niceTitle(raw);
}

function locationParts(p){
  return safeArray(p.coverage_areas || p.coverage || p.areas || p.location).concat(safeArray(p.location));
}

function primaryLocation(p){
  const arr = locationParts(p);
  return arr[0] || "Nairobi";
}

function sameLocation(a,b){
  const aa = locationParts(a).map(x => x.toLowerCase());
  const bb = locationParts(b).map(x => x.toLowerCase());
  return aa.some(x => bb.some(y => x === y || x.includes(y) || y.includes(x)));
}

function score(p){
  return Math.round(
    Number(p.boost || 0) * 1000 +
    Number(p.views || 0) +
    Number(p.whatsapp_clicks || 0) * 10 +
    Number(p.call_clicks || 0) * 15 +
    Number(p.favorites || 0) * 12 +
    Number(p.profile_shares || 0) * 7
  );
}

function badgeHTML(p){
  let html = "";
  if(isSignature(p)) html += `<span class="badge signature">👑 Signature</span>`;
  else if(isVip(p)) html += `<span class="badge vip">⭐ VIP</span>`;
  else html += `<span class="badge featured">🔥 Featured</span>`;

  if(p.verified === true || p.verified === "true" || p.is_verified === true){
    html += `<span class="badge verified">✅ Verified</span>`;
  }
  return html;
}

function renderServices(raw){
  let services = safeArray(raw);
  if(!services.length) services = ["Professional Massage"];
  return services.map(s => `<span class="chip">✓ ${escapeHTML(s)}</span>`).join("");
}

function setMeta(selector,value){
  const el = document.querySelector(selector);
  if(el) el.setAttribute("content",value);
}

function updateSEO(p){
  const name = displayName(p);
  const loc = primaryLocation(p);
  const plan = planText(p);
  const img = absUrl(mainImage(p)) || ABS_FALLBACK_IMAGE;
  const url = profileUrl(p);
  const slug = profileSlug(p);
  const title = `${name} | ${plan} Profile in ${loc} | Nairobi Sweets`;
  const desc = `View ${name}'s ${plan} profile in ${loc}. Browse photos, services, coverage areas, direct WhatsApp contact and call options on Nairobi Sweets.`;

  document.title = title;

  setMeta('meta[name="description"]',desc);
  setMeta('meta[property="og:title"]',title);
  setMeta('meta[property="og:description"]',desc);
  setMeta('meta[property="og:image"]',img);
  setMeta('meta[property="og:url"]',url);
  setMeta('meta[property="og:type"]',"profile");

  setMeta('meta[name="twitter:title"]',title);
  setMeta('meta[name="twitter:description"]',desc);
  setMeta('meta[name="twitter:image"]',img);

  const canonical = document.querySelector('link[rel="canonical"]');
  if(canonical) canonical.setAttribute("href",url);

  const phone = cleanPhone(p.phone || p.whatsapp);
  const gallery = galleryImages(p).map(absUrl).filter(Boolean);
  const services = safeArray(p.services);
  const coverage = safeArray(p.coverage_areas || p.coverage || p.areas || p.location);

  const schema = {
    "@context":"https://schema.org",
    "@graph":[
      {
        "@type":"WebSite",
        "@id":`${SITE_URL}/#website`,
        "name":"Nairobi Sweets",
        "url":SITE_URL
      },
      {
        "@type":"Organization",
        "@id":`${SITE_URL}/#organization`,
        "name":"Nairobi Sweets",
        "url":SITE_URL,
        "logo":{
          "@type":"ImageObject",
          "url":ABS_FALLBACK_IMAGE
        }
      },
      {
        "@type":"BreadcrumbList",
        "@id":`${url}#breadcrumb`,
        "itemListElement":[
          {
            "@type":"ListItem",
            "position":1,
            "name":"Home",
            "item":SITE_URL + "/"
          },
          {
            "@type":"ListItem",
            "position":2,
            "name":loc,
            "item":`${SITE_URL}/seo/locations/${makeSlug(loc)}.html`
          },
          {
            "@type":"ListItem",
            "position":3,
            "name":name,
            "item":url
          }
        ]
      },
      {
        "@type":"ProfilePage",
        "@id":`${url}#profilepage`,
        "name":title,
        "description":desc,
        "url":url,
        "isPartOf":{"@id":`${SITE_URL}/#website`},
        "breadcrumb":{"@id":`${url}#breadcrumb`},
        "primaryImageOfPage":{
          "@type":"ImageObject",
          "url":img
        },
        "mainEntity":{"@id":`${url}#person`}
      },
      {
        "@type":"Person",
        "@id":`${url}#person`,
        "name":name,
        "url":url,
        "image":gallery.length ? gallery : [img],
        "description":desc,
        "telephone":phone ? `+${phone}` : undefined,
        "address":{
          "@type":"PostalAddress",
          "addressLocality":loc,
          "addressCountry":"KE"
        },
        "knowsAbout":services.length ? services : ["Professional Massage"],
        "areaServed":coverage.length ? coverage.map(a => ({
          "@type":"Place",
          "name":a
        })) : [{
          "@type":"Place",
          "name":loc
        }]
      }
    ]
  };

  document.getElementById("schema-json").textContent = JSON.stringify(schema, null, 2);
}

async function incrementColumn(column){
  if(!currentProfile?.id) return;
  const next = Number(currentProfile[column] || 0) + 1;
  currentProfile[column] = next;

  try{
    await sb.from("profiles").update({[column]:next}).eq("id",currentProfile.id);
    const el = document.getElementById(column);
    if(el) el.textContent = next;
    const hv = document.getElementById("hero_views");
    if(column === "views" && hv) hv.textContent = next;
    const hs = document.getElementById("hero_score");
    if(hs) hs.textContent = score(currentProfile);
  }catch(e){}
}

async function logEvent(type){
  if(!currentProfile?.id) return;
  try{await sb.from("profile_analytics").insert({profile_id:currentProfile.id,event_type:type});}catch(e){}
  try{await sb.from("profile_events").insert({profile_id:currentProfile.id,event_type:type});}catch(e){}
}

function miniCard(p){
  return `
    <a class="mini-card" href="${localProfileUrl(p)}">
      <div class="mini-media">
        <img src="${escapeHTML(mainImage(p))}" loading="lazy" alt="${escapeHTML(displayName(p))}" onerror="this.src='${FALLBACK_IMAGE}'">
        <span class="mini-score">🔥 ${score(p)}</span>
      </div>
      <div class="mini-body">
        <div class="mini-name">${escapeHTML(displayName(p))}</div>
        <div class="mini-meta">📍 ${escapeHTML(p.location || "Nairobi")}</div>
        <div class="mini-plan">${escapeHTML(planText(p))}</div>
      </div>
    </a>
  `;
}

function section(title,emoji,items){
  if(!items.length) return "";
  return `
    <div class="feed-block">
      <h2>${emoji} ${escapeHTML(title)}</h2>
      <div class="mini-row">${items.map(miniCard).join("")}</div>
    </div>
  `;
}

function buildFeeds(){
  const sorted = [...relatedProfiles].sort((a,b) => score(b) - score(a));
  const locTitle = primaryLocation(currentProfile);
  const sameLoc = sorted.filter(p => sameLocation(currentProfile,p));
  const base = sameLoc.length >= 4 ? sameLoc : sorted;

  const vip = base.filter(isVip).slice(0,8);
  const signature = base.filter(isSignature).slice(0,8);
  const featured = base.filter(p => !isVip(p) && !isSignature(p)).slice(0,8);

  return `
    <section class="feed-section">
      ${section(`More Profiles in ${locTitle}`,"📍",sameLoc.slice(0,8))}
      ${section("More VIP Profiles","⭐",vip)}
      ${section("Signature Profiles","👑",signature)}
      ${section("Featured Profiles","🔥",featured)}
    </section>
  `;
}

function previousNext(){
  const sorted = [...relatedProfiles].sort((a,b) => Number(a.id || 0) - Number(b.id || 0));
  if(!sorted.length) return "";

  const prev = sorted.filter(p => Number(p.id) < Number(currentProfile.id)).pop() || sorted[sorted.length - 1];
  const next = sorted.find(p => Number(p.id) > Number(currentProfile.id)) || sorted[0];

  return `
    <div class="profile-nav">
      ${prev ? `<a class="btn back" href="${localProfileUrl(prev)}">← Previous</a>` : ""}
      ${next ? `<a class="btn back" href="${localProfileUrl(next)}">Next →</a>` : ""}
    </div>
  `;
}

function stickyButtons(p){
  const wa = cleanPhone(p.whatsapp || p.phone);
  const phone = cleanPhone(p.phone || p.whatsapp);
  const waText = encodeURIComponent(`Hi ${displayName(p)}, I found your profile on Nairobi Sweets: ${profileUrl(p)}`);

  stickyContact.innerHTML = `
    ${wa ? `<a class="btn wa" href="https://wa.me/${wa}?text=${waText}" target="_blank" rel="noopener" onclick="incrementColumn('whatsapp_clicks');logEvent('whatsapp')">💬 WhatsApp</a>` : ""}
    ${phone ? `<a class="btn call" href="tel:+${phone}" onclick="incrementColumn('call_clicks');logEvent('call')">☎ Call</a>` : ""}
  `;

  stickyContact.classList.toggle("show",!!(wa || phone));
}

async function shareProfile(){
  const url = profileUrl(currentProfile);
  await incrementColumn("profile_shares");
  await logEvent("share");

  if(navigator.share){
    try{
      await navigator.share({
        title:document.title,
        text:`Check this Nairobi Sweets profile: ${displayName(currentProfile)}`,
        url
      });
    }catch(e){}
  }else{
    await navigator.clipboard.writeText(url);
    alert("Profile link copied!");
  }
}

function seoLinks(){
  return `
    <section class="seo-links">
      <h2>Explore Nairobi Sweets</h2>
      <div class="seo-link-grid">
        <a href="/seo/locations/index.html">All Locations</a>
        <a href="/seo/categories/index.html">All Categories</a>
        <a href="/seo/categories/featured.html">Featured Profiles</a>
        <a href="/seo/categories/vip.html">VIP Profiles</a>
        <a href="/seo/categories/signature.html">Signature Profiles</a>
        <a href="/seo/locations/kilimani.html">Kilimani</a>
        <a href="/seo/locations/westlands.html">Westlands</a>
        <a href="/seo/locations/lavington.html">Lavington</a>
        <a href="/seo/locations/ngong-road.html">Ngong Road</a>
        <a href="/seo/locations/embakasi.html">Embakasi</a>
        <a href="/seo/locations/south-b.html">South B</a>
        <a href="/seo/locations/kasarani.html">Kasarani</a>
      </div>
    </section>
  `;
}

function renderProfile(p){
  currentProfile = p;
  updateSEO(p);
  stickyButtons(p);

  const name = escapeHTML(displayName(p));
  const loc = escapeHTML(p.location || primaryLocation(p) || "Nairobi");
  const plan = escapeHTML(planText(p));
  const bio = escapeHTML(
    p.bio ||
    p.description ||
    p.about ||
    `${displayName(p)} is a verified ${planText(p)} profile located in ${primaryLocation(p)}. View gallery photos, services offered and direct contact options.`
  );

  const gallery = galleryImages(p);
  const coverage = safeArray(p.coverage_areas || p.coverage || p.areas || p.location);
  const reel = reelUrl(p);

  app.innerHTML = `
    <section class="page">
      <article class="profile-card">
        <div class="hero">
          <img class="hero-img" src="${escapeHTML(gallery[0] || FALLBACK_IMAGE)}" alt="${name}" onerror="this.src='${FALLBACK_IMAGE}'">
          <div class="hero-row">
            <div class="score-row">
              <span class="hero-pill">🔥 Score <span id="hero_score">${score(p)}</span></span>
              <span class="hero-pill">👁 <span id="hero_views">${Number(p.views || 0)}</span> Views</span>
            </div>
            <div class="watermark">
              <img src="/assets/logo/logo-badge.png" onerror="this.style.display='none'">
              NAIROBI-SWEETS.COM
            </div>
          </div>
        </div>

        <div class="content">
          <div class="signature-banner ${isSignature(p) ? "show" : ""}">👑 NAIROBI SWEETS SIGNATURE PROFILE</div>

          <div class="badges">${badgeHTML(p)}</div>

          <h1>${name}</h1>

          <div class="meta">
            📍 ${loc} · ${p.online === true || p.online === "true" ? "🟢 Online Now" : "⚪ Offline"}<br>
            💎 Plan: ${plan}
          </div>

          <div class="stats">
            <span class="stat">👁 <span id="views">${Number(p.views || 0)}</span> Views</span>
            <span class="stat">💬 <span id="whatsapp_clicks">${Number(p.whatsapp_clicks || 0)}</span> WhatsApp</span>
            <span class="stat">☎ <span id="call_clicks">${Number(p.call_clicks || 0)}</span> Calls</span>
            <span class="stat">❤️ <span id="favorites">${Number(p.favorites || 0)}</span> Favorites</span>
            <span class="stat">🔗 <span id="profile_shares">${Number(p.profile_shares || 0)}</span> Shares</span>
          </div>

          <div class="info-grid">
            <div class="info-box">🎂 Age: ${escapeHTML(p.age || "N/A")}</div>
            <div class="info-box">💃 Body: ${escapeHTML(p.body_type || "N/A")}</div>
            <div class="info-box">🏨 Meeting: ${escapeHTML(p.meeting_place || "Ask")}</div>
            <div class="info-box">💰 Rate: ${escapeHTML(p.rate || "Ask")}</div>
          </div>

          <p class="bio">${bio}</p>

          <h2>Services</h2>
          <div class="chips">${renderServices(p.services)}</div>

          ${
            coverage.length
            ? `<h2>Coverage Areas</h2><div class="chips">${coverage.map(a => `<span class="chip">📍 ${escapeHTML(a)}</span>`).join("")}</div>`
            : ""
          }

          ${
            gallery.length > 1
            ? `<h2>Gallery</h2><div class="gallery-row">${gallery.slice(1).map(img => `<div class="gallery-item"><img src="${escapeHTML(img)}" loading="lazy" alt="${name}" onerror="this.parentElement.style.display='none'"><span>© NAIROBI-SWEETS.COM</span></div>`).join("")}</div>`
            : ""
          }

          ${
            reel
            ? `<h2>Short Reel</h2><div class="reel-box"><video controls playsinline preload="metadata" poster="${escapeHTML(gallery[0] || FALLBACK_IMAGE)}" onplay="logEvent('video_play')"><source src="${escapeHTML(reel)}"></video></div>`
            : ""
          }

          <div class="actions compact-actions">
            <button class="btn fav" onclick="incrementColumn('favorites');logEvent('favorite')">❤️ Favorite</button>
            <button class="btn share" onclick="shareProfile()">🔗 Share</button>
            <a class="btn back" href="/">🏠 Back Home</a>
          </div>

          ${previousNext()}
          ${buildFeeds()}
          ${seoLinks()}
        </div>
      </article>
    </section>
  `;
}

async function loadRelated(current){
  const {data,error} = await sb
    .from("profiles")
    .select("*")
    .neq("id",current.id)
    .limit(160);

  relatedProfiles = error ? [] : (data || []);
}

async function findProfileById(id){
  if(!id) return null;

  const {data,error} = await sb
    .from("profiles")
    .select("*")
    .eq("id",id)
    .maybeSingle();

  if(error) return null;
  return data || null;
}

async function findProfileBySlug(slug){
  if(!slug) return null;

  const wanted = makeSlug(slug);

  const {data,error} = await sb
    .from("profiles")
    .select("*")
    .limit(1500);

  if(error) return null;

  return (data || []).find(p => {
    const possible = [
      p.slug,
      p.username,
      p.stage_name,
      p.name,
      p.full_name,
      p.id,
      `${p.stage_name || p.name || "profile"}-${p.location || ""}`
    ].map(makeSlug);

    return possible.includes(wanted);
  }) || null;
}

async function loadProfile(){
  const slug = getSlug();
  const idParam = getIdParam();

  if(!slug && !idParam){
    app.innerHTML = `<div class="error">Profile identifier missing.</div>`;
    return;
  }

  let data = null;

  if(slug && !/^\d+$/.test(slug)){
    data = await findProfileBySlug(slug);
  }

  if(!data && (idParam || /^\d+$/.test(slug || ""))){
    data = await findProfileById(idParam || slug);
  }

  if(!data && slug){
    data = await findProfileBySlug(slug);
  }

  if(!data){
    app.innerHTML = `<div class="error">Profile not found.</div>`;
    return;
  }

  await loadRelated(data);
  renderProfile(data);
  await incrementColumn("views");
  await logEvent("view");
}

loadProfile();
