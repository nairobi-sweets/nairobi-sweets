  <style>
    :root{
      --gold:#ffd84b;
      --gold2:#ffb700;
      --navy:#060852;
      --navy2:#080b70;
      --black:#000;

    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#000}
    body{
      margin:0;
      background:radial-gradient(circle at top,#07105a 0%,#010212 48%,#000 100%);

      font-family:Arial,Helvetica,sans-serif;
      padding-bottom:84px;
      overflow-x:hidden;
    }
    a{text-decoration:none;color:inherit}
    img,video{max-width:100%;display:block}

    .site-header{
      position:sticky;
      top:0;
      z-index:1000;
      height:92px;
      background:rgba(0,0,0,.94);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,216,75,.18);
      display:flex;
      justify-content:space-between;

    .brand{

    .page{

    .profile-card{

    .hero-row{

    .score-row{display:flex;gap:8px;flex-wrap:wrap}
    .hero-pill,.watermark{

      font-size:13px;
      padding:9px 12px;
      white-space:nowrap;

    .watermark{display:flex;align-items:center;gap:7px;letter-spacing:.35px}

    .content{padding:28px 30px 34px}
    .badges,.stats,.chips,.actions{display:flex;flex-wrap:wrap;gap:10px}

    .gallery-row{
      display:flex;

      scroll-snap-type:x mandatory;

    .gallery-row::-webkit-scrollbar,.mini-row::-webkit-scrollbar{height:6px}

      flex:0 0 190px;

    .actions{margin-top:24px}

      font-weight:950;

    .wa{background:var(--green);color:#fff}.call{background:var(--gold);color:#000}.fav{background:var(--pink);color:#fff}.share{background:var(--purple);color:#fff}.back{background:#07106a;color:var(--gold);border:1px solid rgba(255,216,75,.32)}

    .profile-nav{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 10px}
    .feed-section{margin-top:34px;border-top:1px solid rgba(255,216,75,.16);padding-top:22px}
    .feed-block{margin:0 0 30px}
    .mini-row{
      display:flex;
      overflow-x:auto;
      gap:14px;
      padding:2px 2px 12px;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
    }
    .mini-card{
      flex:0 0 185px;
      background:linear-gradient(180deg,#11136e,#070943);
      border:1px solid rgba(255,216,75,.24);
      border-radius:18px;
      overflow:hidden;
      scroll-snap-align:start;
      box-shadow:0 0 20px rgba(0,0,0,.32);
    }
    .mini-media{height:145px;position:relative;background:#111;overflow:hidden}
    .mini-media img{width:100%;height:100%;object-fit:cover}
    .mini-score{
      position:absolute;left:8px;bottom:8px;
      background:rgba(0,0,0,.7);
      color:var(--gold);
      border-radius:999px;
      padding:6px 9px;
      font-size:12px;
      font-weight:950;

    .mini-body{padding:12px}
    .mini-name{color:var(--gold);font-size:17px;font-weight:950;line-height:1.15;margin-bottom:7px}
    .mini-meta{font-size:13px;line-height:1.35;color:#f3f3f3;min-height:34px}
    .mini-plan{margin-top:10px;background:var(--gold);color:#07105a;border-radius:999px;padding:7px 10px;text-align:center;font-size:12px;font-weight:950;text-transform:uppercase}

    .sticky-contact{
      position:fixed;
      left:0;right:0;bottom:64px;
      z-index:9999;
      display:none;
      gap:8px;
      padding:8px 10px;
      background:rgba(0,0,0,.5);
      backdrop-filter:blur(10px);
      border-top:1px solid rgba(255,216,75,.12);

    .sticky-contact.show{display:flex}
    .sticky-contact a{flex:1;min-width:0;min-height:54px;border-radius:16px;font-size:16px;padding:12px 10px}

    .bottom-nav{
      position:fixed;left:0;right:0;bottom:0;z-index:9998;
      height:64px;background:rgba(0,0,0,.96);
      border-top:1px solid rgba(255,216,75,.15);
      display:flex;justify-content:space-around;align-items:center;
      backdrop-filter:blur(10px);
    }
    .bottom-nav a{font-size:26px;color:var(--gold);opacity:.95}

    .error{min-height:58vh;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:24px;font-weight:950;text-align:center;padding:30px}

    @media(max-width:860px){
      .page{padding:0 0 88px}.profile-card{border-radius:0;border-left:0;border-right:0}
      .site-header{height:82px;padding:10px 16px}.brand{font-size:28px;letter-spacing:-.8px}.brand img{width:58px;height:58px;border-radius:16px}.home-btn{font-size:15px;padding:12px 20px;border-radius:18px}
      .hero-img{height:355px;object-position:center top}.hero-row{left:10px;right:10px;bottom:10px}.watermark{font-size:10px;padding:7px 9px}.watermark img{width:18px;height:18px}.hero-pill{font-size:12px;padding:7px 9px}
      .content{padding:22px 20px 30px}h1{font-size:34px;letter-spacing:-.8px}h2{font-size:25px}.meta,.bio{font-size:16px}.badge,.stat,.chip{font-size:13px;padding:8px 12px}
      .info-grid{grid-template-columns:1fr 1fr}.info-box{font-size:14px;padding:13px 14px}.actions .btn{flex:1 1 calc(50% - 8px);min-width:0}.actions .back{flex-basis:100%}.profile-nav .btn{width:100%}
      .mini-card{flex-basis:165px}.mini-media{height:132px}.mini-name{font-size:16px}.mini-meta{font-size:12px}.gallery-item{flex-basis:165px;height:220px}
    }
    @media(max-width:430px){
      body{padding-bottom:128px}.site-header{height:78px}.brand{font-size:26px}.brand img{width:54px;height:54px}.home-btn{font-size:14px;padding:11px 18px}
      .hero-img{height:330px}.content{padding:20px 18px 28px}h1{font-size:31px}h2{font-size:23px}.info-grid{grid-template-columns:1fr}.actions{display:none}.sticky-contact.show{display:flex}
      .mini-card{flex-basis:156px}.mini-media{height:126px}.feed-section{padding-bottom:30px}
    }

.sticky-contact.show{display:grid}
.sticky-contact .btn{height:52px;min-height:52px;border-radius:17px;font-size:15px;padding:0 10px}

body{padding-bottom:128px}
.feed-block h2{font-size:23px;line-height:1.12;margin:24px 0 14px}
.mini-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:visible;padding:0}

</style>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const stickyContact = document.getElementById("stickyContact");
let currentProfile = null;
let relatedProfiles = [];

function getSlug(){
  const q = new URLSearchParams(location.search).get("slug");
  if(q) return q.trim();
  const parts = location.pathname.split("/").filter(Boolean);
  return parts[0] === "profile" && parts[1] ? decodeURIComponent(parts[1]).trim() : "";
}
function escapeHTML(v){return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function cleanPhone(phone){if(!phone)return"";let p=String(phone).replace(/\D/g,"");if(p.startsWith("0"))p="254"+p.slice(1);if(p.startsWith("7")||p.startsWith("1"))p="254"+p;return p}
function badValue(v){const s=String(v??"").trim().toLowerCase();return !s||s==="0"||s==="[]"||s==="null"||s==="undefined"||s==="nan"}
function safeArray(value){
  if(value == null) return [];
  let out=[];
  if(Array.isArray(value)) out=value;
  else if(typeof value === "string"){
    const raw=value.trim(); if(!raw||raw==="[]") return [];
    try{const parsed=JSON.parse(raw); out=Array.isArray(parsed)?parsed:[parsed]}catch(e){out=raw.split(/[,;\n]/)}
  }else out=[value];
  return out.flatMap(x=>Array.isArray(x)?x:[x]).map(x=>String(x??"").trim().replace(/^\[+|\]+$/g,"").replace(/^['"]+|['"]+$/g,"").trim()).filter(x=>!badValue(x)).filter((x,i,a)=>a.indexOf(x)===i);
}
function mainImage(p){return p.signature_banner_url||p.banner_url||p.image_url||p.photo_url||p.main_image||"/assets/logo/logo-badge.png"}
function galleryImages(p){const arr=safeArray(p.gallery_images||p.gallery||p.images||p.image_urls);return [...new Set([mainImage(p),...arr].filter(Boolean))]}
function reelUrl(p){return p.reel_url||p.reel||p.short_video||p.video_url||p.short_url||""}
function profileUrl(p){return `https://nairobi-sweets.com/profile.html?slug=${encodeURIComponent(p.slug||getSlug())}`}
function planText(p){return String(p.plan||"Featured").trim()}
function isSignature(p){const plan=planText(p).toLowerCase();return plan.includes("signature")||plan.includes("vvip")||p.is_signature===true||p.signature===true}
function isVip(p){const plan=planText(p).toLowerCase();return plan.includes("vip")&&!isSignature(p)}
function niceTitle(v){return String(v||'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase())}
function displayName(p){
  const raw=String(p.stage_name||p.name||'Nairobi Sweet').trim();
  const lower=raw.toLowerCase().replace(/\s+/g,'');
  if(lower==='pretiezari'||lower==='prettiezari'||lower==='pretie-zari') return 'Pretie Zari';
  return niceTitle(raw);
}
function locationParts(p){
  return safeArray(p.coverage_areas||p.coverage||p.areas||p.location).concat(safeArray(p.location));
}
function primaryLocation(p){
  const arr=locationParts(p);
  return arr[0] || 'Nairobi';
}
function sameLocation(a,b){
  const aa=locationParts(a).map(x=>x.toLowerCase());
  const bb=locationParts(b).map(x=>x.toLowerCase());
  return aa.some(x=>bb.some(y=>x===y || x.includes(y) || y.includes(x)));
}
function score(p){return Math.round(Number(p.boost||0)*1000+Number(p.views||0)+Number(p.whatsapp_clicks||0)*10+Number(p.call_clicks||0)*15+Number(p.favorites||0)*12+Number(p.profile_shares||0)*7)}
function badgeHTML(p){let html=""; if(isSignature(p)) html+=`<span class="badge signature">👑 Signature</span>`; else if(isVip(p)) html+=`<span class="badge vip">⭐ VIP</span>`; else html+=`<span class="badge featured">🔥 Featured</span>`; if(p.verified===true||p.verified==="true") html+=`<span class="badge verified">✅ Verified</span>`; return html}
function renderServices(raw){let services=safeArray(raw); if(!services.length) services=["Professional Massage"]; return services.map(s=>`<span class="chip">✓ ${escapeHTML(s)}</span>`).join("")}

async function incrementColumn(column){
  if(!currentProfile?.id) return;
  const next=Number(currentProfile[column]||0)+1; currentProfile[column]=next;
  try{
    await sb.from("profiles").update({[column]:next}).eq("id",currentProfile.id);
    const el=document.getElementById(column); if(el) el.textContent=next;
    const hv=document.getElementById("hero_views"); if(column==="views"&&hv) hv.textContent=next;
    const hs=document.getElementById("hero_score"); if(hs) hs.textContent=score(currentProfile);
  }catch(e){console.warn("Counter skipped",e.message)}
}
async function logEvent(type){
  if(!currentProfile?.id) return;
  try{await sb.from("profile_analytics").insert({profile_id:currentProfile.id,event_type:type})}catch(e){}
  try{await sb.from("profile_events").insert({profile_id:currentProfile.id,event_type:type})}catch(e){}
}
function updateSEO(p){
  const name=displayName(p), loc=p.location||"Nairobi", img=mainImage(p), url=profileUrl(p);
  const desc=`${name} in ${loc}. Verified Nairobi Sweets profile with WhatsApp and direct call contact.`;
  document.title=`${name} | Nairobi Sweets`;
  document.querySelector('meta[name="description"]')?.setAttribute("content",desc);
  document.querySelector('meta[property="og:title"]')?.setAttribute("content",`${name} | Nairobi Sweets`);
  document.querySelector('meta[property="og:description"]')?.setAttribute("content",desc);
  document.querySelector('meta[property="og:image"]')?.setAttribute("content",img);
  document.querySelector('meta[property="og:url"]')?.setAttribute("content",url);
  document.querySelector('link[rel="canonical"]')?.setAttribute("href",url);
  document.getElementById("schema-json").textContent=JSON.stringify({"@context":"https://schema.org","@type":"ProfilePage",name,description:desc,url,image:img});
}
function miniCard(p){
  const slug=encodeURIComponent(p.slug||"");
  return `<a class="mini-card" href="/profile.html?slug=${slug}">
    <div class="mini-media"><img src="${escapeHTML(mainImage(p))}" loading="lazy" alt="${escapeHTML(displayName(p))}" onerror="this.src='/assets/logo/logo-badge.png'"><span class="mini-score">🔥 ${score(p)}</span></div>
    <div class="mini-body"><div class="mini-name">${escapeHTML(displayName(p))}</div><div class="mini-meta">📍 ${escapeHTML(p.location||'Nairobi')}</div><div class="mini-plan">${escapeHTML(planText(p))}</div></div>
  </a>`;
}
function section(title,emoji,items){if(!items.length)return"";return `<div class="feed-block"><h2>${emoji} ${escapeHTML(title)}</h2><div class="mini-row">${items.map(miniCard).join("")}</div></div>`}
function buildFeeds(){
  const sorted=[...relatedProfiles].sort((a,b)=>score(b)-score(a));
  const locTitle=primaryLocation(currentProfile);
  const sameLoc=sorted.filter(p=>sameLocation(currentProfile,p));

  // Growth mode: only recommend profiles from the SAME location/coverage area.
  const signature=sameLoc.filter(isSignature).slice(0,12);
  const vip=sameLoc.filter(isVip).slice(0,12);

  return `<section class="feed-section">
    ${section(`More Signature Profiles in ${locTitle}`,"👑",signature)}
    ${section(`More VIP Profiles in ${locTitle}`,"💎",vip)}
  </section>`;
}
function previousNext(){
  const sorted=[...relatedProfiles].sort((a,b)=>Number(a.id||0)-Number(b.id||0)); if(!sorted.length)return"";
  const prev=sorted.filter(p=>Number(p.id)<Number(currentProfile.id)).pop()||sorted[sorted.length-1];
  const next=sorted.find(p=>Number(p.id)>Number(currentProfile.id))||sorted[0];
  return `<div class="profile-nav">${prev?`<a class="btn back" href="/profile.html?slug=${encodeURIComponent(prev.slug)}">← Previous</a>`:""}${next?`<a class="btn back" href="/profile.html?slug=${encodeURIComponent(next.slug)}">Next →</a>`:""}</div>`;
}
function stickyButtons(p){
  const wa=cleanPhone(p.whatsapp||p.phone), phone=cleanPhone(p.phone||p.whatsapp);
  const waText=encodeURIComponent(`Hi ${displayName(p)||'there'}, I found your profile on Nairobi Sweets: ${profileUrl(p)}`);
  stickyContact.innerHTML=`${wa?`<a class="btn wa" href="https://wa.me/${wa}?text=${waText}" target="_blank" onclick="incrementColumn('whatsapp_clicks');logEvent('whatsapp')">💬 WhatsApp</a>`:""}${phone?`<a class="btn call" href="tel:+${phone}" onclick="incrementColumn('call_clicks');logEvent('call')">☎ Call</a>`:""}`;
  stickyContact.classList.toggle("show",!!(wa||phone));
}
async function shareProfile(){
  const url=profileUrl(currentProfile); await incrementColumn("profile_shares"); await logEvent("share");
  if(navigator.share){try{await navigator.share({title:document.title,url})}catch(e){}}else{await navigator.clipboard.writeText(url);alert("Profile link copied!")}
}
function renderProfile(p){
  currentProfile=p; updateSEO(p); stickyButtons(p);
  const name=escapeHTML(displayName(p)), loc=escapeHTML(p.location||"Nairobi"), plan=escapeHTML(planText(p));
  const bio=escapeHTML(p.bio||p.description||p.about||`Verified Nairobi Sweets profile in ${p.location||'Nairobi'}.`);
  const gallery=galleryImages(p), coverage=safeArray(p.coverage_areas||p.coverage||p.areas||p.location), reel=reelUrl(p);
  const wa=cleanPhone(p.whatsapp||p.phone), phone=cleanPhone(p.phone||p.whatsapp), waText=encodeURIComponent(`Hi ${displayName(p)||'there'}, I found your profile on Nairobi Sweets: ${profileUrl(p)}`);
  app.innerHTML=`<section class="page"><article class="profile-card">
    <div class="hero"><img class="hero-img" src="${escapeHTML(gallery[0]||'/assets/logo/logo-badge.png')}" alt="${name}" onerror="this.src='/assets/logo/logo-badge.png'"><div class="hero-row"><div class="score-row"><span class="hero-pill">🔥 Score <span id="hero_score">${score(p)}</span></span><span class="hero-pill">👁 <span id="hero_views">${Number(p.views||0)}</span> Views</span></div><div class="watermark"><img src="/assets/logo/logo-badge.png" onerror="this.style.display='none'">NAIROBI-SWEETS.COM</div></div></div>
    <div class="content">
      <div class="signature-banner ${isSignature(p)?'show':''}">👑 NAIROBI SWEETS SIGNATURE PROFILE</div>
      <div class="badges">${badgeHTML(p)}</div><h1>${name}</h1>
      <div class="meta">📍 ${loc} · ${p.online===true||p.online==='true'?'🟢 Online Now':'⚪ Offline'}<br>💎 Plan: ${plan}</div>
      <div class="stats"><span class="stat">👁 <span id="views">${Number(p.views||0)}</span> Views</span><span class="stat">💬 <span id="whatsapp_clicks">${Number(p.whatsapp_clicks||0)}</span> WhatsApp</span><span class="stat">☎ <span id="call_clicks">${Number(p.call_clicks||0)}</span> Calls</span><span class="stat">❤️ <span id="favorites">${Number(p.favorites||0)}</span> Favorites</span><span class="stat">🔗 <span id="profile_shares">${Number(p.profile_shares||0)}</span> Shares</span></div>
      <div class="info-grid"><div class="info-box">🎂 Age: ${escapeHTML(p.age||'N/A')}</div><div class="info-box">💃 Body: ${escapeHTML(p.body_type||'N/A')}</div><div class="info-box">🏨 Meeting: ${escapeHTML(p.meeting_place||'Ask')}</div><div class="info-box">💰 Rate: ${escapeHTML(p.rate||'Ask')}</div></div>
      <p class="bio">${bio}</p>
      <h2>Services</h2><div class="chips">${renderServices(p.services)}</div>
      ${coverage.length?`<h2>Coverage Areas</h2><div class="chips">${coverage.map(a=>`<span class="chip">📍 ${escapeHTML(a)}</span>`).join("")}</div>`:""}
      ${reel?`<h2>Reel</h2><div class="reel-box"><video controls playsinline preload="metadata" poster="${escapeHTML(gallery[0]||'/assets/logo/logo-badge.png')}" onplay="logEvent('video_play')"><source src="${escapeHTML(reel)}"></video></div>`:""}
      ${gallery.length>1?`<h2>Gallery</h2><div class="gallery-row">${gallery.slice(1).map(img=>`<div class="gallery-item"><img src="${escapeHTML(img)}" loading="lazy" alt="${name}" onerror="this.parentElement.style.display='none'"><span>© NAIROBI-SWEETS.COM</span></div>`).join("")}</div>`:""}
      <div class="actions compact-actions"><button class="btn fav" onclick="incrementColumn('favorites');logEvent('favorite')">❤️ Favorite</button><button class="btn share" onclick="shareProfile()">🔗 Share</button><a class="btn back" href="/">🏠 Back Home</a></div>
      ${previousNext()}${buildFeeds()}
    </div></article></section>`;
}
async function loadRelated(current){
  const {data,error}=await sb.from("profiles").select("*").eq("approved",true).neq("id",current.id).limit(80);
  relatedProfiles=error?[]:(data||[]);
}
async function loadProfile(){
  const slug=getSlug(); if(!slug){app.innerHTML=`<div class="error">Profile slug missing.</div>`;return}
  const {data,error}=await sb.from("profiles").select("*").eq("slug",slug).eq("approved",true).maybeSingle();
  if(error){app.innerHTML=`<div class="error">${escapeHTML(error.message)}</div>`;return}
  if(!data){app.innerHTML=`<div class="error">Profile not found.</div>`;return}
  await loadRelated(data); renderProfile(data); await incrementColumn("views"); await logEvent("view");
}
loadProfile();
</script>
</body>
</html>
