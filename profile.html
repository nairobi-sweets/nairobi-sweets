  <style>

    .profile-page{
      max-width:1220px;

    }
    .profile-card{
      background:linear-gradient(145deg,#030423,#07095e);
      border:1px solid rgba(255,216,75,.22);
      border-radius:34px;
      overflow:hidden;
      box-shadow:0 0 45px rgba(0,0,0,.75);
    }

    .hero-wrap{
      position:relative;
      background:#01020f;
    }
    .hero-img{
      width:100%;
      height:min(74vh,760px);
      min-height:420px;
      object-fit:cover;
      display:block;
    }
    .hero-shade{
      position:absolute;
      left:0;right:0;bottom:0;
      height:45%;
      background:linear-gradient(to top,rgba(0,0,0,.82),transparent);

    }
    .watermark-chip{
      position:absolute;
      right:28px;
      bottom:28px;
      background:rgba(0,0,0,.62);

      background:linear-gradient(90deg,#ffd84b,#ff9f1c,#ffd84b);

      font-size:20px;
      text-align:center;

    h1{

      font-size:66px;

    }
    h2{

    .meta,.bio{

    .stats-strip{margin:26px 0}
    .stat{font-size:18px}
    .info-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
      gap:16px;
      margin:28px 0;
    }
    .info-box{
      background:rgba(255,255,255,.075);
      border:1px solid rgba(255,255,255,.13);

      font-weight:900;
    }
    .chip{font-size:18px;background:rgba(255,216,75,.1)}

    .gallery-slider{
      display:flex;
      gap:14px;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      padding:6px 0 16px;
    }
    .gallery-slider::-webkit-scrollbar{height:8px}
    .gallery-slider::-webkit-scrollbar-thumb{background:rgba(255,216,75,.35);border-radius:99px}
    .gallery-item{
      flex:0 0 260px;
      height:360px;
      border-radius:24px;
      overflow:hidden;
      position:relative;
      border:1px solid rgba(255,216,75,.22);
      scroll-snap-align:start;
      background:#111;
    }
    .gallery-item img{width:100%;height:100%;object-fit:cover}
    .gallery-item span{
      position:absolute;
      right:10px;bottom:10px;
      background:rgba(0,0,0,.6);
      color:#ffd84b;
      font-size:12px;
      font-weight:900;

    .reel-box{
      max-width:430px;
      margin:0 auto;
      position:relative;
      border-radius:28px;
      overflow:hidden;
      border:1px solid rgba(255,216,75,.25);

    }
    .reel-box video{
      width:100%;
      max-height:620px;
      object-fit:cover;

    .actions{margin-top:32px}
    .btn{
      border:none;
      cursor:pointer;
      min-width:180px;
      padding:18px 24px;
      border-radius:22px;
      font-size:20px;
      font-weight:950;

      gap:10px;

    .wa{background:#25d366;color:#fff}
    .call{background:#ffd84b;color:#000}
    .fav{background:#ff2d75;color:#fff}
    .share{background:#7c3aed;color:#fff}

    .feed-section{
      margin-top:56px;
      border-top:1px solid rgba(255,216,75,.18);

    }
    .feed-row{
      margin:32px 0 52px;

    .feed-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);

    .mini-card{
      background:linear-gradient(145deg,#07083d,#080b5e);
      border:1px solid rgba(255,216,75,.24);

      overflow:hidden;
      min-height:310px;

      transition:transform .18s ease, border-color .18s ease;

    .mini-card:hover{transform:translateY(-4px);border-color:rgba(255,216,75,.55)}
    .mini-media{height:200px;position:relative;background:#111;overflow:hidden}
    .mini-media img{width:100%;height:100%;object-fit:cover;display:block}
    .mini-score{

      left:10px;bottom:10px;
      background:rgba(0,0,0,.72);
      color:#ffd84b;
      font-size:13px;
      font-weight:950;
      padding:8px 10px;
      border-radius:999px;
    }
    .mini-body{padding:16px}
    .mini-name{font-size:22px;font-weight:950;color:#ffd84b;margin-bottom:8px}
    .mini-meta{font-size:16px;color:#f2f2f2;line-height:1.35}
    .mini-plan{
      margin-top:12px;
      padding:8px 12px;
      border-radius:999px;
      background:#ffd84b;
      color:#07105a;
      font-weight:950;
      font-size:14px;
      text-transform:uppercase;
      text-align:center;
    }

    .sticky-contact{
      position:fixed;
      left:0;
      right:0;
      bottom:76px;
      z-index:9999;
      display:flex;
      justify-content:center;
      gap:12px;
      padding:10px 16px;
      pointer-events:none;
    }
    .sticky-contact a{
      pointer-events:auto;
      flex:1;
      max-width:360px;
      border-radius:22px;
      padding:20px 18px;
      text-align:center;
      font-size:20px;
      font-weight:950;
    }
    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:9998;
      height:76px;
      background:rgba(0,0,0,.95);
      border-top:1px solid rgba(255,216,75,.16);

      justify-content:space-around;

    .error{

    @media(max-width:980px){
      .feed-grid{grid-template-columns:repeat(2,1fr)}

    @media(max-width:680px){
      body{padding-bottom:126px}
      .site-header{padding:14px 18px}
      .brand{font-size:36px;gap:12px;letter-spacing:-1px}
      .brand img{width:72px;height:72px;border-radius:20px}
      .home-btn{font-size:18px;padding:15px 24px}
      .profile-page{padding:0 0 260px}
      .profile-card{border-radius:0;border-left:0;border-right:0}
      .hero-img{height:72vh;min-height:520px;border-radius:0}
      .hero-stats{left:18px;right:18px;bottom:24px}
      .hero-stat{font-size:16px;padding:10px 12px}
      .watermark-chip{right:18px;bottom:84px;font-size:13px;padding:10px 12px}
      .content{padding:28px 22px}
      h1{font-size:52px;letter-spacing:-1px}
      h2{font-size:42px;margin-top:42px}
      .meta,.bio{font-size:22px}
      .info-grid{grid-template-columns:1fr}
      .info-box{font-size:22px;padding:24px}
      .stat{font-size:18px}
      .badge,.chip{font-size:18px;padding:14px 18px}
      .actions .btn{width:100%}
      .gallery-item{flex-basis:78vw;height:420px}
      .feed-section{padding:28px 18px 0}
      .feed-grid{grid-template-columns:repeat(2,1fr);gap:14px}

      .mini-media{height:160px}

      .mini-name{font-size:18px}

      .sticky-contact{bottom:76px;padding:10px 20px}
      .sticky-contact a{font-size:20px;padding:18px 12px}
    }

</head>

<body>
<header class="site-header">
  <a href="/" class="brand">
    <img src="/assets/logo/logo-badge.png" onerror="this.src='/logo.png'" alt="Nairobi Sweets">
    <div>Nairobi<br>Sweets</div>
  </a>
  <a class="home-btn" href="/">Home</a>
</header>

<main id="app"><div class="error">Loading profile...</div></main>

<div id="stickyContact" class="sticky-contact" style="display:none"></div>

<nav class="bottom-nav">
  <a href="/">🏠</a>
  <a href="/trending.html">🔥</a>
  <a href="/shorts.html">🎬</a>
  <a href="/join.html">➕</a>
</nav>

<script>
const SUPABASE_URL = "https://dkjlvyynvgtijccitvvd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtXESbvWOeL5EiUi1aYXSg_Ynm8qywm";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById("app");
const stickyContact = document.getElementById("stickyContact");
let currentProfile = null;
let allRelated = [];

function getSlug(){
  const fromQuery = new URLSearchParams(location.search).get("slug");
  if(fromQuery) return fromQuery.trim();
  const parts = location.pathname.split("/").filter(Boolean);
  if(parts[0] === "profile" && parts[1]) return decodeURIComponent(parts[1]);
  return "";
}

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function cleanPhone(phone){
  if(!phone) return "";
  let p = String(phone).replace(/\D/g,"");
  if(p.startsWith("0")) p = "254" + p.slice(1);
  if(p.startsWith("7") || p.startsWith("1")) p = "254" + p;
  return p;
}

function isBadValue(v){
  const s = String(v ?? "").trim().toLowerCase();
  return !s || s === "0" || s === "[]" || s === "null" || s === "undefined" || s === "nan";
}

function safeArray(value){
  if(value == null) return [];

  let out = [];

  if(Array.isArray(value)){
    out = value;
  }else if(typeof value === "string"){
    const raw = value.trim();
    if(!raw || raw === "[]") return [];
    try{
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) out = parsed;
      else out = [parsed];
    }catch(e){
      out = raw.split(/[,;\n]/);
    }
  }else{
    out = [value];
  }

  return out
    .flatMap(item => Array.isArray(item) ? item : [item])
    .map(item => String(item ?? "").trim())
    .filter(item => !isBadValue(item))
    .filter((item,index,arr) => arr.indexOf(item) === index);
}

function renderServices(rawServices){
  let services = safeArray(rawServices);
  if(!services.length) services = ["Professional Massage"];
  return services.map(service => `<span class="chip">✓ ${escapeHTML(service)}</span>`).join("");
}

function mainImage(p){
  return p.signature_banner_url || p.banner_url || p.image_url || p.photo_url || p.main_image || "/assets/logo/logo-badge.png";
}

function galleryImages(p){
  const arr = safeArray(p.gallery_images || p.gallery || p.images || p.image_urls);
  return [...new Set([mainImage(p), ...arr].filter(Boolean))];
}

function reelUrl(p){
  return p.reel_url || p.reel || p.short_video || p.video_url || p.short_url || "";
}

function profileUrl(p){
  return `https://nairobi-sweets.com/profile.html?slug=${encodeURIComponent(p.slug || getSlug())}`;
}

function score(p){
  return Math.round(
    Number(p.boost || 0) * 1000 +
    Number(p.views || 0) +
    Number(p.whatsapp_clicks || 0) * 10 +
    Number(p.call_clicks || 0) * 15 +
    Number(p.favorites || 0) * 12 +
    Number(p.profile_shares || 0) * 7
  );
}

function planText(p){
  return String(p.plan || "Featured").trim();
}

function isSignature(p){
  const plan = planText(p).toLowerCase();
  return plan.includes("signature") || plan.includes("vvip") || p.is_signature === true;
}

function isVip(p){
  const plan = planText(p).toLowerCase();
  return plan.includes("vip") && !isSignature(p);
}

function badgeHTML(p){
  let html = "";
  if(isSignature(p)) html += `<span class="badge signature">👑 Signature</span>`;
  else if(isVip(p)) html += `<span class="badge vip">⭐ VIP</span>`;
  else html += `<span class="badge featured">🔥 Featured</span>`;

  if(p.verified === true || p.verified === "true") html += `<span class="badge verified">✅ Verified</span>`;
  return html;
}

async function incrementColumn(column){
  if(!currentProfile?.id) return;
  const nextValue = Number(currentProfile[column] || 0) + 1;
  currentProfile[column] = nextValue;
  try{
    await sb.from("profiles").update({ [column]: nextValue }).eq("id", currentProfile.id);
    const el = document.getElementById(column);
    if(el) el.textContent = nextValue;
    const heroViews = document.getElementById("hero_views");
    if(column === "views" && heroViews) heroViews.textContent = nextValue;
    const heroScore = document.getElementById("hero_score");
    if(heroScore) heroScore.textContent = score(currentProfile);
  }catch(e){
    console.warn("Counter skipped:", e.message);
  }
}

async function logEvent(type){
  if(!currentProfile?.id) return;
  try{
    await sb.from("profile_analytics").insert({
      profile_id: currentProfile.id,
      event_type: type
    });
  }catch(e){
    console.warn("Analytics skipped:", e.message);
  }
}

function updateSEO(p){
  const name = p.stage_name || p.name || "Nairobi Sweets Profile";
  const locationName = p.location || "Nairobi";
  const plan = planText(p);
  const img = mainImage(p);
  const url = profileUrl(p);
  const desc = `${name} located in ${locationName}. Verified Nairobi Sweets ${plan} profile with WhatsApp and direct call contact.`;

  document.title = `${name} | Nairobi Sweets`;
  document.querySelector('meta[name="description"]')?.setAttribute("content", desc);
  document.querySelector('meta[property="og:title"]')?.setAttribute("content", `${name} | Nairobi Sweets`);
  document.querySelector('meta[property="og:description"]')?.setAttribute("content", desc);
  document.querySelector('meta[property="og:image"]')?.setAttribute("content", img);
  document.querySelector('meta[property="og:url"]')?.setAttribute("content", url);
  document.querySelector('link[rel="canonical"]')?.setAttribute("href", url);

  const old = document.getElementById("profileSchema");
  if(old) old.remove();
  const schema = document.createElement("script");
  schema.type = "application/ld+json";
  schema.id = "profileSchema";
  schema.textContent = JSON.stringify({
    "@context":"https://schema.org",
    "@type":"ProfilePage",
    "name":name,
    "description":desc,
    "url":url,
    "image":img
  });
  document.head.appendChild(schema);
}

function miniCard(p){
  const slug = encodeURIComponent(p.slug || "");
  return `
    <a class="mini-card" href="/profile.html?slug=${slug}" onclick="try{sessionStorage.setItem('last_profile_slug','${slug}')}catch(e){}">
      <div class="mini-media">
        <img src="${escapeHTML(mainImage(p))}" loading="lazy" alt="${escapeHTML(p.stage_name || 'Profile')}" onerror="this.src='/assets/logo/logo-badge.png'">
        <span class="mini-score">🔥 ${score(p)}</span>
      </div>
      <div class="mini-body">
        <div class="mini-name">${escapeHTML(p.stage_name || p.name || 'Profile')}</div>
        <div class="mini-meta">📍 ${escapeHTML(p.location || 'Nairobi')}</div>
        <div class="mini-plan">${escapeHTML(planText(p))}</div>
      </div>
    </a>
  `;
}

function section(title, emoji, items){
  if(!items.length) return "";
  return `
    <div class="feed-row">
      <h2>${emoji} ${escapeHTML(title)}</h2>
      <div class="feed-grid">${items.map(miniCard).join("")}</div>
    </div>
  `;
}

function buildTikTokFeed(){
  const currentLoc = String(currentProfile.location || "").toLowerCase();
  const currentPlan = String(currentProfile.plan || "").toLowerCase();

  const sorted = [...allRelated].sort((a,b)=>score(b)-score(a));
  const nearby = sorted.filter(p => String(p.location || "").toLowerCase().includes(currentLoc) || currentLoc.includes(String(p.location || "").toLowerCase())).slice(0,8);
  const samePlan = sorted.filter(p => String(p.plan || "").toLowerCase() === currentPlan).slice(0,8);
  const vip = sorted.filter(p => isVip(p)).slice(0,8);
  const signature = sorted.filter(p => isSignature(p)).slice(0,8);
  const trending = sorted.slice(0,8);

  return `
    <section class="feed-section">
      ${section("Trending Nearby", "🔥", nearby.length ? nearby : trending)}
      ${section(`More in ${currentProfile.location || 'Nairobi'}`, "📍", nearby)}
      ${section("More VIP Profiles", "💎", vip)}
      ${section("More Signature Profiles", "👑", signature)}
      ${section("More Profiles You May Like", "✨", trending)}
    </section>
  `;
}

function previousNext(){
  const sorted = [...allRelated].sort((a,b)=>score(b)-score(a));
  const prev = sorted[0];
  const next = sorted[1] || sorted[0];
  if(!prev && !next) return "";
  return `
    <div class="actions">
      ${prev ? `<a class="btn back" href="/profile.html?slug=${encodeURIComponent(prev.slug)}">← Previous Profile</a>` : ""}
      ${next ? `<a class="btn back" href="/profile.html?slug=${encodeURIComponent(next.slug)}">Next Profile →</a>` : ""}
    </div>
  `;
}

function stickyButtons(p){
  const wa = cleanPhone(p.whatsapp || p.phone);
  const phone = cleanPhone(p.phone || p.whatsapp);
  const waText = encodeURIComponent(`Hi ${p.stage_name || 'there'}, I found your profile on Nairobi Sweets: ${profileUrl(p)}`);
  stickyContact.innerHTML = `
    ${wa ? `<a class="wa" href="https://wa.me/${wa}?text=${waText}" target="_blank" onclick="incrementColumn('whatsapp_clicks');logEvent('whatsapp')">💬 WhatsApp</a>` : ""}
    ${phone ? `<a class="call" href="tel:+${phone}" onclick="incrementColumn('call_clicks');logEvent('call')">☎ Call</a>` : ""}
  `;
  stickyContact.style.display = (wa || phone) ? "flex" : "none";
}

async function shareProfile(){
  const url = profileUrl(currentProfile);
  await incrementColumn("profile_shares");
  await logEvent("share");
  if(navigator.share){
    try{ await navigator.share({ title:document.title, url }); }catch(e){}
  }else{
    await navigator.clipboard.writeText(url);
    alert("Profile link copied!");
  }
}

function renderProfile(p){
  currentProfile = p;
  updateSEO(p);
  stickyButtons(p);

  const name = escapeHTML(p.stage_name || p.name || "Nairobi Sweet");
  const locationName = escapeHTML(p.location || "Nairobi");
  const plan = escapeHTML(planText(p));
  const bio = escapeHTML(p.bio || p.description || p.about || `Verified Nairobi Sweets profile in ${p.location || 'Nairobi'}.`);

  const coverage = safeArray(p.coverage_areas || p.coverage || p.areas || p.location);
  const reel = reelUrl(p);
  const wa = cleanPhone(p.whatsapp || p.phone);
  const phone = cleanPhone(p.phone || p.whatsapp);
  const waText = encodeURIComponent(`Hi ${p.stage_name || 'there'}, I found your profile on Nairobi Sweets: ${profileUrl(p)}`);

  app.innerHTML = `
    <section class="profile-page">
      <article class="profile-card">
        <div class="hero-wrap">
          <img class="hero-img" src="${escapeHTML(gallery[0] || '/assets/logo/logo-badge.png')}" alt="${name}" onerror="this.src='/assets/logo/logo-badge.png'">
          <div class="hero-shade"></div>
          <div class="hero-stats">
            <span class="hero-stat">🔥 Score <span id="hero_score">${score(p)}</span></span>
            <span class="hero-stat">👁 <span id="hero_views">${Number(p.views || 0)}</span> Views</span>
          </div>
          <div class="watermark-chip"><img src="/assets/logo/logo-badge.png" onerror="this.style.display='none'"> NAIROBI-SWEETS.COM</div>
        </div>

        <div class="content">
          ${isSignature(p) ? `<div class="signature-banner">👑 NAIROBI SWEETS SIGNATURE PROFILE</div>` : ""}
          <div class="badges">${badgeHTML(p)}</div>
          <h1>${name}</h1>
          <div class="meta">
            📍 ${locationName} · ${p.online ? "🟢 Online Now" : "⚪ Offline"}<br>
            💎 Plan: ${plan}
          </div>

          <div class="stats-strip">
            <span class="stat">👁 <span id="views">${Number(p.views || 0)}</span> Views</span>
            <span class="stat">💬 <span id="whatsapp_clicks">${Number(p.whatsapp_clicks || 0)}</span> WhatsApp</span>
            <span class="stat">☎ <span id="call_clicks">${Number(p.call_clicks || 0)}</span> Calls</span>
            <span class="stat">❤️ <span id="favorites">${Number(p.favorites || 0)}</span> Favorites</span>
            <span class="stat">🔗 <span id="profile_shares">${Number(p.profile_shares || 0)}</span> Shares</span>
          </div>

          <div class="info-grid">
            <div class="info-box">🎂 Age: ${escapeHTML(p.age || "N/A")}</div>
            <div class="info-box">💃 Body: ${escapeHTML(p.body_type || "N/A")}</div>
            <div class="info-box">🏨 Meeting: ${escapeHTML(p.meeting_place || "Ask")}</div>
            <div class="info-box">💰 Rate: ${escapeHTML(p.rate || "Ask")}</div>
          </div>

          <p class="bio">${bio}</p>

          <h2>Services</h2>
          <div class="chips">${renderServices(p.services)}</div>

          ${coverage.length ? `<h2>Coverage Areas</h2><div class="chips">${coverage.map(a=>`<span class="chip">📍 ${escapeHTML(a)}</span>`).join("")}</div>` : ""}

          ${gallery.length > 1 ? `
            <h2>Gallery</h2>
            <div class="gallery-slider">
              ${gallery.map(img=>`
                <div class="gallery-item">
                  <img src="${escapeHTML(img)}" loading="lazy" alt="${name}" onerror="this.style.display='none'">
                  <span>© NAIROBI-SWEETS.COM</span>
                </div>
              `).join("")}
            </div>
          ` : ""}

          ${reel ? `
            <h2>Reel</h2>
            <div class="reel-box">
              <video controls playsinline preload="metadata" poster="${escapeHTML(gallery[0] || '/assets/logo/logo-badge.png')}">
                <source src="${escapeHTML(reel)}">
              </video>
            </div>
          ` : ""}

          <div class="actions">
            ${wa ? `<a class="btn wa" href="https://wa.me/${wa}?text=${waText}" target="_blank" onclick="incrementColumn('whatsapp_clicks');logEvent('whatsapp')">💬 WhatsApp</a>` : ""}
            ${phone ? `<a class="btn call" href="tel:+${phone}" onclick="incrementColumn('call_clicks');logEvent('call')">☎ Call</a>` : ""}
            <button class="btn fav" onclick="incrementColumn('favorites');logEvent('favorite')">❤️ Favorite</button>
            <button class="btn share" onclick="shareProfile()">🔗 Share</button>
            <a class="btn back" href="/">🏠 Back Home</a>
          </div>

          ${previousNext()}
          ${buildTikTokFeed()}
        </div>
      </article>

  `;

async function loadRelated(current){
  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("approved", true)
    .neq("id", current.id)
    .limit(80);
  if(error){
    console.warn("Related profiles skipped:", error.message);
    allRelated = [];
    return;
  }
  allRelated = data || [];
}

async function loadProfile(){
  const slug = getSlug();
  if(!slug){
    app.innerHTML = `<div class="error">Profile slug missing.</div>`;
    return;
  }

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("slug", slug)
    .eq("approved", true)
    .maybeSingle();

  if(error){
    app.innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`;
    return;
  }

  if(!data){
    app.innerHTML = `<div class="error">Profile not found.</div>`;
    return;
  }

  await loadRelated(data);
  renderProfile(data);
  await incrementColumn("views");
  await logEvent("view");
}

loadProfile();
</script>
