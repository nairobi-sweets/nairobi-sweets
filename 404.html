<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Profile Not Found | Nairobi Sweets</title>

<meta name="robots" content="noindex,nofollow">

<link rel="icon" href="/assets/logo/logo-badge.png">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
  radial-gradient(circle at top,#08105f,#000 60%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  padding:20px;
}

.card{
  width:min(650px,95vw);
  text-align:center;
  background:
  linear-gradient(180deg,#030b5e,#020531);
  border:1px solid rgba(255,216,75,.2);
  border-radius:30px;
  padding:40px;
}

.logo{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:24px;
  margin:auto;
  margin-bottom:20px;
}

h1{
  color:#ffd84b;
  font-size:72px;
  font-weight:900;
  margin-bottom:10px;
}

h2{
  color:#fff;
  margin-bottom:15px;
}

p{
  color:#ddd;
  line-height:1.7;
  margin-bottom:25px;
}

.buttons{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn{
  text-decoration:none;
  padding:14px 24px;
  border-radius:999px;
  font-weight:900;
}

.home{
  background:#ffd84b;
  color:#000;
}

.join{
  background:#07106a;
  color:#fff;
  border:1px solid rgba(255,216,75,.25);
}
</style>
</head>

<body>

<div class="card">

<img
class="logo"
src="/assets/logo/logo-badge.png"
alt="Nairobi Sweets">

<h1>404</h1>

<h2>Profile Not Found</h2>

<p>
The profile you are looking for may have expired,
been removed or no longer exists.
</p>

<div class="buttons">
<a href="/" class="btn home">🏠 Home</a>
<a href="/join.html" class="btn join">➕ Join Nairobi Sweets</a>
</div>

</div>

</body>
</html>
