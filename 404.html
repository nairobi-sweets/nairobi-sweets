<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Under Construction | Nairobi Sweets</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/assets/logo/logo-badge.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at top,#0c1148,#000 55%);color:white;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(640px,94vw);background:linear-gradient(180deg,#020a56,#010633);border:1px solid rgba(255,213,74,.16);border-radius:34px;padding:34px;text-align:center;box-shadow:0 26px 90px rgba(0,0,0,.55)}
.logo{width:96px;height:96px;border-radius:26px;object-fit:cover;box-shadow:0 0 35px rgba(255,140,0,.45);margin-bottom:18px}
h1{color:#ffd54a;font-size:clamp(36px,8vw,64px);line-height:.95;margin-bottom:14px;font-weight:950}
p{color:#ddd;font-size:17px;line-height:1.7;margin:0 auto 22px;max-width:520px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:14px 22px;border-radius:999px;font-weight:900;text-decoration:none}.home{background:linear-gradient(145deg,#ffd54a,#ff9f1c);color:#000}.seo{background:#07145f;color:#fff;border:1px solid rgba(255,213,74,.18)}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/logo/logo-badge.png" alt="Nairobi Sweets">
    <h1>Page Under Construction</h1>
    <p>This Nairobi Sweets page is being prepared. Use the buttons below to return home or browse the SEO hub.</p>

    </div>
  </main>
</body>
</html>
