[build]
publish = "."
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/profile-sitemap.xml"
to = "/.netlify/functions/profile-sitemap"
status = 200
force = true

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

[[headers]]
for = "/sitemap.xml"

[headers.values]
Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/static-sitemap.xml"

[headers.values]
Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/location-sitemap.xml"

[headers.values]
Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/profile-sitemap.xml"

[headers.values]
Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/manifest.webmanifest"

[headers.values]
Content-Type = "application/manifest+json"

[[headers]]
for = "/sw.js"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[functions."auto-expire"]
schedule = "@hourly"

[functions."auto-renew"]
schedule = "@hourly"
