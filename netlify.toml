[build]
  publish = "."
  functions = "netlify/functions"

# ==========================================
# SECURITY HEADERS
# ==========================================

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=*"

# ==========================================
# SITEMAP
# ==========================================

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# ==========================================
# API FUNCTIONS
# ==========================================

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ==========================================
# M-PESA FUNCTIONS
# ==========================================

[[redirects]]
  from = "/mpesa-stk-push"
  to = "/.netlify/functions/mpesa-stk-push"
  status = 200

[[redirects]]
  from = "/mpesa-callback"
  to = "/.netlify/functions/mpesa-callback"
  status = 200

# ==========================================
# ADMIN FUNCTIONS
# ==========================================

[[redirects]]
  from = "/admin-login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/admin-me"
  to = "/.netlify/functions/admin-me"
  status = 200

[[redirects]]
  from = "/admin-list-users"
  to = "/.netlify/functions/admin-list-users"
  status = 200

[[redirects]]
  from = "/admin-create-user"
  to = "/.netlify/functions/admin-create-user"
  status = 200

[[redirects]]
  from = "/admin-update-user"
  to = "/.netlify/functions/admin-update-user"
  status = 200

[[redirects]]
  from = "/admin-delete-user"
  to = "/.netlify/functions/admin-delete-user"
  status = 200

# ==========================================
# SEO FILES
# ==========================================

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# ==========================================
# CRON JOBS
# ==========================================

[functions]

  [functions."auto-expire"]
    schedule = "@hourly"

  [functions."auto-renew"]
    schedule = "@hourly"

# ==========================================
# SPA FALLBACK
# MUST STAY LAST
# ==========================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
