[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/profile/:slug"
  to = "/profile.html?slug=:slug"
  status = 200

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/user-dashboard.html"
  status = 200

[[redirects]]
  from = "/payment-status"
  to = "/payment-status.html"
  status = 200

[[redirects]]
  from = "/trending"
  to = "/trending.html"
  status = 200

[[redirects]]
  from = "/shorts"
  to = "/shorts.html"
  status = 200

[[redirects]]
  from = "/reels"
  to = "/reel.html"
  status = 200

[[redirects]]
  from = "/vault"
  to = "/vault-8472.html"
  status = 200

[functions."auto-renew-check"]
  schedule = "0 8 * * *"

[functions."send-renewal-reminders"]
  schedule = "0 9 * * *"

[functions."daily-analytics-rollup"]
  schedule = "0 1 * * *"

[functions."expire-old-profiles"]
  schedule = "0 2 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
