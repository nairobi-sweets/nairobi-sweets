# ==========================================
# NAIROBI SWEETS
# Production Netlify Configuration
# ==========================================

[build]
  publish = "."
  functions = "netlify/functions"

# ==========================================
# SECURITY HEADERS
# ==========================================

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ==========================================
# CACHE STATIC ASSETS
# ==========================================

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

# ==========================================
# SUPABASE + API FUNCTIONS
# ==========================================

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ==========================================
# GOOGLE SEARCH CONSOLE VERIFICATION
# ==========================================

[[redirects]]
  from = "/google57ecb1f92048de42.html"
  to = "/google57ecb1f92048de42.html"
  status = 200
  force = true

# ==========================================
# SITE ROUTES
# ==========================================

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/user-dashboard.html"
  status = 200

[[redirects]]
  from = "/vault"
  to = "/vault-8472.html"
  status = 200

[[redirects]]
  from = "/payment-status"
  to = "/payment-status.html"
  status = 200

[[redirects]]
  from = "/shorts"
  to = "/shorts.html"
  status = 200

[[redirects]]
  from = "/reels"
  to = "/reel.html"
  status = 200

# ==========================================
# AUTO RENEW ENGINE
# ==========================================

[functions."auto-renew-check"]
  schedule = "0 8 * * *"

[functions."send-renewal-reminders"]
  schedule = "0 9 * * *"

# ==========================================
# OPTIONAL DAILY ANALYTICS
# ==========================================

[functions."daily-analytics-rollup"]
  schedule = "0 1 * * *"

# ==========================================
# OPTIONAL EXPIRY CLEANUP
# ==========================================

[functions."expire-old-profiles"]
  schedule = "0 2 * * *"

# ==========================================
# SPA FALLBACK
# MUST STAY LAST
# ==========================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
