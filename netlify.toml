[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."auto-expire-profiles"]
  schedule = "@hourly"

[functions."refresh-trending-scores"]
  schedule = "@hourly"

[[redirects]]
  from = "/profile/:id"
  to = "/.netlify/functions/profile-share?id=:id"
  status = 200
