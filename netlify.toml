[build]
  publish = "."
  functions = "netlify/functions"

# =========================
# SECURITY HEADERS
# =========================

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# =========================
# DYNAMIC SITEMAP
# =========================

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# =========================
# NETLIFY FUNCTIONS
# =========================

[[redirects]]
  from = "/api/mpesa-stk-push"
  to = "/.netlify/functions/mpesa-stk-push"
  status = 200

[[redirects]]
  from = "/api/mpesa-callback"
  to = "/.netlify/functions/mpesa-callback"
  status = 200

[[redirects]]
  from = "/api/admin-login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/admin-me"
  to = "/.netlify/functions/admin-me"
  status = 200

[[redirects]]
  from = "/api/admin-list-users"
  to = "/.netlify/functions/admin-list-users"
  status = 200

[[redirects]]
  from = "/api/admin-create-user"
  to = "/.netlify/functions/admin-create-user"
  status = 200

[[redirects]]
  from = "/api/admin-update-user"
  to = "/.netlify/functions/admin-update-user"
  status = 200

[[redirects]]
  from = "/api/admin-delete-user"
  to = "/.netlify/functions/admin-delete-user"
  status = 200

# =========================
# AUTO RENEW CRON
# =========================

[functions."auto-renew"]
  schedule = "@hourly"

# =========================
# SEO URLS
# =========================

[[redirects]]
  from = "/profile/:slug"
  to = "/profile.html?slug=:slug"
  status = 200

[[redirects]]
  from = "/escort/:slug"
  to = "/profile.html?slug=:slug"
  status = 200

# =========================
# SHORTS
# =========================

[[redirects]]
  from = "/shorts"
  to = "/shorts.html"
  status = 200

[[redirects]]
  from = "/trending"
  to = "/trending.html"
  status = 200

[[redirects]]
  from = "/reels"
  to = "/reel.html"
  status = 200

# =========================
# FORCE HTTPS
# =========================

[[redirects]]
  from = "http://nairobi-sweets.com/*"
  to = "https://nairobi-sweets.com/:splat"
  status = 301
  force = true

# =========================
# SPA FALLBACK
# KEEP LAST
# =========================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
