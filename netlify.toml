
[build]
  publish = "."
  functions = "netlify/functions"

########################################
# PROFILE SITEMAP
########################################

[[redirects]]
  from = "/profile-sitemap.xml"
  to = "/.netlify/functions/profile-sitemap"
  status = 200

########################################
# M-PESA FUNCTIONS
########################################

[[redirects]]
  from = "/api/mpesa-stk-push"
  to = "/.netlify/functions/mpesa-stk-push"
  status = 200

[[redirects]]
  from = "/api/mpesa-callback"
  to = "/.netlify/functions/mpesa-callback"
  status = 200

########################################
# ADMIN FUNCTIONS
########################################

[[redirects]]
  from = "/api/admin-login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/admin-me"
  to = "/.netlify/functions/admin-me"
  status = 200

[[redirects]]
  from = "/api/admin-list-users"
  to = "/.netlify/functions/admin-list-users"
  status = 200

[[redirects]]
  from = "/api/admin-create-user"
  to = "/.netlify/functions/admin-create-user"
  status = 200

[[redirects]]
  from = "/api/admin-update-user"
  to = "/.netlify/functions/admin-update-user"
  status = 200

[[redirects]]
  from = "/api/admin-delete-user"
  to = "/.netlify/functions/admin-delete-user"
  status = 200

########################################
# PROFILE ROUTING
########################################

[[redirects]]
  from = "/profile/*"
  to = "/profile.html"
  status = 200

########################################
# SECURITY HEADERS
########################################

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

########################################
# PWA
########################################

[[headers]]
  for = "/manifest.webmanifest"

  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "no-cache"

########################################
# STATIC ASSETS CACHE
########################################

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

########################################
# SEO FILES
########################################

[[headers]]
  for = "/robots.txt"

  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/sitemap.xml"

  [headers.values]
    Content-Type = "application/xml"

########################################
# LOCATION SEO PAGES
########################################

[[headers]]
  for = "/seo/*"

  [headers.values]
    Cache-Control = "public, max-age=86400"

########################################
# CUSTOM 404
########################################

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

