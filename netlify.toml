[build]
  publish = "."
  functions = "netlify/functions"

#################################################
# PROFILE SITEMAP
#################################################

[[redirects]]
  from = "/profile-sitemap.xml"
  to = "/.netlify/functions/profile-sitemap"
  status = 200

#################################################
# M-PESA FUNCTIONS
#################################################

[[redirects]]
  from = "/api/mpesa-stk-push"
  to = "/.netlify/functions/mpesa-stk-push"
  status = 200

[[redirects]]
  from = "/api/mpesa-callback"
  to = "/.netlify/functions/mpesa-callback"
  status = 200

#################################################
# ADMIN FUNCTIONS
#################################################

[[redirects]]
  from = "/api/admin-login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/admin-me"
  to = "/.netlify/functions/admin-me"
  status = 200

[[redirects]]
  from = "/api/admin-list-users"
  to = "/.netlify/functions/admin-list-users"
  status = 200

[[redirects]]
  from = "/api/admin-create-user"
  to = "/.netlify/functions/admin-create-user"
  status = 200

[[redirects]]
  from = "/api/admin-update-user"
  to = "/.netlify/functions/admin-update-user"
  status = 200

[[redirects]]
  from = "/api/admin-delete-user"
  to = "/.netlify/functions/admin-delete-user"
  status = 200

#################################################
# AUTO RENEW / EXPIRE
#################################################

[[redirects]]
  from = "/api/auto-renew"
  to = "/.netlify/functions/auto-renew"
  status = 200

#################################################
# SECURITY HEADERS
#################################################

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

#################################################
# HTML CACHING
#################################################

[[headers]]
  for = "*.html"

  [headers.values]
    Cache-Control = "public,max-age=300"

#################################################
# JS CACHING
#################################################

[[headers]]
  for = "*.js"

  [headers.values]
    Cache-Control = "public,max-age=86400"

#################################################
# CSS CACHING
#################################################

[[headers]]
  for = "*.css"

  [headers.values]
    Cache-Control = "public,max-age=86400"

#################################################
# IMAGE CACHING
#################################################

[[headers]]
  for = "*.png"

  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "*.jpg"

  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "*.jpeg"

  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "*.webp"

  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

#################################################
# VIDEO CACHING
#################################################

[[headers]]
  for = "*.mp4"

  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

#################################################
# ROBOTS
#################################################

[[headers]]
  for = "/robots.txt"

  [headers.values]
    Content-Type = "text/plain"

#################################################
# SITEMAPS
#################################################

[[headers]]
  for = "/sitemap.xml"

  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/profile-sitemap.xml"

  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/static-sitemap.xml"

  [headers.values]
    Content-Type = "application/xml"

#################################################
# SPA FALLBACK
#################################################

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
