[build]
publish = "."
functions = "netlify/functions"

[[redirects]]
from = "/profile-sitemap.xml"
to = "/.netlify/functions/profile-sitemap"
status = 200
force = true

[[redirects]]
from = "/location-sitemap.xml"
to = "/.netlify/functions/location-sitemap"
status = 200
force = true

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
