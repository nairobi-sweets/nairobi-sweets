# =====================================
# SEO LOCATION ENGINE
# =====================================

[[redirects]]
from = "/seo-location/:location"
to = "/seo-location.html?location=:location"
status = 200
force = true

[[redirects]]
from = "/seo/locations/:location.html"
to = "/seo-location.html?location=:location"
status = 200
force = false


# =====================================
# SEO CATEGORY ENGINE
# =====================================

[[redirects]]
from = "/seo-category/:category"
to = "/seo-category.html?category=:category"
status = 200
force = true

[[redirects]]
from = "/seo/categories/:category"
to = "/seo-category.html?category=:category"
status = 200
force = true

[[redirects]]
from = "/seo/categories/:category.html"
to = "/seo-category.html?category=:category"
status = 200
force = true

# =====================================
# CANONICAL PAGE REDIRECTS
# =====================================

[[redirects]]
from = "/trending"
to = "/trending.html"
status = 301
force = true


# =====================================
# PROFILE ROUTES
# =====================================

[[redirects]]
from = "/profile/:slug"
to = "/profile.html?slug=:slug"
status = 200
force = true

[[redirects]]
from = "/p/:slug"
to = "/profile.html?slug=:slug"
status = 200
force = true

# =====================================
# HEADERS
# =====================================

[[headers]]
for = "/*.xml"

[headers.values]
Content-Type = "application/xml; charset=utf-8"
Cache-Control = "no-store"

[[headers]]
for = "/manifest.webmanifest"

[headers.values]
Content-Type = "application/manifest+json"
Cache-Control = "no-cache"

[[headers]]
for = "/sw.js"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(self), camera=(self), microphone=(), payment=(self)"

# =====================================
# SCHEDULED FUNCTIONS
# =====================================

[functions."auto-expire-profiles"]
schedule = "@hourly"

[functions."auto-renew"]
schedule = "@hourly"

[functions."auto-renew-check"]
schedule = "@daily"

[functions."expire-live-locations"]
schedule = "*/30 * * * *"
